---
# Server — Raspberry Pi 4b: Lerobot SO-101 leader, GPS-RTK LC29H(BS)
# Network (netplan) and hostname — set for each host or here for the group:
network_address: "192.168.1.33/24"
network_gateway: "192.168.1.1"
primary_dns_server: "192.168.1.1"
secondary_dns_server: "1.1.1.1"
network_nameservers:
  - "{{ primary_dns_server }}"
  - "{{ secondary_dns_server }}"
hostname: "server-rpi4"

# ROS2 node types: default settings per type (used by ros2_node_deploy).
# Server ROS2 master binds to all interfaces (0.0.0.0) so Client can connect; other nodes use localhost only.
ros2_node_type_defaults:
  fastdds_discovery_server:
    # Uninstalled (see ros2_dds_env in all.yml); kept so deploys remove the old service.
    deploy_mode: native
    node_launch_command: "true"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
  ros2_master:
    deploy_mode: native
    node_launch_command: "ros2 daemon start && sleep infinity"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
    cpu_quota: "20%"
    memory_max: "128M"
  feetech_servos:
    deploy_mode: native
    node_launch_command: "python3 -m feetech_servos"
    node_src_dir: "nodes/bridges/feetech_servos"
    pythonpath_parent: true
    cpu_quota: "50%"
    memory_max: "128M"
    config_path: /etc/ros2/feetech_servos
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/feetech_servos/config.yaml
  topic_scraper_api:
    deploy_mode: native
    node_launch_command: "python3 -m topic_scraper_api"
    node_src_dir: "nodes/topic_scraper_api"
    cpu_quota: "25%"
    memory_max: "192M"
    config_path: /etc/ros2/topic_scraper_api
    env:
      - TOPIC_SCRAPER_API_CONFIG=/etc/ros2/topic_scraper_api/config.yaml
  gps_rtk:
    deploy_mode: native
    node_launch_command: "python3 -m gps_rtk"
    node_src_dir: "nodes/bridges/gps_rtk"
    cpu_quota: "25%"
    memory_max: "64M"
    config_path: /etc/ros2/gps_rtk
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk/config.yaml
  # RTAB-Map RGB-D mapping (nodes/rtabmap_mapping/README.md): one component_container with the rgbd_sync and rtabmap
  # nodes fed over WiFi by the client's map3d_uplink; the database lives in /var/lib/ros2/rtabmap
  # (playbooks/tasks/rtabmap_db_dir.yml). Server rule: quota and cap, no tier keys. The monitoring stack may take up to
  # 2.2 GB / 150 % CPU, so the 200 % quota and 900M cap leave room for lerobot_leader, gps_rtk_base, ros2-master and
  # map3d_manager. No ROS_STATIC_PEERS (only the client uplink bridges the hosts).
  rtabmap_mapping:
    deploy_mode: native
    node_launch_command: "ros2 launch {{ ros2_repo_dest }}/nodes/rtabmap_mapping/launch/rtabmap_mapping.launch.py"
    node_src_dir: ""
    # The launch file and its config/contract yaml; a change restarts the node.
    src_paths: [nodes/rtabmap_mapping]
    # Individual packages, never ros-jazzy-rtabmap-ros (pulls rtabmap-viz and Qt) or ros-jazzy-rtabmap-viz.
    apt_packages:
      - ros-jazzy-rtabmap-slam
      - ros-jazzy-rtabmap-sync
      - ros-jazzy-rtabmap-util
      - ros-jazzy-rtabmap-msgs
      - ros-jazzy-rtabmap-conversions
      - ros-jazzy-image-transport-plugins
      - ros-jazzy-rclcpp-components
      - python3-pydantic
      - python3-yaml
    cpu_quota: "200%"
    memory_max: "900M"
    config_path: /etc/ros2/rtabmap_mapping
    env:
      - RTABMAP_MAPPING_CONFIG=/etc/ros2/rtabmap_mapping/config.yaml

# Nodes to deploy: name, node_type, present, enabled, config.
ros2_nodes:
  - name: fastdds_discovery_server
    node_type: fastdds_discovery_server
    present: false
    enabled: false
  - name: ros2-master
    node_type: ros2_master
    present: true
    enabled: true
  - name: lerobot_leader
    node_type: feetech_servos
    present: true
    enabled: true
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/lerobot_leader/config.yaml
    config: |
      device: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A059057-if00
      namespace: leader
      log_joint_updates: true
      enable_torque_on_start: false
      disable_torque_on_start: true
      # The leader arm is not the robot pack: only the follower publishes /battery_state.
      battery_interval_s: 0
      interpolation_enabled: false
      publish_only_on_change: true
      publish_change_epsilon: 0.01
      control_loop_hz: 180
      joint_names:
        - name: shoulder_pan
          id: 1
        - name: shoulder_lift
          id: 2
        - name: elbow_flex
          id: 3
        - name: wrist_flex
          id: 4
        - name: wrist_roll
          id: 5
        - name: gripper
          id: 6
  - name: topic_scraper_api
    node_type: topic_scraper_api
    present: true
    # Disabled 2026-10-11 (user): ~0.4 cores of always-on debug subscriptions; enable again for debugging sessions.
    enabled: false
    config: |
      host: "0.0.0.0"
      port: 18100
      # Discovery of new topics within 2 s is fine for a debug tool (graph query is costly)
      topic_refresh_interval_s: 2.0
      allowed_types:
        - sensor_msgs/msg/JointState
        - sensor_msgs/msg/NavSatFix
        - sensor_msgs/msg/Image
        - sensor_msgs/msg/CompressedImage
        - std_msgs/msg/String
  - name: gps_rtk_base
    node_type: gps_rtk
    present: true
    enabled: true
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk_base/config.yaml
    config: |
      mode: base
      serial_port: /dev/ttyAMA0
      baud_rate: 115200
      topic: /server/gps/fix
      status_topic: /server/gps/status
      frame_id: gps_link
      configure_on_start: true
      rtcm_tcp_port: 5016
      ntrip_mountpoint: /rtk
      ntrip_user: ""
      ntrip_password: ""
  - name: rtabmap_mapping
    node_type: rtabmap_mapping
    present: true
    enabled: true
    # No config block: the defaults of nodes/rtabmap_mapping/config/rtabmap_params.yaml apply. Overrides are merged key
    # by key on top; tunable keys (RTAB-Map core parameters are strings):
    # config: |
    #   database_dir: /var/lib/ros2/rtabmap
    #   rtabmap:
    #     ros__parameters:
    #       Mem/STMSize: "10"
    #       Mem/ImagePreDecimation: "2"
    #       Rtabmap/DetectionRate: "1"
    #       Grid/CellSize: "0.05"
    #       Grid/RangeMax: "4.0"

# ---- monitoring (roles/monitoring_agent + roles/web_proxy + roles/monitoring; deploy-nodes.sh server monitoring) -----
# The server stores everything: Mimir (metrics, 1 d), Loki (logs, 1 d) and Grafana at http://server.ros2.lan/grafana/.
# `host` label of every series and log stream this host sends.
monitoring_host: server
# Mimir and Loki run here: push over loopback.
monitoring_agent_metrics_url: http://127.0.0.1:9009/api/v1/push
monitoring_agent_logs_url: http://127.0.0.1:3100/loki/api/v1/push
# No ROS node here exports metrics (they are robot-only); Alloy scrapes the stack's own /metrics instead.
monitoring_agent_node_targets: []
monitoring_agent_stack_targets:
  - {job: mimir, address: "127.0.0.1:9009"}
  - {job: loki, address: "127.0.0.1:3100"}
  - {job: grafana, address: "127.0.0.1:3000"}
# monitoring.slice of the RPi4 (4 cores, 3.8 GB, ~3.3 GB free before the stack): Mimir 700M + Loki 400M + Grafana 768M
# + Alloy 250M = 2118M of per-unit caps fit under the 2200M hard total, which leaves ~1.1 GB for the ROS units and the
# page cache; MemoryHigh starts reclaiming at 2000M first. 150% CPU: compaction and dashboard queries are bursty, the
# CPUWeight of 20 still hands the CPU to lerobot_leader and the other ROS units whenever they want it.
monitoring_agent_slice_cpu_quota: "150%"
monitoring_agent_slice_memory_max: "2200M"
monitoring_agent_slice_memory_high: "2000M"
# nginx on port 80: / -> /grafana/, /grafana/ -> Grafana (roles/web_proxy).
web_proxy_site: server
