---
# Shared variables for all hosts (Client and Server)
# Ubuntu 24.04 on Raspberry Pi

# ROS2 hostnames for cross-host DDS and RTCM.
# When ros2_extend_etc_hosts is true, hostname role adds ros2_hosts_entries to /etc/hosts.
# Default false: rely on primary DNS (e.g. 192.168.1.1) or manual /etc/hosts.
ros2_node_user: "{{ ansible_user }}"

ros2_extend_etc_hosts: false
ros2_server_hostname: "server.ros2.lan"
ros2_client_hostname: "client.ros2.lan"
ros2_controller_hostname: "controller.ros2.lan"
ros2_hosts_entries:
  - { ip: "192.168.1.33", hostname: "server.ros2.lan" }
  - { ip: "192.168.1.34", hostname: "client.ros2.lan" }
  - { ip: "192.168.1.35", hostname: "controller.ros2.lan" }

# DDS discovery: simple discovery restricted to each host (rendered first into every ROS2 node unit; node env entries
# after it override). Only the client's master2master and leader_bridge add the server as a static peer (ROS_STATIC_PEERS) so they alone
# bridges the hosts. The former FastDDS discovery server is uninstalled: launch_ros' one-shot lifecycle and component
# service calls (slam_toolbox configure, Nav2 composable loading) hung intermittently through it. The original
# "restarted nodes get no data" problem was logind RemoveIPC deleting FastDDS shared memory (see dds_host_setup.yml).
# UDPv4 only: the shared-memory transport is off. A SIGKILLed (OOM) participant leaves its SHM port segment behind; the
# restarted participant reuses the port, FastDDS unlinks the zombie segment and creates a new one, while long-lived peers
# keep mapping the deleted inode and write into it (observed 2026-10-11: web_ui deaf after an OOM restart, discovery
# fine, data and service replies never arrived). Trade-off: same-host image topics are copied through loopback UDP,
# which costs CPU.
# More than 32 participants per host: with ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST rmw_fastrtps (Jazzy, Fast DDS 2.14)
# sets maxInitialPeersRange=32 and the only initial peer is 127.0.0.1, so a participant announces to participant IDs
# 0..31 only; any two participants with IDs >= 32 never discover each other. Verified live 2026-10-22 on the client
# (~43 participants): web_ui (id 35) never matched Nav2's bt_navigator (id 32), so goals were lost, and mcp_server,
# poi_store, map_manager, marker_detector and claude_agent (ids 36-41) were unreachable. FASTRTPS_DEFAULT_PROFILES_FILE
# points at a default participant profile (playbooks/templates/fastdds_localhost_peers.xml.j2, installed by dds_host_setup.yml)
# whose initialPeersList adds 127.0.0.1 with explicit metatraffic ports for IDs ros2_dds_extra_peer_first_id..last_id.
# A probe participant pinned to ID 60 with that profile discovered every node; without it only IDs < 32.
ros2_dds_env:
  - "ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST"
  - "FASTDDS_BUILTIN_TRANSPORTS=UDPv4"
  - "FASTRTPS_DEFAULT_PROFILES_FILE={{ ros2_dds_profiles_file }}"

ros2_dds_profiles_file: /etc/ros2/fastdds_localhost_peers.xml
# Profile of the static-peer Wi-Fi bridges (master2master, leader_bridge, map3d_uplink; their env overrides the file above):
# the same localhost peers plus a UDPv4 transport with non_blocking_send. Fast DDS 2.14 UDPTransportInterface::send sets
# SO_SNDTIMEO to the remaining max_blocking_time and to 0 (no timeout) once it has passed, so a blocking send stalls
# the whole process for as long as the Wi-Fi carrier is stuck.
ros2_dds_bridge_profiles_file: /etc/ros2/fastdds_wifi_bridge.xml
ros2_dds_domain_id: 0 # ROS_DOMAIN_ID of every node; part of the metatraffic port formula
ros2_dds_extra_peer_first_id: 32
ros2_dds_extra_peer_last_id: 99

# Seconds between node starts when a deploy brings the stack back up (playbooks/tasks/start_ros_nodes.yml).
ros2_node_start_interval_s: 2

# Repo to clone on each node for local container builds (deploy playbooks).
ros2_repo_url: https://github.com/szymonrychu/ros2-lerobot-swerve-platform
ros2_repo_revision: main  # branch, tag, or commit
ros2_repo_dest: /opt/ros2-lerobot-swerve-platform

# Build containers on each Raspberry Pi (no CI/registry yet). Set true later to build on controller and pull on nodes.
node_build_on_controller: false
# Repo root on controller (for docker build context when node_build_on_controller is true). Playbook lives in ansible/playbooks/, so go up twice.
ros2_repo_root: "{{ playbook_dir }}/../.."
# Source (colcon) and web_ui frontend builds: cgroup CPU cap and parallel jobs. Builds still run at nice 19 with idle IO
# priority, so the running stack keeps precedence; raise only if the Pi stays cool (it throttles at 85 C).
ros2_build_cpu_quota: "400%"
# CPUWeight of the build scope: below every robot weight tier and the default 100, so a build loses every contention.
ros2_build_cpu_weight: 20
ros2_build_jobs: 4

# Deploy state on the host: stamps (what source/config was deployed) and the persistent restart queue. A restart is
# queued here the moment a change is applied, so it survives a failed run and is carried out by the next run's
# start_ros_nodes.yml (which also runs in the rescue path of a failed run).
ros2_deploy_state_dir: /var/lib/ros2-deploy
ros2_restart_queue: "{{ ros2_deploy_state_dir }}/pending-restart"
ros2_deploy_lock: "{{ ros2_deploy_state_dir }}/deploy.lock"
# Units a heavy step stopped (one per line). start_ros_nodes.yml starts all of them whatever the run's scope and clears
# the file; if the run dies without doing so (controller lost), the on-host timer ros2-deploy-recover starts them.
ros2_stopped_for_build_file: "{{ ros2_deploy_state_dir }}/stopped-for-build"
# Self-healing guard: units listed in the file for this many minutes with no live deploy lock are started by the timer.
ros2_recover_after_min: 15
# A deploy lock older than this is stale (controller died mid-run) and no longer blocks the recovery. Must exceed the
# longest single task (a source build).
ros2_deploy_lock_max_age_min: 240
# Agent idle guard (playbooks/tasks/agent_idle_guard.yml, client deploy): wait until the robot agent has been quiet
# (not busy, no instruction/stop/reset) for ros2_agent_quiet_min minutes, polling every ros2_agent_idle_poll_s seconds
# for at most ros2_agent_idle_wait_min minutes, then fail. -e ros2_deploy_ignore_agent=true skips the guard.
ros2_agent_quiet_min: 5
ros2_agent_idle_wait_min: 15
ros2_agent_idle_poll_s: 15
ros2_deploy_ignore_agent: false
