    memory_low: "96M"
    memory_max: "256M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    config_path: /etc/ros2/costmap_zones
    apt_packages:
      - ros-jazzy-nav2-msgs
    env:
      - COSTMAP_ZONES_CONFIG=/etc/ros2/costmap_zones/config.yaml
  claude_agent:
    # Claude (Agent SDK, bundled pinned Claude Code CLI) chat agent that drives the robot through mcp_server:
    # see nodes/claude_agent/README.md. Runs as its own non-root user, niced, in the agent-facing weight tier.
    deploy_mode: native
    node_launch_command: "python3 -m claude_agent"
    node_src_dir: "nodes/claude_agent"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # No quota (was 50%, then 150%): the CLI child needs about 1.3 s of CPU per model request, and the 50% quota stretched
    # that floor on every turn (47% of the wall time of 17 measured sessions was model-only). The agent-facing weight
    # (300 vs 1000/500) makes the control nodes (arm, base, Nav2) win the cores under contention.
    # Working set MiB p50/24 h peak 93.4/386.5 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "96M"
    memory_max: "1G"
    cpu_weight: 300
    io_weight: 300
    oom_score_adjust: -200
    nice: 10
    user: claude_agent
    # Hardening (claude_agent only): the MCP bearer token is in the CLI child's argv (--mcp-config), so hide other
    # processes' /proc entries from it. No ProtectSystem/ProtectHome: the CLI writes under its home and work_dir.
    protect_proc: invisible
    proc_subset: pid
    no_new_privileges: true
    private_tmp: true
    # Group that may read the mcp_server bearer token (created by playbooks/tasks/mcp_server_setup.yml).
    supplementary_groups:
      - mcp-token
    config_path: /etc/ros2/claude_agent
    env:
      - CLAUDE_AGENT_CONFIG=/etc/ros2/claude_agent/config.yaml
      - DISABLE_AUTOUPDATER=1
      - HOME=/var/lib/claude_agent
      # SDK initialize timeout in ms (default 60 s): the CLI starts slowly on the Pi.
      - CLAUDE_CODE_STREAM_CLOSE_TIMEOUT=180000
    # CLAUDE_CODE_OAUTH_TOKEN=<token>, written by playbooks/tasks/claude_agent_setup.yml from the deployer's env (never in git).
    environment_file: /etc/ros2/claude_agent/env

# Nodes to deploy: name (logical/service name), node_type (maps to image/config), present, enabled, config.
ros2_nodes:
  - name: fastdds_discovery_server
    node_type: fastdds_discovery_server
    present: false
    enabled: false
  - name: ros2-master
    node_type: ros2_master
    present: true
    enabled: true
  # Disabled 2026-10-08 to save CPU: its /controller/* relays (camera included) served the legacy Steam Deck UI.
  # Note: it also bridges /server/cmd_vel; leader arm teleop (/leader/joint_states) now goes through leader_bridge.
  - name: master2master
    node_type: master2master
    present: true
    enabled: false
    config: |
      topics:
        - source: /server/cmd_vel
          dest: /client/cmd_vel
          direction: in
        - source: /client/odom
          dest: /server/odom
          direction: out
        - source: /leader/joint_states
          dest: /filter/input_joint_updates
          direction: in
          type: JointState
        - source: /client/haptic_leader_commands
          dest: /leader/joint_commands
          direction: out
          type: JointState
        - source: /client/haptic_leader_set_register
          dest: /leader/set_register
          direction: out
          type: String
        # Controller-bound: relay client topics to /controller/* namespace (SteamDeck UI)
        - source: /imu/data
          dest: /controller/imu/data
          direction: out
          type: Imu
        - source: /follower/joint_states
          dest: /controller/follower/joint_states
          direction: out
          type: JointState
        - source: /swerve_drive/joint_states
          dest: /controller/swerve_drive/joint_states
          direction: out
          type: JointState
        - source: /client/gps/fix
          dest: /controller/gps/fix
          direction: out
          type: NavSatFix
        - source: /odom
          dest: /controller/odom
          direction: out
          type: Odometry
        - source: /camera_0/image_raw/compressed
          dest: /controller/camera_0/image_compressed
          direction: out
          type: CompressedImage
        # Controller-originated: relay SteamDeck commands into client ROS2 graph
        - source: /controller/goal_pose
          dest: /goal_pose
          direction: in
          type: PoseStamped
  - name: filter_node
    node_type: filter_node
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19102
      input_topic: /filter/input_joint_updates
      output_topic: /follower/joint_commands
      algorithm: kalman
      control_loop_hz: 100
      idle_timeout_s: 0.5
      web_ui_input_topic: /filter/web_ui_joint_commands
      web_ui_timeout_s: 0.5
      follower_feedback_topic: /follower/joint_states
      takeover_threshold_rad: 0.15
      # Autonomy lease (mcp_server): setpoints, release (std_msgs/Bool) and the published active source.
      autonomy_input_topic: /filter/autonomy_joint_commands
      autonomy_release_topic: /filter/autonomy_release
      active_source_topic: /filter/active_source
      joint_names:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
        - gripper
      algorithm_params:
        process_noise_pos: 0.000518
        process_noise_vel: 0.03294
        measurement_noise: 7.06e-5
        prediction_lead_s: 0.045
        velocity_decay_per_s: 4.5
        max_prediction_time_s: 0.14
  - name: test_joint_api
    node_type: test_joint_api
    present: true
    enabled: true
    config: |
      host: "0.0.0.0"
      port: 18080
      topic: /filter/input_joint_updates
  - name: topic_scraper_api
    node_type: topic_scraper_api
    present: true
    # Disabled 2026-10-11 (user): ~0.4 cores of always-on debug subscriptions; enable again for debugging sessions.
    enabled: false
    config: |
      host: "0.0.0.0"
      port: 18100
      # Discovery of new topics within 2 s is fine for a debug tool (graph query is costly)
      topic_refresh_interval_s: 2.0
      allowed_types:
        - sensor_msgs/msg/JointState
        - sensor_msgs/msg/NavSatFix
        # No raw sensor_msgs/msg/Image: deserializing the 640x480 raw frames (~20 MB/s) cost ~0.4 cores (2026-10-11);
        # previews come from the compressed topics.
        - sensor_msgs/msg/CompressedImage
        - sensor_msgs/msg/LaserScan
        - sensor_msgs/msg/PointCloud2
        - sensor_msgs/msg/Imu
        - std_msgs/msg/String
      observation_rules:
        - name: leader_vs_follower
          topics:
            - /filter/input_joint_updates
            - /follower/joint_states
          type: compare
          joint_names:
            - wrist_roll
            - gripper
        - name: leader_follower_oscillation
          topics:
            - /filter/input_joint_updates
            - /follower/joint_states
          type: oscillation
          joint_names:
            - wrist_roll
            - gripper
          window_s: 1.0
          variance_threshold: 1e-5
          sign_change_min_hz: 2.0
  - name: bno055_imu
    node_type: bno055_imu
    # 50 Hz reduces I2C load; BNO055 can return None on transient read failures
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19103
      topic: /imu/data
      frame_id: imu_link
      # NDOF fuses the magnetometer: absolute yaw (magnetic north) for the web_ui GPS compass anchor. The EKF fuses only
      # the gyro yaw rate (imu0_config index 11), so this does not change odometry. Calibrate the magnetometer by moving
      # the robot; see /imu/calibration.
      operation_mode: NDOF
      publish_hz: 50
      i2c_bus: 8  # software i2c-gpio bus, must match rpi_bno055_i2c_gpio_bus
      i2c_address: 0x28
      # Sensor offsets survive node restarts here (directory created by tasks/bno055_state_dir.yml).
      calibration_file: /var/lib/ros2/bno055_imu/calibration.json
      # Learned gyro bias, loaded at start (same state dir); /imu/gyro_bias publishes the raw gyro, bias and counters.
      gyro_bias_file: /var/lib/ros2/bno055_imu/gyro_bias.json
      gyro_bias_save_interval_s: 60
      gyro_bias_mean_s: 30
      gyro_bias_topic: /imu/gyro_bias
      orientation_covariance: 0.01
      # Fixed small gyro covariance: the rolling-variance estimate inflated the yaw rate exactly while turning, so the
      # EKF preferred the slip-prone wheel yaw rate over the gyro.
      angular_velocity_covariance: 0.0004
      linear_acceleration_covariance: 0.04
      compute_covariance: false
      covariance_window: 100      # rolling window size (samples, ~2 s at 50 Hz)
      covariance_min_samples: 20  # samples before estimated covariance replaces config values
      # Zero-rate gyro bias learned only while the swerve wheel odometry reports the robot stopped (parked heading drift).
      odom_topic: /odom
      odom_timeout_s: 1.0
      stationary_linear_mps: 0.01
      stationary_angular_rad_s: 0.01
      gyro_bias_stillness_s: 2.0
      gyro_bias_tau_s: 60.0
      gyro_bias_max_rad_s: 0.02
      gyro_bias_sanity_rad_s: 0.05
  # RPi 5: GPIO UART0 (pins 14/15) needs dtoverlay=uart0-pi5; creates /dev/ttyAMA0
  - name: gps_rtk_rover
    node_type: gps_rtk
    present: true
    enabled: true
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk_rover/config.yaml
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19104
      mode: rover
      serial_port: /dev/ttyAMA0
      baud_rate: 115200
      topic: /client/gps/fix
      status_topic: /client/gps/status
      # Status says "receiver silent" after this many seconds without NMEA (below web_ui stale_after_s - 1 s).
      nmea_timeout_s: 3.0
      frame_id: gps_link
      rtcm_server_host: {{ ros2_server_hostname }}
      rtcm_server_port: 5016
      ntrip_mountpoint: /rtk
      ntrip_user: ""
      ntrip_password: ""
      ntrip_gga_interval_s: 10.0
  # Leader arm teleop: server /leader/joint_states -> /filter/input_joint_updates (filter_node still arbitrates).
  # The only process with the server as a static peer besides the disabled master2master.
  - name: leader_bridge
    node_type: leader_bridge
    present: true
    enabled: true
    config: |
      source_topic: /leader/joint_states
      dest_topic: /filter/input_joint_updates
  - name: haptic_controller
    node_type: haptic_controller
    present: true
    enabled: false
    config: |
      mode: off
      gripper_joint_names:
        - joint_5
        - joint_6
      leader_state_topic: /filter/input_joint_updates
      follower_state_topic: /follower/joint_states
      leader_cmd_topic: /client/haptic_leader_commands
      leader_set_register_topic: /client/haptic_leader_set_register
      control_loop_hz: 100
      resistance_gains:
        max_stiffness: 0.0008
        load_deadband: 60.0
        max_step_per_cycle: 0.02
        activation_velocity_threshold: 0.01
        release_delay_s: 0.15
        load_release_ratio: 0.6
        activation_debounce_cycles: 2
      delay_safety_max_skew_s: 0.4
      watchdog_timeout_s: 0.5
  # Gripper USB camera (reconnected): /camera_0/image_raw and /camera_0/image_raw/compressed (web_ui camera tab, mcp_server).
  - name: gripper_uvc_camera
    node_type: uvc_camera
    present: true
    enabled: true
    env:
      # By id: the overview CSI camera (rp1-cfe) takes /dev/video0..9, so numbered devices are not stable.
      - UVC_DEVICE=/dev/v4l/by-id/usb-Arducam_Arducam_5MP_USB_Camera_YL20240927V0-video-index0
      - UVC_TOPIC=/camera_0/image_raw
      # Image is upside down at wrist roll 0 (confirmed by the agent): rotate every published frame 180 deg at source.
      - UVC_ROTATE_DEG=180
      # About 18 fps uncapped; 10 fps is enough for the agent and the web UI and saves CPU on the loaded client.
      - UVC_MAX_FPS=10
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy).
      - METRICS_PORT=19105
  # Arducam ToF camera: depth, amplitude and camera_info for the web UI head tab. CSI cam1 now carries the right IMX219
  # (overview_camera_boot_config.yml removes the ToF overlay), so this node has no CSI port and stays `enabled: false`.
  - name: arducam_tof
    node_type: arducam_tof
    present: true
    enabled: false
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_agent_node_targets).
      metrics_port: 19112
      # Was CSI cam1; cam1 now carries the right IMX219 and cam0 the left, so the node has no CSI port (stays disabled).
      camera_index: 1
      # near or far (the driver rejects anything else, and any key not listed here).
      range_mode: far
      confidence_threshold: 30
      frame_id: tof_optical_frame
      publish_rate_hz: 10.0
      # Topics are fixed in the driver (the web_ui head tab subscribes to them):
      # /tof/depth/image_raw
      # /tof/amplitude/image_raw
      # /tof/camera_info
  - name: rplidar_a1
    node_type: rplidar_a1
    present: true
    enabled: true
    env:
      # Prometheus /metrics of the scan supervisor on 127.0.0.1 (scraped by Alloy).
      - METRICS_PORT=19106
  # Replaced by the overview_camera: present false uninstalls the unit on the next deploy.
  - name: realsense_d435i
    node_type: realsense_d435i
    present: false
    enabled: false
  # Two IMX219 cameras (left cam0, right cam1): no TF yet (mount pose not measured). Camera IDs: `cam -l` on the client,
  # see the README.
  - name: overview_camera
    node_type: overview_camera
    present: true
    enabled: true
    config: |
      # libcamera IDs of the left (cam0) and right (cam1) cameras (`cam -l`); empty selects index 0 (left) or 1 (right)
      # and logs a warning.
      left_camera_id: ""
      right_camera_id: ""
  # Stereo depth from the IMX219 pair: /stereo/depth/image_raw (16UC1 mm, 0 = invalid) and /stereo/camera_info at up
  # to 5 Hz, shown in the web_ui Head tab. Publishes nothing until /var/lib/ros2/camera_calibration holds a valid
  # calibration (python3 -m stereo_depth.calibrate, see nodes/stereo_depth/README.md).
  - name: stereo_depth
    node_type: stereo_depth
    present: true
    enabled: true
    config: |
      # Every DepthConfig key at its default (nodes/stereo_depth/README.md, "Config").
      left_image_topic: /overview_camera/image_raw
      right_image_topic: /stereo/right/image_raw
      depth_topic: /stereo/depth/image_raw
      camera_info_topic: /stereo/camera_info
      publish_disparity: false
      disparity_topic: /stereo/disparity
      calibration_dir: /var/lib/ros2/camera_calibration
      calibration_check_s: 5.0
      # StereoSGBM MODE_SGBM_3WAY on 480x360 grey rectified pairs.
      num_disparities: 48
      block_size: 5
      p1: 200
      p2: 800
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
      # Depth outside [min_depth_m, max_depth_m] is published as 0 (invalid).
      min_depth_m: 0.3
      max_depth_m: 4.0
      sync_slop_s: 0.002
      max_rate_hz: 5.0
      matcher_threads: 2
      frame_id: stereo_left_optical_frame
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_agent_node_targets).
      metrics_port: 19113
  # C++ port of stereo_depth (side by side, not installed until the cut-over): the same config block, so either node
  # reads it. Cut-over: present/enabled true here, enabled false on stereo_depth (never both: one metrics port).
  - name: stereo_depth_cpp
    node_type: stereo_depth_cpp
    present: false
    enabled: false
    config: |
      # Every DepthConfig key at its default (nodes/stereo_depth/README.md, "Config").
      left_image_topic: /overview_camera/image_raw
      right_image_topic: /stereo/right/image_raw
      depth_topic: /stereo/depth/image_raw
      camera_info_topic: /stereo/camera_info
      publish_disparity: false
      disparity_topic: /stereo/disparity
      calibration_dir: /var/lib/ros2/camera_calibration
      calibration_check_s: 5.0
      # StereoSGBM MODE_SGBM_3WAY on 480x360 grey rectified pairs.
      num_disparities: 48
      block_size: 5
      p1: 200
      p2: 800
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
      # Depth outside [min_depth_m, max_depth_m] is published as 0 (invalid).
      min_depth_m: 0.3
      max_depth_m: 4.0
      sync_slop_s: 0.002
      max_rate_hz: 5.0
      matcher_threads: 2
      frame_id: stereo_left_optical_frame
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_agent_node_targets).
      metrics_port: 19113
  - name: lerobot_follower
    node_type: feetech_servos
    present: true
    enabled: true
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/lerobot_follower/config.yaml
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19101
      device: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A059004-if00
      namespace: follower
      log_joint_updates: true
      enable_torque_on_start: true
      register_publish_interval_s: 10
      # Pack voltage (3-cell) read from the servos, one servo per second, published as sensor_msgs/BatteryState.
      battery_topic: /battery_state
      battery_interval_s: 1.0
      battery_cells: 3
      publish_effort_joints:
        - wrist_roll
        - gripper
      # Present_Current (A, magnitude) of these joints on /follower/joint_currents, same stamp as joint_states.
      # Cost: the one state sync read grows from 6 to 15 bytes for all 14 servos on the bus (+126 bytes per cycle,
      # about +1.26 ms at 1 Mbaud). Gate: /follower/joint_states must still publish at 95 Hz or more.
      # Rollback: set this to an empty list ([]) and redeploy; the read shrinks back and nothing is published.
      # ROLLED BACK 2026-10-11: with [gripper] the bridge ran at 93.4 Hz, p99 18 ms (gate 95 Hz; before 95.7 Hz, 12 ms).
      # Follow-up: a gripper-only single read every N cycles instead of lengthening the shared sync read.
      publish_current_joints: []
      # filter_node tags /follower/joint_commands with its source in header.frame_id. web_ui and autonomy
      # (mcp_server) positions are follower joint radians (as in /follower/joint_states): the gripper's
      # leader -> follower source range mapping below applies only to leader (and untagged) commands.
      direct_command_sources:
        - web_ui
        - autonomy
      joint_names:
        - name: shoulder_pan
          id: 1
        - name: shoulder_lift
          id: 2
        - name: elbow_flex
          id: 3
        - name: wrist_flex
          id: 4
        - name: wrist_roll
          id: 5
        - name: gripper
          id: 6
          source_min_steps: 2045
          source_max_steps: 3289
          command_min_steps: 1900
      # Swerve platform servos share this bus (IDs 32-39), served as /swerve_drive/* from the same process.
      # Steering servos (33, 34, 37, 38): centred with `calibrate_servos.py center` (2048 = straight ahead,
      # limits 1024..3072 = +-90 deg); position commands in rad, positive = CCW seen from above.
      # In-wheel servos (32, 35, 39, 36): wheel mode, velocity commands in rad/s, positive = forward
      # (left side 32/39 mounted mirrored -> inverted, verified on the bench 2026-10-03).
      velocity_command_timeout_s: 0.3
      # Goal sync writes get no status reply: an unchanged goal is rewritten every second so a lost packet or a
      # servo brownout reset is corrected. A servo failing 3 state reads in a row leaves the sync read (so its
      # timeout does not stall the healthy servos every cycle) and is probed once every 5 s.
      goal_refresh_interval_s: 1.0
      read_failure_limit: 3
      read_retry_interval_s: 5.0
      extra_groups:
        - namespace: swerve_drive
          joint_names:
            - name: fl_drive
              id: 32
              mode: velocity
              inverted: true  # left wheels are mounted mirrored
            - name: fl_steer
              id: 33
            - name: fr_drive
              id: 35
              mode: velocity
            - name: fr_steer
              id: 34
            - name: rl_drive
              id: 39
              mode: velocity
              inverted: true  # left wheels are mounted mirrored
            - name: rl_steer
              id: 38
            - name: rr_drive
              id: 36
              mode: velocity
            - name: rr_steer
              id: 37
  # Swerve servos moved onto the lerobot_follower bus (single serial port); this service is uninstalled.
  - name: swerve_drive_servos
    node_type: feetech_servos
    present: false
    enabled: false
  - name: swerve_controller
    node_type: swerve_controller
    present: true
    enabled: true
    env:
      - SWERVE_DRIVE_CONTROLLER_CONFIG=/etc/ros2/swerve_controller/config.yaml
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19107
      # Platform dimensions.md: steering yaw axes 305 x 266.6 mm, wheel radius 60 mm, steer +-90 deg.
      half_length_m: 0.1525
      half_width_m: 0.1333
      wheel_radius_m: 0.06
      max_steer_angle_rad: 1.5708
      max_wheel_angular_velocity_rad_s: 4.71
      # ST3215 steering: 0.222 s/60 deg = 4.71 rad/s. MPPI model_delay_vy (nav2_params.yaml) derives from it.
      max_steer_angular_velocity_rad_s: 4.71
      cmd_vel_timeout_s: 0.5
      joint_states_timeout_s: 0.5
      idle_recenter_s: 3.0
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /swerve_drive/joint_states
      joint_commands_topic: /swerve_drive/joint_commands
      odom_topic: /odom
      odom_frame_id: odom
      base_frame_id: base_link
      # robot_localization_ekf is the only odom -> base_link TF publisher.
      publish_tf: false
      control_loop_hz: 50
      steer_error_threshold_rad: 0.35
      # Forward-kinematics residual (m/s) above which one slipping wheel is dropped from the odometry twist.
      slip_residual_threshold_mps: 0.05
      # Tilt guard: roll/pitch from the /imu/data orientation minus the level reference. Pitch tips the robot over
      # its longer front/rear edge, so its limits are larger. Warning: consumers stop automatic driving and ask for
      # manual recovery. Error: cmd_vel ignored, wheels braked at zero speed (torque_off: drive torque off, the robot
      # can roll on a slope), kept until back at ok (below warn - hysteresis). Level reference = the BNO055 mounting
      # bias (same as mcp_server floor_guard.imu_level_reference). Latched JSON state on /tilt_guard/state, 1 Hz.
      tilt_guard:
        enabled: true
        imu_topic: /imu/data
        state_topic: /tilt_guard/state
        torque_topic: /follower/set_register
        roll_warn_deg: 8.0
        roll_error_deg: 15.0
        pitch_warn_deg: 12.0
        pitch_error_deg: 20.0
        persistence_s: 0.5
        hysteresis_deg: 2.0
        recovery_hold_s: 2.0
        imu_timeout_s: 0.5
        level_reference_roll_deg: 0.7
        level_reference_pitch_deg: 1.3
        error_action: brake
        state_publish_hz: 1.0
      joint_names:
        - fl_drive
        - fl_steer
        - fr_drive
        - fr_steer
        - rl_drive
        - rl_steer
        - rr_drive
        - rr_steer
  - name: static_tf_publisher
    node_type: static_tf_publisher
    present: true
    enabled: true
    config: |
      # NOTE: These are estimates - update with actual measured offsets
      parent_frame: base_link
      frames:
        - child: imu_link
          x: 0.0
          y: 0.0
          z: 0.05
          roll: 0.0
          pitch: 0.0
          yaw: 0.0
        # RPLidar A1: measured from the ground-projected centre between the wheels (Platform dimensions.md: 0.15, 0.04),
        # corrected by the in-place turn test 2026-10-05: 90 deg turns showed 3.1-3.6 cm of map translation with none in
        # the EKF odometry; both turns fit one lidar offset error of (+0.8, +2.0) cm.
        - child: laser_frame
          x: 0.158
          y: 0.06
          z: 0.20
          roll: 0.0
          pitch: 0.0
          # Lidar is mounted rotated 180 deg (bench test 2026-10-03: forward motion shortened the 180 deg range).
          yaw: 3.14159265
        # No overview camera frame here on purpose: its mount pose is not measured yet, so no guessed
        # base_link -> overview_camera_optical_frame transform is published (see nodes/overview_camera/README.md).
  # Lidar odometry for the EKF (see nodes/rf2o_laser_odometry/README.md); must start before the EKF fuses /odom_rf2o_twist.
  - name: rf2o_laser_odometry
    node_type: rf2o_laser_odometry
    present: true
    enabled: true
  - name: rf2o_odom_relay
    node_type: rf2o_odom_relay
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19108
      input_topic: /odom_rf2o
      output_topic: /odom_rf2o_twist
      # No quality figure from rf2o: conservative fixed variances (wheel odometry floor is 0.002 (m/s)^2).
      var_vx_vy: 0.02
      var_vyaw: 0.05
      max_dt_s: 1.0
  - name: robot_localization_ekf
    node_type: robot_localization_ekf
    present: true
    enabled: true
    # Keep identical in content to nodes/robot_localization_ekf/config/ekf.yaml (tests/test_nav_stack_config.py).
    config: |
      ekf_filter_node:
        ros__parameters:
          frequency: 30.0
          sensor_timeout: 0.1
          two_d_mode: true
          publish_tf: true
          map_frame: map
          odom_frame: odom
          base_link_frame: base_link
          world_frame: odom
          odom0: /odom
          odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
          odom0_queue_size: 10
          odom0_differential: false
          odom0_relative: false
          # Mahalanobis gate on the wheel twist only; rationale in nodes/robot_localization_ekf/config/ekf.yaml.
          odom0_twist_rejection_threshold: 3.0
          odom1: /odom_rf2o_twist
          odom1_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
          odom1_queue_size: 5
          odom1_differential: false
          odom1_relative: false
          imu0: /imu/data
          imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
          imu0_queue_size: 10
          imu0_differential: false
          imu0_relative: false
          use_control: false
          print_diagnostics: false
  # Removes lidar returns on the robot body: /scan -> /scan_filtered (consumed by SLAM, costmaps, collision monitor).
  - name: laser_filter
    node_type: laser_filter
    present: true
    enabled: true
  - name: slam_toolbox
    node_type: slam_toolbox
    present: true
    enabled: true
    # ROS params overrides loaded after the repo slam_params.yaml (later wins). map_file_name is the posegraph base:
    # the launch file resumes <base>.posegraph if it exists (keep it equal to the web_ui map tab map_save_path).
    config: |
      slam_toolbox:
        ros__parameters:
          map_file_name: /var/lib/ros2/maps/slam_map
          min_laser_range: 0.15
          max_laser_range: 12.0
  # SLAM map protection (nodes/map_guard/README.md): pauses slam_toolbox while the robot is lifted, carried or
  # rotated by hand, then resumes or backs up + resets the map. Starts in dry run (logs + metrics only).
  - name: map_guard
    node_type: map_guard
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1.
      metrics_port: 19110
      # true: never call slam_toolbox services or publish /map_guard/map_reset; set false once tuned in Grafana.
      dry_run: true
      reasons: [mismatch, lifted, carried, rotated]
      scan_topic: /scan_filtered
      map_topic: /map
      imu_topic: /imu/data
      wheel_odom_topic: /odom
      lidar_odom_topic: /odom_rf2o
      cmd_vel_topic: /cmd_vel
      map_frame: map
      reset_topic: /map_guard/map_reset
      events_topic: /robot_events
      pause_service: /slam_toolbox/pause_new_measurements
      reset_service: /slam_toolbox/reset
      serialize_service: /slam_toolbox/serialize_map
      parameters_service: /slam_toolbox/get_parameters
      service_timeout_s: 5.0
      agent_state_url: http://127.0.0.1:18300/api/state
      agent_poll_s: 2.0
      agent_timeout_s: 0.5
      tick_hz: 10.0
      # Scan-to-map agreement.
      max_range_m: 8.0
      hit_radius_cells: 1
      occupied_threshold: 65
      min_points: 40
      agreement_hz: 2.0
      median_window: 5
      mismatch_ratio: 0.3
      mismatch_s: 5.0
      healthy_ratio: 0.6
      min_map_cells_known: 2000
      # LIFTED: tilt from the level baseline, or vertical acceleration confirmed by tilt / lidar motion.
      lift_tilt_deg: 12.0
      lift_s: 1.0
      level_window_s: 3.0
      level_tolerance_deg: 2.0
      level_rebaseline_s: 30.0
      lift_accel_z: 1.5
      lift_accel_s: 0.4
      lift_confirm_s: 2.0
      lift_confirm_tilt_deg: 4.0
      gravity_band: 2.0
      # CARRIED: lidar odometry moves, wheels do not, nothing commanded.
      carried_speed_mps: 0.08
      wheel_still_mps: 0.02
      cmd_timeout_s: 0.5
      cmd_eps: 0.01
      carried_s: 1.0
      input_timeout_s: 0.5
      # ROTATED: IMU yaw rate without wheel yaw rate or angular command.
      rotate_rate_rad_s: 0.3
      wheel_still_rad_s: 0.05
      rotate_s: 0.8
      # Response.
      settle_s: 3.0
      evaluate_s: 4.0
      cooldown_s: 30.0
      backup_dir: /var/lib/ros2/maps
      backup_prefix: map_guard_backup
      keep_backups: 5
  # C++ port of map_guard (side by side, not installed until the cut-over): the same config block, so either node
  # reads it. Cut-over: present/enabled true here, enabled false on map_guard (never both: one metrics port).
  - name: map_guard_cpp
    node_type: map_guard_cpp
    present: false
    enabled: false
    config: |
      # Prometheus /metrics on 127.0.0.1.
      metrics_port: 19110
      # true: never call slam_toolbox services or publish /map_guard/map_reset; set false once tuned in Grafana.
      dry_run: true
      reasons: [mismatch, lifted, carried, rotated]
      scan_topic: /scan_filtered
      map_topic: /map
      imu_topic: /imu/data
      wheel_odom_topic: /odom
      lidar_odom_topic: /odom_rf2o
      cmd_vel_topic: /cmd_vel
      map_frame: map
      reset_topic: /map_guard/map_reset
      events_topic: /robot_events
      pause_service: /slam_toolbox/pause_new_measurements
      reset_service: /slam_toolbox/reset
      serialize_service: /slam_toolbox/serialize_map
      parameters_service: /slam_toolbox/get_parameters
      service_timeout_s: 5.0
      agent_state_url: http://127.0.0.1:18300/api/state
      agent_poll_s: 2.0
      agent_timeout_s: 0.5
      tick_hz: 10.0
      # Scan-to-map agreement.
      max_range_m: 8.0
      hit_radius_cells: 1
      occupied_threshold: 65
      min_points: 40
      agreement_hz: 2.0
      median_window: 5
      mismatch_ratio: 0.3
      mismatch_s: 5.0
      healthy_ratio: 0.6
      min_map_cells_known: 2000
      # LIFTED: tilt from the level baseline, or vertical acceleration confirmed by tilt / lidar motion.
      lift_tilt_deg: 12.0
      lift_s: 1.0
      level_window_s: 3.0
      level_tolerance_deg: 2.0
      level_rebaseline_s: 30.0
      lift_accel_z: 1.5
      lift_accel_s: 0.4
      lift_confirm_s: 2.0
      lift_confirm_tilt_deg: 4.0
      gravity_band: 2.0
      # CARRIED: lidar odometry moves, wheels do not, nothing commanded.
      carried_speed_mps: 0.08
      wheel_still_mps: 0.02
      cmd_timeout_s: 0.5
      cmd_eps: 0.01
      carried_s: 1.0
      input_timeout_s: 0.5
      # ROTATED: IMU yaw rate without wheel yaw rate or angular command.
      rotate_rate_rad_s: 0.3
      wheel_still_rad_s: 0.05
      rotate_s: 0.8
      # Response.
      settle_s: 3.0
      evaluate_s: 4.0
      cooldown_s: 30.0
      backup_dir: /var/lib/ros2/maps
      backup_prefix: map_guard_backup
      keep_backups: 5
  - name: nav2_bringup
    node_type: nav2_bringup
    present: true
    enabled: true
  - name: web_ui
    node_type: web_ui
    present: true
    enabled: true
    config: |
      http_port: 8080
      ws_broadcast_hz: 20
      # Nav goals are refused when the tilt guard state (1 Hz) is older than this many seconds.
      tilt_guard_stale_s: 5
      bridge:
        host: localhost
        port: 9090
      # Pack voltage chip; below cells x cutoff_cell_v (3 x 2.8 = 8.4 V) web UI commands are rejected.
      battery:
        topic: /battery_state
        cells: 3
        cutoff_cell_v: 2.8
        resume_cell_v: 2.9
        stale_s: 5.0
      # Robot and base GPS chips: rover status over DDS, base status from GET /status of the base gps_rtk node's
      # NTRIP caster (same port as the rover's RTCM stream, server.yml gps_rtk_base rtcm_tcp_port).
      gps_status:
        rover_topic: /client/gps/status
        base_url: http://{{ ros2_server_hostname }}:5016/status
        base_poll_hz: 1.0
        stale_after_s: 5.0
        base_timeout_s: 2.0
      tabs:
        - id: map
          type: map_nav
          label: "Map"
          map_topic: /map
          global_plan_topic: /plan
          # MPPI optimal trajectory (nav_msgs/Path in the odom frame), see nodes/nav2_bringup/README.md.
          local_plan_topic: /optimal_trajectory
          goal_topic: /goal_pose
          map_frame: map
          base_frame: base_link
          map_save_path: /var/lib/ros2/maps/slam_map
          # Merged 3D view: local costmap, swerve base and the interactive arm (client-local topics).
          local_costmap_topic: /local_costmap/costmap
          base_urdf: robot.urdf
          base_joint_states_topic: /swerve_drive/joint_states
          arm_urdf: so101_arm.urdf
          arm_joint_states_topic: /follower/joint_states
          arm_command_topic: /filter/web_ui_joint_commands
          # Arm mount (URDF base origin) in base_link [x, y, z] m (z up from the floor), measured 2026-10-10 (pan axis from
          # CAD, height from tip touch-downs). Same value as the mcp_server arm.base_in_base_link, so the drawn arm and
          # the grasp preview agree with the planner.
          arm_offset: [0.0592, -0.05, 0.100]
          # Home / Set home buttons: std_srvs/Trigger services served by mcp_server.
          arm_home_service: /arm/home
          arm_set_home_service: /arm/set_home
          # Points of interest from poi_store (list is latched; edits go through POST /api/poi).
          poi_list_topic: /poi/list
          poi_command_topic: /poi/command
          poi_result_topic: /poi/result
          # Photo store summary from poi_store (latched; the UI refetches /api/photos when its revision changes).
          poi_photos_topic: /poi/photos
          # Grasp panel: JSON requests/answers of the mcp_server GraspService (POST /api/grasp, progress on /ws).
          grasp_command_topic: /grasp/command
          grasp_result_topic: /grasp/result
          # Photo store (index.jsonl + JPEGs; same path as mcp_server lookups.store_dir), read-only: GET /api/photos, /api/photos/{id}.jpg.
          lookups_dir: /var/lib/ros2/poi/lookups
          # GPS anchor while parked: one fix + the BNO055 NDOF compass heading (bno055_imu operation_mode: NDOF), trusted
          # only once /imu/calibration reports mag >= 2; the drive fit replaces it when it passes.
          gps_anchor_imu_topic: /imu/data
          gps_anchor_imu_calibration_topic: /imu/calibration
          # Magnetic declination at lat 54.605 lon 18.31 (Gdansk area), east positive: approx +6.6 deg in 2026
          # (NOAA WMM model, about 6.5 deg in 2024 growing 0.2 deg/yr; recheck at https://www.ngdc.noaa.gov/geomag/).
          magnetic_declination_deg: 6.6
          # Proxied map tiles are cached in /var/cache/web_ui/tiles (default tile_cache_dir, created by
          # playbooks/tasks/web_ui_tile_cache_dir.yml), one subdirectory per source. The layers panel switches between
          # the sources; above a source's max_zoom the UI stretches its max-zoom tiles up to tile_display_zoom.
          tile_display_zoom: 19
          default_tile_source: satellite
          tile_sources:
            # Esri template order is {z}/{y}/{x} (row before column). Real imagery z18-z20 at the robot; z21 is a placeholder.
            - id: satellite
              label: Satellite
              url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
              max_zoom: 20
              attribution: "Esri, Maxar, Earthstar Geographics"
            # CARTO basemaps need an API key: {api_key} is filled from the env var below (/etc/ros2/web_ui/env, written by
            # playbooks/tasks/web_ui_tile_key.yml from the deployer's CARTO_API_KEY). The key tier serves z <= 18 (403 above).
            - id: street
              label: Street
              url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key={api_key}"
              subdomains: abcd
              max_zoom: 18
              api_key_env: WEB_UI_TILE_API_KEY
              attribution: "CARTO, OpenStreetMap contributors"
        # Chat with the claude_agent node (127.0.0.1:18300, its http_port); the backend proxies /api/agent and /ws/agent.
        - id: agent
          type: agent_chat
          label: "Agent"
          agent_url: http://127.0.0.1:18300
        # Arm tab: gripper + overview cameras, arm-glued 3D views and arm control. The gripper camera mount is the
        # one of mcp_server cameras.gripper.mount below (a test pins them equal).
        - id: arm
          type: arm
          label: "Arm"
          gripper_camera_topic: /camera_0/image_raw/compressed
          overview_camera_topic: /overview_camera/image_raw/compressed
          arm_urdf: so101_arm.urdf
          arm_joint_states_topic: /follower/joint_states
          arm_offset: [0.0592, -0.05, 0.100]
          gripper_camera_mount:
            xyz: [-0.0046, 0.0364, -0.0364]
            rpy: [-1.5622, 1.1950, -1.4466]
        # Head tab: overview camera (left IMX219) as head RGB and greyscale depth from the stereo_depth node (16UC1 mm on
        # the ToF contract; the stereo pair has no amplitude image). Pan/tilt is a disabled placeholder; nothing is published.
        - id: head
          type: head
          label: "Head"
          rgb_camera_topic: /overview_camera/image_raw/compressed
          tof_depth_topic: /stereo/depth/image_raw
          tof_range_m: 4.0
        - id: overview_camera
          type: camera
          label: "Overview"
          topic: /overview_camera/image_raw/compressed
        - id: poi
          type: poi
          label: "POI"
          poi_list_topic: /poi/list
          poi_photos_topic: /poi/photos
      # Status bar readouts from live client topics; "position[name=fl_steer]" picks the joint by name, not by index.
      overlays:
        - topic: /client/gps/fix
          field: "latitude"
          label: "Lat"
          format: ".6f"
        - topic: /client/gps/fix
          field: "longitude"
          label: "Lon"
          format: ".6f"
        - topic: /odom
          field: "twist.twist.linear.x"
          label: "Vel"
          format: ".2f"
          unit: "m/s"
        - topic: /swerve_drive/joint_states
          field: "position[name=fl_steer]"
          label: "FL Steer"
          format: ".2f"
          unit: "rad"
  - name: mcp_server
    node_type: mcp_server
    present: true
    enabled: true
    config: |
      server:
        host: "0.0.0.0"
        port: 18200
        path: /mcp
      topics:
        # Front camera: the overview camera (left IMX219, 480x360 at 5 fps) looking down at the front of the robot.
        front_camera: /overview_camera/image_raw/compressed
        # Body monitor feeds (get_body_state, /robot_events): servo register dump, swerve odom (twist covariance = slip
        # residual), rf2o twist, BNO055 IMU.
        servo_registers: /follower/servo_registers
        swerve_odom: /odom
        rf2o_twist: /odom_rf2o_twist
        imu: /imu/data
        robot_events: /robot_events
        # Gripper Present_Current (A) from the follower bridge (publish_current_joints there): the grasp band's current vote.
        follower_joint_currents: /follower/joint_currents
        # get_topdown_view: local costmap (subscribed lazily, latest message only) and the current Nav2 plan.
        local_costmap: /local_costmap/costmap
        plan: /plan
        # POI tools talk to poi_store (same topics as its entry below).
        poi_list: /poi/list
        poi_command: /poi/command
        poi_result: /poi/result
        # Web-UI grasp actions: JSON requests in, JSON results out (nodes/mcp_server/README.md, "Grasp macros").
        grasp_command: /grasp/command
        grasp_result: /grasp/result
        # Gripper torque_limit writes of grip profiles go to the follower bridge (RAM registers only).
        follower_set_register: /follower/set_register
      arm:
        urdf_path: nodes/web_ui/urdf/so101_arm.urdf
        home_file: /var/lib/ros2/arm/home.yaml
        # Arm mount plane (URDF base_link origin) height above the floor: 10.0 cm (floor_z_m = -0.100). Was 10.4 cm from tip
        # touch-downs, 15 cm before. Corrected 2026-10-10 after the grid calibration was deployed: the fixed-jaw tip
        # commanded 1 cm above base_link (0.30, 0) had FK X/Y confirmed exactly by the user, FK height 6.9 mm, physically
        # 3 mm above the floor, so the floor is 3.9 mm higher than configured (the grid fit with the floor free also
        # moved it about 3 mm). Mount x/y unchanged.
        arm_base_height_m: 0.100
        # Arm reach on the floor around the shoulder pan axis, drawn as the reach annulus on annotated camera images
        # (approximate: measure it and adjust).
        reach_outer_m: 0.25
        reach_inner_m: 0.05
        # Follower-vs-URDF joint zero offsets (rad): urdf_angle = measured_angle + offset (nodes/mcp_server/README.md).
        # Solved 2026-10-10 on a 50 mm grid sheet (234 camera points from 20 views, 6 tip touch-downs, floor fixed at
        # -0.104; held out: floor error 4.1 mm vs 44.9 mm with the 2026-10-08 set, tip 6 mm vs 35 mm; home tip height
        # 243.6 mm vs 243 mm measured), docs/calibration/2026-10-10/session/results.yaml. wrist_roll is not identifiable from these
        # data (absorbed by the camera mount and tool point) and keeps the 2026-10-08 value.
        joint_offsets_rad:
          shoulder_pan: 0.0182
          shoulder_lift: -0.0345
          elbow_flex: -0.1070
          wrist_flex: 0.0988
          wrist_roll: -0.0710
        # Tool point (m) in the gripper_frame_link frame: the physical fixed-jaw tip, fitted 2026-10-10 with the joint
        # offsets above (grid sheet tip touches). Replaces the 2026-10-08 effective TCP (0.0104, -0.0282, -0.0017).
        tool_offset_m: {x: 0.0010, y: -0.0056, z: -0.0014}
        # URDF shoulder_lift upper limit 1.745 rad widened (tested 2026-10-08: reached 1.87 rad without collision; the
        # servo cannot lift the stretched-out arm beyond about 1.85 rad): a folded arm reaches about 5 cm below the floor.
        joint_limit_overrides_rad:
          shoulder_lift: [-1.745, 1.9]
        # Arm base frame pose in base_link (x/y/z in m, yaw in rad; z must equal arm_base_height_m), measured 2026-10-10:
        # shoulder_pan axis centre 98 mm forward, 50 mm right of the centre between the wheels (user, from the CAD
        # model); URDF base origin = pan axis - (38.8 mm forward, 62.4 mm up); height 0.100 (floor
        # at z -0.100 in the arm frame, corrected 2026-10-10 from the deployed-tip floor check, see arm_base_height_m). The grid sheet fit wanted
        # the sheet 22.3 mm further forward than its labels: the sheet was shifted (user), the mount stays.
        # Used for arm <-> base_link conversions (gripper-camera base_link/map coordinates, grasp objects given in
        # base_link, the floor slow zone). null disables them.
        base_in_base_link: {x: 0.0592, y: -0.05, z: 0.100, yaw: 0.0}
        # Gravity sag compensation (nodes/mcp_server/README.md, "Gravity sag compensation"): commanded joint target =
        # target - k * gravity torque (URDF inertials), k after a lifting approach, k_lowering after a lowering one
        # (rad per N m), at most max_rad. Fitted 2026-10-10 from the grid-sheet touch-downs
        # (docs/calibration/2026-10-10/sag_fit.md): held-out residual shoulder_lift 0.067 -> 0.005 rad, elbow_flex
        # 0.042 -> 0.007 rad, hover tool point 12.8 -> 3.4 mm RMS. wrist_flex is not compensated (its data cover only
        # 0.009-0.012 N m of a torque range up to 0.117 N m). Re-fit with sag_fit.py from the arm_settle records.
        sag_compensation:
          enabled: true
          k: {shoulder_lift: 0.141, elbow_flex: 0.169}
          k_lowering: {shoulder_lift: 0.004}
          max_rad: 0.12
      # Inverse reachability map grid (nodes/mcp_server/README.md, "Reach map"): explicit values equal to the defaults.
      # The committed artifact nodes/mcp_server/mcp_server/data/reach_map.npz is built from this block plus the body, arm
      # mount, joint limits/offsets and margins above by scripts/gen_reach_map.py; its key must match (tests fail when
      # any of them changes without regenerating: uv run python scripts/gen_reach_map.py).
      reach_map:
        heading_step_deg: 5.0
        r_step_m: 0.02
        r_max_m: 0.48
        z_step_m: 0.025
        z_max_m: 0.45
        planar_samples: [72, 72, 37]
        samples_per_cell: 2
      # Approach pose planner and grasp docking interfaces: explicit values equal to the defaults. staging_offset_m,
      # docking_threshold_m, dock_action and detection_topic must equal nodes/nav2_bringup/config/grasp_docking_params.yaml
      # (staging_x_offset, docking_threshold, /grasp/docking_server); tracker.rate_hz > 2 / external_detection_timeout.
      approach:
        yaw_step_deg: 10.0
        cells_per_yaw: 30
        min_expected_margin_m: 0.0
        pose_error_xy_m: 0.03
        pose_error_yaw_deg: 3.0
        margin_cap_m: 0.08
        weights:
          margin: 1.0
          cost: 0.5
          travel: 0.2
          heading: 0.1
        staging_offset_m: 0.30
        docking_threshold_m: 0.03
        corridor_samples: 5
        verify_top_k: 5
        path_check_k: 3
        global_costmap_topic: /global_costmap/costmap
        costmap_stale_s: 5.0
        planner_action: /compute_path_to_pose
        dock_action: /grasp/dock_robot
        detection_topic: /grasp/detected_dock_pose
        dock_timeout_s: 120.0
        tracker:
          rate_hz: 5.0
          min_score: 0.6
          template_px: 48
          search_px: 96
          max_correction_m: 0.10
          edge_margin_px: 20
      limits:
        # Tracking abort compares each joint against the setpoint commanded this long ago (s). Clean servo lag 0.20-0.24 s
        # measured 2026-10-11 with P=16; 0.35 leaves margin. The old 0.65 compensated the 25% tick stretch (fixed sleep
        # per tick, now deadline-scheduled) and the follower register-dump stall.
        arm_tracking_delay_s: 0.35
        # No extra lag * velocity term on top of the delay window (it double-counted the lag: a jam at 1 rad/s aborted
        # only 0.85 rad behind the newest setpoint); a jam now aborts about 0.6 rad behind it.
        arm_tracking_lag_s: 0.0
      # Camera geometry for pixel_to_ground, annotated images and candidate points (nodes/mcp_server/README.md, "Camera
      # tools and calibration"). Both cameras are NOT calibrated until intrinsics and mount are set. intrinsics is
      # {calibration_file: <camera_calibration yaml>} or an approximation {hfov_deg: 66.0, width: 640, height: 480};
      # Camera calls subscribe per call: on the loaded Pi, DDS discovery can exceed the 2 s default.
      timeouts:
        image_timeout_s: 5.0
      # mount is the solve_camera_calibration output (parent_frame x y z roll pitch yaw, body frame x fwd / y left / z up).
      # The gripper mount is relative to the URDF link gripper_link of so101_arm.urdf, the front mount to base_link.
      cameras:
        calibration_dir: /var/lib/ros2/camera_calibration
        # Mount re-solved 2026-10-08 (afternoon) from 15 views at wrist_roll 0, -0.8, -1.57, -2.3, -2.69 over a steel
        # ruler (3 arm poses, 115 points; intrinsics and the pan/lift/elbow/wrist_flex offsets kept): floor RMS 6.6 mm,
        # held-out views 4-14 mm. The previous mount fitted only low oblique views at roll 0 (35 mm on these views).
        # Superseded 2026-10-10: the gripper mount and intrinsics below were re-solved jointly with joint_offsets_rad and
        # the tool point on a 50 mm grid sheet (234 points, 20 views, floor at the measured -0.104): held-out 5.5 px /
        # 4.1 mm floor error (2026-10-08 set: 96 px / 45 mm), docs/calibration/2026-10-10/session/results.yaml.
        gripper:
          parent_frame: gripper_link
          intrinsics:
            calibration_file: "{{ ros2_repo_dest }}/nodes/mcp_server/calibration/gripper_camera.yaml"
          mount:
            parent_frame: gripper_link
            x: -0.0046
            y: 0.0364
            z: -0.0364
            roll: -1.5622
            pitch: 1.1950
            yaw: -1.4466
        front:
          parent_frame: base_link
          intrinsics: null
          mount: null
      # Nav2 goal precision stated in the navigation tool descriptions (nav2_params.yaml goal checker: 0.01 m, 0.035 rad).
      # A goal ends early (cancelled, 'succeeded') within the intermediate tolerances unless the call passes precise=true.
      nav:
        goal_xy_tolerance_m: 0.01
        goal_yaw_tolerance_deg: 2.0
        intermediate_xy_tolerance_m: 0.03
        intermediate_yaw_tolerance_deg: 5.0
      # Below cells x cutoff_cell_v (3 x 2.8 = 8.4 V) motion/effector tools are refused; stop and sensors keep working.
      battery:
        topic: /battery_state
        cells: 3
        cutoff_cell_v: 2.8
        resume_cell_v: 2.9
        stale_s: 5.0
      # Body monitor thresholds: events on /robot_events, get_body_state, digest on every tool result, early-return motion.
      monitor:
        servo_temp_warn_c: 60
        servo_temp_critical_c: 70
        cpu_temp_warn_c: 75
        cpu_temp_critical_c: 82
        battery_warn_margin_cell_v: 0.2
        stall_s: 1.0
        slip_residual_warn_mps: 0.1
        bump_warn_mps2: 4.0
        bump_critical_mps2: 9.0
        tilt_warn_deg: 10
        # /tilt_guard/state (1 Hz) older than this is stale: its last level stays enforced and, at level ok,
        # navigation is refused (as with imu_ok false) until the guard reports again; manual drive still works.
        tilt_guard_stale_s: 3.0
        tilt_cancel_attempts: 3       # Nav2 goal cancel tries at a tilt warning/error entry, then tilt_nav_cancel_failed
        tilt_cancel_retry_s: 1.0
        debounce_default_s: 30
      # Robot outer frame (m, centred on base_link): drawn by get_topdown_view, sets look_around's rotation clearance.
      footprint:
        length_m: 0.47
        width_m: 0.386
      # Navigation footprint mcp_server publishes (nodes/mcp_server/README.md, "Navigation footprint"): the static H body +
      # parked arm (Nav2 costmaps and inflation, laser_filter polygon), or while the arm is released out of it the
      # static outline + measured arm shadow + carried object, with the collision_monitor ArmStop polygon. Numbers
      # generated by scripts/gen_nav_footprint.py from scripts/gen_nav_footprint.yaml; do not edit them here.
      nav_footprint:
        # >>> gen_nav_footprint: mcp_nav_footprint
        circle_segments: 16
        close_gap_m: 0.01
        laser_filter_margin_m: 0.01
        stopbox_margin_m: 0.02
        simplify_m: 0.005
        decimals: 4
        costmap_resolution: 0.025
        max_cost_scaling_factor: 25.0
        parked_arm_shadow:
          - [0.3225, -0.0674]
          - [0.322, -0.0391]
          - [0.2585, -0.0074]
          - [-0.0051, -0.0144]
          - [-0.0065, -0.0777]
          - [0.0089, -0.0884]
          - [0.1536, -0.0942]
          - [0.2574, -0.0896]
        # <<< gen_nav_footprint: mcp_nav_footprint
      topdown:
        default_radius_m: 2.5
        default_px: 480
        arm_reach_m: 0.41
      # /swerve_drive/joint_states (50 Hz) is subscribed only while steer positions are read (release_control base reset,
      # get_control_state steering_neutral): first-message wait after subscribing, destroyed once unread for idle_s.
      control:
        steer_states_wait_s: 0.5
        steer_states_idle_s: 30.0
      # Object memory (remember_object / list_objects / forget_object): objects are object POIs in poi_store; store_path is
      # only the legacy objects.json, imported once into poi_store and renamed *.migrated (directory made by mcp_server_setup.yml).
      objects:
        store_path: /var/lib/ros2/objects/objects.json
        merge_radius_m: 0.25
      # look_around: equal in-place headings; refused when an obstacle is inside footprint radius + margin. mode spin:
      # one continuous slow rotation (frames while turning), steps: one precise Nav2 rotation per heading. The turn
      # ends facing the last heading unless the agent passes return_to_start=true.
      look_around:
        default_captures: 4
        clearance_margin_m: 0.10
        step_timeout_s: 30
        mode: spin
        spin_speed_rps: 0.4
        return_to_start: false
      # Non-blocking motion queue (enqueue_motions / wait_for_event, nodes/mcp_server/README.md "Motion queue"):
      # pending-step cap, wait bounds and the precondition thresholds (base_still, gripper_holding).
      motion_queue:
        max_steps: 32
        wait_default_s: 30
        wait_max_s: 120
        base_still_linear_mps: 0.02
        base_still_angular_rps: 0.05
        holding_min_effort: 100.0
        # watch_constraints of enqueue_motions: evaluation rate and the most constraints one call may attach.
        watch_rate_hz: 10
        watch_max_per_call: 8
      # Guard rules (nodes/mcp_server/README.md "Guard rules"): declarative refusals checked outside the model.
      # All start in dry_run (log guard_rule_would_refuse + mcp_guard_rule_hits_total, nothing refused). After a week of
      # counters, flip one rule at a time to `mode: enforce` and redeploy (ansible/README.md "Guard rules").
      guard_rules:
        enabled: true
        rules:
          # Hazard: the footprint stays static while the agent holds the arm (control.py), so costmaps, collision_monitor
          # and laser_filter ignore an extended arm. 0.03 m > stopbox_margin 0.02 and one 0.025 m costmap cell.
          - name: base_motion_arm_outside_footprint
            mode: dry_run
            message: "The arm sticks out of the robot footprint, so obstacle avoidance cannot see it. Either run arm_home (or fold the arm inside
              the outline), or call release_control with keep_position=true to hand the base back holding its pose, then repeat
              the base move."
            applies_to:
              tools: [navigate_to_pose, move_relative, drive, look_around, go_to_frontier, look_toward_frontier, approach_for_grasp]
              steps: [base_relative, navigate_to_pose]
            all:
              - {field: footprint.kind, op: eq, value: static}
              - {field: arm.outside_footprint_m, op: gt, value: 0.03}
            when_unknown: reject
          # Hazard: a carried object is outside every footprint unless released with carried_object_radius_m (control.py).
          - name: base_motion_carrying_without_object_footprint
            mode: dry_run
            message: "An object is carried but the footprint does not include it. Call release_control with carried_object_radius_m set to the
              object radius (or put the object down with release_object), then repeat the base move."
            applies_to:
              tools: [navigate_to_pose, move_relative, drive, look_around, go_to_frontier, look_toward_frontier, approach_for_grasp]
              steps: [base_relative, navigate_to_pose]
            all:
              - {field: arm.carrying, op: eq, value: true}
              - {field: footprint.carried_radius_m, op: le, value: 0.0}
            when_unknown: reject
          # Hazard: take_control acquires unconditionally (control.py) and a human just took the arm (human_takeover, monitor.py).
          - name: no_arm_retake_from_human
            mode: dry_run
            message: "A human is driving the arm (web UI) or took it less than 30 s ago. Do not retake it: wait 30 s or ask the user to hand
              it back, then call take_control again."
            applies_to:
              tools: [take_control]
            all:
              - {field: args.subsystem, op: eq, value: arm}
            any:
              - {field: arm.active_source, op: eq, value: web_ui}
              - {field: events.human_takeover_age_s, op: lt, value: 30}
            when_unknown: allow
          # Hazard: memory note 2026-10-08, roll only with the arm lifted and clear (finger tip sweeps ~0.10 m from the wrist).
          - name: wrist_roll_needs_lifted_arm
            mode: dry_run
            message: "Wrist roll with the tool below 0.12 m would sweep the finger into the floor or body. Lift the arm first with
              move_arm_cartesian to a tool height of at least 0.12 m, then roll."
            applies_to:
              arm_motion_from: [move_arm_joints, move_arm_cartesian, arm_joints, arm_cartesian]
            all:
              - {field: motion.abs_delta.wrist_roll, op: gt, value: 0.1}
            any:
              - {field: start.tool_height_m, op: lt, value: 0.12}
              - {field: target.tool_height_m, op: lt, value: 0.12}
            when_unknown: reject
          # Hazard: memory note, negative elbow stretches; shoulder_lift past ~1.85 rad stalled the shoulder under load.
          - name: no_stretched_shoulder_overreach
            mode: dry_run
            message: "Stretched pose (shoulder_lift above 1.85 rad with a negative elbow_flex) stalls the shoulder under load. Choose a target
              nearer the base or bend the elbow (elbow_flex at or above 0), or run arm_home first."
            applies_to:
              arm_motion_from: [move_arm_joints, move_arm_cartesian, arm_joints, arm_cartesian, grasp_object, grasp]
            all:
              - {field: target.joint.shoulder_lift, op: gt, value: 1.85}
              - {field: target.joint.elbow_flex, op: lt, value: 0.0}
            when_unknown: reject
      poi:
        request_timeout_s: 3.0
        near_radius_m: 5.0
      # Auto stuck points (nodes/mcp_server/README.md, "Auto stuck points" and "poi_hint nudge"): collision_stop and Nav2
      # aborts drop a point POI at the robot pose; hint_after_images camera / look_around results without a POI write
      # add a poi_hint to the result.
      auto_poi:
        enabled: true
        merge_radius_m: 0.5
        max_pose_age_s: 2.0
        event_types: [collision_stop, nav_abort]
        hint_after_images: 3
      # Camera photos (nodes/mcp_server/README.md, "Photos (photo POIs)"): the JPEG target directory only; every camera
      # image is a photo POI whose index and retention (max_records / max_bytes / max_age_days) poi_store owns
      # (poi_store photos: block below).
      lookups:
        store_dir: /var/lib/ros2/poi/lookups
      # Frontier exploration (list_frontiers, plan_frontier_visit, go_to_frontier, look_toward_frontier), computed per /map
      # version; every key at its FrontierSettings default (nodes/mcp_server/README.md).
      frontiers:
        min_length_m: 0.3 # smaller frontier clusters are dropped
        map_max_age_s: 60.0 # an older /map counts as unavailable
        geodesic_downsample: 2 # geodesic grid cell = map resolution x this
        pass_clearance_margin_m: 0.03 # traversable cell clearance = footprint half width + this
        view_clearance_margin_m: 0.05 # observation pose clearance = footprint circumscribed radius + this
        standoff_min_m: 0.4 # observation pose: nearest distance to the frontier
        standoff_max_m: 1.2 # observation pose: farthest distance to the frontier
        los_candidates: 5 # best-scored observation poses checked for line of sight
        match_radius_m: 0.6 # centroid distance that keeps a frontier id across map versions
        epoch_reset_known_fraction: 0.5 # known cells below this fraction of the previous map restart the ids
        retired_keep: 50 # retired ids remembered for "gone, replaced by"
        max_listed: 15 # list_frontiers cap, reachable first by path distance
        poi_radius_m: 2.0 # nearest-POI search radius per frontier
        facing_half_angle_deg: 30.0 # a lookup faces a frontier within this angle
        facing_max_distance_m: 6.0 # ... and within this distance of the lookup position
        compute_path_timeout_s: 5.0 # plan_frontier_visit Nav2 path check timeout
        look_timeout_s: 20.0 # look_toward_frontier rotation timeout
        look_camera: front # look_toward_frontier default camera (front or gripper)
      # Below-surface slow zone of every arm motion (nodes/mcp_server/README.md, "Floor slow zone"): trajectory steps
      # where a jaw tip, the wrist or the elbow is within margin_m of the effective surface (the higher of the robot
      # plane at surface_z_m and the IMU gravity-level plane through base_link) run at slow_speed_scale of their speed.
      # It never blocks; agents can only shift it per call (surface_z_m, tilt_override_deg). An IMU tilt older than
      # imu_max_age_s is ignored (robot plane only).
      floor_guard:
        enabled: true
        margin_m: 0.02
        slow_speed_scale: 0.2
        surface_z_m: 0.0
        imu_max_age_s: 1.0
        # BNO055 mounting bias: IMU roll/pitch while the robot stands level on the floor arm_base_height_m was fitted
        # on (2026-10-11 investigation: roll 0.5-0.8, pitch 1.2-1.4 deg; values from it, not a fresh capture). The
        # slow zone and grasp surface use the IMU tilt minus this. Re-capture it whenever the floor height is recalibrated.
        imu_level_reference:
          roll_deg: 0.7
          pitch_deg: 1.3
      # Robot body the arm must not hit (nodes/mcp_server/README.md, "Body collision"), base_link metres (x forward, y left,
      # z up from the floor). Seen from above the robot is an H: two side frames above the wheels, the crossbar between
      # them (the arm base and the lidar stand on it; the arm base/shoulder link is not checked), the wheels as their
      # steering envelopes (vertical cylinders around the steer axes, they steer) and the lidar column up to the dome top.
      # Measured 2026-10-10: lidar dome diameter 74 mm (radius 37 mm), top face 210 mm; wheels and side bars 35 mm wide (wheel envelope =
      # half-diagonal of the 120 x 35 mm wheel, 62.5 mm); side bar top ~180 mm. Still assumed (README "How to
      # measure"): wheel line from swerve half_length/half_width 0.1525/0.1333, side bar bottom 120 mm, crossbar extent
      # and height (it spans to the side bars' inner faces), lidar column bottom 100 mm.
      body:
        boxes:
          - {name: frame_left, center: [0.0, 0.1333, 0.15], size: [0.425, 0.035, 0.06]}
          - {name: frame_right, center: [0.0, -0.1333, 0.15], size: [0.425, 0.035, 0.06]}
          - {name: crossbar, center: [-0.025, 0.0, 0.08], size: [0.25, 0.2316, 0.04]}
        cylinders:
          - {name: wheel_fl, x: 0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
          - {name: wheel_fr, x: 0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
          - {name: wheel_rl, x: -0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
          - {name: wheel_rr, x: -0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
          - {name: lidar, x: 0.150, y: 0.040, radius: 0.037, z_min: 0.10, z_max: 0.21}
      # Arm self-collision soft boundary over every executed arm trajectory sample: link clearance to a body obstacle
      # below soft_margin_m runs at slow_speed_scale (the slower of this and the floor guard wins); below hard_margin_m
      # (or penetrating) the motion is rejected before it starts. enabled: false switches the check off. The reach_*
      # values set get_arm_reach's envelope grid (shoulder_pan headings x tool heights in base_link).
      body_check:
        enabled: true
        soft_margin_m: 0.03
        hard_margin_m: 0.002
        slow_speed_scale: 0.3
        reach_heading_step_deg: 15
        reach_height_max_m: 0.35
        reach_height_step_m: 0.05
        # Envelope cache: started at server start and reused across restarts unless the body, mount, limits, grid or
        # margins changed (first computation takes ~95 s on the RPi5 under the unit's CPU quota).
        reach_cache_file: /var/lib/ros2/arm/reach_envelope.json
      # Grasp planner defaults (plan_grasp / grasp_object / release_object and /grasp/command); every value can be
      # overridden per call through `params`. Lengths in m, the tool point is the fixed jaw's inner face (arm.tool_offset_m).
      # Validated in the MuJoCo sim with jaws calibrated to arm.tool_offset_m (sim/README.md, "Planner scenario matrix").
      grasp:
        approach_distance_m: 0.04       # straight approach before the object (beyond half its depth)
        pre_grasp_clearance_m: 0.05     # lifted pre-grasp (roll happens here, gripper at most half open)
        approach_speed_scale: 0.3       # free moves to the lifted pre-grasp and its roll (capped to arm_max_speed_scale)
        slide_speed_scale: 0.15         # approach, slide, lift and retreat speed scale
        lift_height_m: 0.05
        retreat_distance_m: 0.05
        jaw_thickness_m: 0.008          # fixed jaw thickness below its inner face (estimate)
        jaw_open_margin_m: 0.015        # opening beyond the gripped size
        # angled / top_down centre the opening on the object: each jaw clears its side face by at least this
        # (2026-10-10: the fixed jaw went onto the face and tipped a 39 mm jar over on approach)
        fixed_jaw_clearance_m: 0.0075
        below_object_offset_m: 0.005    # scoop: fixed jaw top below the object bottom (clamped to skim the surface)
        skim_clearance_m: 0.003         # scoop: fixed jaw bottom above the surface when skimming
        max_object_width_m: 0.08
        min_object_width_m: 0.01       # narrower objects are rejected: the jaws cannot hold them
        hold_effort_min: 100            # verified grasp: load still felt after the close
        min_hold_gap_rad: 0.08          # verified grasp: jaw stopped this far short of closed
        interpolation_step_m: 0.005     # straight-line IK sample spacing
        max_joint_jump_rad: 0.25
        scoop_pitch_deg: 0              # horizontal scoop first, steeper pitches up to scoop_max_pitch_deg
        scoop_max_pitch_deg: 40         # sim: gap scoops lift 9/9 up to 40 deg; steeper ones slip (25 left 1 feasible)
        scoop_pitch_step_deg: 5
        scoop_gap_margin_m: 0.004       # scoop only when the object's gap_below_m >= jaw_thickness_m + this
        tall_ratio: 1.5                 # height / width above this = tall narrow object:
        tall_grasp_height_fraction: 0.3 #   gripped at this fraction of its height from the bottom
        lift_speed_scale: 0.05          #   and lifted at this speed scale (others lift at slide_speed_scale)
        angled_pitch_deg: 45
        stall_shoulder_lift_rad: 1.85   # stretched arm (elbow_flex <= stretched_elbow_max_rad) above this stalls
        stretched_elbow_max_rad: 0.0
        release_open_fraction: 0.6
        release_lift_m: 0.05
        # auto: top_down first, then angled; scoop last and only for objects with a gap under them (flat objects get
        # "no gap under object for the fixed jaw").
        auto_order:
          - {strategy: top_down}
          - {strategy: angled, approach_pitch_deg: 45}
          - {strategy: scoop}
      # Per-object grip strength (nodes/mcp_server/README.md, "Grip profiles"): set_gripper / grasp_object /
      # the motion queue / the web UI pick a preset (or inline overrides) per object. Values in servo units, tune on
      # the real gripper: torque_limit is the gripper servo's Torque_Limit RAM register (0.1 % of max torque, written
      # before the close, default restored after every open, release, abort and at startup), loads are the decoded
      # gripper effort. Hard caps torque_limit_max / squeeze_max_rad apply to every profile, preset or inline.
      # Post-lift visual grasp check (confirm_grasp): the gripper camera frame cropped to the region between the jaws.
      grasp_check:
        crop_depth_m: 0.045           # how far into the jaws (toward gripper_link) the crop reaches
        crop_margin_px: 24            # added on every side of the projected jaw box
        crop_min_px: 64               # a smaller crop falls back to the full frame
        image_px: 640                 # longest side of the attached image
      grip_profiles:
        default_grip_profile: normal
        torque_limit_max: 800         # never above 80 % torque (the SO-101 gripper burns out squeezing blocked objects)
        squeeze_max_rad: 0.08
        closing_load_sign: 1          # decoded effort sign while closing on an object (gripper not inverted)
        hold_check_delay_s: 0.25      # holding_load / slipping sampled this long after the hold (twice)
        slip_threshold_rad: 0.01      # jaw closing more than this between the samples = slipping
        retighten_load_below: 30      # retighten profiles: a hold relaxed below this (jaw not in the empty band) steps
                                      # once to squeeze_max_rad past the contact, never past closed (null = never); a
                                      # re-tightened hold showing crush_risk goes back to the hold before it
        unverified_hold_relax_s: 60   # an unverified (empty-band) hold keeps the profile torque this long, then the
                                      # default torque is restored (servo heating while the agent looks; null = never)
        # Delta contact (arXiv 2608.23983, SO-ARM101 / STS3215): the baseline is the mean of this many closing loads
        # (free-closing after contact_allowed opens, else the rest samples); contact needs closing load - baseline >=
        # the preset's contact_load_delta for contact_persist_samples ticks in a row. contact_effort_threshold,
        # target_load and the stall check stay as absolute backstops (a close that starts touching the object).
        contact_baseline_samples: 10
        contact_persist_samples: 3
        # Gripper current rise (A) that votes 'object' in the grasp band; null = recorded but not voting. Set it from
        # the empty-jaw close noise (rollout step 4: about 3-4 sigma).
        current_contact_delta_a: null
        presets:                      # tuned on the real gripper 2026-10-10 (grip tuning session, mcp_server README)
                                      # contact_load_delta: null (load-rise contact OFF). Measured 2026-10-11, 5 empty
                                      # closes per preset: the load rose 35-124 above the free-closing baseline, so a
                                      # 20 delta stopped every close half-open; the absolute thresholds stay the contact.
          gentle:                     # fragile or light objects (a plush still gets squashed: load cannot see it)
            squeeze_rad: 0.01
            torque_limit: 250
            close_speed_rps: 0.2
            target_load: 80           # stop closing once the closing load reaches this
            contact_effort_threshold: 120
            contact_load_delta: null
            crush_load: 200           # holding load above this reports crush_risk
            retighten: false          # its 0.01 squeeze would grow 8x on a light rigid object reading ~0 load
          normal:                     # ordinary objects (squeeze, speed and contact load used before profiles)
            squeeze_rad: 0.03
            torque_limit: 500
            close_speed_rps: 0.5
            target_load: 200
            contact_effort_threshold: 300
            contact_load_delta: null
            crush_load: 450
            retighten: true
          firm:                       # heavy or slippery objects, tools (unvalidated on a held object)
            squeeze_rad: 0.05
            torque_limit: 650
            close_speed_rps: 0.4
            target_load: 300
            contact_effort_threshold: 350
            contact_load_delta: null
            crush_load: 600
            retighten: true
          soft:                       # plush, foam, fabric: compresses under the hold (2026-10-11 croc head slipped
                                      # out of a normal hold that relaxed to load 0). Full squeeze cap past the contact;
                                      # torque 600 < cap 800: the hold target is inside the object, so the servo stalls
                                      # on it at this torque limit, never at closed and never above it
            squeeze_rad: 0.08
            torque_limit: 600
            close_speed_rps: 0.3
            target_load: 150
            contact_effort_threshold: 250
            contact_load_delta: null
            crush_load: 550           # a hold near the torque limit flags crush_risk
            retighten: true
  - name: poi_store
    node_type: poi_store
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19109
      store_path: /var/lib/ros2/poi/poi.json
      list_topic: /poi/list
      command_topic: /poi/command
      result_topic: /poi/result
      # Photo store: the camera photos mcp_server writes as JPEGs, indexed and pruned by poi_store.
      photos:
        # Directory of the <id>.jpg files and index.jsonl (created by playbooks/tasks/poi_store_dir.yml).
        store_dir: /var/lib/ros2/poi/lookups
        # Most photos kept; the oldest go first.
        max_records: 3000
        # Most total JPEG bytes kept (300 MB).
        max_bytes: 300000000
        # Oldest photo age kept (days).
        max_age_days: 14
        # Largest single JPEG an add accepts (5 MB).
        max_image_bytes: 5000000
        # Period of the retention timer (s), so the age limit holds without camera activity.
        prune_interval_s: 3600
        # Latched std_msgs/String photo summary topic.
        summary_topic: /poi/photos
  - name: costmap_zones
    node_type: costmap_zones
    present: true
    enabled: true
    config: |
      # Prometheus /metrics on 127.0.0.1 (scraped by Alloy: monitoring_node_targets).
      metrics_port: 19111
      map_topic: /map
      poi_list_topic: /poi/list
      keepout_mask_topic: /costmap_zones/keepout_mask
      speed_mask_topic: /costmap_zones/speed_mask
      # Must equal filter_info_topic of keepout_filter / speed_filter in nav2_params.yaml.
      keepout_info_topic: /costmap_filter_info/keepout
      speed_info_topic: /costmap_filter_info/speed
  - name: claude_agent
    node_type: claude_agent
    present: true
    enabled: true
    config: |
      model: opus
      # The agent splits each task into phases and sets rw (effector calls) / turn caps per phase via
      # agent.set_task_plan. Sensor calls are never capped. The caps of all phases together stay within the
      # instruction maxima, one phase within the per-phase maxima. raise_phase_budget may be called more than once per
      # phase within these maxima.
      max_rw_cap: 400
      max_turn_cap: 500
      max_phase_rw_cap: 100
      max_phase_turn_cap: 100
      # Plan tree: largest max_iterations of a while node (1 to 5). A phase closed as failed is re-entered
      # automatically when its p_retry_success >= retry_success_threshold, attempts and budget allow it, and
      # fewer than max_auto_retries automatic re-entries happened in this instruction.
      max_loop_iterations: 5
      retry_success_threshold: 0.5
      max_auto_retries: 6
      # Bound of the retry calibration ledger <state_dir>/calibration/retry_outcomes.jsonl (each failed-phase
      # p_retry_success paired with the next attempt's outcome; survives /api/reset). Past it the oldest half is
      # dropped. At least 100.
      retry_ledger_max_records: 5000
      # Job end: an instruction may only end with the arm at home, no control lease held and the plan finished.
      # The runner sends up to job_end_max_followups refusal follow-ups, then parks the arm itself (release_control all).
      job_end_max_followups: 2
      # Bound of each robot call of the runner's forced park (cancel_motions, release_control and, when refused for
      # carrying, the release_control keep_position=true fallback that frees the leases without moving the arm).
      job_end_park_timeout_s: 60
      # Event monitor of mcp_server: critical events interrupt the running model step (see nodes/claude_agent/README.md).
      # Warning events of these types interrupt the agent after the tool calls in flight finished (a bump never cancels a motion call).
      interrupt_warning_types: [bump]
      # A warning type interrupts at most once per this many seconds (mcp_server re-emits bump every 2 s on rough floor).
      warning_interrupt_debounce_s: 10
      robot_events_topic: /robot_events
      # Agent POIs persist across sessions: a new session clears only done/cancelled ones (clear_all clears every one).
      agent_poi_reset: keep_open
      # One extra "POI REVIEW" turn per instruction that used camera/motion tools and wrote no POI.
      poi_review_followup: true
      # complete_phase flags summary map coordinates with no POI within this radius (m).
      poi_hint_radius_m: 0.5
      http_host: "127.0.0.1"
      http_port: 18300
      mcp_url: http://127.0.0.1:18200/mcp
      mcp_token_file: /etc/ros2/mcp_server/token
      history_size: 500
      image_thumbnail_max_px: 480
      # Persistent volume of the agent (NOTES.md; created by claude_agent_setup.yml, never deleted by a deploy).
      workdir: /var/lib/claude_agent/workspace
      # Session log: <state_dir>/session/events.jsonl (paged history for the web UI; POST /api/reset deletes it).
      state_dir: /var/lib/claude_agent
      # Hardware facts stated in the system prompt (SO-101: reach from the shoulder_lift axis, base height above floor;
      # keep arm_base_height_m equal to mcp_server arm.arm_base_height_m, measured 2026-10-10).
      arm_reach_cm: 41
      arm_base_height_m: 0.100
      # Nav2 goal precision stated in the system prompt (same values as mcp_server nav and the Nav2 goal checker).
      nav_goal_xy_tolerance_cm: 1.0
      nav_goal_yaw_tolerance_deg: 2.0
      nav_intermediate_xy_tolerance_cm: 3.0
      nav_intermediate_yaw_tolerance_deg: 5.0
      # Pre-plan watchdog: until set_task_plan declares time_budget_min the instruction ends after this many seconds;
      # afterwards the declared budget (from the instruction start) applies, at most max_instruction_time_min.
      instruction_timeout_s: 900
      max_instruction_time_min: 120
      # Latency: the model gap (median 3.3 s) is mostly output tokens. Explicit medium effort, thinking text not streamed,
      # 1 h prompt cache TTL (idle gaps over 5 min), api_timing events in the session log, and context kept bounded by
      # auto-compaction at 60% of the window (fresh_with_digest starts a new session per instruction instead).
      effort: medium
      thinking_display: omitted
      prompt_cache_ttl: 1h
      log_api_timing: true
      context_policy: compact
      autocompact_pct: 60
      effector_tools:
        - navigate_to_pose
        - move_relative
        - drive
        - move_arm_joints
        - move_arm_cartesian
        - set_gripper
        - arm_home
        - look_around
        - grasp_object
        - release_object
        - enqueue_motions
        - resume_motions
        - go_to_frontier
        - look_toward_frontier
        - approach_for_grasp
      uncapped_tools:
        - stop
        - take_control
        - release_control
        - cancel_motions
      # Motion tools the permission gate always refuses (effector_tools + denied_tools == mcp_server MOTION_TOOLS):
      # the agent must not redefine home, the job-end check compares against the stored home.
      denied_tools:
        - arm_set_home
      sensor_tools:
        - suggest_approach_pose
        - plan_grasp
        - get_control_state
        - get_motion_status
        - wait_for_event
        - check_guard_rules
        - get_robot_state
        - get_camera_image
        - get_map_summary
        - get_arm_state
        - get_body_state
        - get_arm_reach
        - pixel_to_ground
        - get_annotated_camera_image
        - mark_candidate_points
        - resolve_candidate
        - capture_calibration_sample
        - solve_camera_calibration
        - clear_calibration_samples
        - get_topdown_view
        - remember_object
        - list_objects
        - forget_object
        - list_pois
        - add_poi
        - update_poi
        - delete_poi
        - list_lookups
        - get_lookup_image
        - annotate_lookup
        - delete_photos
        - list_frontiers
        - plan_frontier_visit
        - confirm_grasp

# ---- monitoring (roles/monitoring_agent + roles/web_proxy; ./scripts/deploy-nodes.sh client monitoring) ---------------
# `host` label of every series and log stream this host sends to the server's Mimir and Loki.
monitoring_host: client
# The robot ran Prometheus + Grafana until 2026-10-10: stop, disable and purge them (roles/monitoring_agent).
monitoring_agent_remove_local_stack: true
# Our ROS2 nodes' Prometheus endpoints (ros2_metrics helper or the node's own HTTP server), scraped by Alloy job
# ros2_nodes with a `node` label. Ports follow the ros2_nodes entries above (metrics_port, METRICS_PORT or the node's
# HTTP port); tests/test_node_metrics_wiring.py keeps both in sync.
monitoring_agent_node_targets:
  - {node: lerobot_follower, address: "127.0.0.1:19101", path: /metrics}
  - {node: filter_node, address: "127.0.0.1:19102", path: /metrics}
  - {node: bno055_imu, address: "127.0.0.1:19103", path: /metrics}
  - {node: gps_rtk_rover, address: "127.0.0.1:19104", path: /metrics}
  - {node: gripper_uvc_camera, address: "127.0.0.1:19105", path: /metrics}
  - {node: rplidar_a1, address: "127.0.0.1:19106", path: /metrics}
  - {node: swerve_controller, address: "127.0.0.1:19107", path: /metrics}
  - {node: rf2o_odom_relay, address: "127.0.0.1:19108", path: /metrics}
