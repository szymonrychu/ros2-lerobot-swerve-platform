---
# Client — Raspberry Pi 5: follower, swerve, sensors, master2master
# Network (netplan) and hostname — set for each host or here for the group:
network_address: "192.168.1.34/24"
rpi_i2c_baudrate: 10000
network_gateway: "192.168.1.1"
primary_dns_server: "192.168.1.1"
secondary_dns_server: "1.1.1.1"
network_nameservers:
  - "{{ primary_dns_server }}"
  - "{{ secondary_dns_server }}"
hostname: "client-rpi5"

# Server hostname for master2master, rtcm, and ROS2 DDS (resolved via /etc/hosts).
ros2_server_host: "{{ ros2_server_hostname }}"

# ROS2 node types. All nodes use localhost-only simple discovery; master2master adds the server as a static peer.
ros2_node_type_defaults:
  fastdds_discovery_server:
    # Uninstalled (see ros2_dds_env in all.yml); kept so deploys remove the old service.
    deploy_mode: native
    node_launch_command: "true"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
  ros2_master:
    deploy_mode: native
    node_launch_command: "ros2 daemon start && sleep infinity"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
    cpu_quota: "20%"
    memory_max: "128M"
  master2master:
    deploy_mode: native
    node_launch_command: "python3 -m master2master"
    node_src_dir: "nodes/master2master"
    cpu_quota: "25%"
    memory_max: "128M"
    config_path: /etc/ros2/master2master
    env:
      - "ROS_STATIC_PEERS={{ ros2_server_hostname }}"
      - MASTER2MASTER_CONFIG=/etc/ros2/master2master/config.yaml
      # ROS2_SERVER_HOST passed per-node below so master2master can connect to Server's ROS2 master
  feetech_servos:
    deploy_mode: native
    node_launch_command: "python3 -m feetech_servos"
    node_src_dir: "nodes/bridges/feetech_servos"
    pythonpath_parent: true
    cpu_quota: "50%"
    memory_max: "128M"
    config_path: /etc/ros2/feetech_servos
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/feetech_servos/config.yaml
  uvc_camera:
    deploy_mode: native
    node_launch_command: "python3 -m uvc_camera"
    node_src_dir: "nodes/bridges/uvc_camera"
    pythonpath_parent: true
    cpu_quota: "30%"
    memory_max: "256M"
  filter_node:
    deploy_mode: native
    node_launch_command: "python3 -m filter_node"
    node_src_dir: "nodes/filter_node"
    cpu_quota: "25%"
    memory_max: "128M"
    config_path: /etc/ros2/filter_node
    env:
      - FILTER_NODE_CONFIG=/etc/ros2/filter_node/config.yaml
  test_joint_api:
    deploy_mode: native
    node_launch_command: "python3 -m test_joint_api"
    node_src_dir: "nodes/test_joint_api"
    cpu_quota: "15%"
    memory_max: "64M"
    config_path: /etc/ros2/test_joint_api
    env:
      - TEST_JOINT_API_CONFIG=/etc/ros2/test_joint_api/config.yaml
  topic_scraper_api:
    deploy_mode: native
    node_launch_command: "python3 -m topic_scraper_api"
    node_src_dir: "nodes/topic_scraper_api"
    cpu_quota: "25%"
    memory_max: "128M"
    config_path: /etc/ros2/topic_scraper_api
    env:
      - TOPIC_SCRAPER_API_CONFIG=/etc/ros2/topic_scraper_api/config.yaml
  bno055_imu:
    deploy_mode: native
    node_launch_command: "python3 -m bno055_imu"
    node_src_dir: "nodes/bridges/bno055_imu"
    cpu_quota: "15%"
    memory_max: "64M"
    config_path: /etc/ros2/bno055_imu
    env:
      - BLINKA_FORCECHIP=BCM2XXX
      - BNO055_IMU_CONFIG=/etc/ros2/bno055_imu/config.yaml
  haptic_controller:
    deploy_mode: native
    node_launch_command: "python3 -m haptic_controller"
    node_src_dir: "nodes/haptic_controller"
    cpu_quota: "25%"
    memory_max: "64M"
    config_path: /etc/ros2/haptic_controller
    env:
      - HAPTIC_CONTROLLER_CONFIG=/etc/ros2/haptic_controller/config.yaml
  gps_rtk:
    deploy_mode: native
    node_launch_command: "python3 -m gps_rtk"
    node_src_dir: "nodes/bridges/gps_rtk"
    cpu_quota: "25%"
    memory_max: "64M"
    config_path: /etc/ros2/gps_rtk
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk/config.yaml
  rplidar_a1:
    deploy_mode: native
    # Supervisor runs the launch file and exits 1 (systemd restarts it) when /scan never starts or goes silent.
    node_launch_command: "python3 {{ ros2_repo_dest }}/nodes/bridges/rplidar_a1/scan_supervisor.py"
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/bridges/rplidar_a1]
    cpu_quota: "30%"
    memory_max: "128M"
    apt_packages:
      - ros-jazzy-rplidar-ros
  realsense_d435i:
    deploy_mode: native
    node_launch_command: >-
      ros2 launch realsense2_camera rs_launch.py enable_accel:=false enable_gyro:=false
      depth_module.depth_profile:=848x480x90 rgb_camera.color_profile:=1280x720x30 align_depth.enable:=true
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/bridges/realsense_d435i]
    cpu_quota: "200%"
    memory_max: "512M"
    apt_packages:
      - ros-jazzy-realsense2-camera
  # Raspberry Pi Camera Module 3 (IMX708) on CSI cam0, mounted overhead: Raspberry Pi libcamera fork + camera_ros built
  # from pinned sources into /opt/ros2-ws (libcamera first). The apt ros-jazzy-camera-ros / ros-jazzy-libcamera
  # packages must NOT be installed: they would shadow the fork. Boot overlay:
  # playbooks/tasks/overview_camera_boot_config.yml. See nodes/overview_camera/README.md.
  overview_camera:
    deploy_mode: native
    node_launch_command: "ros2 launch {{ ros2_repo_dest }}/nodes/overview_camera/launch/overview_camera.launch.py"
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/overview_camera]
    # One 640x480 camera at 15 fps with JPEG compression: one core is plenty.
    cpu_quota: "100%"
    memory_max: "256M"
    nice: 5
    config_path: /etc/ros2/overview_camera
    env:
      - OVERVIEW_CAMERA_CONFIG=/etc/ros2/overview_camera/config.yaml
    colcon_source:
      - repo: https://github.com/raspberrypi/libcamera.git
        commit: v0.7.2+rpt20260817
        package: libcamera
        workspace: /opt/ros2-ws
        # colcon-meson needs a package.xml (build_type meson); libpisp comes from its meson wrap (needs network).
        patches:
          - "{{ ros2_repo_dest }}/nodes/overview_camera/patches/libcamera-0001-add-package-xml.patch"
        meson_args:
          - -Dpipelines=rpi/pisp
          - -Dipas=rpi/pisp
          - -Dcam=enabled
          - -Dqcam=disabled
          - -Dgstreamer=disabled
          - -Dv4l2=false
          - -Dtest=false
          - -Ddocumentation=disabled
          - -Dpycamera=disabled
          # No -Dprefix/-Dlibdir/-Dbuildtype: colcon-meson passes --prefix, --libdir (install/lib) and --buildtype
          # itself, and meson fails on a duplicate ("Got argument buildtype as both -Dbuildtype and --buildtype").
      - repo: https://github.com/christianrauch/camera_ros.git
        commit: 8f792e27a6dbc81e4943a75765fc1b7b7d37b301
        package: camera_ros
        workspace: /opt/ros2-ws
    apt_packages:
      - git
      - build-essential
      - cmake
      - pkg-config
      - python3-colcon-common-extensions
      - python3-colcon-meson
      - meson
      - ninja-build
      - python3-ply
      - python3-jinja2
      - python3-yaml
      - libyaml-dev
      - libgnutls28-dev
      - ros-jazzy-ament-cmake
      - ros-jazzy-rclcpp
      - ros-jazzy-rclcpp-components
      - ros-jazzy-sensor-msgs
      - ros-jazzy-diagnostic-msgs
      - ros-jazzy-camera-info-manager
      - ros-jazzy-cv-bridge
      - ros-jazzy-image-transport
      - ros-jazzy-image-transport-plugins
      - ros-jazzy-compressed-image-transport
  swerve_controller:
    deploy_mode: native
    node_launch_command: "python3 -m swerve_drive_controller"
    node_src_dir: "nodes/swerve_drive_controller"
    cpu_quota: "30%"
    memory_max: "128M"
    config_path: /etc/ros2/swerve_drive_controller
    env:
      - SWERVE_DRIVE_CONTROLLER_CONFIG=/etc/ros2/swerve_drive_controller/config.yaml
  laser_filter:
    deploy_mode: native
    node_launch_command: >-
      ros2 run laser_filters scan_to_scan_filter_chain --ros-args
      --params-file {{ ros2_repo_dest }}/nodes/laser_filter/config/footprint_filter.yaml
      -r scan:=/scan -r scan_filtered:=/scan_filtered
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/laser_filter]
    cpu_quota: "20%"
    memory_max: "128M"
    apt_packages:
      - ros-jazzy-laser-filters
  static_tf_publisher:
    deploy_mode: native
    node_launch_command: "python3 -m static_tf_publisher"
    node_src_dir: "nodes/static_tf_publisher"
    cpu_quota: "10%"
    memory_max: "64M"
    config_path: /etc/ros2/static_tf_publisher
    env:
      - STATIC_TF_PUBLISHER_CONFIG=/etc/ros2/static_tf_publisher/config.yaml
  # rf2o_laser_odometry is not in the Jazzy apt distribution: built from the pinned upstream commit (ROS2 branch,
  # tip 2023-04-28) into /opt/ros2-ws by the ros2_node_deploy role (colcon_source_build.yml) at lowest priority.
  rf2o_laser_odometry:
    deploy_mode: native
    node_launch_command: >-
      ros2 run rf2o_laser_odometry rf2o_laser_odometry_node --ros-args
      --log-level rf2o_laser_odometry:=error
      --params-file {{ ros2_repo_dest }}/nodes/rf2o_laser_odometry/config/rf2o.yaml
      -r __node:=rf2o_laser_odometry
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/rf2o_laser_odometry]
    cpu_quota: "25%"
    memory_max: "128M"
    colcon_source:
      repo: https://github.com/MAPIRlab/rf2o_laser_odometry.git
      commit: b38c68e46387b98845ecbfeb6660292f967a00d3
      package: rf2o_laser_odometry
      workspace: /opt/ros2-ws
      # Repo patches applied after the checkout: retry the base_link -> laser TF lookup instead of keeping an identity
      # laser pose for the whole session (the 180 deg yawed lidar would invert vx/vy).
      patches:
        - "{{ ros2_repo_dest }}/nodes/rf2o_laser_odometry/patches/0001-retry-laser-tf.patch"
    apt_packages:
      - git
      - build-essential
      - cmake
      - python3-colcon-common-extensions
      - libboost-dev
      - libeigen3-dev
      - ros-jazzy-ament-cmake
      - ros-jazzy-eigen3-cmake-module
      - ros-jazzy-rclcpp
      - ros-jazzy-std-msgs
      - ros-jazzy-geometry-msgs
      - ros-jazzy-sensor-msgs
      - ros-jazzy-nav-msgs
      - ros-jazzy-tf2
      - ros-jazzy-tf2-ros
      - ros-jazzy-tf2-geometry-msgs
  # rf2o publishes zero covariance, a laser-frame x speed and vy = 0: this relay turns its pose into a body twist with a real covariance.
  rf2o_odom_relay:
    deploy_mode: native
    node_launch_command: "python3 -m rf2o_odom_relay"
    node_src_dir: "nodes/rf2o_odom_relay"
    cpu_quota: "10%"
    memory_max: "64M"
    config_path: /etc/ros2/rf2o_odom_relay
    env:
      - RF2O_ODOM_RELAY_CONFIG=/etc/ros2/rf2o_odom_relay/config.yaml
  robot_localization_ekf:
    deploy_mode: native
    node_launch_command: "ros2 launch {{ ros2_repo_dest }}/nodes/robot_localization_ekf/launch/ekf.launch.py"
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/robot_localization_ekf]
    cpu_quota: "25%"
    memory_max: "128M"
    apt_packages:
      - ros-jazzy-robot-localization
    config_path: /etc/ros2/robot_localization_ekf
    env:
      - ROBOT_LOCALIZATION_EKF_CONFIG=/etc/ros2/robot_localization_ekf/config.yaml
  nav2_bringup:
    deploy_mode: native
    # SLAM runs as its own node (slam_toolbox, online async), so Nav2 starts without localization/map_server.
    node_launch_command: >-
      ros2 launch nav2_bringup bringup_launch.py use_localization:=False
      params_file:={{ ros2_repo_dest }}/nodes/nav2_bringup/config/nav2_params.yaml
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/nav2_bringup]
    cpu_quota: "75%"
    memory_max: "512M"
    apt_packages:
      - ros-jazzy-nav2-bringup
      - ros-jazzy-nav2-core
      - ros-jazzy-nav2-costmap-2d
      - ros-jazzy-nav2-map-server
      - ros-jazzy-nav2-planner
      - ros-jazzy-nav2-controller
      - ros-jazzy-nav2-behaviors
      - ros-jazzy-nav2-bt-navigator
      - ros-jazzy-nav2-waypoint-follower
  slam_toolbox:
    deploy_mode: native
    # Online async mapping; repo nodes/slam_toolbox/config/slam_params.yaml are the defaults, the ros2_nodes
    # `config: |` block (written to /etc/ros2/slam_toolbox/config.yaml) overrides them; saved posegraph in
    # /var/lib/ros2/maps (see nodes/slam_toolbox/README.md).
    node_launch_command: "ros2 launch {{ ros2_repo_dest }}/nodes/slam_toolbox/launch/slam.launch.py"
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/slam_toolbox]
    cpu_quota: "75%"
    memory_max: "512M"
    apt_packages:
      - ros-jazzy-slam-toolbox
    config_path: /etc/ros2/slam_toolbox
    env:
      - SLAM_TOOLBOX_CONFIG=/etc/ros2/slam_toolbox/config.yaml
  web_ui:
    deploy_mode: native
    node_launch_command: "python3 -m web_ui"
    node_src_dir: "nodes/web_ui"
    # Depends on shared/ (editable path dependency in [tool.uv.sources]): its source and metadata matter.
    src_shared: true
    cpu_quota: "30%"
    memory_max: "256M"
    config_path: /etc/ros2/web_ui
    # web_ui imports slam_toolbox.srv (map save) at module top; install it here so web_ui deploys standalone.
    apt_packages:
      - ros-jazzy-slam-toolbox
    env:
      - WEB_UI_CONFIG=/etc/ros2/web_ui/config.yaml
  mcp_server:
    # Robot MCP server (Streamable HTTP, bearer token): see nodes/mcp_server/README.md.
    deploy_mode: native
    node_launch_command: "python3 -m mcp_server"
    node_src_dir: "nodes/mcp_server"
    # Depends on shared/ (editable path dependency in [tool.uv.sources]): its source and metadata matter.
    src_shared: true
    # mcp_server loads the arm URDF from the web_ui package directory.
    src_extra_paths: [nodes/web_ui/urdf]
    cpu_quota: "25%"
    memory_max: "256M"
    config_path: /etc/ros2/mcp_server
    env:
      - MCP_SERVER_CONFIG=/etc/ros2/mcp_server/config.yaml
    # MCP_SERVER_TOKEN=<48 random chars>, created once on the robot by playbooks/tasks/mcp_server_setup.yml (never in git).
    environment_file: /etc/ros2/mcp_server/token
  poi_store:
    # Points/areas of interest on the map (JSON file, /poi/* topics): see nodes/poi_store/README.md.
    deploy_mode: native
    node_launch_command: "python3 -m poi_store"
    node_src_dir: "nodes/poi_store"
    cpu_quota: "10%"
    memory_max: "128M"
    config_path: /etc/ros2/poi_store
    env:
      - POI_STORE_CONFIG=/etc/ros2/poi_store/config.yaml
  claude_agent:
    # Claude (Agent SDK, bundled pinned Claude Code CLI) chat agent that drives the robot through mcp_server:
    # see nodes/claude_agent/README.md. Runs as its own non-root user; resource-capped and niced.
    deploy_mode: native
    node_launch_command: "python3 -m claude_agent"
    node_src_dir: "nodes/claude_agent"
    cpu_quota: "50%"
    memory_max: "1G"
    nice: 10
    user: claude_agent
    # Hardening (claude_agent only): the MCP bearer token is in the CLI child's argv (--mcp-config), so hide other
    # processes' /proc entries from it. No ProtectSystem/ProtectHome: the CLI writes under its home and work_dir.
    protect_proc: invisible
    proc_subset: pid
    no_new_privileges: true
    private_tmp: true
    # Group that may read the mcp_server bearer token (created by playbooks/tasks/mcp_server_setup.yml).
    supplementary_groups:
      - mcp-token
    config_path: /etc/ros2/claude_agent
    env:
      - CLAUDE_AGENT_CONFIG=/etc/ros2/claude_agent/config.yaml
      - DISABLE_AUTOUPDATER=1
      - HOME=/var/lib/claude_agent
      # SDK initialize timeout in ms (default 60 s): the CLI starts slowly on the Pi under CPUQuota=50%.
      - CLAUDE_CODE_STREAM_CLOSE_TIMEOUT=180000
      # The agent needs no DDS data; UDP only avoids FastDDS shared-memory permission clashes between users.
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    # CLAUDE_CODE_OAUTH_TOKEN=<token>, written by playbooks/tasks/claude_agent_setup.yml from the deployer's env (never in git).
    environment_file: /etc/ros2/claude_agent/env

# Nodes to deploy: name (logical/service name), node_type (maps to image/config), present, enabled, config.
ros2_nodes:
  - name: fastdds_discovery_server
    node_type: fastdds_discovery_server
    present: false
    enabled: false
  - name: ros2-master
    node_type: ros2_master
    present: true
    enabled: true
  # Disabled 2026-10-08 to save CPU: its /controller/* relays (camera included) served the legacy Steam Deck UI.
  # Note: it also bridges leader arm teleop (/leader/joint_states) and /server/cmd_vel; re-enable for teleop.
  - name: master2master
    node_type: master2master
    present: true
    enabled: false
    config: |
      topics:
        - source: /server/cmd_vel
          dest: /client/cmd_vel
          direction: in
        - source: /client/odom
          dest: /server/odom
          direction: out
        - source: /leader/joint_states
          dest: /filter/input_joint_updates
          direction: in
          type: JointState
        - source: /client/haptic_leader_commands
          dest: /leader/joint_commands
          direction: out
          type: JointState
        - source: /client/haptic_leader_set_register
          dest: /leader/set_register
          direction: out
          type: String
        # Controller-bound: relay client topics to /controller/* namespace (SteamDeck UI)
        - source: /imu/data
          dest: /controller/imu/data
          direction: out
          type: Imu
        - source: /follower/joint_states
          dest: /controller/follower/joint_states
          direction: out
          type: JointState
        - source: /swerve_drive/joint_states
          dest: /controller/swerve_drive/joint_states
          direction: out
          type: JointState
        - source: /client/gps/fix
          dest: /controller/gps/fix
          direction: out
          type: NavSatFix
        - source: /odom
          dest: /controller/odom
          direction: out
          type: Odometry
        - source: /camera_0/image_raw/compressed
          dest: /controller/camera_0/image_compressed
          direction: out
          type: CompressedImage
        # Controller-originated: relay SteamDeck commands into client ROS2 graph
        - source: /controller/goal_pose
          dest: /goal_pose
          direction: in
          type: PoseStamped
  - name: filter_node
    node_type: filter_node
    present: true
    enabled: true
    config: |
      input_topic: /filter/input_joint_updates
      output_topic: /follower/joint_commands
      algorithm: kalman
      control_loop_hz: 100
      idle_timeout_s: 0.5
      web_ui_input_topic: /filter/web_ui_joint_commands
      web_ui_timeout_s: 0.5
      follower_feedback_topic: /follower/joint_states
      takeover_threshold_rad: 0.15
      # Autonomy lease (mcp_server): setpoints, release (std_msgs/Bool) and the published active source.
      autonomy_input_topic: /filter/autonomy_joint_commands
      autonomy_release_topic: /filter/autonomy_release
      active_source_topic: /filter/active_source
      joint_names:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
        - gripper
      algorithm_params:
        process_noise_pos: 0.000518
        process_noise_vel: 0.03294
        measurement_noise: 7.06e-5
        prediction_lead_s: 0.045
        velocity_decay_per_s: 4.5
        max_prediction_time_s: 0.14
  - name: test_joint_api
    node_type: test_joint_api
    present: true
    enabled: true
    config: |
      host: "0.0.0.0"
      port: 18080
      topic: /filter/input_joint_updates
  - name: topic_scraper_api
    node_type: topic_scraper_api
    present: true
    enabled: true
    config: |
      host: "0.0.0.0"
      port: 18100
      topic_refresh_interval_s: 0.25
      allowed_types:
        - sensor_msgs/msg/JointState
        - sensor_msgs/msg/NavSatFix
        - sensor_msgs/msg/Image
        - sensor_msgs/msg/CompressedImage
        - sensor_msgs/msg/LaserScan
        - sensor_msgs/msg/PointCloud2
        - sensor_msgs/msg/Imu
        - std_msgs/msg/String
      observation_rules:
        - name: leader_vs_follower
          topics:
            - /filter/input_joint_updates
            - /follower/joint_states
          type: compare
          joint_names:
            - wrist_roll
            - gripper
        - name: leader_follower_oscillation
          topics:
            - /filter/input_joint_updates
            - /follower/joint_states
          type: oscillation
          joint_names:
            - wrist_roll
            - gripper
          window_s: 1.0
          variance_threshold: 1e-5
          sign_change_min_hz: 2.0
  - name: bno055_imu
    node_type: bno055_imu
    # 50 Hz reduces I2C load; BNO055 can return None on transient read failures
    present: true
    enabled: true
    config: |
      topic: /imu/data
      frame_id: imu_link
      publish_hz: 50
      i2c_bus: 1
      i2c_address: 0x28
      orientation_covariance: 0.01
      # Fixed small gyro covariance: the rolling-variance estimate inflated the yaw rate exactly while turning, so the
      # EKF preferred the slip-prone wheel yaw rate over the gyro.
      angular_velocity_covariance: 0.0004
      linear_acceleration_covariance: 0.04
      compute_covariance: false
      covariance_window: 100      # rolling window size (samples, ~2 s at 50 Hz)
      covariance_min_samples: 20  # samples before estimated covariance replaces config values
  # RPi 5: GPIO UART0 (pins 14/15) needs dtoverlay=uart0-pi5; creates /dev/ttyAMA0
  - name: gps_rtk_rover
    node_type: gps_rtk
    present: true
    enabled: true
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk_rover/config.yaml
    config: |
      mode: rover
      serial_port: /dev/ttyAMA0
      baud_rate: 115200
      topic: /client/gps/fix
      status_topic: /client/gps/status
      frame_id: gps_link
      rtcm_server_host: {{ ros2_server_hostname }}
      rtcm_server_port: 5016
      ntrip_mountpoint: /rtk
      ntrip_user: ""
      ntrip_password: ""
      ntrip_gga_interval_s: 10.0
  - name: haptic_controller
    node_type: haptic_controller
    present: true
    enabled: false
    config: |
      mode: off
      gripper_joint_names:
        - joint_5
        - joint_6
      leader_state_topic: /filter/input_joint_updates
      follower_state_topic: /follower/joint_states
      leader_cmd_topic: /client/haptic_leader_commands
      leader_set_register_topic: /client/haptic_leader_set_register
      control_loop_hz: 100
      resistance_gains:
        max_stiffness: 0.0008
        load_deadband: 60.0
        max_step_per_cycle: 0.02
        activation_velocity_threshold: 0.01
        release_delay_s: 0.15
        load_release_ratio: 0.6
        activation_debounce_cycles: 2
      delay_safety_max_skew_s: 0.4
      watchdog_timeout_s: 0.5
  # Gripper USB camera (reconnected): /camera_0/image_raw and /camera_0/image_raw/compressed (web_ui camera tab, mcp_server).
  - name: gripper_uvc_camera
    node_type: uvc_camera
    present: true
    enabled: true
    env:
      # By id: the overview CSI camera (rp1-cfe) takes /dev/video0..9, so numbered devices are not stable.
      - UVC_DEVICE=/dev/v4l/by-id/usb-Arducam_Arducam_5MP_USB_Camera_YL20240927V0-video-index0
      - UVC_TOPIC=/camera_0/image_raw
      # Image is upside down at wrist roll 0 (confirmed by the agent): rotate every published frame 180 deg at source.
      - UVC_ROTATE_DEG=180
      # About 18 fps uncapped; 10 fps is enough for the agent and the web UI and saves CPU on the loaded client.
      - UVC_MAX_FPS=10
  - name: rplidar_a1
    node_type: rplidar_a1
    present: true
    enabled: true
  # Replaced by the overview_camera: present false uninstalls the unit on the next deploy.
  - name: realsense_d435i
    node_type: realsense_d435i
    present: false
    enabled: false
  # Overhead Camera Module 3 (IMX708): no TF yet (mount pose not measured). Camera ID: `cam -l` on the client, see the README.
  - name: overview_camera
    node_type: overview_camera
    present: true
    enabled: true
    config: |
      # libcamera ID of the camera (`cam -l`); empty selects camera index 0 and logs a warning.
      camera_id: ""
  - name: lerobot_follower
    node_type: feetech_servos
    present: true
    enabled: true
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/lerobot_follower/config.yaml
    config: |
      device: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A059004-if00
      namespace: follower
      log_joint_updates: true
      enable_torque_on_start: true
      register_publish_interval_s: 10
      # Pack voltage (3-cell) read from the servos, one servo per second, published as sensor_msgs/BatteryState.
      battery_topic: /battery_state
      battery_interval_s: 1.0
      battery_cells: 3
      publish_effort_joints:
        - wrist_roll
        - gripper
      # filter_node tags /follower/joint_commands with its source in header.frame_id. web_ui and autonomy
      # (mcp_server) positions are follower joint radians (as in /follower/joint_states): the gripper's
      # leader -> follower source range mapping below applies only to leader (and untagged) commands.
      direct_command_sources:
        - web_ui
        - autonomy
      joint_names:
        - name: shoulder_pan
          id: 1
        - name: shoulder_lift
          id: 2
        - name: elbow_flex
          id: 3
        - name: wrist_flex
          id: 4
        - name: wrist_roll
          id: 5
        - name: gripper
          id: 6
          source_min_steps: 2045
          source_max_steps: 3289
          command_min_steps: 1900
      # Swerve platform servos share this bus (IDs 32-39), served as /swerve_drive/* from the same process.
      # Steering servos (33, 34, 37, 38): centred with `calibrate_servos.py center` (2048 = straight ahead,
      # limits 1024..3072 = +-90 deg); position commands in rad, positive = CCW seen from above.
      # In-wheel servos (32, 35, 39, 36): wheel mode, velocity commands in rad/s, positive = forward
      # (left side 32/39 mounted mirrored -> inverted, verified on the bench 2026-10-03).
      velocity_command_timeout_s: 0.3
      extra_groups:
        - namespace: swerve_drive
          joint_names:
            - name: fl_drive
              id: 32
              mode: velocity
              inverted: true  # left wheels are mounted mirrored
            - name: fl_steer
              id: 33
            - name: fr_drive
              id: 35
              mode: velocity
            - name: fr_steer
              id: 34
            - name: rl_drive
              id: 39
              mode: velocity
              inverted: true  # left wheels are mounted mirrored
            - name: rl_steer
              id: 38
            - name: rr_drive
              id: 36
              mode: velocity
            - name: rr_steer
              id: 37
  # Swerve servos moved onto the lerobot_follower bus (single serial port); this service is uninstalled.
  - name: swerve_drive_servos
    node_type: feetech_servos
    present: false
    enabled: false
  - name: swerve_controller
    node_type: swerve_controller
    present: true
    enabled: true
    env:
      - SWERVE_DRIVE_CONTROLLER_CONFIG=/etc/ros2/swerve_controller/config.yaml
    config: |
      # Platform dimensions.md: steering yaw axes 305 x 266.6 mm, wheel radius 60 mm, steer +-90 deg.
      half_length_m: 0.1525
      half_width_m: 0.1333
      wheel_radius_m: 0.06
      max_steer_angle_rad: 1.5708
      max_wheel_angular_velocity_rad_s: 4.71
      cmd_vel_timeout_s: 0.5
      joint_states_timeout_s: 0.5
      idle_recenter_s: 3.0
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /swerve_drive/joint_states
      joint_commands_topic: /swerve_drive/joint_commands
      odom_topic: /odom
      odom_frame_id: odom
      base_frame_id: base_link
      # robot_localization_ekf is the only odom -> base_link TF publisher.
      publish_tf: false
      control_loop_hz: 50
      steer_error_threshold_rad: 0.35
      # Forward-kinematics residual (m/s) above which one slipping wheel is dropped from the odometry twist.
      slip_residual_threshold_mps: 0.05
      joint_names:
        - fl_drive
        - fl_steer
        - fr_drive
        - fr_steer
        - rl_drive
        - rl_steer
        - rr_drive
        - rr_steer
  - name: static_tf_publisher
    node_type: static_tf_publisher
    present: true
    enabled: true
    config: |
      # NOTE: These are estimates - update with actual measured offsets
      parent_frame: base_link
      frames:
        - child: imu_link
          x: 0.0
          y: 0.0
          z: 0.05
          roll: 0.0
          pitch: 0.0
          yaw: 0.0
        # RPLidar A1: measured from the ground-projected centre between the wheels (Platform dimensions.md: 0.15, 0.04),
        # corrected by the in-place turn test 2026-10-05: 90 deg turns showed 3.1-3.6 cm of map translation with none in
        # the EKF odometry; both turns fit one lidar offset error of (+0.8, +2.0) cm.
        - child: laser_frame
          x: 0.158
          y: 0.06
          z: 0.20
          roll: 0.0
          pitch: 0.0
          # Lidar is mounted rotated 180 deg (bench test 2026-10-03: forward motion shortened the 180 deg range).
          yaw: 3.14159265
        # No overview camera frame here on purpose: its mount pose is not measured yet, so no guessed
        # base_link -> overview_camera_optical_frame transform is published (see nodes/overview_camera/README.md).
  # Lidar odometry for the EKF (see nodes/rf2o_laser_odometry/README.md); must start before the EKF fuses /odom_rf2o_twist.
  - name: rf2o_laser_odometry
    node_type: rf2o_laser_odometry
    present: true
    enabled: true
  - name: rf2o_odom_relay
    node_type: rf2o_odom_relay
    present: true
    enabled: true
    config: |
      input_topic: /odom_rf2o
      output_topic: /odom_rf2o_twist
      # No quality figure from rf2o: conservative fixed variances (wheel odometry floor is 0.002 (m/s)^2).
      var_vx_vy: 0.02
      var_vyaw: 0.05
      max_dt_s: 1.0
  - name: robot_localization_ekf
    node_type: robot_localization_ekf
    present: true
    enabled: true
    # Keep identical in content to nodes/robot_localization_ekf/config/ekf.yaml (tests/test_nav_stack_config.py).
    config: |
      ekf_filter_node:
        ros__parameters:
          frequency: 30.0
          sensor_timeout: 0.1
          two_d_mode: true
          publish_tf: true
          map_frame: map
          odom_frame: odom
          base_link_frame: base_link
          world_frame: odom
          odom0: /odom
          odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
          odom0_queue_size: 10
          odom0_differential: false
          odom0_relative: false
          # Mahalanobis gate on the wheel twist only; rationale in nodes/robot_localization_ekf/config/ekf.yaml.
          odom0_twist_rejection_threshold: 3.0
          odom1: /odom_rf2o_twist
          odom1_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
          odom1_queue_size: 5
          odom1_differential: false
          odom1_relative: false
          imu0: /imu/data
          imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
          imu0_queue_size: 10
          imu0_differential: false
          imu0_relative: false
          use_control: false
          print_diagnostics: false
  # Removes lidar returns on the robot body: /scan -> /scan_filtered (consumed by SLAM, costmaps, collision monitor).
  - name: laser_filter
    node_type: laser_filter
    present: true
    enabled: true
  - name: slam_toolbox
    node_type: slam_toolbox
    present: true
    enabled: true
    # ROS params overrides loaded after the repo slam_params.yaml (later wins). map_file_name is the posegraph base:
    # the launch file resumes <base>.posegraph if it exists (keep it equal to the web_ui map tab map_save_path).
    config: |
      slam_toolbox:
        ros__parameters:
          map_file_name: /var/lib/ros2/maps/slam_map
          min_laser_range: 0.15
          max_laser_range: 12.0
  - name: nav2_bringup
    node_type: nav2_bringup
    present: true
    enabled: true
  - name: web_ui
    node_type: web_ui
    present: true
    enabled: true
    config: |
      http_port: 8080
      ws_broadcast_hz: 20
      bridge:
        host: localhost
        port: 9090
      # Pack voltage chip; below cells x cutoff_cell_v (3 x 2.8 = 8.4 V) web UI commands are rejected.
      battery:
        topic: /battery_state
        cells: 3
        cutoff_cell_v: 2.8
        resume_cell_v: 2.9
        stale_s: 5.0
      # Robot and base GPS chips: rover status over DDS, base status polled from the server topic scraper.
      gps_status:
        rover_topic: /client/gps/status
        base_url: http://{{ ros2_server_hostname }}:18100/topics/server/gps/status
        base_poll_hz: 1.0
        stale_after_s: 5.0
        base_timeout_s: 2.0
      tabs:
        - id: map
          type: map_nav
          label: "Map"
          map_topic: /map
          global_plan_topic: /plan
          # MPPI optimal trajectory (nav_msgs/Path in the odom frame), see nodes/nav2_bringup/README.md.
          local_plan_topic: /optimal_trajectory
          goal_topic: /goal_pose
          map_frame: map
          base_frame: base_link
          map_save_path: /var/lib/ros2/maps/slam_map
          # Merged 3D view: local costmap, swerve base and the interactive arm (client-local topics).
          local_costmap_topic: /local_costmap/costmap
          base_urdf: robot.urdf
          base_joint_states_topic: /swerve_drive/joint_states
          arm_urdf: so101_arm.urdf
          arm_joint_states_topic: /follower/joint_states
          arm_command_topic: /filter/web_ui_joint_commands
          # Home / Set home buttons: std_srvs/Trigger services served by mcp_server.
          arm_home_service: /arm/home
          arm_set_home_service: /arm/set_home
          # Points of interest from poi_store (list is latched; edits go through POST /api/poi).
          poi_list_topic: /poi/list
          poi_command_topic: /poi/command
          poi_result_topic: /poi/result
          # Proxied map tiles are cached in /var/cache/web_ui/tiles (default tile_cache_dir, created by
          # playbooks/tasks/web_ui_tile_cache_dir.yml).
        # Chat with the claude_agent node (127.0.0.1:18300, its http_port); the backend proxies /api/agent and /ws/agent.
        - id: agent
          type: agent_chat
          label: "Agent"
          agent_url: http://127.0.0.1:18300
        - id: camera
          type: camera
          label: "Gripper Cam"
          topic: /camera_0/image_raw/compressed
        - id: overview_camera
          type: camera
          label: "Overview"
          topic: /overview_camera/image_raw/compressed
        - id: imu_graphs
          type: imu_orientation
          label: "IMU"
          topics:
            - topic: /controller/imu/data
              fields: []
      overlays:
        - topic: /controller/gps/fix
          field: "latitude"
          label: "Lat"
          format: ".6f"
        - topic: /controller/gps/fix
          field: "longitude"
          label: "Lon"
          format: ".6f"
        - topic: /controller/odom
          field: "twist.twist.linear.x"
          label: "Vel"
          format: ".2f"
          unit: "m/s"
        - topic: /controller/swerve_drive/joint_states
          field: "position[1]"
          label: "FL Steer"
          format: ".2f"
          unit: "rad"
  - name: mcp_server
    node_type: mcp_server
    present: true
    enabled: true
    config: |
      server:
        host: "0.0.0.0"
        port: 18200
        path: /mcp
      topics:
        # Front camera: overhead Camera Module 3 looking down at the front of the robot (CompressedImage, 640x480).
        front_camera: /overview_camera/image_raw/compressed
        # Body monitor feeds (get_body_state, /robot_events): servo register dump, swerve odom (twist covariance = slip
        # residual), rf2o twist, BNO055 IMU.
        servo_registers: /follower/servo_registers
        swerve_odom: /odom
        rf2o_twist: /odom_rf2o_twist
        imu: /imu/data
        robot_events: /robot_events
        # get_topdown_view: local costmap (subscribed lazily, latest message only) and the current Nav2 plan.
        local_costmap: /local_costmap/costmap
        plan: /plan
        # POI tools talk to poi_store (same topics as its entry below).
        poi_list: /poi/list
        poi_command: /poi/command
        poi_result: /poi/result
      arm:
        urdf_path: nodes/web_ui/urdf/so101_arm.urdf
        home_file: /var/lib/ros2/arm/home.yaml
        # Arm mount plane (URDF base_link origin) height above the floor, measured: 16.5 cm.
        arm_base_height_m: 0.165
        # Arm reach on the floor around the shoulder pan axis, drawn as the reach annulus on annotated camera images
        # (approximate: measure it and adjust).
        reach_outer_m: 0.25
        reach_inner_m: 0.05
        # Follower-vs-URDF joint zero offsets (rad): urdf_angle = measured_angle + offset (nodes/mcp_server/README.md).
        # Solved 2026-10-08 with the gripper camera calibration (ruler + Lego, 45 points, 10 poses, floor RMS 6.1 mm).
        joint_offsets_rad:
          shoulder_pan: -0.0619
          shoulder_lift: -0.0103
          elbow_flex: -0.1381
          wrist_flex: 0.2477
          # wrist_roll re-solved 2026-10-08 (afternoon) with views at wrist_roll 0 .. -154 deg.
          wrist_roll: -0.0710
        # Tool centre point (m) in the gripper_frame_link frame: jaw closing point vs gripper_frame_link, measured
        # 2026-10-08 by closing on ruler marks.
        tool_offset_m: {x: 0.0104, y: -0.0282, z: -0.0017}
        # URDF shoulder_lift upper limit 1.745 rad widened (tested 2026-10-08: reached 1.87 rad without collision; the
        # servo cannot lift the stretched-out arm beyond about 1.85 rad): a folded arm reaches about 5 cm below the floor.
        joint_limit_overrides_rad:
          shoulder_lift: [-1.745, 1.9]
        # Optional once measured: arm base frame pose in base_link (x/y/z in m, yaw in rad; z = arm_base_height_m). Without it
        # gripper-camera results have no base_link/map coordinates and the reach/gripper overlays are skipped on the front camera.
        # base_in_base_link: {x: 0.0, y: 0.0, z: 0.165, yaw: 0.0}
      # Camera geometry for pixel_to_ground, annotated images and candidate points (nodes/mcp_server/README.md, "Camera
      # tools and calibration"). Both cameras are NOT calibrated until intrinsics and mount are set. intrinsics is
      # {calibration_file: <camera_calibration yaml>} or an approximation {hfov_deg: 66.0, width: 640, height: 480};
      # Camera calls subscribe per call: on the loaded Pi, DDS discovery can exceed the 2 s default.
      timeouts:
        image_timeout_s: 5.0
      # mount is the solve_camera_calibration output (parent_frame x y z roll pitch yaw, body frame x fwd / y left / z up).
      # The gripper mount is relative to the URDF link gripper_link of so101_arm.urdf, the front mount to base_link.
      cameras:
        calibration_dir: /var/lib/ros2/camera_calibration
        # Mount re-solved 2026-10-08 (afternoon) from 15 views at wrist_roll 0, -0.8, -1.57, -2.3, -2.69 over a steel
        # ruler (3 arm poses, 115 points; intrinsics and the pan/lift/elbow/wrist_flex offsets kept): floor RMS 6.6 mm,
        # held-out views 4-14 mm. The previous mount fitted only low oblique views at roll 0 (35 mm on these views).
        gripper:
          parent_frame: gripper_link
          intrinsics:
            calibration_file: "{{ ros2_repo_dest }}/nodes/mcp_server/calibration/gripper_camera.yaml"
          mount:
            parent_frame: gripper_link
            x: 0.0002
            y: 0.0305
            z: -0.1073
            roll: -1.6171
            pitch: 1.1845
            yaw: -1.4629
        front:
          parent_frame: base_link
          intrinsics: null
          mount: null
      # Nav2 goal precision stated in the navigation tool descriptions (nav2_params.yaml goal checker: 0.01 m, 0.035 rad).
      nav:
        goal_xy_tolerance_m: 0.01
        goal_yaw_tolerance_deg: 2.0
      # Below cells x cutoff_cell_v (3 x 2.8 = 8.4 V) motion/effector tools are refused; stop and sensors keep working.
      battery:
        topic: /battery_state
        cells: 3
        cutoff_cell_v: 2.8
        resume_cell_v: 2.9
        stale_s: 5.0
      # Body monitor thresholds: events on /robot_events, get_body_state, digest on every tool result, early-return motion.
      monitor:
        servo_temp_warn_c: 60
        servo_temp_critical_c: 70
        cpu_temp_warn_c: 75
        cpu_temp_critical_c: 82
        battery_warn_margin_cell_v: 0.2
        stall_s: 1.0
        slip_residual_warn_mps: 0.1
        bump_warn_mps2: 4.0
        bump_critical_mps2: 9.0
        tilt_warn_deg: 10
        debounce_default_s: 30
      # Robot outer frame (m, centred on base_link): drawn by get_topdown_view, sets look_around's rotation clearance.
      footprint:
        length_m: 0.47
        width_m: 0.386
      topdown:
        default_radius_m: 2.5
        default_px: 480
        arm_reach_m: 0.41
      # Object memory (remember_object / list_objects / forget_object): objects are object POIs in poi_store; store_path is
      # only the legacy objects.json, imported once into poi_store and renamed *.migrated (directory made by mcp_server_setup.yml).
      objects:
        store_path: /var/lib/ros2/objects/objects.json
        merge_radius_m: 0.25
      # look_around: equal in-place rotation steps; refused when an obstacle is inside footprint radius + margin.
      look_around:
        default_captures: 4
        clearance_margin_m: 0.10
        step_timeout_s: 30
      poi:
        request_timeout_s: 3.0
        near_radius_m: 5.0
  - name: poi_store
    node_type: poi_store
    present: true
    enabled: true
    config: |
      store_path: /var/lib/ros2/poi/poi.json
      list_topic: /poi/list
      command_topic: /poi/command
      result_topic: /poi/result
  - name: claude_agent
    node_type: claude_agent
    present: true
    enabled: true
    config: |
      model: opus
      # The agent splits each task into phases and sets rw (effector calls) / turn caps per phase via
      # agent.set_task_plan. Sensor calls are never capped. The caps of all phases together stay within the
      # instruction maxima, one phase within the per-phase maxima.
      max_rw_cap: 150
      max_turn_cap: 200
      max_phase_rw_cap: 40
      max_phase_turn_cap: 40
      # Event monitor of mcp_server: critical events interrupt the running model step (see nodes/claude_agent/README.md).
      robot_events_topic: /robot_events
      http_host: "127.0.0.1"
      http_port: 18300
      mcp_url: http://127.0.0.1:18200/mcp
      mcp_token_file: /etc/ros2/mcp_server/token
      history_size: 500
      image_thumbnail_max_px: 480
      # Persistent volume of the agent (NOTES.md; created by claude_agent_setup.yml, never deleted by a deploy).
      workdir: /var/lib/claude_agent/workspace
      # Session log: <state_dir>/session/events.jsonl (paged history for the web UI; POST /api/reset deletes it).
      state_dir: /var/lib/claude_agent
      # Hardware facts stated in the system prompt (SO-101: reach from the shoulder_lift axis, base height above floor).
      arm_reach_cm: 41
      arm_base_height_m: 0.165
      # Nav2 goal precision stated in the system prompt (same values as mcp_server nav and the Nav2 goal checker).
      nav_goal_xy_tolerance_cm: 1.0
      nav_goal_yaw_tolerance_deg: 2.0
      instruction_timeout_s: 900
      effector_tools:
        - navigate_to_pose
        - move_relative
        - drive
        - move_arm_joints
        - move_arm_cartesian
        - set_gripper
        - arm_home
        - arm_set_home
        - look_around
      uncapped_tools:
        - stop
        - acquire_control
        - release_control
      sensor_tools:
        - get_robot_state
        - get_camera_image
        - get_map_summary
        - get_arm_state
        - get_body_state
        - pixel_to_ground
        - get_annotated_camera_image
        - mark_candidate_points
        - resolve_candidate
        - capture_calibration_sample
        - solve_camera_calibration
        - clear_calibration_samples
        - get_topdown_view
        - remember_object
        - list_objects
        - forget_object
        - list_pois
        - add_poi
        - update_poi
        - delete_poi
