---
# Client — Raspberry Pi 5: follower, swerve, sensors, master2master
# Network (netplan) and hostname — set for each host or here for the group:
network_address: "192.168.1.34/24"
# BNO055 runs on a software i2c-gpio bus (GPIO2/3) pinned to this number, see tasks/bno055_i2c_boot_config.yml.
rpi_bno055_i2c_gpio_bus: 8
network_gateway: "192.168.1.1"
primary_dns_server: "192.168.1.1"
secondary_dns_server: "1.1.1.1"
network_nameservers:
  - "{{ primary_dns_server }}"
  - "{{ secondary_dns_server }}"
hostname: "client-rpi5"

# Server hostname for master2master, rtcm, and ROS2 DDS (resolved via /etc/hosts).
ros2_server_host: "{{ ros2_server_hostname }}"

# Host-level cgroup drop-ins (playbooks/tasks/cgroup_headroom.yml, every client deploy): system.slice allocates the sum
# of the enabled nodes' memory_low (a unit's MemoryLow protects only as far as its ancestors allocate), and user.slice
# (ssh sessions and the deploy's become steps such as uv sync) loses every CPU/IO contention to system.slice (default
# 100). false removes both drop-ins again.
ros2_cgroup_headroom_enabled: true
ros2_user_slice_cpu_weight: 50
ros2_user_slice_io_weight: 50

# ROS2 node types. All nodes use localhost-only simple discovery; master2master adds the server as a static peer.
# Cgroup model (ansible/README.md, "Node resource model"): robot headroom guaranteed, background constrained. Robot node
# types set no cpu_quota and no memory_high; priority comes from the weight tiers (systemd default weight is 100):
#   critical (servos, swerve, ros2_master, filter_node, static_tf, bno055_imu)  cpu/io_weight 1000, oom_score_adjust -900
#   normal   (lidar, odometry, EKF, Nav2, SLAM, cameras incl. ToF, GPS, POI, map_guard)    cpu/io_weight  500, oom_score_adjust -500
#   agent    (mcp_server, claude_agent, web_ui, scraper, master2master, leader_bridge, haptic)  cpu/io_weight  300, oom_score_adjust -200
#   background (joint-state throttles: work the robot can lose)                               cpu/io_weight  100, oom_score_adjust    0
# memory_low protects about the measured typical working set, memory_max is a safety net at >= 2x the 24 h peak.
# Nav2 MPPI overlay: nav2_mppi_controller 1.3.13 + the model_delay patch (PR #6154 ported to xtensor), built into
# /opt/ros2-ws by the colcon_source machinery and picked up because the launcher sources that workspace after
# /opt/ros/jazzy. Rollback: set nav2_mppi_overlay to false and deploy nav2_bringup (apt MPPI again, no rebuild).
nav2_mppi_overlay: true
nav2_mppi_overlay_source:
  repo: https://github.com/ros-navigation/navigation2.git
  commit: f4108e5b1c2bce804a1aa0c7be6673a8eb4a1501 # tag 1.3.13 = apt version
  package: nav2_mppi_controller
  workspace: /opt/ros2-ws
  # navigation2 is a multi-package repo: only discover the patched package, its nav2_* deps stay the apt ones.
  base_paths: [nav2_mppi_controller]
  patches:
    - "{{ ros2_repo_dest }}/nodes/nav2_bringup/patches/nav2_mppi_controller-0001-model-delay-pr6154.patch"
  cmake_args: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_TESTING=OFF]
  # A ros-jazzy sync that moves the apt MPPI rebuilds the overlay against the new headers.
  stamp_apt_packages: [ros-jazzy-nav2-mppi-controller]
  # xtensor at -O3 is RAM-heavy; the client has frozen during builds before.
  jobs: 2

ros2_node_type_defaults:
  fastdds_discovery_server:
    # Uninstalled (see ros2_dds_env in all.yml); kept so deploys remove the old service.
    deploy_mode: native
    node_launch_command: "true"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
  ros2_master:
    deploy_mode: native
    node_launch_command: "ros2 daemon start && sleep infinity"
    node_src_dir: ""
    # No repo path to watch (runs no repo code): constant source key, restarts only for config/unit changes.
    src_paths: []
    # Working set MiB p50/24 h peak 42.6/46.9 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "48M"
    memory_max: "128M"
    cpu_weight: 1000
    io_weight: 1000
    oom_score_adjust: -900
  master2master:
    deploy_mode: native
    node_launch_command: "python3 -m master2master"
    node_src_dir: "nodes/master2master"
    # Not running on 2026-10-11 (no series): MemoryLow estimated from comparable nodes, MemoryMax 2x it or more.
    memory_low: "64M"
    memory_max: "128M"
    cpu_weight: 300
    io_weight: 300
    oom_score_adjust: -200
    config_path: /etc/ros2/master2master
    env:
      - "ROS_STATIC_PEERS={{ ros2_server_hostname }}"
      - MASTER2MASTER_CONFIG=/etc/ros2/master2master/config.yaml
      # ROS2_SERVER_HOST passed per-node below so master2master can connect to Server's ROS2 master
  leader_bridge:
    deploy_mode: native
    node_launch_command: "python3 -m leader_bridge"
    node_src_dir: "nodes/leader_bridge"
    # Relays only /leader/joint_states (one subscription, one publisher), so no measured series yet: MemoryLow
    # estimated from master2master, MemoryMax 2x it or more. Replaces master2master's leader rule.
    memory_low: "48M"
    memory_max: "128M"
    cpu_weight: 300
    io_weight: 300
    oom_score_adjust: -200
    config_path: /etc/ros2/leader_bridge
    env:
      - "ROS_STATIC_PEERS={{ ros2_server_hostname }}"
      - LEADER_BRIDGE_CONFIG=/etc/ros2/leader_bridge/config.yaml
  feetech_servos:
    deploy_mode: native
    node_launch_command: "python3 -m feetech_servos"
    node_src_dir: "nodes/bridges/feetech_servos"
    pythonpath_parent: true
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 49.7/50.4 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "56M"
    memory_max: "128M"
    cpu_weight: 1000
    io_weight: 1000
    oom_score_adjust: -900
    config_path: /etc/ros2/feetech_servos
    env:
      - FEETECH_SERVOS_CONFIG=/etc/ros2/feetech_servos/config.yaml
  uvc_camera:
    deploy_mode: native
    node_launch_command: "python3 -m uvc_camera"
    node_src_dir: "nodes/bridges/uvc_camera"
    pythonpath_parent: true
    # libjpeg-turbo for PyTurboJPEG: lossless JPEG rotation of the camera's MJPEG frames.
    apt_packages:
      - libturbojpeg
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 66.7/68.2 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "72M"
    memory_max: "256M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
  arducam_tof:
    deploy_mode: native
    node_launch_command: "python3 -m arducam_tof"
    node_src_dir: "nodes/bridges/arducam_tof"
    # No pythonpath_parent: the package sits one level down (nodes/bridges/arducam_tof/arducam_tof), so PYTHONPATH is
    # the node dir itself.
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Estimate, no series yet (deployed disabled): a 240x180 ToF frame pair at publish_rate_hz is small, so MemoryLow
    # follows uvc_camera (p50 66.7 MiB) with the SDK and numpy, MemoryMax 2x or more. Re-measure once enabled.
    memory_low: "64M"
    memory_max: "192M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    config_path: /etc/ros2/arducam_tof
    env:
      - ARDUCAM_TOF_CONFIG=/etc/ros2/arducam_tof/config.yaml
  # Config-only node: rtabmap_util point_cloud_xyz turns the ToF depth image into /tof/points (see
  # nodes/tof_obstacle_cloud/README.md). It publishes no TF; slam_toolbox keeps map -> odom.
  tof_obstacle_cloud:
    deploy_mode: native
    node_launch_command: >-
      ros2 run rtabmap_util point_cloud_xyz --ros-args
      --params-file {{ ros2_repo_dest }}/nodes/tof_obstacle_cloud/config/point_cloud_xyz.yaml
      -r depth/image:=/tof/depth/image_raw
      -r depth/camera_info:=/tof/camera_info
      -r cloud:=/tof/points
      -r __node:=tof_obstacle_cloud
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its params file.
    src_paths: [nodes/tof_obstacle_cloud]
    # Sized by analogy: one decimated 60x45 depth frame per cycle is small, MemoryLow follows arducam_tof
    # (p50 ~64 MiB incl. the rtabmap shared libraries), MemoryMax 3x. Same basis as the other unmeasured types.
    memory_low: "64M"
    memory_max: "192M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    apt_packages:
      - ros-jazzy-rtabmap-util
  filter_node:
    deploy_mode: native
    node_launch_command: "python3 -m filter_node"
    node_src_dir: "nodes/filter_node"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 47.6/48.2 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "48M"
    memory_max: "128M"
    cpu_weight: 1000
    io_weight: 1000
    oom_score_adjust: -900
    config_path: /etc/ros2/filter_node
    env:
      - FILTER_NODE_CONFIG=/etc/ros2/filter_node/config.yaml
  test_joint_api:
    deploy_mode: native
    node_launch_command: "python3 -m test_joint_api"
    node_src_dir: "nodes/test_joint_api"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 57.6/58.2 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "64M"
    memory_max: "128M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    config_path: /etc/ros2/test_joint_api
    env:
      - TEST_JOINT_API_CONFIG=/etc/ros2/test_joint_api/config.yaml
  topic_scraper_api:
    deploy_mode: native
    node_launch_command: "python3 -m topic_scraper_api"
    node_src_dir: "nodes/topic_scraper_api"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 119.6/128.0 (Mimir, 2026-10-11; the peak was the old 128M cap, OOM-killed there):
    # MemoryLow ~ p50, MemoryMax >= 2x peak. Agent-facing tier.
    memory_low: "120M"
    memory_max: "256M"
    cpu_weight: 300
    io_weight: 300
    oom_score_adjust: -200
    config_path: /etc/ros2/topic_scraper_api
    env:
      - TOPIC_SCRAPER_API_CONFIG=/etc/ros2/topic_scraper_api/config.yaml
  # Head RGB-D calibration (nodes/head_rgbd_calibration/README.md): interactive operator tool behind the web UI Calibrate
  # page (capture, review, compute, apply). Background tier (work the robot can lose): the systemd default weights and no
  # OOM protection, so capture and compute never starve robot nodes; own memory cap below. The
  # compute child runs niced (compute_nice). Sessions and applied files live in /var/lib/ros2/head_rgbd_calibration.
  head_rgbd_calibration:
    deploy_mode: native
    node_launch_command: "python3 -m head_rgbd_calibration"
    node_src_dir: nodes/head_rgbd_calibration
    # Depends on shared/ (ros2_common.head_rgbd_calibration): shared/ changes restart and re-sync it.
    src_shared: true
    memory_low: "64M"
    memory_max: "768M"
    cpu_weight: 100
    io_weight: 100
    oom_score_adjust: 0
    config_path: /etc/ros2/head_rgbd_calibration
    env:
      - HEAD_RGBD_CALIBRATION_CONFIG=/etc/ros2/head_rgbd_calibration/config.yaml
  bno055_imu:
    deploy_mode: native
    node_launch_command: "python3 -m bno055_imu"
    node_src_dir: "nodes/bridges/bno055_imu"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Measured 2026-10-10: ~6.8 ms CPU per sample (i2c-gpio bit-bang in kernel time counts here); 50 Hz needs ~34% of a
    # core, which the critical tier weight guarantees under contention (no quota to throttle it).
    # Working set MiB p50/24 h peak 53.6/57.6 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "56M"
    memory_max: "128M"
    cpu_weight: 1000
    io_weight: 1000
    oom_score_adjust: -900
    config_path: /etc/ros2/bno055_imu
    env:
      - BLINKA_FORCECHIP=BCM2XXX
      - BNO055_IMU_CONFIG=/etc/ros2/bno055_imu/config.yaml
  haptic_controller:
    deploy_mode: native
    node_launch_command: "python3 -m haptic_controller"
    node_src_dir: "nodes/haptic_controller"
    # Not running on 2026-10-11 (no series): MemoryLow estimated from comparable nodes, MemoryMax 2x it or more.
    memory_low: "48M"
    memory_max: "128M"
    cpu_weight: 300
    io_weight: 300
    oom_score_adjust: -200
    config_path: /etc/ros2/haptic_controller
    env:
      - HAPTIC_CONTROLLER_CONFIG=/etc/ros2/haptic_controller/config.yaml
  gps_rtk:
    deploy_mode: native
    node_launch_command: "python3 -m gps_rtk"
    node_src_dir: "nodes/bridges/gps_rtk"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 55.0/55.8 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "56M"
    memory_max: "128M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    config_path: /etc/ros2/gps_rtk
    env:
      - GPS_RTK_CONFIG=/etc/ros2/gps_rtk/config.yaml
  rplidar_a1:
    deploy_mode: native
    # Supervisor runs the launch file and exits 1 (systemd restarts it) when /scan never starts or goes silent.
    node_launch_command: "python3 {{ ros2_repo_dest }}/nodes/bridges/rplidar_a1/scan_supervisor.py"
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/bridges/rplidar_a1]
    # No venv: the supervisor imports ros2_metrics from the checkout (PYTHONPATH below) and prometheus_client from apt.
    src_extra_paths: [shared/ros2_metrics]
    # Working set MiB p50/24 h peak 91.6/92.9 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "96M"
    memory_max: "192M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    apt_packages:
      - ros-jazzy-rplidar-ros
      - python3-prometheus-client
    # The launcher sources /opt/ros/jazzy/setup.bash, which prepends the ROS paths and keeps this entry.
    env:
      - "PYTHONPATH={{ ros2_repo_dest }}/shared/ros2_metrics"
  realsense_d435i:
    deploy_mode: native
    node_launch_command: >-
      ros2 launch realsense2_camera rs_launch.py enable_accel:=false enable_gyro:=false
      depth_module.depth_profile:=848x480x90 rgb_camera.color_profile:=1280x720x30 align_depth.enable:=true
    node_src_dir: ""
    # Repo paths whose change restarts the node (no Python package dir): its launch/config files.
    src_paths: [nodes/bridges/realsense_d435i]
    # Not running on 2026-10-11 (no series): MemoryLow estimated from comparable nodes, MemoryMax 2x it or more.
    memory_low: "128M"
    memory_max: "512M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
    apt_packages:
      - ros-jazzy-realsense2-camera
  # Retired (D7): the cameras are physically gone from the Pi. present: false makes a deploy of this name run only the
  # uninstall path of roles/ros2_node_deploy/tasks/main.yml (deploy_mode and a launch command, nothing else). Boot
  # overlays: playbooks/tasks/pi_camera_boot_config.yml.
  overview_camera:
    deploy_mode: native
    node_launch_command: "ros2 launch overview_camera overview_camera.launch.py"
  # Retired (D9 of the head camera epic): the Camera Module 3 is the head camera, served by head_camera_cpp. Only the
  # uninstall path stays: present: false removes the unit, launcher and config, and colcon_purge removes the
  # camera_ros install. libcamera is NOT purged: head_camera_cpp builds against it.
  pi_cameras:
    deploy_mode: native
    node_launch_command: "ros2 launch pi_cameras pi_cameras.launch.py"
    colcon_purge:
      - package: camera_ros
        workspace: /opt/ros2-ws
  # Head RGB camera (Camera Module 3 on CSI cam0): 30 fps /head_camera/* plus autofocused full-resolution zoom crops
  # (nodes/head_camera_cpp/README.md). It replaces pi_cameras and builds against the same pinned libcamera: the first
  # colcon_source dict is identical to pi_cameras' (repo, commit, meson_args, patch contents; the patch path is not part
  # of the stamp key), so the existing stamp matches and nothing rebuilds. The apt ros-jazzy-libcamera and
  # ros-jazzy-camera-ros packages must NOT be installed: they would shadow the fork. camera_ros is not built. Never
  # enable it together with pi_cameras: one process owns the camera. Then ros2_common_cpp and the node build as local
  # sources (-j2).
  # Background tier like pi_cameras, a preview the robot can lose. The figures are carried over from pi_cameras
  # (one process, one camera, with the full-resolution still buffers). The working set to compare them with is the
  # Mimir p50 and 24 h peak: MemoryLow is ~1.33x p50, MemoryMax 4x the peak.
  head_camera_cpp:
    deploy_mode: native
    node_launch_command: "ros2 run head_camera_cpp head_camera_node"
    node_src_dir: ""
    # Runs no repo file (the binary is in /opt/ros2-ws/install): the build stamp restarts it when its source changes.
    src_paths: []
    colcon_source:
      - repo: https://github.com/raspberrypi/libcamera.git
        commit: v0.7.2+rpt20260817
        package: libcamera
        workspace: /opt/ros2-ws
        # colcon-meson needs a package.xml (build_type meson); libpisp comes from its meson wrap (needs network).
        patches:
          - "{{ ros2_repo_dest }}/nodes/head_camera_cpp/patches/libcamera-0001-add-package-xml.patch"
        meson_args:
          - -Dpipelines=rpi/pisp
          - -Dipas=rpi/pisp
          - -Dcam=enabled
          - -Dqcam=disabled
          - -Dgstreamer=disabled
          - -Dv4l2=false
          - -Dtest=false
          - -Ddocumentation=disabled
          - -Dpycamera=disabled
          # No -Dprefix/-Dlibdir/-Dbuildtype: colcon-meson passes --prefix, --libdir (install/lib) and --buildtype itself.
      - local: shared/ros2_common_cpp
        package: ros2_common_cpp
        workspace: /opt/ros2-ws
        cmake_args: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_TESTING=OFF]
        # colcon discovers only this tree; make -j2 keeps the running robot's cores free.
        base_paths: [.]
        jobs: 2
        stamp_apt_packages: [libyaml-cpp-dev, prometheus-cpp-dev]
      - local: nodes/head_camera_cpp
        package: head_camera_cpp
        workspace: /opt/ros2-ws
        cmake_args: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_TESTING=OFF]
        base_paths: [.]
        jobs: 2
        stamp_apt_packages: [ros-jazzy-rclcpp, ros-jazzy-sensor-msgs, libopencv-dev, nlohmann-json3-dev]
    memory_low: "128M"
    memory_max: "384M"
    cpu_weight: 100
    io_weight: 100
    oom_score_adjust: 0
    nice: 10
    config_path: /etc/ros2/head_camera_cpp
    env:
      - HEAD_CAMERA_CONFIG=/etc/ros2/head_camera_cpp/config.yaml
    apt_packages:
      - git
      - build-essential
      - cmake
      - pkg-config
      - rsync
      - python3-colcon-common-extensions
      - python3-colcon-meson
      - meson
      - ninja-build
      - python3-ply
      - python3-jinja2
      - python3-yaml
      - libyaml-dev
      - libgnutls28-dev
      - ros-jazzy-ament-cmake
      - ros-jazzy-rclcpp
      - ros-jazzy-rclcpp-components
      - ros-jazzy-sensor-msgs
      - ros-jazzy-std-msgs
      - libopencv-dev
      - nlohmann-json3-dev
      - libyaml-cpp-dev
      - prometheus-cpp-dev
  # Retired (D7): the Pi's stereo pipeline never produced depth and saturated its CPU; its sources are deleted. The entries are
  # present: false, so a deploy of these names runs only the uninstall path of roles/ros2_node_deploy/tasks/main.yml,
  # which needs deploy_mode and a launch command (the role asserts it) and nothing else.
  stereo_depth:
    deploy_mode: native
    node_launch_command: "python3 -m stereo_depth"
  stereo_depth_cpp:
    deploy_mode: native
    node_launch_command: "ros2 run stereo_depth_cpp stereo_depth_node"
  # Retired with the Jetson: present: false uninstalls the unit, launcher and config, and colcon_purge removes the
  # package's source, build, install and stamps from /opt/ros2-ws (roles/ros2_node_deploy/tasks/colcon_purge.yml).
  jetson_bridge_cpp:
    deploy_mode: native
    node_launch_command: "ros2 run jetson_bridge_cpp jetson_bridge_node"
    colcon_purge:
      - package: jetson_bridge_cpp
        workspace: /opt/ros2-ws
  swerve_controller:
    deploy_mode: native
    node_launch_command: "python3 -m swerve_drive_controller"
    node_src_dir: "nodes/swerve_drive_controller"
    # Depends on shared/ros2_metrics (editable path dependency): shared/ changes restart and re-sync it.
    src_shared: true
    # Working set MiB p50/24 h peak 49.8/50.5 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "56M"
    memory_max: "128M"
    cpu_weight: 1000
    io_weight: 1000
    oom_score_adjust: -900
    config_path: /etc/ros2/swerve_drive_controller
    env:
      - SWERVE_DRIVE_CONTROLLER_CONFIG=/etc/ros2/swerve_drive_controller/config.yaml
  # Repo Python node (nodes/laser_filter), not laser_filters' scan_to_scan_filter_chain: its polygon filters cannot
  # change the polygon at runtime in Jazzy, and mcp_server sets the self polygon (dynamic footprint) at runtime.
  laser_filter:
    deploy_mode: native
    node_launch_command: "python3 -m laser_filter"
    node_src_dir: "nodes/laser_filter"
    env:
      - LASER_FILTER_CONFIG={{ ros2_repo_dest }}/nodes/laser_filter/config/footprint_filter.yaml
    # point_cloud2 for the ToF cloud (sensor_msgs_py reads /tof/points and writes /tof/points_filtered).
    apt_packages:
      - ros-jazzy-sensor-msgs-py
    # MemoryLow 64M: the C++ filter chain it replaced measured 35.7/37.6 MiB, and this Python node also loads
    # rclpy + numpy + shapely; MemoryMax is 4x it (the cgroup test floor is 32M).
    memory_low: "64M"
    memory_max: "256M"
    cpu_weight: 500
    io_weight: 500
    oom_score_adjust: -500
  static_tf_publisher:
    deploy_mode: native
    node_launch_command: "python3 -m static_tf_publisher"
    node_src_dir: "nodes/static_tf_publisher"
    # Working set MiB p50/24 h peak 44.5/45.0 (Mimir, 2026-10-11): MemoryLow ~ p50, MemoryMax >= 2x peak.
    memory_low: "48M"
    memory_max: "96M"
