[defaults]
inventory = inventory
roles_path = roles
# Use built-in default callback; 'yaml' requires community.general collection
stdout_callback = default
deprecation_warnings = False
# Per-task timing: the recap lists every task by duration and the total deploy time (ansible.posix collection).
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
# Facts: only the minimal subset (ansible_machine, ansible_architecture, distribution), cached for a day.
gathering = smart
gather_subset = min
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 86400

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=6
timeout = 120
retries = 5
pipelining = True
