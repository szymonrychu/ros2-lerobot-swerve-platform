---
- name: Deploy claude_agent on client
  hosts: client
  become: true
  pre_tasks:
    - name: Stop all ROS2 nodes before deploying
      ansible.builtin.include_tasks: ../../tasks/stop_ros_nodes.yml

    - name: Sync repository
      ansible.builtin.include_tasks: ../../tasks/repo_sync.yml
  tasks:
    - name: MCP server token and arm home directory (the agent reads the token)
      ansible.builtin.include_tasks: ../../tasks/mcp_server_setup.yml

    - name: Claude agent user, directories and OAuth token
      ansible.builtin.include_tasks: ../../tasks/claude_agent_setup.yml

    - name: Deploy claude_agent
      ansible.builtin.include_tasks: ../../tasks/resolve_and_deploy.yml
      vars:
        _deploy_node_name: claude_agent

  post_tasks:
    - name: Start enabled ROS2 nodes gradually
      ansible.builtin.include_tasks: ../../tasks/start_ros_nodes.yml
