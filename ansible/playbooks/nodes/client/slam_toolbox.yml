---
- name: Deploy slam_toolbox on client
  hosts: client
  become: true
  pre_tasks:
    - name: Sync repository
      ansible.builtin.include_tasks: ../../tasks/repo_sync.yml
  tasks:
    - name: SLAM maps directory
      ansible.builtin.include_tasks: ../../tasks/slam_maps_dir.yml

    - name: Deploy slam_toolbox
      ansible.builtin.include_tasks: ../../tasks/resolve_and_deploy.yml
      vars:
        _deploy_node_name: slam_toolbox
