---
- name: Deploy fastdds_discovery_server on client
  hosts: client
  become: true
  pre_tasks:
    - name: Sync repository
      ansible.builtin.include_tasks: ../../tasks/repo_sync.yml
  tasks:
    - name: Deploy fastdds_discovery_server
      ansible.builtin.include_tasks: ../../tasks/resolve_and_deploy.yml
      vars:
        _deploy_node_name: fastdds_discovery_server

    - name: DDS host setup (shell env, keep shared memory)
      ansible.builtin.include_tasks: ../../tasks/dds_host_setup.yml
