---
# First step of every deploy: stop all running ROS2 node services so package installs and builds (web_ui npm build,
# Poetry venvs) run on an otherwise idle client. The client overheated and froze when a build ran next to the full
# stack (2026-10-03). The nodes are started again by the role as they are deployed and by start_ros_nodes.yml.
- name: Stop all running ROS2 node services before deploying
  ansible.builtin.shell: |
    set -o pipefail
    units=$(systemctl list-units --type=service --state=running --no-legend 'ros2-*' | awk '{print $1}')
    [ -z "$units" ] && exit 0
    echo "$units" | xargs systemctl stop
    echo "stopped: $(echo $units)"
  args:
    executable: /bin/bash
  become: true
  register: ros2_nodes_stopped
  changed_when: "'stopped:' in ros2_nodes_stopped.stdout"
