---
# One apt task for the packages of every present node (of the selected ones when the run was limited to nodes by tag),
# instead of one apt call per node. The role skips its own per-node install because the playbooks set ros2_apt_batched.
- name: Collect the apt packages of the nodes in this run
  ansible.builtin.set_fact:
    ros2_apt_packages: >-
      {{ (ros2_nodes
          | selectattr('name', 'in', ros2_selected_nodes if (ros2_apt_only_selected | bool) else (ros2_nodes | map(attribute='name') | list))
          | rejectattr('present', 'defined') | list
          + ros2_nodes
          | selectattr('name', 'in', ros2_selected_nodes if (ros2_apt_only_selected | bool) else (ros2_nodes | map(attribute='name') | list))
          | selectattr('present', 'defined') | selectattr('present') | list)
         | map(attribute='node_type') | unique
         | map('extract', ros2_node_type_defaults) | selectattr('apt_packages', 'defined')
         | map(attribute='apt_packages') | flatten | unique | list }}
  tags: [apt, always]

- name: Install the node apt packages
  ansible.builtin.apt:
    name: "{{ ros2_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ros2_apt_packages | length > 0
  tags: [apt, always]
