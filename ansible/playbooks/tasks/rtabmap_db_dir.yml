---
# rtabmap_mapping keeps its RTAB-Map database (rtabmap.db) here; the node runs as ansible_user.
- name: Ensure the RTAB-Map database directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/rtabmap
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [setup]
