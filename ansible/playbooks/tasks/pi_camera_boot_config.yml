---
# Boot config for the Pi 5 CSI ports: a Camera Module 3 (IMX708, pi_cameras front preview) on cam0 and the Arducam
# ToF camera on cam1. The firmware's auto detection does not know the ToF, so it is turned off and both overlays are
# written explicitly; the IMX219 overlays of the retired Pi camera pair are removed. The firmware reads config.txt at
# boot, so the client reboots when (and only when) a line changed. Same pattern as the UART overlay in
# deploy_nodes_client.yml and bno055_i2c_boot_config.yml. Included from pre_tasks (after the stop-all) by the full
# client playbook (tags boot, pi_cameras and arducam_tof, so a deploy of either camera node reaches it).
- name: Remove the IMX219 overlay from CSI cam0 (left camera, retired)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^dtoverlay=imx219,cam0$"
    state: absent
  when: ansible_machine == "aarch64"
  register: imx219_cam0_result
  tags: [boot]

- name: Remove the IMX219 overlay from CSI cam1 (right camera, retired)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^dtoverlay=imx219,cam1$"
    state: absent
  when: ansible_machine == "aarch64"
  register: imx219_cam1_result
  tags: [boot]

- name: Turn camera auto detection off (it does not detect the Arducam ToF)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "camera_auto_detect=0"
    regexp: "^camera_auto_detect="
    create: true
  when: ansible_machine == "aarch64"
  register: camera_auto_detect_result
  tags: [boot]

- name: Enable the Camera Module 3 overlay on CSI cam0
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=imx708,cam0"
    regexp: "^dtoverlay=imx708,cam0$"
    insertafter: "^camera_auto_detect="
    create: true
  when: ansible_machine == "aarch64"
  register: imx708_cam0_result
  tags: [boot]

- name: Enable the Arducam ToF overlay on CSI cam1 (Pivariety driver, ships with the Ubuntu raspi kernel)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=arducam-pivariety,cam1"
    regexp: "^dtoverlay=arducam-pivariety,cam1$"
    insertafter: "^dtoverlay=imx708,cam0$"
    create: true
  when: ansible_machine == "aarch64"
  register: tof_cam1_result
  tags: [boot]

- name: Reboot client if a camera boot overlay changed
  when: >-
    imx219_cam0_result.changed or imx219_cam1_result.changed or camera_auto_detect_result.changed
    or imx708_cam0_result.changed or tof_cam1_result.changed
  ansible.builtin.reboot:
    reboot_timeout: 120
  tags: [boot]
