---
# mcp_server prerequisites, run before its deploy: the bearer token EnvironmentFile, the arm home pose directory, the
# camera calibration sample directory (capture_calibration_sample writes <camera>.json there), the object memory directory
# and the camera lookup store (/var/lib/ros2/poi/lookups, next to poi_store's poi.json; web_ui reads it as the same user).
# The token is generated once on the robot and never overwritten (force: false); it never enters git.
# Group mcp-token (read-only) lets other services, e.g. claude_agent, use it. Fetch it on the dev machine with scripts/robot_mcp_token.sh.
- name: Ensure mcp_server config directory exists
  ansible.builtin.file:
    path: /etc/ros2/mcp_server
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [setup]

- name: Ensure the group that may read the mcp_server token exists
  ansible.builtin.group:
    name: mcp-token
    system: true
  tags: [setup]

- name: Create mcp_server bearer token if absent
  ansible.builtin.copy:
    dest: /etc/ros2/mcp_server/token
    content: "MCP_SERVER_TOKEN={{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
    owner: "{{ ansible_user }}"
    group: mcp-token
    mode: "0640"
    force: false
  no_log: true
  tags: [setup]

# force: false leaves an existing token untouched, including owner-only 0600 from before the mcp-token group existed.
- name: Let group mcp-token read the existing mcp_server token
  ansible.builtin.file:
    path: /etc/ros2/mcp_server/token
    owner: "{{ ansible_user }}"
    group: mcp-token
    mode: "0640"
  tags: [setup]

# The board-park token opens only POST /admin/park_calibration_board (head_rgbd_calibration's park with the calibration
# board on). Its own file and group board-park: claude_agent holds the shared MCP token (group mcp-token) but not this
# group, so the agent cannot reach the route. Created once (force: false), never in git.
- name: Ensure the group that may read the board-park token exists
  ansible.builtin.group:
    name: board-park
    system: true
  tags: [setup]

- name: Create the board-park token if absent
  ansible.builtin.copy:
    dest: /etc/ros2/mcp_server/board_park_token
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
    owner: "{{ ansible_user }}"
    group: board-park
    mode: "0640"
    force: false
  no_log: true
  tags: [setup]

- name: Let group board-park read the existing board-park token
  ansible.builtin.file:
    path: /etc/ros2/mcp_server/board_park_token
    owner: "{{ ansible_user }}"
    group: board-park
    mode: "0640"
  tags: [setup]

- name: Ensure arm home pose directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/arm
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [setup]

- name: Ensure camera calibration sample directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/camera_calibration
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [setup]

- name: Ensure object memory directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/objects
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [setup]

# The parent is poi_store's directory (poi_store_dir.yml makes it too, but runs after mcp_server's deploy): created here
# first so the lookups directory never gets a root-owned parent.
- name: Ensure camera lookup store directory exists (owned by the node user)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /var/lib/ros2/poi
    - /var/lib/ros2/poi/lookups
  tags: [setup]
