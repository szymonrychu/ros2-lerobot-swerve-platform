---
# mcp_server prerequisites, run before its deploy: the bearer token EnvironmentFile, the arm home pose directory, the
# camera calibration sample directory (capture_calibration_sample writes <camera>.json there) and the object memory directory.
# The token is generated once on the robot and never overwritten (force: false); it never enters git.
# Group mcp-token (read-only) lets other services, e.g. claude_agent, use it. Fetch it on the dev machine with scripts/robot_mcp_token.sh.
- name: Ensure mcp_server config directory exists
  ansible.builtin.file:
    path: /etc/ros2/mcp_server
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the group that may read the mcp_server token exists
  ansible.builtin.group:
    name: mcp-token
    system: true

- name: Create mcp_server bearer token if absent
  ansible.builtin.copy:
    dest: /etc/ros2/mcp_server/token
    content: "MCP_SERVER_TOKEN={{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
    owner: "{{ ansible_user }}"
    group: mcp-token
    mode: "0640"
    force: false
  no_log: true

# force: false leaves an existing token untouched, including owner-only 0600 from before the mcp-token group existed.
- name: Let group mcp-token read the existing mcp_server token
  ansible.builtin.file:
    path: /etc/ros2/mcp_server/token
    owner: "{{ ansible_user }}"
    group: mcp-token
    mode: "0640"

- name: Ensure arm home pose directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/arm
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure camera calibration sample directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/camera_calibration
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure object memory directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/objects
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
