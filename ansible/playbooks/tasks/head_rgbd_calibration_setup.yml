# The service joins groups mcp-token and board-park (SupplementaryGroups=) to read the mcp_server token and the board-park token. This setup runs before
# mcp_server_setup.yml in the client playbook, and systemd will not start a unit naming a missing group, so create it
# here too (idempotent, same definition as mcp_server_setup.yml).
- name: Ensure the group that may read the mcp_server token exists
  ansible.builtin.group:
    name: mcp-token
    system: true
  tags: [setup]

- name: Ensure the group that may read the board-park token exists
  ansible.builtin.group:
    name: board-park
    system: true
  tags: [setup]

# head_rgbd_calibration keeps sessions/ and applied/ here; the node runs as ansible_user. Nothing in this file writes,
# removes or truncates their contents: only the node's Apply writes applied/ (nothing is seeded), and the apply unit
# restarts the head nodes when applied/applied.json changes and an applied file they read changed with it.
- name: Ensure head_rgbd_calibration state directories exist (owned by the node user)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /var/lib/ros2/head_rgbd_calibration
    - /var/lib/ros2/head_rgbd_calibration/sessions
    - /var/lib/ros2/head_rgbd_calibration/applied
  tags: [setup]

- name: Install the head_rgbd_calibration apply restart script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/ros2-head-rgbd-calibration-apply.sh"
    dest: /usr/local/sbin/ros2-head-rgbd-calibration-apply
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [setup]

- name: Install head_rgbd_calibration apply path unit
  ansible.builtin.template:
    src: ros2-head-rgbd-calibration-apply.path.j2
    dest: /etc/systemd/system/ros2-head-rgbd-calibration-apply.path
    owner: root
    group: root
    mode: "0644"
  become: true
  register: head_rgbd_calibration_path_unit
  tags: [setup]

- name: Install head_rgbd_calibration apply service unit
  ansible.builtin.template:
    src: ros2-head-rgbd-calibration-apply.service.j2
    dest: /etc/systemd/system/ros2-head-rgbd-calibration-apply.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: head_rgbd_calibration_service_unit
  tags: [setup]

- name: Reload systemd after head_rgbd_calibration apply unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: head_rgbd_calibration_path_unit.changed or head_rgbd_calibration_service_unit.changed
  tags: [setup]

- name: Enable and start head_rgbd_calibration apply path unit
  ansible.builtin.systemd:
    name: ros2-head-rgbd-calibration-apply.path
    enabled: true
    state: started
  become: true
  tags: [setup]
