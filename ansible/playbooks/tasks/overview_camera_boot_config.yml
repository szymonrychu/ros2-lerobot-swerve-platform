---
# Boot config for the two IMX219 cameras on the Pi 5 CSI ports cam0 (left) and cam1 (right): auto detection off, one
# explicit imx219 overlay per port. The overlays of the previous setup (IMX708 Camera Module 3 on cam0, Arducam ToF on
# cam1) are removed first; no task removes an imx219 line. The firmware reads config.txt at boot, so the client
# reboots when (and only when) a line was added, changed or removed. Same pattern as the UART overlay in
# deploy_nodes_client.yml and bno055_i2c_boot_config.yml. Included from pre_tasks (after the stop-all) by the full
# client playbook (tags boot and overview_camera, so --tags overview_camera reaches it).
- name: Remove the IMX708 overlay from CSI cam0 (replaced by the left IMX219)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^dtoverlay=imx708,cam0$"
    state: absent
  when: ansible_machine == "aarch64"
  register: imx708_cam0_result
  tags: [boot]

- name: Remove the Arducam ToF overlay from CSI cam1 (replaced by the right IMX219)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^dtoverlay=arducam-pivariety,cam1$"
    state: absent
  when: ansible_machine == "aarch64"
  register: tof_cam1_result
  tags: [boot]

- name: Disable camera auto detection (the imx219 overlays are explicit)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "camera_auto_detect=0"
    regexp: "^camera_auto_detect="
    create: true
  when: ansible_machine == "aarch64"
  register: camera_auto_detect_result
  tags: [boot]

- name: Enable the IMX219 overlay on CSI cam0 (left camera)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=imx219,cam0"
    regexp: "^dtoverlay=imx219,cam0$"
    insertafter: "^camera_auto_detect="
    create: true
  when: ansible_machine == "aarch64"
  register: imx219_cam0_result
  tags: [boot]

- name: Enable the IMX219 overlay on CSI cam1 (right camera)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=imx219,cam1"
    regexp: "^dtoverlay=imx219,cam1$"
    insertafter: "^dtoverlay=imx219,cam0$"
    create: true
  when: ansible_machine == "aarch64"
  register: imx219_cam1_result
  tags: [boot]

- name: Reboot client if a camera boot overlay changed
  when: >-
    imx708_cam0_result.changed or tof_cam1_result.changed or camera_auto_detect_result.changed
    or imx219_cam0_result.changed or imx219_cam1_result.changed
  ansible.builtin.reboot:
    reboot_timeout: 120
  tags: [boot]
