# Device permissions and USB power for the Intel RealSense D435 (plain D435, USB PID 8086:0b07, and 8086:0adb in firmware
# update / recovery mode; no IMU, so no IIO/HID rules).
# Applied by the realsense_d435 node deploy, not by the base playbook.
- name: Install the RealSense D435 udev rule
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-realsense-d435.rules
    content: |
      # Intel RealSense D435 - USB device access and no autosuspend
      SUBSYSTEMS=="usb", ATTRS{idVendor}=="8086", ATTRS{idProduct}=="0b07", MODE="0666", GROUP="video"
      SUBSYSTEMS=="usb", ATTRS{idVendor}=="8086", ATTRS{idProduct}=="0b07", ATTR{power/autosuspend}="-1"
      SUBSYSTEMS=="usb", ATTRS{idVendor}=="8086", ATTRS{idProduct}=="0b07", ATTR{power/control}="on"
      # Firmware update / recovery mode (rs-fw-update switches the camera to it): access without root
      SUBSYSTEMS=="usb", ATTRS{idVendor}=="8086", ATTRS{idProduct}=="0adb", MODE="0666", GROUP="video"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: realsense_d435_udev_rule
  tags: [setup]

- name: Remove the stale RealSense D435i udev rule (PID 0b3a)
  ansible.builtin.file:
    path: /etc/udev/rules.d/99-realsense-d435i.rules
    state: absent
  become: true
  register: realsense_d435_udev_stale
  tags: [setup]

# Unverified by Intel documentation (docs brief 3.15): quirks=128 (UVC_QUIRK_FIX_BANDWIDTH) is kept as a stability
# measure for uvcvideo. Not the former 640 (0x280): its UVC_QUIRK_RESTRICT_FRAME_RATE (0x200) makes uvcvideo report only
# the default (highest) frame interval of each mode, so 640x360x15 did not exist and realsense2_camera fell back to
# 1920x1080x30 colour and no depth (bring-up 2026-10-28).
- name: Keep the uvcvideo quirks for RealSense stability
  ansible.builtin.copy:
    dest: /etc/modprobe.d/99-realsense-uvcvideo.conf
    content: "options uvcvideo quirks=128\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [setup]

# uvcvideo reads its quirks when it probes a device: set them on the running module and re-enumerate the D435 (unit
# stopped first; the deploy's start step starts it again). No-op when the module already has them or is not loaded.
- name: Apply the uvcvideo quirks to the running module and re-enumerate the D435
  ansible.builtin.shell: |
    set -eu
    param=/sys/module/uvcvideo/parameters/quirks
    [ -w "$param" ] || exit 0
    [ "$(cat "$param")" = 128 ] && exit 0
    systemctl stop ros2-realsense_d435 || true
    echo 128 > "$param"
    for f in /sys/bus/usb/devices/*/idProduct; do
      d=$(dirname "$f")
      if [ "$(cat "$f")" = 0b07 ] && [ "$(cat "$d/idVendor")" = 8086 ]; then
        echo 0 > "$d/authorized"
        sleep 2
        echo 1 > "$d/authorized"
      fi
    done
    echo "uvcvideo quirks set to 128"
  args:
    executable: /bin/bash
  become: true
  register: realsense_d435_live_quirks
  changed_when: "'quirks set' in realsense_d435_live_quirks.stdout"
  tags: [setup]

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  changed_when: true
  when: realsense_d435_udev_rule.changed or realsense_d435_udev_stale.changed
  tags: [setup]

- name: Trigger udev
  ansible.builtin.command: udevadm trigger
  become: true
  changed_when: true
  when: realsense_d435_udev_rule.changed or realsense_d435_udev_stale.changed
  tags: [setup]
