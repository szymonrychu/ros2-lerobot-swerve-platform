---
# Login shells (SSH, ros2 CLI, diag scripts) use the same localhost-only simple discovery as the nodes.
- name: Install /etc/profile.d/ros2_dds.sh
  ansible.builtin.copy:
    dest: /etc/profile.d/ros2_dds.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (playbooks/tasks/dds_host_setup.yml). DDS discovery settings matching the ROS2 nodes.
      unset ROS_DISCOVERY_SERVER ROS_SUPER_CLIENT
      export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
  tags: [config]

# Nodes run as a regular user; with logind's default RemoveIPC=yes every SSH logout of that user deletes
# its POSIX shared memory, i.e. the FastDDS SHM segments of all running nodes (data silently stops while
# discovery still works). Keep IPC, and restart the nodes once when this is first applied.
- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [config]

- name: Keep node user IPC when sessions end (logind RemoveIPC=no)
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/ros2-keep-ipc.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (playbooks/tasks/dds_host_setup.yml): FastDDS shared memory must survive logouts.
      [Login]
      RemoveIPC=no
  register: ros2_keep_ipc
  tags: [config]

- name: Reload systemd-logind configuration
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted
  when: ros2_keep_ipc.changed
  tags: [config]

- name: Restart running ROS2 node services so they recreate shared memory segments
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-units --type=service --state=running --no-legend 'ros2-*' | awk '{print $1}' | xargs -r systemctl restart
  args:
    executable: /bin/bash
  changed_when: true
  when: ros2_keep_ipc.changed
  tags: [config]
