# bno055_imu persists the BNO055 calibration offsets here (calibration_file); the node runs as ansible_user.
- name: Ensure BNO055 calibration state directory exists (owned by the node user)
  ansible.builtin.file:
    path: /var/lib/ros2/bno055_imu
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [setup]
