---
# Deploy all ROS2 nodes on Server RPi4b, or only some of them: every node's steps carry its node name as a tag, so
#   ./scripts/deploy-nodes.sh server lerobot_leader          # = this playbook with --tags lerobot_leader
#   ./scripts/deploy-nodes.sh server --all --tags config,restart
# Phase tags: apt, python, build, config, boot, setup, sync, restart, verify (documented in ansible/README.md, "Deploy tags").
# Node list and config live in group_vars/server.yml; repo vars in group_vars/all.yml.
# For a no-change run nothing is stopped or restarted; see the client playbook for the reasoning.

- name: Deploy all Server ROS2 nodes
  hosts: server
  become: true
  vars:
    ros2_apt_batched: true
  pre_tasks:
    - name: Work out which nodes and phases this run covers
      ansible.builtin.include_tasks: tasks/select_run.yml
      tags: [always]

    - name: Create the deploy state directories (stamps, restart queue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ ros2_deploy_state_dir }}"
        - "{{ ros2_deploy_state_dir }}/stamps"
      tags: [always]

    - name: Install the pinned uv (hosts provisioned before the uv migration have none)
      ansible.builtin.include_role:
        name: ros2_base
        tasks_from: uv.yml
      tags: [python, always]

    - name: Sync repository
      ansible.builtin.include_tasks: tasks/repo_sync.yml
      tags: [sync, always]

    - name: Sync ROS 2 Jazzy packages to one release
      ansible.builtin.include_tasks: tasks/ros_packages_sync.yml
      when: ros2_run_apt | bool
      tags: [apt, always]

    - name: Install the apt packages of all nodes in one task
      ansible.builtin.include_tasks: tasks/apt_nodes.yml
      when: ros2_run_apt | bool
      tags: [apt, always]

    - name: Ensure UART enabled for GPS RTK base station (enable_uart=1)
      when: ros2_nodes | selectattr('node_type', 'equalto', 'gps_rtk') | list | length > 0
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "enable_uart=1"
        regexp: "^enable_uart="
        create: true
      tags: [boot, gps_rtk_base]

    # console=serial0 makes the kernel console own ttyAMA0 (root:tty 0620), overriding the
    # dialout udev rule, so the base node gets EACCES on the LC29H UART after every boot.
    - name: Free ttyAMA0 from the kernel serial console for the GPS RTK base
      when: ros2_nodes | selectattr('node_type', 'equalto', 'gps_rtk') | list | length > 0
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: 'console=(?:serial0|ttyAMA0),[0-9]+\s*'
        replace: ""
      register: serial_console_result
      tags: [boot, gps_rtk_base]

    - name: Mask the serial getty on ttyAMA0 for the GPS RTK base
      when: ros2_nodes | selectattr('node_type', 'equalto', 'gps_rtk') | list | length > 0
      ansible.builtin.systemd_service:
        name: serial-getty@ttyAMA0.service
        masked: true
      tags: [boot, gps_rtk_base]

    - name: Reboot server if the serial console was removed (frees ttyAMA0)
      when: serial_console_result is defined and serial_console_result.changed
      ansible.builtin.reboot:
        reboot_timeout: 180
      tags: [boot, gps_rtk_base]

    - name: Boot waits for any network interface only
      ansible.builtin.include_tasks: tasks/network_wait_online.yml
      tags: [boot]

    - name: Install the self-healing recovery timer for stopped nodes
      ansible.builtin.include_tasks: tasks/deploy_guard.yml
      tags: [config, always]

    - name: Take the deploy lock (the recovery timer leaves the stopped nodes to this run)
      ansible.builtin.file:
        path: "{{ ros2_deploy_lock }}"
        state: touch
        mode: "0644"
      tags: [always]

  tasks:
    - name: Deploy the nodes
      block:
        - name: Deploy fastdds_discovery_server
          ansible.builtin.include_tasks:
            file: tasks/resolve_and_deploy.yml
            apply:
              tags: [fastdds_discovery_server]
          vars:
            _deploy_node_name: fastdds_discovery_server
          tags: [fastdds_discovery_server, apt, python, build, config]

        - name: DDS host setup (shell env, keep shared memory)
          ansible.builtin.include_tasks: tasks/dds_host_setup.yml
          tags: [config]

        - name: Deploy ros2-master
          ansible.builtin.include_tasks:
            file: tasks/resolve_and_deploy.yml
            apply:
              tags: [ros2-master]
          vars:
            _deploy_node_name: ros2-master
          tags: [ros2-master, apt, python, build, config]

        - name: Deploy lerobot_leader
          ansible.builtin.include_tasks:
            file: tasks/resolve_and_deploy.yml
            apply:
              tags: [lerobot_leader]
          vars:
            _deploy_node_name: lerobot_leader
          tags: [lerobot_leader, apt, python, build, config]

        - name: Deploy topic_scraper_api
          ansible.builtin.include_tasks:
            file: tasks/resolve_and_deploy.yml
            apply:
              tags: [topic_scraper_api]
          vars:
            _deploy_node_name: topic_scraper_api
          tags: [topic_scraper_api, apt, python, build, config]

        - name: Deploy gps_rtk_base
          ansible.builtin.include_tasks:
            file: tasks/resolve_and_deploy.yml
            apply:
              tags: [gps_rtk_base]
          vars:
            _deploy_node_name: gps_rtk_base
          tags: [gps_rtk_base, apt, python, build, config]

      # A failure anywhere above (after a heavy step stopped the nodes, say) must not leave the robot down: restart the
      # queued nodes and start the stopped ones, whatever that start does, then fail the run with the original error.
      rescue:
        - name: Start the stopped and queued nodes after a failed deploy
          ignore_errors: true
          tags: [always]
          block:
            - name: Restart the queued and start the stopped ROS2 nodes
              ansible.builtin.include_tasks: tasks/start_ros_nodes.yml

        - name: Release the deploy lock
          ansible.builtin.file:
            path: "{{ ros2_deploy_lock }}"
            state: absent
          ignore_errors: true
          tags: [always]

        - name: Fail the run with the original error
          ansible.builtin.fail:
            msg: >-
              Deploy failed at task "{{ ansible_failed_task.name | default('unknown') }}":
              {{ ansible_failed_result.msg | default('see the output above') }}
              (rc={{ ansible_failed_result.rc | default('n/a') }}) {{ ansible_failed_result.stderr | default('') }}
              Queued restarts and stopped nodes were handled in the rescue path.
          tags: [always]

  post_tasks:
    - name: Restart changed and start stopped ROS2 nodes gradually
      ansible.builtin.include_tasks: tasks/start_ros_nodes.yml
      tags: [restart, always]

    - name: Verify all ROS2 node services are active and stable
      ansible.builtin.include_role:
        name: ros2_node_verify
      tags: [verify, always]

    - name: Release the deploy lock
      ansible.builtin.file:
        path: "{{ ros2_deploy_lock }}"
        state: absent
      tags: [always]
