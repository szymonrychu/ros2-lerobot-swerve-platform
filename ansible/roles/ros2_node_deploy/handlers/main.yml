---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart ROS2 node
  ansible.builtin.service:
    name: "ros2-{{ ros2_node_restart_now }}"
    state: restarted
  become: true
  # Never (re)start a node deployed with enabled: false; the role has just stopped it.
  when:
    - ros2_node_restart_on_change | default(true) | bool
    - ros2_node_restart_enabled | default(true) | bool  # node_enabled of the node being deployed
