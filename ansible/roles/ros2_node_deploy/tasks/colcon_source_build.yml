---
# Build the pinned source packages of a node type into a colcon workspace (packages that are not in the apt
# distribution). node_colcon_source is either ONE source dict (rf2o_laser_odometry) or a LIST of them, built in list
# order so dependencies come first (libcamera before camera_ros). Each source is {repo, commit, package, workspace,
# patches, cmake_args, meson_args}: see colcon_source_package.yml for the fields, the stamp logic and the build limits.

- name: Normalise the colcon sources to a list
  ansible.builtin.set_fact:
    _colcon_sources: "{{ [node_colcon_source] if node_colcon_source is mapping else node_colcon_source }}"
    _colcon_chain_key: ""

- name: Build each pinned source in order
  ansible.builtin.include_tasks: colcon_source_package.yml
  loop: "{{ _colcon_sources }}"
  loop_control:
    loop_var: colcon_src
    label: "{{ colcon_src.package }}"
