---
# Network (netplan) role defaults.
# Primary interface gets static IP (ethernet or wlan); other interfaces set to DHCP. IPv6 disabled.
# Override in group_vars or host_vars.

network_netplan_file: 01-ansible-netplan.yaml
# network_address: "192.168.1.10/24"   # required
# network_gateway: "192.168.1.1"       # required
# network_nameservers: ["8.8.8.8", "8.8.4.4"]  # optional
# network_interface: "eth0"            # optional; default: primary IPv4 interface (ethernet or wlan)
# When primary is WiFi (wl*): network_wifi_ssid (required), network_wifi_password (optional)

# Static point-to-point ethernets (design D8), e.g. the Pi <-> Jetson cable. Each entry: iface, address (CIDR), and
# optionally default_route_via + route_metric. Rendered with dhcp4 off, ignore-carrier and optional, and left out of the
# DHCP list. Set for client and jetson in group_vars/all.yml.
network_link_ethernets: []

# Hand-written netplan files the deployed one replaces (e.g. /etc/netplan/00-wifi.yaml on the Jetson). Each is removed
# before netplan applies, and only once the deployed file holds the primary WiFi interface's stanza.
network_netplan_superseded_files: []
