---
# Configure static IP on primary interface (ethernet or wlan); other interfaces set to DHCP. IPv6 disabled.
# Requires: network_address (CIDR), network_gateway.
# Optional: network_interface (default: primary IPv4 interface), network_nameservers.
# For primary wlan: network_wifi_ssid (required), network_wifi_password (optional).

- name: Validate network variables
  ansible.builtin.assert:
    that:
      - network_address is defined
      - network_address | length > 0
      - network_gateway is defined
      - network_gateway | length > 0
    fail_msg: "network role requires network_address and network_gateway (set in group_vars or host_vars)."
    success_msg: "Network vars present"

- name: Set primary interface (explicit or default IPv4)
  ansible.builtin.set_fact:
    _network_interface: "{{ network_interface | default(ansible_facts['default_ipv4']['interface']) }}"
  when: network_interface is defined and network_interface | length > 0

- name: Set primary interface from default IPv4
  ansible.builtin.set_fact:
    _network_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
  when: network_interface is not defined or network_interface | length == 0

- name: Set whether primary is wireless (wl*)
  ansible.builtin.set_fact:
    _network_interface_is_wlan: "{{ _network_interface is match('^wl') }}"

- name: Require network_wifi_ssid when primary interface is WiFi
  ansible.builtin.assert:
    that: network_wifi_ssid is defined and network_wifi_ssid | length > 0
    fail_msg: "network role requires network_wifi_ssid when primary interface ({{ _network_interface }}) is WiFi. Set in group_vars or host_vars."
  when: _network_interface_is_wlan | bool

- name: Set list of other interfaces (exclude lo and primary)
  ansible.builtin.set_fact:
    _other_interfaces: "{{ ansible_facts['interfaces'] | default([]) | reject('match', '^lo$') | reject('equalto', _network_interface) | list }}"

- name: Set other ethernet-like interfaces (for DHCP in template)
  ansible.builtin.set_fact:
    _other_ethernets: "{{ _other_interfaces | reject('match', '^wl') | reject('in', network_link_ethernets | map(attribute='iface') | list) | list }}"

- name: Probe link interfaces for foreign IPv4 addresses
  ansible.builtin.set_fact:
    _network_link_foreign_addresses: >-
      {%- set ns = namespace(found=[]) -%}
      {%- for link in network_link_ethernets -%}
      {%- set facts = ansible_facts.get(link.iface, {}) -%}
      {%- set planned = link.address.split('/')[0] -%}
      {%- set addrs = ([facts.ipv4.address] if facts.ipv4 is defined and facts.ipv4.address is defined else [])
      + (facts.ipv4_secondaries | default([]) | map(attribute='address') | list) -%}
      {%- for addr in addrs if addr != planned -%}
      {%- set ns.found = ns.found + [link.iface ~ ' ' ~ addr] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- ns.found | tojson -}}

- name: Fail when a link interface holds a foreign IPv4 address
  ansible.builtin.assert:
    that: (_network_link_foreign_addresses | from_json) | length == 0
    fail_msg: >-
      network role: the link interface already holds an IPv4 address other than the planned one
      ({{ _network_link_foreign_addresses | from_json | join(', ') }}); refusing to overwrite it with the static link in netplan.
      Free the interface first (design assumption 'Pi network').

- name: Ensure netplan config directory exists
  ansible.builtin.file:
    path: /etc/netplan
    state: directory
    mode: "0755"
  become: true

- name: Remove conflicting cloud-init netplan file
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  become: true
  register: cloud_init_removed

- name: Deploy netplan configuration
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "/etc/netplan/{{ network_netplan_file }}"
    mode: "0600"
  become: true
  register: netplan_config

- name: Read back the deployed netplan file
  ansible.builtin.slurp:
    src: "/etc/netplan/{{ network_netplan_file }}"
  register: network_netplan_deployed
  when: network_netplan_superseded_files | length > 0

# Netplan cannot merge two files that both define the same WiFi access point, so a hand-written file that the deployed one
# replaces must go before netplan applies. It is removed only once the deployed file holds the primary interface's stanza.
- name: Remove superseded netplan files (only after the deployed file holds the primary WiFi stanza)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ network_netplan_superseded_files }}"
  when:
    - _network_interface_is_wlan | bool
    - (network_netplan_deployed.content | b64decode) is search('(?m)^  wifis:\n    ' ~ _network_interface ~ ':')
  register: network_netplan_superseded

- name: Apply netplan (when config, cloud-init state or superseded files changed)
  ansible.builtin.command:
    cmd: netplan apply
  become: true
  when: netplan_config is changed or cloud_init_removed is changed or network_netplan_superseded is changed
