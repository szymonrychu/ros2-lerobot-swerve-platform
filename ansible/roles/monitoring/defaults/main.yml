---
# Monitoring stack on the server RPi4: Grafana Mimir stores the metrics of both hosts, Grafana Loki their journals and
# Grafana shows them at http://server.ros2.lan/grafana/ (nginx: roles/web_proxy). Alloy on each host (roles/monitoring_agent)
# pushes into it. Deploy with
#   ./scripts/deploy-nodes.sh server monitoring
# false stops and disables Mimir, Loki and Grafana (packages, data and config stay).
monitoring_enabled: true

# Ports. Mimir and Loki HTTP are on 0.0.0.0 (the robot's Alloy pushes over the LAN, no auth: there is no public
# address); their gRPC and Grafana stay on localhost.
monitoring_mimir_port: 9009
monitoring_mimir_grpc_port: 9095
monitoring_loki_port: 3100
monitoring_loki_grpc_port: 9096
monitoring_grafana_port: 3000
monitoring_grafana_subpath: /grafana/

# Alloy's scrape interval (Grafana's datasource timeInterval: the shortest step a query uses).
monitoring_interval: "5s"

# Data on the SD card (wear accepted for 1 d of retention): Mimir blocks + TSDB/WAL, Loki chunks + index + WAL.
monitoring_mimir_data_dir: /var/lib/mimir
monitoring_loki_data_dir: /var/lib/loki
# Retention of both: the compactors delete what is older.
monitoring_mimir_retention: "24h"
monitoring_loki_retention: "24h"

# Mimir ingestion limits (one tenant, "anonymous", holds both hosts). Each host sends ~5-10k active series every 5 s,
# so ~20k series and ~4k samples/s in steady state. max_global_series_per_user keeps Mimir's default of 150k (7x
# headroom). ingestion_rate is raised from the default 10k samples/s to 50k (burst 500k, default 200k): after a server
# outage Alloy replays its remote-write WAL as fast as Mimir accepts it, and a 429 there only slows the catch-up.
monitoring_mimir_max_series: 150000
monitoring_mimir_ingestion_rate: 50000
monitoring_mimir_ingestion_burst: 500000
# Small-RAM caps for the Pi4: the ingester refuses series past this bound instead of growing into the OOM killer,
# the querier evaluates few queries at a time (default 8).
monitoring_mimir_ingester_max_series: 100000
monitoring_mimir_querier_max_concurrent: 4

# Grafana admin password: generated on the server on the first deploy (openssl rand), never on the controller.
monitoring_grafana_admin_password_file: /etc/grafana/admin-password
monitoring_grafana_dashboards_dir: /etc/grafana/dashboards

# Per-unit caps inside monitoring.slice (the slice itself and its totals: roles/monitoring_agent, server values in
# group_vars/server.yml). Mimir holds 2 h of head series (~20k) plus query memory; Loki holds the recent chunks of a
# few hundred streams; Grafana was OOM-killed at 250M and 450M on the robot while browsing (2026-10-10) and keeps 768M.
# OOMScoreAdjust=500 makes the kernel kill monitoring before any ROS unit.
monitoring_nice: 10
monitoring_oom_score_adjust: 500
monitoring_units:
  - name: mimir
    memory_max: "700M"
  - name: loki
    memory_max: "400M"
  - name: grafana-server
    memory_max: "768M"
