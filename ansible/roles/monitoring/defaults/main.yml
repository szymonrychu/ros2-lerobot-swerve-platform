---
# Monitoring stack on the client RPi5: Grafana Alloy collects, Prometheus stores, Grafana shows. Deploy with
#   ./scripts/deploy-nodes.sh client monitoring
# false stops and disables the stack (packages, data and config stay).
monitoring_enabled: true

# Ports (all on 0.0.0.0, LAN only: the robot has no public address).
monitoring_grafana_port: 3000
# nginx on port 80 fronts the robot: web UI at /, Grafana at monitoring_grafana_subpath (Grafana listens on localhost).
monitoring_http_port: 80
monitoring_grafana_subpath: /grafana/
monitoring_web_ui_port: 8080
monitoring_prometheus_port: 9090
monitoring_alloy_port: 12345

# Scrape and collection interval of every target.
monitoring_interval: "5s"
# Scrape timeout: below the interval (Alloy and Prometheus reject a timeout above it; their default is 10 s).
monitoring_scrape_timeout: "4s"

# Our ROS2 nodes' Prometheus endpoints (ros2_metrics helper or the node's own HTTP server), scraped by Alloy job
# ros2_nodes with a `node` label. Ports follow ansible/group_vars/client.yml (metrics_port, METRICS_PORT or the node's
# HTTP port); tests/test_node_metrics_wiring.py keeps both in sync.
monitoring_node_targets:
  - {node: lerobot_follower, address: "127.0.0.1:19101", path: /metrics}
  - {node: filter_node, address: "127.0.0.1:19102", path: /metrics}
  - {node: bno055_imu, address: "127.0.0.1:19103", path: /metrics}
  - {node: gps_rtk_rover, address: "127.0.0.1:19104", path: /metrics}
  - {node: gripper_uvc_camera, address: "127.0.0.1:19105", path: /metrics}
  - {node: rplidar_a1, address: "127.0.0.1:19106", path: /metrics}
  - {node: swerve_controller, address: "127.0.0.1:19107", path: /metrics}
  - {node: rf2o_odom_relay, address: "127.0.0.1:19108", path: /metrics}
  - {node: poi_store, address: "127.0.0.1:19109", path: /metrics}
  - {node: web_ui, address: "127.0.0.1:8080", path: /metrics}
  - {node: test_joint_api, address: "127.0.0.1:18080", path: /metrics}
  - {node: topic_scraper_api, address: "127.0.0.1:18100", path: /metrics}
  - {node: mcp_server, address: "127.0.0.1:18200", path: /metrics}
  - {node: claude_agent, address: "127.0.0.1:18300", path: /metrics}

# systemd units the unix exporter's systemd collector reports (node_systemd_unit_state, restarts, start time).
# Plain regex (the template escapes it for Alloy).
monitoring_systemd_unit_include: 'ros2-.*\.service|alloy\.service|prometheus\.service|grafana-server\.service|nginx\.service'

# Prometheus TSDB on the NVMe root; whichever limit is hit first drops the oldest blocks.
monitoring_prometheus_data_dir: /var/lib/prometheus/metrics2
monitoring_prometheus_retention_time: "1d"
monitoring_prometheus_retention_size: "2GB"

# Alloy textfile collector directory (the RPi throttling script writes rpi_throttled.prom here).
monitoring_textfile_dir: /var/lib/alloy/textfile
# How often the throttling script runs (vcgencmd get_throttled).
monitoring_throttled_interval: "5s"

# Grafana admin password: generated on the robot on the first deploy (openssl rand), never on the controller.
monitoring_grafana_admin_password_file: /etc/grafana/admin-password
monitoring_grafana_dashboards_dir: /etc/grafana/dashboards

# monitoring.slice caps the whole stack so it never starves the robot nodes (CPU ~80% busy at the robot's baseline):
# a low CPU/IO weight loses every contention, CPUQuota is 40% of ONE core in total, MemoryHigh throttles before the
# hard MemoryMax.
monitoring_slice_cpu_weight: 20
monitoring_slice_io_weight: 20
monitoring_slice_cpu_quota: "40%"
monitoring_slice_memory_max: "1200M"
monitoring_slice_memory_high: "1100M"

# Per-unit caps inside the slice. Prometheus gets the largest share: ~5k series at 5 s with 1 d retention needs ~150-250 MB
# of head block plus query memory; Alloy (exporters + remote-write WAL) and Grafana (idle, a few viewers) run at about
# 100-150 MB each. The sum (1150M) stays just under the slice: the slice is the hard total, the per-unit caps stop one
# service from taking all of it. OOMScoreAdjust=500 makes the kernel kill monitoring before any robot node.
monitoring_nice: 10
monitoring_oom_score_adjust: 500
monitoring_units:
  - name: alloy
    memory_max: "250M"
  - name: prometheus
    memory_max: "450M"
  - name: grafana-server
    # 250M was OOM-killed during the first start (database migrations peak ~260M), 2026-10-10.
    memory_max: "450M"
