---
# Order matters: handlers run in the order listed here, so systemd picks up drop-in changes before restarts.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart mimir
  ansible.builtin.systemd_service:
    name: mimir
    state: restarted
  when: monitoring_enabled | bool

- name: Restart loki
  ansible.builtin.systemd_service:
    name: loki
    state: restarted
  when: monitoring_enabled | bool

- name: Restart grafana-server
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
  when: monitoring_enabled | bool
