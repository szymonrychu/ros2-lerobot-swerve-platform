---
# Monitoring stack on the server RPi4 (Ubuntu 24.04, aarch64): Grafana Mimir (metrics, Prometheus API), Grafana Loki
# (logs) and Grafana, all from apt.grafana.com, in monitoring.slice (installed by roles/monitoring_agent, which the
# playbook runs first). Alloy on both hosts pushes into Mimir and Loki. Deploy: ./scripts/deploy-nodes.sh server monitoring
# A second run reports no changes (packages present, password created once, templates unchanged).

- name: Gather the service list (stack installed?)
  ansible.builtin.service_facts:

- name: Install and configure the monitoring stack
  when: monitoring_enabled | bool
  block:
    # ---- packages -------------------------------------------------------------------------------------------------
    - name: Add the Grafana apt repository
      ansible.builtin.include_role:
        name: monitoring_agent
        tasks_from: grafana_repo.yml

    # The mimir and loki debs (arm64 builds on apt.grafana.com) bring their own systemd units and users and start
    # with the package configs; the restart guard below moves them onto ours.
    - name: Install Mimir, Loki and Grafana
      ansible.builtin.apt:
        name: [mimir, loki, grafana]
        state: present
        install_recommends: false
        cache_valid_time: 3600

    # ---- resource isolation ---------------------------------------------------------------------------------------
    - name: Create the drop-in directories of the stack services
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.name }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ monitoring_units }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Put each stack service into monitoring.slice with its own memory cap
      ansible.builtin.template:
        src: monitoring-dropin.conf.j2
        dest: "/etc/systemd/system/{{ item.name }}.service.d/10-monitoring-slice.conf"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ monitoring_units }}"
      loop_control:
        label: "{{ item.name }}"
      notify: [Reload systemd, Restart mimir, Restart loki, Restart grafana-server]

    # ---- mimir ----------------------------------------------------------------------------------------------------
    - name: Create the Mimir data directory (blocks, TSDB and WAL)
      ansible.builtin.file:
        path: "{{ monitoring_mimir_data_dir }}"
        state: directory
        owner: mimir
        group: mimir
        mode: "0750"

    - name: Mimir service settings (log level; the deb's unit reads /etc/mimir/config.yml)
      ansible.builtin.template:
        src: mimir.default.j2
        dest: /etc/default/mimir
        owner: root
        group: root
        mode: "0644"
      notify: [Restart mimir]

    - name: Mimir config (monolithic, filesystem blocks, 24 h retention)
      ansible.builtin.template:
        src: mimir.yml.j2
        dest: /etc/mimir/config.yml
        owner: root
        group: mimir
        mode: "0640"
      notify: [Restart mimir]

    # ---- loki -----------------------------------------------------------------------------------------------------
    - name: Create the Loki data directory (chunks, index and WAL)
      ansible.builtin.file:
        path: "{{ monitoring_loki_data_dir }}"
        state: directory
        owner: loki
        mode: "0750"

    - name: Loki config (monolithic, filesystem, tsdb v13, 24 h retention)
      ansible.builtin.template:
        src: loki.yml.j2
        dest: /etc/loki/config.yml
        owner: root
        group: root
        mode: "0644"
        validate: /usr/bin/loki -config.file=%s -verify-config
      notify: [Restart loki]

    # ---- grafana --------------------------------------------------------------------------------------------------
    # Created once on the server, never on the controller; Grafana applies it when it creates its database (first
    # start). The grafana package does not start the service on install, so the file exists before that start.
    - name: Generate the Grafana admin password on the server (first deploy only)
      ansible.builtin.shell: umask 077 && openssl rand -hex -out {{ monitoring_grafana_admin_password_file }} 24
      args:
        creates: "{{ monitoring_grafana_admin_password_file }}"

    - name: Grafana admin password file permissions
      ansible.builtin.file:
        path: "{{ monitoring_grafana_admin_password_file }}"
        owner: root
        group: grafana
        mode: "0600"

    - name: Grafana settings (localhost behind nginx, anonymous Editor, no phoning home)
      ansible.builtin.template:
        src: grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: "0640"
      notify: [Restart grafana-server]

    - name: Provision the Mimir and Loki datasources
      ansible.builtin.template:
        src: grafana-datasources.yaml.j2
        dest: /etc/grafana/provisioning/datasources/robot.yaml
        owner: root
        group: grafana
        mode: "0640"
      notify: [Restart grafana-server]

    - name: Provision the dashboard provider
      ansible.builtin.template:
        src: grafana-dashboards.yaml.j2
        dest: /etc/grafana/provisioning/dashboards/robot.yaml
        owner: root
        group: grafana
        mode: "0640"
      notify: [Restart grafana-server]

    - name: Create the dashboard directory
      ansible.builtin.file:
        path: "{{ monitoring_grafana_dashboards_dir }}"
        state: directory
        owner: root
        group: grafana
        mode: "0755"

    - name: Install every dashboard of files/ (Grafana re-reads them within a minute)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_grafana_dashboards_dir }}/{{ item | basename }}"
        owner: root
        group: grafana
        mode: "0644"
      with_fileglob: ["*.json"]
      loop_control:
        label: "{{ item | basename }}"

    # ---- start and check ------------------------------------------------------------------------------------------
    - name: Apply unit and config changes before starting
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Mimir, Loki and Grafana
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [mimir, loki, grafana-server]

    # Handlers are lost when a run fails after writing a config (and the debs already started Mimir and Loki with
    # the package configs), so the next run would see nothing to change: restart any service started before a change
    # of its config, its drop-in or the shared slice.
    - name: Restart the stack services whose config is newer than their start
      ansible.builtin.shell: |
        set -eu
        restarted=""; d=/etc/systemd/system; slice=.service.d/10-monitoring-slice.conf
        for entry in \
          "mimir:/etc/default/mimir /etc/mimir/config.yml $d/mimir$slice $d/monitoring.slice" \
          "loki:/etc/loki/config.yml $d/loki$slice $d/monitoring.slice" \
          "grafana-server:/etc/grafana/grafana.ini /etc/grafana/provisioning/datasources/robot.yaml $d/grafana-server$slice $d/monitoring.slice"; do
          unit=${entry%%:*}; files=${entry#*:}
          started=$(date -d "$(systemctl show -p ActiveEnterTimestamp --value "$unit")" +%s)
          for f in $files; do
            if [ -e "$f" ] && [ "$(stat -c %Y "$f")" -gt "$started" ]; then
              systemctl restart "$unit"; restarted="$restarted $unit"; break
            fi
          done
        done
        echo "restarted:${restarted}"
      args:
        executable: /bin/bash
      register: monitoring_stale_restart
      changed_when: monitoring_stale_restart.stdout != 'restarted:'

    # Mimir's ingester reports ready only after its ring min_ready_duration (15 s) past the start.
    - name: Wait until Mimir, Loki and Grafana answer
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      loop:
        - "http://127.0.0.1:{{ monitoring_mimir_port }}/ready"
        - "http://127.0.0.1:{{ monitoring_loki_port }}/ready"
        - "http://127.0.0.1:{{ monitoring_grafana_port }}/api/health"
        - "http://127.0.0.1{{ monitoring_grafana_subpath }}api/health"
      register: monitoring_ready
      until: monitoring_ready.status == 200
      retries: 36
      delay: 5
      changed_when: false

- name: Stop and disable the monitoring stack (monitoring_enabled is false)
  ansible.builtin.systemd_service:
    name: "{{ item.unit }}"
    enabled: false
    state: stopped
  loop:
    - {unit: grafana-server, probe: grafana-server.service}
    - {unit: loki, probe: loki.service}
    - {unit: mimir, probe: mimir.service}
  loop_control:
    label: "{{ item.unit }}"
  when:
    - not monitoring_enabled | bool
    - item.probe in ansible_facts.services
