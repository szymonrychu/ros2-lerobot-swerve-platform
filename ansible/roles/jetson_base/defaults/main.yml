---
# Jetson Nano OS base: the end state of the 2026-10-14 cleanup (docs/plans/2026-10-14-jetson-depth-offload-briefs/
# jetson-cleanup-log.md), plus full clocks, persistent logs and the IMX219 ISP override. The role never removes a package.

# Units the cleanup disabled or masked, copied from the cleanup log (step 2). All are masked (symlink to /dev/null), so
# nothing can start them again; units whose package was purged are masked too, which keeps a reinstall quiet.
jetson_base_masked_units:
  - { unit: ros_robot_platform.service, reason: "old ROS 1 robot platform of the previous owner; the Jetson runs no ROS" }
  - { unit: docker.service, reason: "docker purged; the depth pipeline runs natively against the CUDA 10.2 / TensorRT 8.0 stack" }
  - { unit: containerd.service, reason: "containerd purged together with docker" }
  - { unit: snapd.service, reason: "snapd purged; saves RAM and disk, snaps were desktop leftovers" }
  - { unit: cups.service, reason: "no printing on a headless coprocessor" }
  - { unit: bluetooth.service, reason: "no bluetooth use; bluez purged" }
  - { unit: blueman.service, reason: "blueman bluetooth manager purged with bluez" }
  - { unit: ModemManager.service, reason: "no modem; it grabs serial ports" }
  - { unit: whoopsie.service, reason: "crash reporting upload, unwanted" }
  - { unit: apport.service, reason: "crash report collector, unwanted" }
  - { unit: gpsd.service, reason: "no GPS attached; it grabs serial ports" }
  - { unit: rpcbind.service, reason: "no NFS; open RPC port for nothing" }
  - { unit: fwupd.service, reason: "firmware updates do not apply to the Tegra board" }
  - { unit: fwupd-refresh.timer, reason: "timer of fwupd" }

# Headless: the GUI (gdm3 is installed) must not start.
jetson_base_default_target: multi-user.target

# Persistent journal (the FECS loop of the nvgpu driver left no trace on the volatile one).
jetson_base_journald_storage: persistent
jetson_base_journald_max_use: 200M

# nvpmodel mode 0 is MAXN (all four cores, max GPU clock); jetson-clocks.service then pins the clocks at their maximum.
jetson_base_nvpmodel_mode: 0

# Keep-list: the accelerated stack. The role fails when any of it is missing, so an apt purge or autoremove that took
# a piece away is caught on the next deploy. nvidia-l4t-* are the 27 board support packages at L4T 32.6.1.
jetson_base_keep_packages:
  - nvidia-l4t-3d-core
  - nvidia-l4t-apt-source
  - nvidia-l4t-bootloader
  - nvidia-l4t-camera
  - nvidia-l4t-configs
  - nvidia-l4t-core
  - nvidia-l4t-cuda
  - nvidia-l4t-firmware
  - nvidia-l4t-gputools
  - nvidia-l4t-graphics-demos
  - nvidia-l4t-gstreamer
  - nvidia-l4t-init
  - nvidia-l4t-initrd
  - nvidia-l4t-jetson-io
  - nvidia-l4t-jetson-multimedia-api
  - nvidia-l4t-kernel
  - nvidia-l4t-kernel-dtbs
  - nvidia-l4t-kernel-headers
  - nvidia-l4t-libvulkan
  - nvidia-l4t-multimedia
  - nvidia-l4t-multimedia-utils
  - nvidia-l4t-oem-config
  - nvidia-l4t-tools
  - nvidia-l4t-wayland
  - nvidia-l4t-weston
  - nvidia-l4t-x11
  - nvidia-l4t-xusb-firmware
  - cuda-cudart-10-2
  - cuda-cudart-dev-10-2
  - cuda-nvcc-10-2
  - cuda-libraries-10-2
  - cuda-libraries-dev-10-2
  - libcudnn8
  - libnvinfer8
  - libnvvpi1
# Not dpkg-owned: the OpenCV 4.8 build with CUDA (cudastereo, cudawarping, ximgproc) installed outside apt.
jetson_base_keep_paths:
  - /usr/lib/python3/dist-packages/cv2

# IMX219 ISP override (fixes the pink cast of nvarguscamerasrc without a tuning file), from the Waveshare IMX219-83
# stereo camera wiki, archive Camera_overrides.tar.gz:
#   source URL: https://files.waveshare.com/upload/e/eb/Camera_overrides.tar.gz
#   sha256 of camera_overrides.isp inside it: c6b8cafffa5f218a85f73d323e2a72b382194b84b39ff9a7804fffc1819638ec
jetson_base_isp_source_url: https://files.waveshare.com/upload/e/eb/Camera_overrides.tar.gz
jetson_base_isp_sha256: c6b8cafffa5f218a85f73d323e2a72b382194b84b39ff9a7804fffc1819638ec
