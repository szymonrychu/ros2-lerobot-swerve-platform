---
# Build dependencies. The role only adds packages; every apt task is state: present, so a second run changes nothing.

- name: Assert no forbidden package is requested
  ansible.builtin.assert:
    that: >-
      ((jetson_depthd_build_packages + jetson_depthd_cmake_packages + jetson_depthd_nvidia_packages)
      | intersect(jetson_depthd_forbidden_packages)) | length == 0
    quiet: true

- name: Install the Kitware signing key
  ansible.builtin.get_url:
    url: "{{ jetson_depthd_kitware_key_url }}"
    dest: "{{ jetson_depthd_kitware_keyring }}"
    mode: "0644"
    owner: root
    group: root

- name: Add the Kitware APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ jetson_depthd_kitware_keyring }}] {{ jetson_depthd_kitware_repo_url }} {{ jetson_depthd_kitware_suite }} main"
    filename: kitware
    state: present
    update_cache: true

- name: Look for the L4T r32.6 APT repositories
  ansible.builtin.shell:
    cmd: grep -rhsE '^deb .*{{ item }} {{ jetson_depthd_l4t_release }} main' /etc/apt/sources.list /etc/apt/sources.list.d/
    executable: /bin/bash
  register: jetson_depthd_l4t_repo_lines
  changed_when: false
  failed_when: jetson_depthd_l4t_repo_lines.rc > 1
  check_mode: false
  loop: "{{ jetson_depthd_nvidia_repo_hosts }}"

- name: Add the missing L4T r32.6 APT repositories
  ansible.builtin.apt_repository:
    repo: "deb https://{{ item.item }} {{ jetson_depthd_l4t_release }} main"
    filename: nvidia-l4t-apt-source
    state: present
    update_cache: false
  when: item.rc == 1
  loop: "{{ jetson_depthd_l4t_repo_lines.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the build packages
  ansible.builtin.apt:
    name: "{{ jetson_depthd_build_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install cmake from Kitware
  ansible.builtin.apt:
    name: "{{ jetson_depthd_cmake_packages }}"
    state: latest  # noqa: package-latest
    update_cache: false

- name: Install the CUDA, cuDNN, TensorRT and VPI dev packages
  ansible.builtin.apt:
    name: "{{ jetson_depthd_nvidia_packages }}"
    state: present

- name: Read the /usr/local/cuda link
  ansible.builtin.command: readlink -f /usr/local/cuda
  register: jetson_depthd_cuda_link
  changed_when: false
  failed_when: false
  check_mode: false

- name: Point /usr/local/cuda at cuda-10.2
  ansible.builtin.command: >-
    update-alternatives --install /usr/local/cuda cuda {{ jetson_depthd_cuda_home }} {{ jetson_depthd_cuda_alternative_priority }}
  when: jetson_depthd_cuda_link.stdout != jetson_depthd_cuda_home
  changed_when: true

- name: Read the cmake version
  ansible.builtin.command: cmake --version
  register: jetson_depthd_cmake_version
  changed_when: false
  check_mode: false

- name: Assert cmake is new enough
  ansible.builtin.assert:
    that: (jetson_depthd_cmake_version.stdout_lines[0].split()[-1]) is version(jetson_depthd_cmake_min_version, '>=')
    fail_msg: "cmake {{ jetson_depthd_cmake_version.stdout_lines[0] }} is older than {{ jetson_depthd_cmake_min_version }}; check the Kitware repository."
    quiet: true

- name: Create the depthd data directory
  ansible.builtin.file:
    path: "{{ jetson_depthd_data_dir }}"
    state: directory
    owner: "{{ jetson_depthd_user }}"
    group: "{{ jetson_depthd_user }}"
    mode: "0755"

- name: Create the depthd config directory
  ansible.builtin.file:
    path: "{{ jetson_depthd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
