---
# Config, unit and service. depthd restarts only when the binary, the config, the unit or a mono engine changed.

- name: Render the depthd config
  ansible.builtin.template:
    src: depthd.yaml.j2
    dest: "{{ jetson_depthd_config_dir }}/depthd.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/depthd --check-config %s
  register: jetson_depthd_conf

- name: Install the depthd unit
  ansible.builtin.template:
    src: depthd.service.j2
    dest: /etc/systemd/system/depthd.service
    owner: root
    group: root
    mode: "0644"
  register: jetson_depthd_unit

- name: Reload systemd after the depthd unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: jetson_depthd_unit is changed

- name: Enable depthd
  ansible.builtin.systemd:
    name: depthd
    enabled: true
    state: started

- name: Restart depthd after a binary, config, unit or engine change
  ansible.builtin.systemd:
    name: depthd
    state: restarted
  when: >-
    jetson_depthd_binary is changed or jetson_depthd_conf is changed or jetson_depthd_unit is changed or
    jetson_depthd_engine_build is changed
