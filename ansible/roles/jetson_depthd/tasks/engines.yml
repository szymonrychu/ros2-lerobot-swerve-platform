---
# TensorRT engines for the monocular models. Engines are tied to the GPU and TensorRT version, so they are built on the
# Jetson from the ONNX exported on the controller (T17); trtexec reruns only when the ONNX sha256 changed, and a
# rebuilt engine restarts depthd (service.yml) so the mono stage loads it.

- name: Look for the exported ONNX models on the controller
  ansible.builtin.stat:
    path: "{{ ros2_repo_root }}/jetson/models/build/{{ item }}.onnx"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: jetson_depthd_onnx_local
  loop: "{{ jetson_depthd_engine_models }}"

- name: Assert the ONNX models were exported
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item }}.onnx is missing under jetson/models/build; run the T17 export (cd jetson/models && uv run poe export)."
    quiet: true
  loop: "{{ jetson_depthd_onnx_local.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create the depthd models directory
  ansible.builtin.file:
    path: "{{ jetson_depthd_data_dir }}/models"
    state: directory
    owner: "{{ jetson_depthd_user }}"
    group: "{{ jetson_depthd_user }}"
    mode: "0755"

- name: Read the sha256 the engines were last built from
  ansible.builtin.slurp:
    src: "{{ jetson_depthd_data_dir }}/models/{{ item }}.onnx.sha256"
  register: jetson_depthd_engine_built_sha
  failed_when: false
  loop: "{{ jetson_depthd_engine_models }}"

- name: Copy the ONNX models to the Jetson
  ansible.builtin.copy:
    src: "{{ ros2_repo_root }}/jetson/models/build/{{ item }}.onnx"
    dest: "{{ jetson_depthd_data_dir }}/models/{{ item }}.onnx"
    owner: "{{ jetson_depthd_user }}"
    group: "{{ jetson_depthd_user }}"
    mode: "0644"
  loop: "{{ jetson_depthd_engine_models }}"

- name: Build the FP16 engine when the ONNX sha256 changed
  ansible.builtin.shell:
    cmd: >-
      {{ jetson_depthd_trtexec }} --onnx={{ item.item }}.onnx --fp16 --saveEngine={{ item.item }}.engine
      --workspace={{ jetson_depthd_engine_workspace_mb }} > {{ item.item }}.trtexec.log 2>&1 &&
      echo {{ item.stat.checksum }} > {{ item.item }}.onnx.sha256
    chdir: "{{ jetson_depthd_data_dir }}/models"
    executable: /bin/bash
  become: true
  become_user: "{{ jetson_depthd_user }}"
  when: >-
    jetson_depthd_engine_built_sha.results[idx].content is not defined or
    (jetson_depthd_engine_built_sha.results[idx].content | b64decode | trim) != item.stat.checksum
  changed_when: true
  register: jetson_depthd_engine_build
  loop: "{{ jetson_depthd_onnx_local.results }}"
  loop_control:
    label: "{{ item.item }}"
    index_var: idx
