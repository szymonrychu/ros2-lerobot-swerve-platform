---
# Source sync, build and install of depthd. Sources come from the controller's checkout (ros2_repo_root), never a git
# clone. No rsync --delete: a file removed upstream stays in /opt/depthd/src until that tree is replaced by hand.

- name: Create the depthd prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jetson_depthd_user }}"
    group: "{{ jetson_depthd_user }}"
    mode: "0755"
  loop:
    - "{{ jetson_depthd_prefix }}"
    - "{{ jetson_depthd_src_dir }}"
    - "{{ jetson_depthd_src_dir }}/jetson"
    - "{{ jetson_depthd_src_dir }}/shared"

- name: Sync the depthd source
  ansible.posix.synchronize:
    src: "{{ ros2_repo_root }}/jetson/depthd/"
    dest: /opt/depthd/src/jetson/depthd/
    archive: true
    checksum: true
    rsync_opts: [--exclude=build/, --exclude=.venv/, --exclude=__pycache__/, --exclude=*.pyc]
  become: false

- name: Sync the shared C++ library
  ansible.posix.synchronize:
    src: "{{ ros2_repo_root }}/shared/ros2_common_cpp/"
    dest: /opt/depthd/src/shared/ros2_common_cpp/
    archive: true
    checksum: true
    rsync_opts: [--exclude=build/, --exclude=.venv/, --exclude=__pycache__/, --exclude=*.pyc]
  become: false

- name: Hash the synced tree
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; cd {{ jetson_depthd_src_dir }} &&
      find jetson/depthd shared/ros2_common_cpp -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16
    executable: /bin/bash
  register: jetson_depthd_tree_hash
  changed_when: false
  check_mode: false
  # As the jetson user, the one who runs the tool: numpy dies with SIGILL under root's sudo environment.
  become: false

- name: Look for the build stamp
  ansible.builtin.stat:
    path: "{{ jetson_depthd_prefix }}/.built-{{ jetson_depthd_tree_hash.stdout }}"
  register: jetson_depthd_stamp

- name: Look for the installed binary
  ansible.builtin.stat:
    path: "{{ jetson_depthd_binary_path }}"
  register: jetson_depthd_binary_stat

- name: Build depthd
  ansible.builtin.shell:
    cmd: >-
      set -e;
      nice -n 10 cmake -S {{ jetson_depthd_src_dir }}/jetson/depthd -B {{ jetson_depthd_build_dir }}
      -DCMAKE_BUILD_TYPE=Release &&
      nice -n 10 cmake --build {{ jetson_depthd_build_dir }} --target depthd -j3
    executable: /bin/bash
  become: true
  become_user: "{{ jetson_depthd_user }}"
  when: not jetson_depthd_stamp.stat.exists or not jetson_depthd_binary_stat.stat.exists
  changed_when: true
  register: jetson_depthd_built

- name: Install the depthd binary
  ansible.builtin.copy:
    src: "{{ jetson_depthd_build_dir }}/depthd"
    dest: /usr/local/bin/depthd
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  register: jetson_depthd_binary

- name: Record the build stamp
  ansible.builtin.shell:
    cmd: >-
      find {{ jetson_depthd_prefix }} -maxdepth 1 -name '.built-*' -delete &&
      touch {{ jetson_depthd_prefix }}/.built-{{ jetson_depthd_tree_hash.stdout }}
    executable: /bin/bash
  when: jetson_depthd_built is changed
  changed_when: true

- name: Sync the calibration tool
  ansible.posix.synchronize:
    src: "{{ ros2_repo_root }}/jetson/calibrate/"
    dest: "{{ jetson_depthd_prefix }}/calibrate/"
    archive: true
    checksum: true
    rsync_opts: [--exclude=.venv/, --exclude=__pycache__/, --exclude=*.pyc, --exclude=.pytest_cache/, --exclude=.ruff_cache/]
  become: false

- name: Check the calibration tool imports on the system python3
  ansible.builtin.command: python3 -c "import stereo_calibrate.calibrate"
  args:
    chdir: "{{ jetson_depthd_prefix }}/calibrate"
  changed_when: false
  check_mode: false
  # As the jetson user, the one who runs the tool: numpy dies with SIGILL under root's sudo environment.
  become: false
