# Live arm + gripper-camera calibration, 2026-10-10 (grid sheet, 50 mm step, labels in base_link mm).
# Nothing here is applied: config (ansible/group_vars/client.yml) and the intrinsics yaml are unchanged.
# Recommended set = variant D (camera samples + near-floor grid lines + tip touches, floor fixed at -0.104,
# label->arm registration free). wrist_roll offset is NOT identifiable (a constant roll offset is absorbed exactly by
# the camera mount and the tool point, both on gripper_link), so it is kept at the deployed -0.071.

recommended:
  arm:
    joint_offsets_rad: {shoulder_pan: 0.0182, shoulder_lift: -0.0345, elbow_flex: -0.1070, wrist_flex: 0.0988, wrist_roll: -0.071}
    tool_offset_m: {x: 0.0010, y: -0.0056, z: -0.0014}   # physical fixed-jaw tip in gripper_frame_link
    # Fitted label->arm registration (22.3, -2.8) mm. If the sheet labels are right, the arm base origin is here
    # instead of the measured (0.0592, -0.05): verify with a tape (pan axis = base origin x + 0.0388).
    base_in_base_link_if_sheet_is_right: {x: 0.0369, y: -0.0472, z: 0.104, yaw: 0.0}
  cameras:
    gripper:
      mount: {parent_frame: gripper_link, x: -0.0046, y: 0.0364, z: -0.0364, roll: -1.5622, pitch: 1.1950, yaw: -1.4466}
      intrinsics:   # principal point fixed at the image centre, single radial term
        camera_matrix: [410.6, 0.0, 320.0, 0.0, 410.6, 240.0, 0.0, 0.0, 1.0]
        distortion_coefficients: [-0.1666, 0.0, 0.0, 0.0, 0.0]

deployed:
  joint_offsets_rad: {shoulder_pan: -0.0619, shoulder_lift: -0.0103, elbow_flex: -0.1381, wrist_flex: 0.2477, wrist_roll: -0.071}
  tool_offset_m: {x: 0.0104, y: -0.0282, z: -0.0017}
  gripper_mount: {x: 0.0002, y: 0.0305, z: -0.1073, roll: -1.6171, pitch: 1.1845, yaw: -1.4629}
  intrinsics: {f: 367.83, k1: -0.1523}

data:
