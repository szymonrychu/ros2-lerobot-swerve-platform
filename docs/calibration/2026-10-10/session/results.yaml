  deployed:  {hold_px: 96.2, hold_floor_mm: 44.9, t7_tip_xy_mm: [-28.8, 19.4], t7_tip_z_mm: -0.2, t7_lines_mm: 38.4, home_tip_above_floor_mm: 205.1}
