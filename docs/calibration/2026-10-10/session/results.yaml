  camera_points: 234         # refined grid intersections; held out: c03 c09 c15 c19 (59 points)
  near_floor_line_points: 228  # traced grid lines in the 5 touch images (t7 held out)
  touches_z: 6               # t1 t2 t5 t7 t8 t9 (t7 held out); t4 t6 hover only (next step unreachable)
  touches_xy: 4              # t1 t2 t7 t8 (tip located in the image); t7 held out

