  B_all_reg_fixed:           {hold_px: 10.7, hold_floor_mm: 6.7, t7_tip_xy_mm: [-5.5, 0.2], t7_tip_z_mm: 0.9, t7_lines_mm: 1.7, home_tip_above_floor_mm: 221.5}
  C_cam_only_reg_free:       {hold_px: 3.7, hold_floor_mm: 2.2, t7_tip_xy_mm: [-29.4, 10.0], t7_tip_z_mm: -1.1, t7_lines_mm: 2.6, home_tip_above_floor_mm: 222.0}
