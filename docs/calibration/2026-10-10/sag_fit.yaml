# Inputs of sag_fit.py (gravity sag gains of arm.sag_compensation). Paths are relative to this file.
# touches: the 2026-10-10 grid-sheet touch-downs (hover poses and the logged lift/up residuals).
touches: session/touches.json
# journals: saved mcp_server journals with arm_settle records, e.g.
#   ssh client.ros2.lan 'sudo journalctl -u ros2-mcp_server --since 2026-10-11 --no-pager' > settle_2026-10-11.log
journals: []
# Follower zero offsets (rad) of the poses in the journals: the deployed arm.joint_offsets_rad (client.yml).
joint_offsets_rad:
  shoulder_pan: 0.0182
  shoulder_lift: -0.0345
  elbow_flex: -0.1070
  wrist_flex: 0.0988
  wrist_roll: -0.0710
tool_offset_m: [0.0010, -0.0056, -0.0014]
max_rad: 0.12
results: sag_fit_results.json
