name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Run lint
        run: uv run --frozen poe lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Run root tests
        run: uv run --frozen pytest tests -q

  lint-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Install Ansible collections
        run: uv run --frozen ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible lint
        run: uv run --frozen poe test-ansible

  nodes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every nodes/**/pyproject.toml; tests/test_ci_workflow.py keeps this in sync.
        node:
          - bridges/arducam_tof
          - bridges/bno055_imu
          - bridges/feetech_servos
          - bridges/gps_rtk
          - bridges/uvc_camera
          - claude_agent
          - costmap_zones
          - filter_node
          - haptic_controller
          - laser_filter
          - leader_bridge
          - lerobot_teleop
          - master2master
          - map_guard
          - map_manager
          - marker_detector
          - mcp_server
          - poi_store
          - rf2o_odom_relay
          - static_tf_publisher
          - steamdeck_ui/bridge
          - swerve_drive_controller
          - test_joint_api
          - topic_scraper_api
          - web_ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Check lockfile
        working-directory: nodes/${{ matrix.node }}
        run: uv lock --check
      - name: Lint
        working-directory: nodes/${{ matrix.node }}
        run: uv run --frozen poe lint
      - name: Test
        working-directory: nodes/${{ matrix.node }}
        run: uv run --frozen pytest -q

  cpp:
    # amd64 runner; scripts/cpp-node-test.sh builds its image for the native platform (arm64 on the Mac, like the Pi).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every in-repo C++ package: shared/ros2_common_cpp plus nodes/*_cpp (ament_cmake, no pyproject.toml);
        # tests/test_ci_workflow.py and tests/test_node_lint_coverage.py keep this in sync.
        package:
          - ros2_common_cpp
          - map_guard_cpp
          - head_camera_cpp
          - head_rgbd_cpp
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and lint in ros:jazzy-ros-base
        run: ./scripts/cpp-node-test.sh ${{ matrix.package }}
