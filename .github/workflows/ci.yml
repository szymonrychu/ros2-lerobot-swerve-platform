name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Run lint
        run: uv run --frozen poe lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Run root tests
        run: uv run --frozen pytest tests -q

  lint-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Run ansible lint
        run: uv run --frozen poe test-ansible

  nodes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every nodes/**/pyproject.toml; tests/test_ci_workflow.py keeps this in sync.
        node:
          - bridges/bno055_imu
          - bridges/feetech_servos
          - bridges/gps_rtk
          - bridges/uvc_camera
          - claude_agent
          - filter_node
          - haptic_controller
          - lerobot_teleop
          - master2master
          - mcp_server
          - poi_store
          - rf2o_odom_relay
          - static_tf_publisher
          - steamdeck_ui/bridge
          - swerve_drive_controller
          - test_joint_api
          - topic_scraper_api
          - web_ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: 0.11.29
          python-version: "3.12"
      - name: Check lockfile
        working-directory: nodes/${{ matrix.node }}
        run: uv lock --check
      - name: Lint
        working-directory: nodes/${{ matrix.node }}
        run: uv run --frozen poe lint
      - name: Test
        working-directory: nodes/${{ matrix.node }}
        run: uv run --frozen pytest -q
