# Scene and pass/fail thresholds for scripts/ground_noise_report.py.
# ROIs are in base_link metres (x forward, y left). Static runbook, no driving.
scene:
  box:
    roi: {x_min: 0.60, x_max: 0.78, y_min: 0.05, y_max: 0.33}
    height_m: 0.05
  ramp:
    roi: {x_min: 0.75, x_max: 1.10, y_min: -0.45, y_max: -0.15}
    slope_deg: 14.0
  board:
    roi: {x_min: 0.37, x_max: 0.61, y_min: -0.12, y_max: 0.14}
thresholds:
  box_obstacle_share_min: 0.95
  ramp_lethal_states_max: 0  # ramp is invisible to the ToF (black rubber): only never-lethal is gated
  board_lethal_states_max: 0
  empty_lethal_points_p95_max: 0
  warning_churn_share_max: 0.10  # strict: share must be < this
