# Config for scripts/propose_unit_limits.py (validated by its pydantic Settings model).
# The script only prints proposals (MemoryLow, MemoryMax, CPUWeight, IOWeight in the robot-headroom model: no CPUQuota,
# no MemoryHigh); applying them to ansible/group_vars/client.yml is a manual, reviewed edit.
# The server's Mimir (Prometheus API under /prometheus) keeps 1 d of both hosts' metrics.
prometheus_url: http://server.ros2.lan:9009/prometheus
# `host` label of the series to propose for (client = robot, server); group_vars_path must be the same host's.
host: client
# Look-back window of the percentile / max queries (Prometheus duration: 30m, 48h, 7d).
window: 24h
# Percentile of the 1m CPU rate (reported; checked against a CPUQuota only where one is still set) (0 < p <= 1).
percentile: 0.99
# Percentile of the working set taken as the typical working set; MemoryLow = it rounded up to 8 MiB.
typical_percentile: 0.5
# MemoryMax safety net = peak working set x this factor, rounded up to 16 MiB (a larger current cap is kept).
memory_max_factor: 2.0
min_memory_low_mib: 32
min_memory_max_mib: 64
# Weights proposed for a unit whose node type sets none (the normal robot tier; critical 1000, agent-facing 300).
default_cpu_weight: 500
default_io_weight: 500
unit_regex: '^ros2-.*\.service$'
# Output format: table | yaml
format: table
# Where the current memory_low / memory_max / weights per node are read from (relative to the repo root).
group_vars_path: ansible/group_vars/client.yml
# HTTP timeout per Prometheus query in seconds.
timeout_s: 30
