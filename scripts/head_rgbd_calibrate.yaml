# Head RGB-D calibration tool config (scripts/head_rgbd_calibration). Loaded by load_calibration_config.
# Bag directory name under capture.local_dir used by every mode; empty = the newest calibration bag.
session: null
# The head camera config the report reads lens_position from (it is the focus the RGB intrinsics are valid at).
head_camera:
  config_file: ansible/group_vars/client.yml
  node: head_camera_cpp
  default_lens_position: 1.0 # head_camera_cpp default when the node config sets none
capture:
  host: client.ros2.lan
  ssh_user: szymonri # ansible_user of ansible/inventory
  remote_dir: /tmp/head_rgbd_capture
  local_dir: .logs/head_rgbd
  duration_s: 120
  ros_setup: /opt/ros/jazzy/setup.bash
  topics:
    - /tof/amplitude/image_raw
    - /tof/depth/image_raw
    - /tof/camera_info
    - /head_camera/mapping/image_raw/compressed # required: engages the focus lock
    - /head_camera/mapping/camera_info
    - /tf
    - /tf_static
  validation_topics:
    - /tof/amplitude/image_raw
    - /tof/depth/image_raw
    - /tof/camera_info
    - /head_camera/mapping/image_raw/compressed
    - /head_camera/mapping/camera_info
    - /tf
    - /tf_static
    - /head_rgbd/depth/image_raw
    - /head_rgbd/depth/camera_info
    - /head_rgbd/rgb/image_raw/compressed
    - /head_rgbd/rgb/camera_info
# Must equal the charuco block of scripts/markers_generate.yaml (the printed board).
board:
  squares_x: 6
  squares_y: 5
  square_mm: 40.0
  marker_mm: 30.0
  dictionary: DICT_5X5_100
selection:
  still_window_s: 0.5
  still_rgb_mad: 2.0 # mean abs difference between consecutive frames, 8-bit grey levels
  still_tof_mad: 0.01 # same, as a fraction of the amplitude range
  max_pair_dt_s: 0.05
  skip_start_s: 2.0 # focus lock settling
  amplitude_percentiles: [1, 99]
limits:
  rgb_max_rms_px: 0.5
  tof_max_rms_px: 0.3
  stereo_max_rms_px: 1.0
  tof_zero_distortion_rms_px: 0.3
  min_views: 12
outputs:
  rgb_calibration: nodes/head_camera_cpp/config/head_camera_calibration.yaml
  tof_calibration: nodes/head_rgbd_cpp/config/tof_calibration.yaml
  extrinsics: nodes/head_rgbd_cpp/config/head_rgbd_extrinsics.yaml
  urdf: nodes/web_ui/urdf/head.urdf
  report_dir: .logs/head_rgbd
validation:
  distances_m: [0.5, 1.0, 2.0, 3.0]
  roi_px: 20
  frames_per_distance: 50
