# Config for the marker generator (QR metadata markers). Sizes are the QR symbol edge in mm, quiet zone excluded.
output_dir: .logs/markers
defaults:
  ecc: q
  min_version: 2
  max_version: 3
  quiet_zone_modules: 4
  page:
    size: A4
    orientation: portrait
stl:
  base_thickness_mm: 4.0 # white base 4 mm; black modules inlaid flush (PETG opaque at 1.2 mm)
  relief_mm: 0.0
  inlay_mm: 1.2
  margin_mm: 3.0
  min_module_mm: 1.5
  warn_module_mm: 2.0
markers:
  - {kind_code: BASE, name: HOME, size_mm: 150}
  - {kind_code: CHARGER, name: DOCK-1, size_mm: 150}
  - {kind_code: DROPOFF, name: BIN-1, size_mm: 100}
  - {kind_code: BUTTON, name: LIGHT-1, size_mm: 60}
  - {kind_code: SWITCH, name: FAN-1, size_mm: 60}
  - {kind_code: TOOLSTATION, name: TS-1, size_mm: 100}
# ChArUco calibration boards (row count stays odd). FULL 6x5 at 40 mm makes a 250x210 mm plate for the head RGB-D
# calibration; ARM 6x5 at 28 mm makes a 178x150 mm plate for the gripper, with marker ids 15-29 so both boards can be
# told apart in one view. Ids of boards sharing a dictionary must not overlap. pattern_face: top prints face up,
# bottom face down on the bed. ARM prints back down (pattern up, inlays in the top layers) in one piece with an edge
# handle (user m540): a tab off the middle of the plate's bottom edge (board y max) and the grip post standing on it
# on the pattern side, seated in the SO-101 follower jaws (handle numbers from the repo gripper meshes,
# nodes/web_ui/urdf/so101_arm.urdf): the gripper holds the post from the pattern side, so the pattern faces the
# wrist; the jaws close along the plate edge (board x) and the plate lies beside them along gripper_link +y. It also
# writes <name>.json (mass, centre of mass, seat in gripper_link, contact and grip angles, handle envelope, stiffness).
arm_urdf_file: nodes/web_ui/urdf/so101_arm.urdf
boards:
  - name: charuco-6x5-40mm
    squares_x: 6
    squares_y: 5
    square_mm: 40.0
    marker_mm: 30.0
    dictionary: DICT_5X5_100
    ids_offset: 0
    margin_mm: 5.0
    thickness_mm: 4.0
    relief_mm: 0.0
    inlay_mm: 1.2
    bed_mm: 256.0
    page: {size: A4, orientation: landscape}
    outputs: [pdf, stl, 3mf]
    pattern_face: top
  - name: charuco-arm-6x5-28mm
    squares_x: 6
    squares_y: 5
    square_mm: 28.0
    marker_mm: 21.0
    dictionary: DICT_5X5_100
    ids_offset: 15
    margin_mm: 5.0
    thickness_mm: 4.0
    relief_mm: 0.0
    inlay_mm: 1.2
    bed_mm: 256.0
    page: {size: A4, orientation: landscape}
    outputs: [pdf, stl, 3mf]
    pattern_face: top
    handle:
      length_mm: 30.0 # grip length behind the shoulder face
      neck_mm: 6.0 # shoulder block from the tab top to the shoulder face (finger tip stop); jaws ~5.9 mm off the tab
      # Top plane: touches the moving jaw land ends (2 mm steps) 9.5 mm and 30 mm behind the tip at ~4 deg gripper
      thickness_tip_mm: 19.7
      thickness_end_mm: 23.4
      channel_tip_mm: 12.6 # finger channel, widths of the moving finger + 2 x clearance
      channel_end_mm: 16.6
      clearance_mm: 0.3 # channel side walls
      clamp_clearance_mm: 0.15 # print allowance off each clamp face (bed face, channel floor); thickness_* are nominal
      rail_width_mm: 4.0
      rail_height_mm: 5.0 # rails and shoulder rise this far above the top plane (over the rounded finger tip)
      squeeze_rad: 0.02 # grip angle = contact angle - squeeze
      # Tab (user m540): off the middle of the plate edge, the post axis post_offset_mm out (board centre ~0.12 m from
      # the tool axis, as main's measured stick mount), trapezoid from the root width at the plate edge to the far
      # width; 10 mm thick so its top stands 6 mm above the pattern face (pattern ~20 mm past the URDF tool point).
      tab_width_mm: 40.0 # at the far end (the post footprint is 24.7 x 24.6 mm)
      tab_root_width_mm: 100.0 # at the plate edge: spreads the cantilever moment into the 4 mm plate
      tab_thickness_mm: 10.0
      post_offset_mm: 43.0 # plate edge to the post axis
      # Gusset: one triangular web off the rail wall facing the plate (the side the jaws do not occupy), along the
      # tab, up the whole post, ending on the tab before the plate edge, centred on the post
      gusset_height_mm: 36.0 # up the post wall from the tab top (at most neck + length)
      gusset_reach_mm: 30.0 # out along the tab from the rail wall (at most gusset_height_mm and post_offset - 12.3)
      gusset_thickness_mm: 8.0 # web thickness along the jaw-closing direction (board x)
      density_g_per_cm3: 1.24 # filament density for the mass (plan D7)
      tool_offset_m: [0.001, -0.0056, -0.0014] # mcp_server arm.tool_offset_m (tool point in gripper_frame_link)
