# Config for scripts/jetson_e2e_check.py (validated by its pydantic Settings model). Defaults shown.
# ssh aliases of the two boards (BatchMode, no prompts).
client_host: client
jetson_host: jetson
# Direct cable link (ansible/group_vars/all.yml): Jetson API and the Pi's chrony reference.
jetson_ip: 10.77.0.2
jetson_http_port: 8090
chrony_reference: 10.77.0.1
# Bridge exporter on the client (loopback).
metrics_port: 19114
# Seconds between the two /metrics reads.
window_s: 30
# Thresholds.
max_offset_ms: 1.0
min_rgb_hz: 10
max_rgb_p95_ms: 150
min_depth_hz: 10
max_depth_p95_ms: 150
min_fused_hz: 2
# Bridge process CPU mean (cores) must stay at or below this: Pi CPU must not rise.
max_bridge_cpu_cores: 0.3
# Retired Pi units that must be absent on the client.
retired_units: [ros2-overview_camera, ros2-stereo_depth, ros2-stereo_depth_cpp]
