# Config for scripts/gen_nav_footprint.py (validated by its pydantic Settings model).
# The script derives the Nav2 costmap footprint (top-view H outline of the body + the parked arm), the inflation radius, the
# collision_monitor StopBox sub-polygons and the laser_filter self polygon, and writes them into the marked regions of
# nav2_params.yaml and footprint_filter.yaml. tests/test_nav_footprint.py fails when the files and the output differ.
#
# Body source: the mcp_server `body:` block in client_vars_path (the arm self-collision model) when it exists, else the
# `body:` below. Same schema: boxes (centre and size, base_link, m) and vertical cylinders (x, y, radius, z range).
# Every part counts for the 2D footprint whatever its height. Base_link: x forward, y left.
body:
  boxes:
    # Side frames (the H strokes) above the wheels.
    - {name: frame_left, center: [0.0, 0.1333, 0.15], size: [0.425, 0.035, 0.06]}
    - {name: frame_right, center: [0.0, -0.1333, 0.15], size: [0.425, 0.035, 0.06]}
    # Crossbar (the H bar) between the frames.
    - {name: crossbar, center: [-0.025, 0.0, 0.08], size: [0.25, 0.2316, 0.04]}
  cylinders:
    # Swerve modules: the steering 120 x 35 mm wheel sweeps the circle of its half-diagonal (62.5 mm) around the steer axis.
    - {name: wheel_fl, x: 0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
    - {name: wheel_fr, x: 0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
    - {name: wheel_rl, x: -0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
    - {name: wheel_rr, x: -0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
    # RPLidar dome (measured diameter 74 mm = radius 37 mm, centre (0.150, 0.040), top 210 mm; scan plane z 0.20).
    - {name: lidar, x: 0.150, y: 0.040, radius: 0.037, z_min: 0.10, z_max: 0.21}
# Relative to the repo root.
client_vars_path: ansible/group_vars/client.yml
nav2_params_path: nodes/nav2_bringup/config/nav2_params.yaml
laser_filter_path: nodes/laser_filter/config/footprint_filter.yaml
# Costmap cell size (m): the inflation radius is rounded up to a whole cell.
costmap_resolution: 0.025
# Vertices per wheel / lidar circle (multiple of 4). The polygon circumscribes the circle (edges tangent at the axes),
# so it never cuts into the real envelope; 16 overshoots by r * (1 / cos(11.25 deg) - 1) = 1.2 mm for r 6 cm.
circle_segments: 16
# Gaps between parts narrower than 2 x this are closed (a slit narrower than a costmap cell holds no obstacle and only
# adds outline vertices, i.e. footprint-check CPU). 0.01 closes the 13 mm slit between the lidar dome and the
# crossbar front (about 12 mm with the circumscribed 16-gon).
close_gap_m: 0.01
# laser_filter self polygon = footprint + this (removes the robot's own returns, keeps returns in the notches).
laser_filter_margin_m: 0.01
# collision_monitor StopBox: the footprint swept this far toward the commanded direction (outside the filter margin);
# also the mcp_server ArmStop margin around the released arm shadow and carried object.
stopbox_margin_m: 0.02
# Costmap footprint (Smac, MPPI, RotationShim, behaviour server) = the outline shrunk by this: millimetre approaches
# and slight bumps are legal, and a start whose outline touches one lethal 2.5 cm cell is not "in collision". The
# laser_filter self polygon, StopBox and CliffStop keep the unshrunk outline. 0.02 = one costmap cell.
footprint_tolerance_m: 0.02
# collision_monitor CliffStop polygon = footprint + this. The head ToF (0.35-0.40 m high) sees the lower floor of a 15 cm
# step about 0.2 m beyond the edge, so the guard reaches past it.
cliff_margin_m: 0.25
# mcp_server dynamic footprint (arm released with keep_position=true): the arm shadow and carried-object circle are
# simplified by this (m) before the union with the exact body outline (removes hull vertices, keeps the costmap
# footprint check cheap; well inside the laser_filter and stopbox margins).
dynamic_simplify_m: 0.005
# Steepest inflation falloff (1/m), the same on both costmaps. Steep so the penalty zone hugs the footprint: cost drops
# to 1/4 of the inscribed cost within 6 cm. The generated cost_scaling_factor is this, lowered to the bound that keeps
# the cost at the circumscribed radius >= 1 (k <= ln(252) / (circumscribed - inscribed), footprint_geometry), otherwise
# MPPI's CostCritic and the Smac collision checker log "inflation is not set sufficiently" and check the full footprint
# everywhere. mcp_server applies the same formula to the dynamic footprint (arm released out).
max_cost_scaling_factor: 25.0
# Arm parked at its stored home (/var/lib/ros2/arm/home.yaml on the client, measured space, rad): the folded arm's
# gripper overhangs the crossbar front by ~10 cm, so its ground shadow (mcp_server arm model, grown and simplified by
# dynamic_simplify_m) is part of the static footprint. Update after /arm/set_home stores a different home.
parked_arm_joints:
  shoulder_pan: -0.003
  shoulder_lift: -1.35
  elbow_flex: 1.578
  wrist_flex: -0.1
  wrist_roll: -1.637
  gripper: 0.1
# Decimal places of the written coordinates (4 = 0.1 mm).
decimals: 4
