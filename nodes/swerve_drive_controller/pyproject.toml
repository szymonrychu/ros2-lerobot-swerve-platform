[project]
name = "swerve_drive_controller"
version = "0.1.0"
description = "Swerve drive controller: cmd_vel to joint commands, FK/IK, odometry"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swerve_drive_controller"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80


[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check swerve_drive_controller tests
  ruff format --check swerve_drive_controller tests
  vulture swerve_drive_controller tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix swerve_drive_controller tests
  ruff format swerve_drive_controller tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
