[project]
name = "poi_store"
version = "0.1.0"
description = "Points/areas of interest store on the map frame (JSON file, ROS2 topics)"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poi_store"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check poi_store tests
  ruff format --check poi_store tests
  vulture poi_store tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix poi_store tests
  ruff format poi_store tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
