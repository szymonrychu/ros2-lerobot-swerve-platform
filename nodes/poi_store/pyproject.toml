[tool.poetry]
name = "poi_store"
version = "0.1.0"
description = "Points/areas of interest store on the map frame (JSON file, ROS2 topics)"
readme = "README.md"
packages = [{ include = "poi_store", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = ">=6.0"
pydantic = ">=2.5"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
autoflake = "^2.3.1"
vulture = "^2.11"
poethepoet = "^0.42.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  flake8 poi_store
  black --check poi_store tests
  isort --check poi_store tests
  autoflake --check --recursive --remove-all-unused-imports --expand-star-imports --remove-unused-variables poi_store tests
  vulture poi_store tests --min-confidence 80
""" }
lint-fix = { shell = """
  black poi_store tests
  isort poi_store tests
  autoflake --in-place --recursive --remove-all-unused-imports --expand-star-imports --remove-unused-variables poi_store tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
