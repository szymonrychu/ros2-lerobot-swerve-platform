[project]
name = "laser-filter"
version = "0.1.0"
description = "Lidar self filter: /scan -> /scan_filtered without the robot's own returns (polygon settable at runtime)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.4.3",
    "shapely==2.2.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture==2.16",
    "poethepoet==0.48.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laser_filter"]

[tool.uv.sources]
ros2-metrics = { path = "../../shared/ros2_metrics", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check laser_filter tests
  ruff format --check laser_filter tests
  vulture laser_filter tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix laser_filter tests
  ruff format laser_filter tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
