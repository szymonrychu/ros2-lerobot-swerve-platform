# laser_filters scan_to_scan_filter_chain: drop RPLidar returns that hit the robot itself.
# The lidar sees the robot body 0.22-0.24 m from the sensor; left in /scan those points become obstacles in the SLAM map
# and costmaps and the planner sees the robot boxed in by itself. Output: /scan_filtered.
# Polygon = the H footprint (scripts/gen_nav_footprint.py) grown by 1 cm, in base_link: returns inside the front and
# rear notches (between the wheels, ahead of / behind the crossbar) are real obstacles and are KEPT (the old box filter
# removed them). StaticLaserScanPolygonFilter: the lidar mount is a static TF, so the polygon is transformed into the
# laser frame once and each scan is a precomputed cos/sin lookup plus a ray-crossing point-in-polygon test (works for
# non-convex polygons). polygon_padding stays 0: laser_filters pads by moving each vertex along sign(x), sign(y),
# which shrinks a non-convex outline at the notch walls; the 1 cm margin is generated into the polygon instead.
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: footprint_polygon
      type: laser_filters/StaticLaserScanPolygonFilter
      params:
        polygon_frame: base_link
        # >>> gen_nav_footprint: laser_polygon
        polygon: "[[0.225, 0.1477], [0.214, 0.1744], [0.1936, 0.1948], [0.1669, 0.2058], [0.1381, 0.2058], [0.1114, 0.1948], [0.091, 0.1744], [0.0854, 0.1608], [-0.0854, 0.1608], [-0.091, 0.1744], [-0.1114, 0.1948], [-0.1381, 0.2058], [-0.1669, 0.2058], [-0.1936, 0.1948], [-0.214, 0.1744], [-0.225, 0.1477], [-0.225, 0.1189], [-0.214, 0.0922], [-0.1936, 0.0718], [-0.1669, 0.0608], [-0.16, 0.0608], [-0.16, -0.0608], [-0.1669, -0.0608], [-0.1936, -0.0718], [-0.214, -0.0922], [-0.225, -0.1189], [-0.225, -0.1477], [-0.214, -0.1744], [-0.1936, -0.1948], [-0.1669, -0.2058], [-0.1381, -0.2058], [-0.1114, -0.1948], [-0.091, -0.1744], [-0.0854, -0.1608], [0.0854, -0.1608], [0.091, -0.1744], [0.1114, -0.1948], [0.1381, -0.2058], [0.1669, -0.2058], [0.1936, -0.1948], [0.214, -0.1744], [0.225, -0.1477], [0.225, -0.1189], [0.214, -0.0922], [0.1936, -0.0718], [0.1669, -0.0608], [0.1381, -0.0608], [0.1114, -0.0718], [0.11, -0.0733], [0.11, 0.0136], [0.1101, 0.0134], [0.1233, 0.0001], [0.1406, -0.007], [0.1594, -0.007], [0.1767, 0.0001], [0.1899, 0.0133], [0.197, 0.0306], [0.197, 0.0494], [0.1899, 0.0667], [0.1873, 0.0692], [0.1936, 0.0718], [0.214, 0.0922], [0.225, 0.1189]]"
        polygon_padding: 0.0
        # <<< gen_nav_footprint: laser_polygon
        invert: false
        transform_timeout: 5.0
