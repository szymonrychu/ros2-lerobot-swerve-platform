# laser_filter (nodes/laser_filter, python -m laser_filter): drop RPLidar returns that hit the robot itself.
# The lidar sees the robot body 0.22-0.24 m from the sensor; left in /scan those points become obstacles in the SLAM map
# and costmaps and the planner sees the robot boxed in by itself. Output: scan_filtered_topic.
# Polygon = the static footprint (H body + parked arm, scripts/gen_nav_footprint.py) grown by 1 cm, in polygon_frame:
# returns inside the rear notch (between the rear wheels, behind the crossbar) are real obstacles and are KEPT; the
# front notch lies under the parked gripper. Every beam whose point lies inside the polygon is set to NaN.
# This is the startup polygon: mcp_server replaces it at runtime through the node's 'polygon' parameter (parameter
# service) with its footprint + 1 cm while the arm is released out of the static outline, re-sends it every
# republish tick and the moment this node's parameter service comes up after a restart, and restores it.
scan_topic: /scan
scan_filtered_topic: /scan_filtered
polygon_frame: base_link
# Longest wait for the static TF polygon_frame -> scan frame per scan before the scan is dropped (s).
transform_timeout_s: 0.1
