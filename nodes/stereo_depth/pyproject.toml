[tool.poetry]
name = "stereo_depth"
version = "0.1.0"
description = "stereo_image_proc disparity to 16UC1 depth in millimetres"
readme = "README.md"
packages = [{ include = "stereo_depth", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = ">=6.0"
pydantic = ">=2.0"
numpy = ">=1.26.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
autoflake = "^2.3.1"
vulture = "^2.11"
poethepoet = "^0.42.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  flake8 stereo_depth
  black --check stereo_depth tests
  isort --check stereo_depth tests
  autoflake --check --recursive --remove-all-unused-imports --expand-star-imports --remove-unused-variables stereo_depth tests
  vulture stereo_depth tests --min-confidence 80
""" }
lint-fix = { shell = """
  black stereo_depth tests
  isort stereo_depth tests
  autoflake --in-place --recursive --remove-all-unused-imports --expand-star-imports --remove-unused-variables stereo_depth tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
