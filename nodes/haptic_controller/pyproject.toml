[project]
name = "haptic-controller"
version = "0.1.0"
description = "Haptic controller: force-feedback resistance and zero-G hold mode for leader gripper (gripper-only pilot)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haptic_controller"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check haptic_controller tests
  ruff format --check haptic_controller tests
  vulture haptic_controller tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix haptic_controller tests
  ruff format haptic_controller tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

