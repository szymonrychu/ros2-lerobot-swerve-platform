[project]
name = "haptic-controller"
version = "0.1.0"
description = "Haptic controller: force-feedback resistance and zero-G hold mode for leader gripper (gripper-only pilot)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "haptic_controller"
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check haptic_controller tests
  ruff format --check haptic_controller tests
  vulture haptic_controller tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix haptic_controller tests
  ruff format haptic_controller tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

