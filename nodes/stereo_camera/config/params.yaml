# stereo_camera defaults (plain YAML read by launch/stereo_camera_config.py, not a ROS params file).
# Deployed overrides: /etc/ros2/stereo_camera/config.yaml (ros2_nodes `config: |`), merged over this file.
# The flat keys left_camera_id, right_camera_id and publish_points may be given at the top level of the override.

launch:
  # libcamera camera IDs, read on the Pi with `cam -l` (see README). Empty: select by index 0 / 1 and log a warning.
  left_camera_id: ""
  right_camera_id: ""
  # stereo_image_proc PointCloudNode on /stereo/points2. Needs the stereo mount TF, which does not exist yet.
  publish_points: false

# Both cameras (camera_ros CameraNode parameters; capitalised names are libcamera controls).
camera:
  sensor_mode: "1640:1232"   # IMX219 2x2 binned mode, full field of view
  width: 320
  height: 240
  role: video
  format: RGB888             # bgr8 on the topic: accepted by image_proc and stereo_image_proc
  FrameDurationLimits: [66666, 66666]   # us, exactly 15 fps (sync needs a fixed frame rate)
  AeExposureMode: short      # normal | short | long: short exposure limits rolling-shutter smear

left:
  sync_mode: server          # off | server | client: libcamera SyncMode, the left camera is the sync server
  frame_id: stereo_left_optical_frame

right:
  sync_mode: client
  frame_id: stereo_right_optical_frame

# stereo_image_proc DisparityNode (SGBM 3-way). Only launched when both calibration files are usable.
disparity:
  stereo_algorithm: 1
  sgbm_mode: 2
  correlation_window_size: 5
  disparity_range: 64
  min_disparity: 0
  P1: 200.0
  P2: 800.0
  uniqueness_ratio: 10.0
  speckle_size: 50
  speckle_range: 2
  disp12_max_diff: 1
  prefilter_cap: 31
  approximate_sync: true
  approximate_sync_tolerance_seconds: 0.002
