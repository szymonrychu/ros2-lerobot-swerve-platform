[project]
name = "uvc-camera"
version = "0.1.0"
description = "UVC camera bridge for ROS2"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=9.0.0,<10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check .
  ruff format --check .
  vulture . --min-confidence 80 --exclude .venv
""" }
lint-fix = { shell = """
  ruff check --fix .
  ruff format .
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
