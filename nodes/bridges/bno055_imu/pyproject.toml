[project]
name = "bno055_imu"
version = "0.1.0"
description = "BNO055 IMU bridge publishing sensor_msgs/Imu for Nav2 and navigation stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "adafruit-circuitpython-bno055>=1.0.0",
    "adafruit-blinka>=8.0.0,<9",
    "adafruit-extended-bus>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bno055_imu"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check bno055_imu tests
  ruff format --check bno055_imu tests
  vulture bno055_imu tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix bno055_imu tests
  ruff format bno055_imu tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
