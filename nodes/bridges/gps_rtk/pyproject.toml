[project]
name = "gps_rtk"
version = "0.1.0"
description = "GPS RTK bridge for LC29H-BS (base) and LC29H-DA (rover); publishes NavSatFix, streams RTCM3 over TCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pyserial>=3.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gps_rtk"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check gps_rtk tests
  ruff format --check gps_rtk tests
  vulture gps_rtk tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix gps_rtk tests
  ruff format gps_rtk tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
