[project]
name = "feetech-servos"
version = "0.1.0"
description = "Feetech servos bridge (joint_states / joint_commands) and calibration tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "st3215>=0.4.0",
    "numpy>=1.26.0",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=9.0.0,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
ros2-metrics = { path = "../../../shared/ros2_metrics", editable = true }

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["feetech_servos"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check .
  ruff format --check .
  vulture . --min-confidence 80 --exclude .venv
""" }
lint-fix = { shell = """
  ruff check --fix .
  ruff format .
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
