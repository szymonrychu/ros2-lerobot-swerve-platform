# Grasp docking server (/grasp/docking_server, started by launch/nav2_launch.py in the namespace "grasp").
# A second server because the stock one publishes /cmd_vel directly; this one is remapped to /cmd_vel_nav so its
# commands pass velocity_smoother and collision_monitor. The plugin is driven by external detections
# (/grasp/detected_dock_pose from mcp_server); mcp_server's `approach` block must match staging_x_offset,
# docking_threshold and external_detection_timeout (tests/test_nav_stack_config.py).
/grasp/docking_server:
  ros__parameters:
    controller_frequency: 20.0
    initial_perception_timeout: 3.0
    dock_approach_timeout: 30.0
    max_retries: 1
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["grasp_servoed"]
    grasp_servoed:
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      # The detection is already the dock pose: no translation or rotation between detected and dock frame.
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_yaw: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_roll: 0.0
      filter_coef: 0.3
      docking_threshold: 0.03
      staging_x_offset: -0.30
      staging_yaw_offset: 0.0
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.5                  # = swerve wz limit
      slowdown_radius: 0.15
      use_collision_detection: true
      # Absolute topics: the namespace must not move them, and the dynamic footprint carries over.
      costmap_topic: /local_costmap/costmap_raw
      footprint_topic: /local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 3.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.30      # >= 0.25 m projection + docking_threshold
      rotate_to_heading_angular_vel: 0.5  # = swerve wz limit
      rotate_to_heading_max_angular_accel: 0.5
