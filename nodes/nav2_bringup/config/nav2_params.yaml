# Nav2 params for the swerve platform (Jazzy, navigation2 1.3.x), passed by Ansible as
#   ros2 launch nav2_bringup bringup_launch.py use_localization:=False params_file:=<repo>/nodes/nav2_bringup/config/nav2_params.yaml
# Every server started by nav2_bringup navigation_launch.py has a section here (a missing section makes
# collision_monitor / docking_server fail to configure, which aborts the whole lifecycle bringup).
#
# Frames: map -> odom (slam_toolbox), odom -> base_link (robot_localization_ekf), base_link -> laser_frame (static TF).
# Holonomic swerve: in-wheel ST3215 ~4.71 rad/s x 60 mm wheel = 0.28 m/s, so translation is capped at 0.25 m/s.
# Footprint: the top-view H outline of the body (outer 425 x 387 mm with front and rear notches), centred on base_link,
# generated with the inflation radius, StopBox and laser_filter polygon by scripts/gen_nav_footprint.py.
# Resolution: 2.5 cm costmaps on the 2.5 cm SLAM map (4x the cells of 5 cm; CPU notes in the README).
# cmd_vel chain: controller/behaviors -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed -> collision_monitor -> cmd_vel.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    # Replan only when the path becomes invalid: the default BT replans at 1 Hz and every replan resets the goal
    # checker latch and the rotation shim's position check (1 cm / 2 deg goals then overshoot).
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # MPPI on the RPi 5: 10 Hz control with model_dt = controller period, 3 s horizon, 1000 samples.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      # PoseProgressChecker also counts rotation, so an in-place turn is progress; small radius for cm-scale goals.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.3
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01   # 1 cm / 2 deg; the latch holds because the BT no longer replans periodically
      yaw_goal_tolerance: 0.035
      stateful: true
    FollowPath:
      # RotationShimController wraps MPPI: at the start of a move it turns the robot in place to face the path
      # (front first: the lidar is partly covered at the back and on the right), then hands over to MPPI; at the
      # end it turns to the goal heading. MPPI parameters below are read from this same FollowPath namespace.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785       # rotate first when the path heading is > 45 deg off
      angular_disengage_threshold: 0.3    # hand over to MPPI once within ~17 deg
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5  # = swerve wz limit
      max_angular_accel: 0.5              # gentler turns so the final rotation does not overshoot 2 deg
      rotate_to_heading_once: true
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      # Jazzy MPPI has no vy_min: lateral limit is symmetric (+-vy_max).
      vx_max: 0.25
      vx_min: -0.25
      vy_max: 0.25
      wz_max: 0.5
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      ay_min: -1.0
      az_max: 2.0
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.3
      prune_distance: 1.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      # visualize: true makes MPPI publish the optimal trajectory as nav_msgs/Path on /optimal_trajectory
      # (frame odom), used by the web UI as the local plan. Publishers only serialize when someone subscribes.
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: false   # the rotation shim turns to the goal heading; this critic fought it near the goal
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # 0 = forward preference: drive front-first (lidar view is best ahead; back and right are partly covered).
        mode: 0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      # A deploy restarts nav2 before the gradual ramp brings up the servos and EKF (odom TF): wait for the whole
      # ramp instead of the default 60 s, which aborted the bringup.
      initial_transform_timeout: 300.0
      rolling_window: true
      width: 3
      height: 3
      # 2.5 cm cells: 120 x 120 = 14400 cells (4x the 5 cm grid); inflation and raytracing cost scale with it.
      resolution: 0.025
      # Footprint: the robot's real top-view H outline (side frames, crossbar, swerve wheel envelopes r 6 cm, lidar
      # column) as one non-convex counter-clockwise polygon with a front and a rear notch, no padding. Generated by
      # scripts/gen_nav_footprint.py from the body model (see nodes/nav2_bringup/README.md, "Footprint"); do not edit.
      # Every consumer here checks the outline edges (FootprintCollisionChecker), so the notches stay drivable.
      # >>> gen_nav_footprint: footprint
      footprint: "[[0.2125, 0.1633], [0.2074, 0.1633], [0.1865, 0.1842], [0.1644, 0.1933], [0.1406, 0.1933], [0.1185, 0.1842], [0.0976, 0.1633], [-0.0976, 0.1633], [-0.1185, 0.1842], [-0.1406, 0.1933], [-0.1644, 0.1933], [-0.1865, 0.1842], [-0.2074, 0.1633], [-0.2125, 0.1633], [-0.2125, 0.1033], [-0.2074, 0.1033], [-0.1865, 0.0824], [-0.1644, 0.0733], [-0.15, 0.0733], [-0.15, -0.0733], [-0.1644, -0.0733], [-0.1865, -0.0824], [-0.2074, -0.1033], [-0.2125, -0.1033], [-0.2125, -0.1633], [-0.2074, -0.1633], [-0.1865, -0.1842], [-0.1644, -0.1933], [-0.1406, -0.1933], [-0.1185, -0.1842], [-0.0976, -0.1633], [0.0976, -0.1633], [0.1185, -0.1842], [0.1406, -0.1933], [0.1644, -0.1933], [0.1865, -0.1842], [0.2074, -0.1633], [0.2125, -0.1633], [0.2125, -0.1033], [0.2074, -0.1033], [0.1865, -0.0824], [0.1644, -0.0733], [0.1406, -0.0733], [0.1185, -0.0824], [0.1, -0.1009], [0.1, 0.0812], [0.1005, 0.0812], [0.1199, 0.0345], [0.1325, 0.0219], [0.149, 0.015], [0.167, 0.015], [0.1835, 0.0219], [0.1961, 0.0345], [0.203, 0.051], [0.203, 0.069], [0.1942, 0.0902], [0.2074, 0.1033], [0.2125, 0.1033]]"
      footprint_padding: 0.0
      # <<< gen_nav_footprint: footprint
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        # ObstacleLayer footprint clearing fills the footprint column by column (Costmap2D::convexFillCells), i.e. it
        # treats the H as convex and would erase real obstacles in the notches. The robot's own returns are already
        # removed by the laser_filter self polygon and raytracing clears stale cells, so it is off.
        footprint_clearing_enabled: false
        scan:
          topic: /scan_filtered   # footprint-filtered (nodes/laser_filter)
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Minimal penalty zone: inflate only to the footprint's circumscribed radius (0.268 m rounded up to a cell,
        # required so footprint-aware MPPI / Smac only check the full outline near obstacles) with a steep falloff
        # (25/m: cost 1/4 of the inscribed cost 6 cm beyond the 0.10 m inscribed radius, still >= 1 at the
        # circumscribed radius). Generated by scripts/gen_nav_footprint.py.
        # >>> gen_nav_footprint: inflation
        cost_scaling_factor: 25.0
        inflation_radius: 0.275
        # <<< gen_nav_footprint: inflation
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      # A deploy restarts nav2 before the gradual ramp brings up the servos and EKF (odom TF): wait for the whole
      # ramp instead of the default 60 s, which aborted the bringup.
      initial_transform_timeout: 300.0
      # Same 2.5 cm as the SLAM map (static layer copies /map 1:1): 4x the cells of the 5 cm map, so the inflation
      # pass and costmap_raw messages grow 4x with the map area.
      resolution: 0.025
      track_unknown_space: true
      # Footprint: the robot's real top-view H outline (side frames, crossbar, swerve wheel envelopes r 6 cm, lidar
      # column) as one non-convex counter-clockwise polygon with a front and a rear notch, no padding. Generated by
      # scripts/gen_nav_footprint.py from the body model (see nodes/nav2_bringup/README.md, "Footprint"); do not edit.
      # Every consumer here checks the outline edges (FootprintCollisionChecker), so the notches stay drivable.
      # >>> gen_nav_footprint: footprint
      footprint: "[[0.2125, 0.1633], [0.2074, 0.1633], [0.1865, 0.1842], [0.1644, 0.1933], [0.1406, 0.1933], [0.1185, 0.1842], [0.0976, 0.1633], [-0.0976, 0.1633], [-0.1185, 0.1842], [-0.1406, 0.1933], [-0.1644, 0.1933], [-0.1865, 0.1842], [-0.2074, 0.1633], [-0.2125, 0.1633], [-0.2125, 0.1033], [-0.2074, 0.1033], [-0.1865, 0.0824], [-0.1644, 0.0733], [-0.15, 0.0733], [-0.15, -0.0733], [-0.1644, -0.0733], [-0.1865, -0.0824], [-0.2074, -0.1033], [-0.2125, -0.1033], [-0.2125, -0.1633], [-0.2074, -0.1633], [-0.1865, -0.1842], [-0.1644, -0.1933], [-0.1406, -0.1933], [-0.1185, -0.1842], [-0.0976, -0.1633], [0.0976, -0.1633], [0.1185, -0.1842], [0.1406, -0.1933], [0.1644, -0.1933], [0.1865, -0.1842], [0.2074, -0.1633], [0.2125, -0.1633], [0.2125, -0.1033], [0.2074, -0.1033], [0.1865, -0.0824], [0.1644, -0.0733], [0.1406, -0.0733], [0.1185, -0.0824], [0.1, -0.1009], [0.1, 0.0812], [0.1005, 0.0812], [0.1199, 0.0345], [0.1325, 0.0219], [0.149, 0.015], [0.167, 0.015], [0.1835, 0.0219], [0.1961, 0.0345], [0.203, 0.051], [0.203, 0.069], [0.1942, 0.0902], [0.2074, 0.1033], [0.2125, 0.1033]]"
      footprint_padding: 0.0
      # <<< gen_nav_footprint: footprint
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox publishes /map reliable + transient_local and keeps updating it while mapping.
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        # ObstacleLayer footprint clearing fills the footprint column by column (Costmap2D::convexFillCells), i.e. it
        # treats the H as convex and would erase real obstacles in the notches. The robot's own returns are already
        # removed by the laser_filter self polygon and raytracing clears stale cells, so it is off.
        footprint_clearing_enabled: false
        scan:
          topic: /scan_filtered   # footprint-filtered (nodes/laser_filter)
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Minimal penalty zone: inflate only to the footprint's circumscribed radius (0.268 m rounded up to a cell,
        # required so footprint-aware MPPI / Smac only check the full outline near obstacles) with a steep falloff
        # (25/m: cost 1/4 of the inscribed cost 6 cm beyond the 0.10 m inscribed radius, still >= 1 at the
        # circumscribed radius). Generated by scripts/gen_nav_footprint.py.
        # >>> gen_nav_footprint: inflation
        cost_scaling_factor: 25.0
        inflation_radius: 0.275
        # <<< gen_nav_footprint: inflation
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # Footprint-aware global planner (NavFn planned a point and relied on inflation, which cannot represent the H):
    # Smac state lattice with omni primitives (forward arcs, sideways slides, in-place rotation by one heading bin)
    # generated at the 2.5 cm costmap resolution, turning radius 0.5 m, 16 headings (README "Lattice primitives").
    # Every expansion checks the full H outline where the centre cost reaches the circumscribed cost. The plugin
    # name stays GridBased (BT compute_path and web UI rely on it).
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: /opt/ros2-lerobot-swerve-platform/nodes/nav2_bringup/config/lattice/output.json
      allow_unknown: true
      tolerance: 0.5                     # as NavFn: accept the best pose within 0.5 m of an unreachable goal
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0             # s, bounded: replans only when the path becomes invalid
      smooth_path: true
      cache_obstacle_heuristic: true     # static map between replans: reuse the obstacle heuristic
      reverse_penalty: 2.0               # unused for omni (no reverse expansion)
      allow_reverse_expansion: false
      change_penalty: 0.05
      non_straight_penalty: 1.05
      # Lattice's analogue of SmacPlanner2D's cost_travel_multiplier: moderate, keeps paths off obstacles without
      # long detours (the inflation band is only a few cm wide).
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      rotation_penalty: 5.0              # in-place rotations allowed but not preferred
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      debug_visualizations: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# No route graph is provided (graph_filepath empty): route_server configures with an empty graph and logs
# "No graph file provided to load yet"; a graph can be set later with its set_route_graph service.
route_server:
  ros__parameters:
    route_frame: map
    global_frame: map
    base_frame: base_link
    graph_filepath: ""
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz]: same limits as MPPI (holonomic, so vy is non-zero).
    max_velocity: [0.25, 0.25, 0.5]
    min_velocity: [-0.25, -0.25, -0.5]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.0, -1.0, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # StopBox: stop when 4+ scan points enter the H footprint swept 2 cm toward the commanded direction, so an obstacle
    # stops the robot only when the part of the body facing it moves into it (obstacles deep in the front/rear notch
    # do not stop a move that keeps the notch walls away from them). A plain stop polygon zeroed every command once an
    # obstacle was inside, so a robot that got close to a wall froze and could not back away (cee02dc). As a
    # velocity_polygon the monitor checks one sub-polygon picked by the command direction (atan2(vy, vx), first match
    # wins); each is the footprint swept over its whole direction sector, with nothing added on the side it moves away
    # from. Commands within 10 deg of an axis count as pure axis motion. Near-zero linear speed (rotating in place sweeps
    # the corners and the notches) checks the bounding box + 2 cm. The sweep reaches beyond the laser_filter self
    # polygon (footprint + 1 cm), whose returns are removed from /scan_filtered. A 20 s stationary sample on the robot
    # (2026-10-03) had 0 returns within 5 cm of the footprint. Polygons are generated by scripts/gen_nav_footprint.py.
    # To disable at runtime: `ros2 param set /collision_monitor StopBox.enabled false`.
    # Every polygon needs 4+ points: Jazzy's Polygon::getPolygonFromString rejects <= 3 (its error says "three"),
    # and one rejected sub-polygon aborts the whole nav2 bringup (the generator enforces 4+).
    polygons: ["StopBox"]
    StopBox:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true
      holonomic: true
      # >>> gen_nav_footprint: stopbox
      velocity_polygons: ["rotate", "forward", "forward_left", "left", "back_left", "back", "back_right", "right", "forward_right"]
      rotate:
        points: "[[0.2325, 0.2133], [-0.2325, 0.2133], [-0.2325, -0.2133], [0.2325, -0.2133]]"
        linear_min: 0.0
        linear_max: 0.005
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -3.1416
