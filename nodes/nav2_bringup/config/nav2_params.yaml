# Nav2 params for the swerve platform (Jazzy, navigation2 1.3.x), passed by Ansible as
#   ros2 launch nav2_bringup bringup_launch.py use_localization:=False params_file:=<repo>/nodes/nav2_bringup/config/nav2_params.yaml
# Every server started by nav2_bringup navigation_launch.py has a section here (a missing section makes
# collision_monitor / docking_server fail to configure, which aborts the whole lifecycle bringup).
#
# Frames: map -> odom (slam_toolbox), odom -> base_link (robot_localization_ekf), base_link -> laser_frame (static TF).
# Holonomic swerve: in-wheel ST3215 ~4.71 rad/s x 60 mm wheel = 0.28 m/s, so translation is capped at 0.25 m/s.
# Footprint: the top-view H outline of the body (outer 425 x 387 mm with front and rear notches), centred on base_link,
# generated with the inflation radius, StopBox and laser_filter polygon by scripts/gen_nav_footprint.py.
# Resolution: 2.5 cm costmaps on the 2.5 cm SLAM map (4x the cells of 5 cm; CPU notes in the README).
# cmd_vel chain: controller/behaviors -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed -> collision_monitor -> cmd_vel.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    # Replan only when the path becomes invalid: the default BT replans at 1 Hz and every replan resets the goal
    # checker latch and the rotation shim's position check (1 cm / 2 deg goals then overshoot).
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # MPPI on the RPi 5: 10 Hz control with model_dt = controller period, 3 s horizon, 1000 samples.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Absolute topic published by the local costmap SpeedFilter (percent limit from the speed zones).
    speed_limit_topic: /speed_limit
    use_realtime_priority: false
    progress_checker:
      # PoseProgressChecker also counts rotation, so an in-place turn is progress; small radius for cm-scale goals.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.3
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01   # 1 cm / 2 deg; the latch holds because the BT no longer replans periodically
      yaw_goal_tolerance: 0.035
      stateful: true
    FollowPath:
      # RotationShimController wraps MPPI: at the start of a move it turns the robot in place to face the path
      # (front first: the lidar is partly covered at the back and on the right), then hands over to MPPI; at the
      # end it turns to the goal heading. MPPI parameters below are read from this same FollowPath namespace.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785       # rotate first when the path heading is > 45 deg off
      angular_disengage_threshold: 0.3    # hand over to MPPI once within ~17 deg
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5  # = swerve wz limit
      max_angular_accel: 0.5              # gentler turns so the final rotation does not overshoot 2 deg
      rotate_to_heading_once: true
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      # Jazzy MPPI has no vy_min: lateral limit is symmetric (+-vy_max).
      vx_max: 0.25
      vx_min: -0.25
      vy_max: 0.25
      wz_max: 0.5
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      ay_min: -1.0
      az_max: 2.0
      # Input-delay compensation (patched MPPI overlay; the apt MPPI ignores these keys). Derived from the swerve
      # steering rate, see tests/test_nav2_mppi_model_delay.py and nodes/nav2_bringup/README.md.
      # vy: a 90 deg re-steer at 4.71 rad/s takes 0.33 s (drive resumes at 0.26 s with the 0.35 rad steer error
      # threshold) = 3 steps of model_dt 0.1.
      model_delay_vy: 0.3
      # vx 0: the rotation shim and idle recentering leave the wheels straight.
      model_delay_vx: 0.0
      # wz 0: the 48.8 deg in-place re-steer (to the 0.35 rad threshold) rounds to 1 step (a no-op) and the shim does the in-place turns.
      model_delay_wz: 0.0
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.3
      prune_distance: 1.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      # visualize: true makes MPPI publish the optimal trajectory as nav_msgs/Path on /optimal_trajectory
      # (frame odom), used by the web UI as the local plan. Publishers only serialize when someone subscribes.
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: false   # the rotation shim turns to the goal heading; this critic fought it near the goal
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # 0 = forward preference: drive front-first (lidar view is best ahead; back and right are partly covered).
        mode: 0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      # A deploy restarts nav2 before the gradual ramp brings up the servos and EKF (odom TF): wait for the whole
      # ramp instead of the default 60 s, which aborted the bringup.
      initial_transform_timeout: 300.0
      rolling_window: true
      width: 3
      height: 3
      # 2.5 cm cells: 120 x 120 = 14400 cells (4x the 5 cm grid); inflation and raytracing cost scale with it.
      resolution: 0.025
      # Footprint: the robot's real top-view H outline (side frames, crossbar, swerve wheel envelopes r 6 cm, lidar
      # column) as one non-convex counter-clockwise polygon with a front and a rear notch, no padding. Generated by
      # scripts/gen_nav_footprint.py from the body model (see nodes/nav2_bringup/README.md, "Footprint"); do not edit.
      # Every consumer here checks the outline edges (FootprintCollisionChecker), so the notches stay drivable.
      # >>> gen_nav_footprint: footprint
      footprint: "[[0.3022, -0.0516], [0.254, -0.0275], [0.08, -0.0321], [0.08, 0.1216], [0.097, 0.1286], [0.1284, 0.0973], [0.1526, 0.0873], [0.1766, 0.0972], [0.1885, 0.1092], [0.195, 0.1249], [0.195, 0.1417], [0.1885, 0.1574], [0.1766, 0.1693], [0.1609, 0.1758], [0.1441, 0.1758], [0.1284, 0.1693], [0.1165, 0.1574], [0.1055, 0.1308], [-0.1055, 0.1308], [-0.1165, 0.1574], [-0.1284, 0.1693], [-0.1441, 0.1758], [-0.1609, 0.1758], [-0.1766, 0.1693], [-0.1885, 0.1574], [-0.195, 0.1417], [-0.195, 0.1249], [-0.1885, 0.1092], [-0.1766, 0.0973], [-0.1609, 0.0908], [-0.13, 0.0908], [-0.13, -0.0908], [-0.1609, -0.0908], [-0.1766, -0.0973], [-0.1885, -0.1092], [-0.195, -0.1249], [-0.195, -0.1417], [-0.1885, -0.1574], [-0.1766, -0.1693], [-0.1609, -0.1758], [-0.1441, -0.1758], [-0.1284, -0.1693], [-0.1165, -0.1574], [-0.1055, -0.1308], [0.1055, -0.1308], [0.1165, -0.1574], [0.1284, -0.1693], [0.1441, -0.1758], [0.1609, -0.1758], [0.1766, -0.1693], [0.1885, -0.1574], [0.195, -0.1417], [0.195, -0.1249], [0.1886, -0.1093], [0.1686, -0.0896], [0.1748, -0.0733], [0.2536, -0.0697], [0.3022, -0.0532]]"
      footprint_padding: 0.0
      # <<< gen_nav_footprint: footprint
      # The D435 voxel layer sits right after the lidar layer (both raw obstacles, combined by max) and below the
      # keepout filter and inflation, so D435 obstacles are inflated like lidar ones. The plane-relative
      # ground_voxel_layer runs alongside the fixed-band depth_voxel_layer (design D8: both stay in force; the fixed bands are retired only
      # when the switch-over criteria in nodes/nav2_bringup/README.md, "Ground layer (plane-relative D435 marks)", pass; runtime switch:
      # `ros2 param set /local_costmap/local_costmap ground_voxel_layer.enabled false`). ground_cost_filter is a layer
      # right below inflation like keepout_filter, so the ground warning cost is inflated and seen by Smac / MPPI.
      plugins: ["obstacle_layer", "depth_voxel_layer", "ground_voxel_layer", "keepout_filter", "ground_cost_filter", "inflation_layer"]
      # Keepout zones (nodes/costmap_zones) are a plugin, not a `filters` entry: filters run after every layer
      # including inflation, so a filter would not be inflated. As a layer right below inflation the lethal zone cost
      # spreads like a real obstacle, which Smac's centre-cost shortcut relies on. The info topic is absolute
      # (costmap_zones publishes it latched); a relative name would resolve under the costmap node namespace.
      # The keepout mask also carries the non-lethal slow-zone cost (slow_zone_mask_value, default 60 -> cost 152):
      # slow zones are costed but passable, only mask value 100 is lethal.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/keepout
        transform_tolerance: 0.2
        # Mask cells stay lethal (254) normally. 252 (below lethal, so inflation does not grow it) is written only
        # while the robot is inside a zone, so the planner and controller can still plan a way out.
        override_lethal_cost: true
        lethal_override_cost: 252
      # Ground warning areas (design D13, D15; nodes/costmap_zones ground cost mask): clear-to-ride-through areas the
      # ground estimator found (edge step up to one third of the wheel diameter, slope up to max_slope_deg). Same
      # KeepoutFilter mechanism as keepout_filter, but with override_lethal_cost false: the mask carries only the
      # non-lethal ground_warning_mask_value (40 -> cost ~101, below INSCRIBED 253), so MPPI and the planner avoid the
      # area when a cheap way around exists and may still drive through it. The slow-down is not made here: the
      # unchanged speed_filter below applies the warning speed percent from the shared speed mask to /speed_limit,
      # which controller_server honours (slow-down, not a stop). Local costmap only (the global planner has no notion).
      ground_cost_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        # On since the D435 replaced the head ToF (design D6): the warning areas the ground estimator finds cost the local
        # costmap; runtime switch: `ros2 param set /local_costmap/local_costmap ground_cost_filter.enabled false`.
        enabled: true
        # Absolute topic (costmap_zones publishes it latched): a relative name would resolve under the costmap namespace.
        filter_info_topic: /costmap_filter_info/ground_cost
        # Same TF tolerance as keepout_filter.
        transform_tolerance: 0.2
        # Never lethal: a warning area must stay drivable, so no lethal override cost is needed either.
        override_lethal_cost: false
      # Speed zones: a real costmap filter (applied after all layers, publishes /speed_limit, absolute topic shared
      # with controller_server.speed_limit_topic). Local costmap only; the global planner has no speed notion.
      filters: ["speed_filter"]
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/speed
        speed_limit_topic: /speed_limit
        transform_tolerance: 0.2
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        # ObstacleLayer footprint clearing fills the footprint column by column (Costmap2D::convexFillCells), i.e. it
        # treats the H as convex and would erase real obstacles in the notches. The robot's own returns are already
        # removed by the laser_filter self polygon and raytracing clears stale cells, so it is off.
        footprint_clearing_enabled: false
        scan:
          topic: /scan_filtered   # footprint-filtered (nodes/laser_filter)
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # Head D435 3D obstacles and cliffs (nodes/nav2_bringup/README.md, "D435 obstacle layer"; design D6): the
      # self-filtered cloud /head/d435/points_filtered (d435_obstacle_cloud point_cloud_xyz -> laser_filter) in a
      # spatio-temporal voxel grid. Local costmap only (user decision Q3; the global costmap keeps static + lidar).
      # Heights are in the costmap global frame (odom), where the floor is z = 0. A separate grid from the lidar
      # obstacle_layer: depth clearing only decays depth voxels and lidar raytracing never clears them (U5). STVL is not
      # used for the lidar.
      depth_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # On since the D435 replaced the head ToF (design D6); runtime switch without a redeploy:
        # `ros2 param set /local_costmap/local_costmap depth_voxel_layer.enabled false`.
        enabled: true
        # Voxel decay: a voxel the D435 no longer sees clears 15 s after its last mark (decay_model 0 = linear), so
        # obstacles behind the robot or outside the head view still count for a short manoeuvre.
        voxel_decay: 15.0
        # 0 = linear decay over voxel_decay seconds.
        decay_model: 0
        # 5 cm voxels: the d435_obstacle_cloud voxel_size, no finer detail exists in the cloud.
        voxel_size: 0.05
        # Unknown space is not tracked: the lidar layer and the global costmap own unknown/free.
        track_unknown_space: false
        # 0: one point in a voxel marks it (the cloud is already voxel- and noise-filtered upstream).
        mark_threshold: 0
        # STVL clears the footprint with setConvexPolygonCost, convex like the ObstacleLayer footprint clearing, and
        # would erase obstacles in the H notches; laser_filter already removes the robot's own points from the cloud.
        update_footprint_enabled: false
        # 1 = max with the layers below: depth cells never lower a lidar or keepout cost.
        combination_method: 1
        # The 3D voxel grid is not published (CPU and DDS bandwidth on the Pi 5); the merged costmap shows the cells.
        publish_voxel_map: false
        # TF lookup tolerance at the cloud stamp, same as the costmap transform_tolerance (head TF from joint states).
        transform_tolerance: 0.3
        # Navigation mode: voxels decay; mapping_mode keeps them forever.
        mapping_mode: false
        observation_sources: depth_mark depth_cliff_mark depth_clear
        # Obstacles: points between just above the floor and the robot's height.
        depth_mark:
          data_type: PointCloud2
          topic: /head/d435/points_filtered
          marking: true
          clearing: false
          # 10 cm above the floor (z = 0 in odom), unchanged from the ToF band: the D435 depth RMS error is under 2 %
          # at 2 m (Intel datasheet), about 4 cm at the obstacle_range, so floor noise stays below 10 cm and the 15 s
          # decay does not union floor points into false obstacles. Still sees obstacles of 10 cm and taller that the
          # lidar plane passes over.
          min_obstacle_height: 0.10
          # Robot height with the head: overhangs higher than the robot are not obstacles.
          max_obstacle_height: 0.6
          # 2 m, inside the d435_obstacle_cloud max_depth (3 m): the D435 depth error grows with the square of the
          # distance, so 2 m keeps it under the 10 cm bands.
          obstacle_range: 2.0
          # Voxel filter: one point per voxel into the grid (bounded CPU per update).
          filter: voxel
          # 0: a voxel needs no minimum point count (the cloud is already decimated to at most 14400 points).
          voxel_min_points: 0
          # 0.0: use only the latest cloud per costmap update; persistence comes from voxel_decay.
          observation_persistence: 0.0
          # Drop the buffered cloud after it is applied so a stale cloud is never re-marked.
          clear_after_reading: true
          # 0.0: a D435 dropout does not mark the costmap "not current"; the collision monitor handles outages.
          expected_update_rate: 0.0
          # Point clouds carry no inf returns (point_cloud_xyz drops invalid pixels).
          inf_is_valid: false
        # Cliffs: below-floor points (the lower floor behind a step or a hole) mark the edge.
        depth_cliff_mark:
          data_type: PointCloud2
          topic: /head/d435/points_filtered
          marking: true
          clearing: false
          # Down to 1 m below the floor (z = 0 in odom): stairs and drop-offs the D435 sees beyond the edge.
          min_obstacle_height: -1.0
          # 10 cm below the floor: well outside the D435 floor noise (no false cliffs), a 15 cm step still marks.
          max_obstacle_height: -0.10
          # Same 2 m range as depth_mark, inside the cloud max_depth.
          obstacle_range: 2.0
          filter: voxel
          voxel_min_points: 0
          observation_persistence: 0.0
          clear_after_reading: true
          expected_update_rate: 0.0
          inf_is_valid: false
        # Frustum clearing: decays depth voxels inside the D435 view that the current cloud no longer marks.
        depth_clear:
          data_type: PointCloud2
          topic: /head/d435/points_filtered
          marking: false
          clearing: true
          # 0 = depth camera frustum model.
          model_type: 0
          # Frustum from the cloud min_depth (0.15 m, the D435 min-Z at 640x360) ...
          min_z: 0.15
          # ... to the cloud max_depth (3 m): no clearing beyond where the cloud has points.
          max_z: 3.0
          # 1.45 rad (83.1 deg), under the D435 87 deg horizontal depth FOV minus its 3 deg tolerance (84 deg, Intel
          # datasheet): clearing never reaches outside the real view.
          horizontal_fov_angle: 1.45
          # 0.98 rad (56.1 deg), under the D435 58 deg vertical depth FOV minus its 1 deg tolerance (57 deg).
          vertical_fov_angle: 0.98
          # 1.0: voxels inside the frustum decay faster, so a moved obstacle clears quickly while in view.
          decay_acceleration: 1.0
      # Plane-relative ground marks (design D8, D13; nodes/ground_estimator_cpp), alongside the fixed bands (those of
      # depth_voxel_layer above): the estimator fits the floor plane and already applied the plane-relative bands, so the
      # layer only marks what it publishes: obstacles above the plane and drop-offs below it. A separate STVL grid, so
      # disabling it at runtime (`ros2 param set /local_costmap/local_costmap ground_voxel_layer.enabled false`) leaves
      # the fixed bands untouched. Switch-over criteria: nodes/nav2_bringup/README.md. The collision monitor and
      # CliffStop keep the fixed depth bands (user decision D-A1); the global costmap has no ground layer.
      ground_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # On since the D435 replaced the head ToF (design D6): steps, drops and steep ramps the ground estimator finds on
        # the D435 cloud are planned around, next to the fixed bands (both mark, combined by max). On the ToF (2026-10-22)
        # the 15 s decay piled the estimator's flickering lethal points into false lethal cells and Nav2 found no path;
        # if that shows on the D435, switch it off without a redeploy:
        # `ros2 param set /local_costmap/local_costmap ground_voxel_layer.enabled false`.
        enabled: true
        # Same decay as depth_voxel_layer: a voxel the estimator no longer publishes clears 15 s after its last mark.
        voxel_decay: 15.0
        # 0 = linear decay over voxel_decay seconds.
        decay_model: 0
        # 5 cm voxels: the cloud voxel size of the D435 pipeline (d435_obstacle_cloud).
        voxel_size: 0.05
        # Unknown space is not tracked: the lidar layer and the global costmap own unknown/free.
        track_unknown_space: false
        # 0: one point marks a voxel (the estimator already filtered by plane distance and clusters).
        mark_threshold: 0
        # STVL footprint clearing is a convex fill and would erase obstacles in the H notches (as depth_voxel_layer).
        update_footprint_enabled: false
        # 1 = max with the layers below: ground cells never lower a lidar or keepout cost.
        combination_method: 1
        # The 3D voxel grid is not published (CPU and DDS bandwidth on the Pi 5).
        publish_voxel_map: false
        # TF lookup tolerance at the cloud stamp, same as depth_voxel_layer.
        transform_tolerance: 0.3
        # Navigation mode: voxels decay.
        mapping_mode: false
        observation_sources: ground_obstacle_mark ground_drop_mark ground_clear
        # Obstacle clusters (steps up, thresholds, ramps steeper than max_slope_deg) from the ground estimator.
        ground_obstacle_mark:
          data_type: PointCloud2
          topic: /ground/obstacle_points
          marking: true
          clearing: false
          # Pass-through limit: ground_estimator_cpp already applied the plane-relative bands, so no height is cut here.
          min_obstacle_height: -1.5
          # Pass-through limit, symmetric to the minimum (the estimator keeps points up to its own band top).
          max_obstacle_height: 1.5
          # 2 m, inside the d435_obstacle_cloud max_depth (3 m), as for depth_mark.
          obstacle_range: 2.0
          # Voxel filter: one point per voxel into the grid (bounded CPU per update).
          filter: voxel
          # 0: a voxel needs no minimum point count.
          voxel_min_points: 0
          # 0.0: use only the latest cloud per costmap update; persistence comes from voxel_decay.
          observation_persistence: 0.0
          # Drop the buffered cloud after it is applied so a stale cloud is never re-marked.
          clear_after_reading: true
          # 0.0: an estimator dropout (no valid plane) does not mark the costmap "not current".
          expected_update_rate: 0.0
          # Point clouds carry no inf returns.
          inf_is_valid: false
        # Drop-off clusters (floor beyond an edge lower than one third of the wheel diameter) from the estimator.
        ground_drop_mark:
          data_type: PointCloud2
          topic: /ground/drop_points
          marking: true
          clearing: false
          # Pass-through limit: the estimator already decided what is a drop (plane-relative), no height cut here.
          min_obstacle_height: -1.5
          # Pass-through limit, symmetric to the minimum.
          max_obstacle_height: 1.5
          # Same 2 m range as the obstacle source.
          obstacle_range: 2.0
          filter: voxel
          voxel_min_points: 0
          observation_persistence: 0.0
          # Drop the buffered cloud after it is applied, as for the obstacle source.
          clear_after_reading: true
          expected_update_rate: 0.0
          inf_is_valid: false
        # Frustum clearing on the filtered D435 cloud (the estimator input): decays ground voxels inside the D435 view
        # that the estimator no longer marks, same frustum as depth_clear.
        ground_clear:
          data_type: PointCloud2
          topic: /head/d435/points_filtered
          marking: false
          clearing: true
          # 0 = depth camera frustum model.
          model_type: 0
          # Frustum from the cloud min_depth (0.15 m, the D435 min-Z) ...
          min_z: 0.15
          # ... to the cloud max_depth (3 m).
          max_z: 3.0
          # 1.45 rad, under the D435 87 deg horizontal depth FOV minus its 3 deg tolerance: never outside the view.
          horizontal_fov_angle: 1.45
          # 0.98 rad, under the D435 58 deg vertical depth FOV minus its 1 deg tolerance.
          vertical_fov_angle: 0.98
          # 1.0: voxels inside the frustum decay faster, so a removed obstacle clears quickly while in view.
          decay_acceleration: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Minimal penalty zone: inflate only to the footprint's circumscribed radius (0.33 m with the parked gripper,
        # rounded up to a cell; required so footprint-aware MPPI / Smac only check the full outline near obstacles)
        # with the steepest falloff that keeps the cost >= 1 there (24/m: 1/4 of the inscribed cost 6 cm beyond the
        # 0.10 m inscribed radius). Generated by scripts/gen_nav_footprint.py; mcp_server sets both at runtime for
        # the footprint it publishes (dynamic parameters of the InflationLayer) and restores these with the static one.
        # >>> gen_nav_footprint: inflation
        cost_scaling_factor: 24.3
        inflation_radius: 0.325
        # <<< gen_nav_footprint: inflation
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      # A deploy restarts nav2 before the gradual ramp brings up the servos and EKF (odom TF): wait for the whole
      # ramp instead of the default 60 s, which aborted the bringup.
      initial_transform_timeout: 300.0
      # Same 2.5 cm as the SLAM map (static layer copies /map 1:1): 4x the cells of the 5 cm map, so the inflation
      # pass and costmap_raw messages grow 4x with the map area.
      resolution: 0.025
      track_unknown_space: true
      # Footprint: the robot's real top-view H outline (side frames, crossbar, swerve wheel envelopes r 6 cm, lidar
      # column) as one non-convex counter-clockwise polygon with a front and a rear notch, no padding. Generated by
      # scripts/gen_nav_footprint.py from the body model (see nodes/nav2_bringup/README.md, "Footprint"); do not edit.
      # Every consumer here checks the outline edges (FootprintCollisionChecker), so the notches stay drivable.
      # >>> gen_nav_footprint: footprint
      footprint: "[[0.3022, -0.0516], [0.254, -0.0275], [0.08, -0.0321], [0.08, 0.1216], [0.097, 0.1286], [0.1284, 0.0973], [0.1526, 0.0873], [0.1766, 0.0972], [0.1885, 0.1092], [0.195, 0.1249], [0.195, 0.1417], [0.1885, 0.1574], [0.1766, 0.1693], [0.1609, 0.1758], [0.1441, 0.1758], [0.1284, 0.1693], [0.1165, 0.1574], [0.1055, 0.1308], [-0.1055, 0.1308], [-0.1165, 0.1574], [-0.1284, 0.1693], [-0.1441, 0.1758], [-0.1609, 0.1758], [-0.1766, 0.1693], [-0.1885, 0.1574], [-0.195, 0.1417], [-0.195, 0.1249], [-0.1885, 0.1092], [-0.1766, 0.0973], [-0.1609, 0.0908], [-0.13, 0.0908], [-0.13, -0.0908], [-0.1609, -0.0908], [-0.1766, -0.0973], [-0.1885, -0.1092], [-0.195, -0.1249], [-0.195, -0.1417], [-0.1885, -0.1574], [-0.1766, -0.1693], [-0.1609, -0.1758], [-0.1441, -0.1758], [-0.1284, -0.1693], [-0.1165, -0.1574], [-0.1055, -0.1308], [0.1055, -0.1308], [0.1165, -0.1574], [0.1284, -0.1693], [0.1441, -0.1758], [0.1609, -0.1758], [0.1766, -0.1693], [0.1885, -0.1574], [0.195, -0.1417], [0.195, -0.1249], [0.1886, -0.1093], [0.1686, -0.0896], [0.1748, -0.0733], [0.2536, -0.0697], [0.3022, -0.0532]]"
      footprint_padding: 0.0
      # <<< gen_nav_footprint: footprint
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      # Keepout zones (nodes/costmap_zones) are a plugin, not a `filters` entry: filters run after every layer
      # including inflation, so a filter would not be inflated. As a layer right below inflation the lethal zone cost
      # spreads like a real obstacle, which Smac's centre-cost shortcut relies on. The info topic is absolute
      # (costmap_zones publishes it latched); a relative name would resolve under the costmap node namespace.
      # The keepout mask also carries the non-lethal slow-zone cost (slow_zone_mask_value, default 60 -> cost 152):
      # slow zones are costed but passable, only mask value 100 is lethal.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/keepout
        transform_tolerance: 0.2
        # Mask cells stay lethal (254) normally. 252 (below lethal, so inflation does not grow it) is written only
        # while the robot is inside a zone, so the planner and controller can still plan a way out.
        override_lethal_cost: true
        lethal_override_cost: 252
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox publishes /map reliable + transient_local and keeps updating it while mapping.
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        # ObstacleLayer footprint clearing fills the footprint column by column (Costmap2D::convexFillCells), i.e. it
        # treats the H as convex and would erase real obstacles in the notches. The robot's own returns are already
        # removed by the laser_filter self polygon and raytracing clears stale cells, so it is off.
        footprint_clearing_enabled: false
        scan:
          topic: /scan_filtered   # footprint-filtered (nodes/laser_filter)
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Minimal penalty zone: inflate only to the footprint's circumscribed radius (0.33 m with the parked gripper,
        # rounded up to a cell; required so footprint-aware MPPI / Smac only check the full outline near obstacles)
        # with the steepest falloff that keeps the cost >= 1 there (24/m: 1/4 of the inscribed cost 6 cm beyond the
        # 0.10 m inscribed radius). Generated by scripts/gen_nav_footprint.py; mcp_server sets both at runtime for
        # the footprint it publishes (dynamic parameters of the InflationLayer) and restores these with the static one.
        # >>> gen_nav_footprint: inflation
        cost_scaling_factor: 24.3
        inflation_radius: 0.325
        # <<< gen_nav_footprint: inflation
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # Footprint-aware global planner (NavFn planned a point and relied on inflation, which cannot represent the H):
    # Smac state lattice with omni primitives (forward arcs, sideways slides, in-place rotation by one heading bin)
    # generated at the 2.5 cm costmap resolution, turning radius 0.5 m, 16 headings (README "Lattice primitives").
    # Every expansion checks the full H outline where the centre cost reaches the circumscribed cost. The plugin
    # name stays GridBased (BT compute_path and web UI rely on it).
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: /opt/ros2-lerobot-swerve-platform/nodes/nav2_bringup/config/lattice/output.json
      allow_unknown: true
      tolerance: 0.5                     # as NavFn: accept the best pose within 0.5 m of an unreachable goal
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0             # s, bounded: replans only when the path becomes invalid
      smooth_path: true
      cache_obstacle_heuristic: true     # static map between replans: reuse the obstacle heuristic
      reverse_penalty: 2.0               # unused for omni (no reverse expansion)
      allow_reverse_expansion: false
      change_penalty: 0.05
      non_straight_penalty: 1.05
      # Lattice's analogue of SmacPlanner2D's cost_travel_multiplier: moderate, keeps paths off obstacles without
      # long detours (the inflation band is only a few cm wide).
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      rotation_penalty: 5.0              # in-place rotations allowed but not preferred
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      debug_visualizations: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# route_server is NOT started: launch/navigation_launch.py drops it from the lifecycle node list (nothing calls it).
# These parameters are kept only so adding it back to lifecycle_nodes needs no other change.
route_server:
  ros__parameters:
    route_frame: map
    global_frame: map
    base_frame: base_link
    graph_filepath: ""
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz]: same limits as MPPI (holonomic, so vy is non-zero).
    max_velocity: [0.25, 0.25, 0.5]
    min_velocity: [-0.25, -0.25, -0.5]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.0, -1.0, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # StopBox: stop when 4+ scan points enter the H footprint swept 2 cm toward the commanded direction, so an obstacle
    # stops the robot only when the part of the body facing it moves into it (obstacles deep in the front/rear notch
    # do not stop a move that keeps the notch walls away from them). A plain stop polygon zeroed every command once an
    # obstacle was inside, so a robot that got close to a wall froze and could not back away (cee02dc). As a
    # velocity_polygon the monitor checks one sub-polygon picked by the command direction (atan2(vy, vx), first match
    # wins); each is the footprint swept over its whole direction sector, with nothing added on the side it moves away
    # from. Commands within 10 deg of an axis count as pure axis motion. Near-zero linear speed (rotating in place sweeps
    # the corners and the notches) checks the bounding box + 2 cm. The sweep reaches beyond the laser_filter self
    # polygon (footprint + 1 cm), whose returns are removed from /scan_filtered. A 20 s stationary sample on the robot
    # (2026-10-03) had 0 returns within 5 cm of the footprint. Polygons are generated by scripts/gen_nav_footprint.py.
    # A zero twist matches `rotate` too, so a return inside the box holds the stop state while the robot stands still;
    # mcp_server move_relative backs and slides as one straight twist (a directional sub-polygon) and refuses an
    # in-place turn into a scan return before moving (nodes/mcp_server/README.md "StopBox on backing and turning").
    # To disable at runtime: `ros2 param set /collision_monitor StopBox.enabled false`.
    # Every polygon needs 4+ points: Jazzy's Polygon::getPolygonFromString rejects <= 3 (its error says "three"),
    # and one rejected sub-polygon aborts the whole nav2 bringup (the generator enforces 4+).
    # ArmStop: the released arm. The StopBox sub-polygons are static parameters (read once at configure), so while
    # the arm is released out of the static footprint (body + parked arm; maybe carrying an object, the costmap
    # footprint then includes it) mcp_server publishes the part of the arm shadow + carried object outside the static
    # footprint, grown by stopbox_margin_m (2 cm), on polygon_sub_topic (latched) and sets ArmStop.enabled true; it
    # sets it false while the footprint is static (take_control('arm'), a park, the arm back inside the outline).
    # action_type approach: the collision monitor simulates the commanded motion for time_before_collision and slows
    # down only toward an obstacle outside the polygon, so the robot can still back away from one near the arm; 4+
    # points already inside the polygon stop every motion (Polygon::getCollisionTime returns 0, nav2 1.3.13).
    # Sources per polygon (sources_names): StopBox reads the lidar and the D435 obstacle band; ArmStop reads only the
    # lidar (D435 edge noise around the released arm must not freeze it; D435 obstacles near the arm still reach the
    # local costmap, whose footprint includes the arm shadow); CliffStop reads only the below-floor D435 band.
    polygons: ["StopBox", "ArmStop", "CliffStop"]
    StopBox:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true
      holonomic: true
      # The lidar all around plus the D435 obstacle band inside the head view (design D6).
      sources_names: ["scan", "depth_obstacles"]
      # >>> gen_nav_footprint: stopbox
