    # depth_obstacles / depth_cliff: the head D435 cloud /head/d435/points_filtered (laser_filter output). Heights
    # compare in base_link after the TF lookup (nav2_collision_monitor pointcloud.cpp), so the negative cliff band
    # works; both bands equal the local costmap depth_voxel_layer mark bands (depth_mark, depth_cliff_mark): 10 cm over
    # the floor to the 0.6 m robot height, and 10 cm to 1 m below the floor. Both D435 sources keep the node
    # source_timeout (1.0 s, no per-source override): an enabled source with no cloud for 1 s, or no head TF at the
    # cloud stamp, is an "invalid source" and the monitor publishes a STOP (collision_monitor_node.cpp 1.3.13), so a
    # D435 or head-TF outage stops motion (fail-safe, user decision 2026-10-18). Runtime switch per source, `false`
    # takes it out of the monitor and `true` puts it back:
    # `ros2 param set /collision_monitor depth_cliff.enabled false` (same for depth_obstacles.enabled).
    # The ground clouds (/ground/obstacle_points, /ground/drop_points) do not feed the monitor (user decision D-A1): the
    # 15 Hz D435 bands with the fail-safe stale-source stop stay, and CliffStop keeps depth_cliff only. The estimator
    # output is a Nav2 costmap input alongside the fixed bands (nodes/nav2_bringup/README.md, ground layer).
