    # CliffStop: fed by the below-floor source depth_cliff, action_type approach: below-floor points outside the selected
    # sub-polygon slow motion toward them to zero as the polygon reaches them, motion away passes. 4+ points already
    # inside the selected sub-polygon stop the command whatever its direction (Polygon::getCollisionTime returns 0,
    # nav2 1.3.13), so the shape follows the command direction (holonomic velocity_polygon, generated by
    # scripts/gen_nav_footprint.py): rotate (below 0.005 m/s) and forward (any command with a forward or sideways
    # component) check the footprint grown by cliff_margin_m (0.25 m: a head camera at 0.35-0.40 m, where the D435 sits
    # at the old head unit's centre, sees the lower floor of a 15 cm step ~0.2 m beyond the edge); back (any command
    # with a backward component) checks the footprint only. The D435 looks forward, so cliff points sit ahead: at a seen
    # edge forward and sideways stop, backing away passes (Docker check 2026-10-18 on the same shapes). The monitor sees
