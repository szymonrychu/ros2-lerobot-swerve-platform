[project]
name = "web-ui"
version = "0.1.0"
description = "ROS2 web dashboard — FastAPI bridge + React frontend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.111.0,<0.136",
    "uvicorn[standard]>=0.30.0,<0.43",
    "structlog>=24.1.0,<26",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "websockets>=12.0,<17",
    "httpx>=0.27.0,<0.28",
    "ros2-common",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<0.24",
]

[tool.uv.sources]
ros2-common = { path = "../../shared", editable = true }
ros2-metrics = { path = "../../shared/ros2_metrics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_ui"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check web_ui tests
  ruff format --check web_ui tests
  vulture web_ui tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix web_ui tests
  ruff format web_ui tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
constraint-dependencies = [
    "annotated-types<0.8",
    "httptools<0.8",
    "uvloop<0.23",
]
