http_port: 8080
ws_broadcast_hz: 20

bridge:
  host: localhost
  port: 9090

tabs:
  # Merged 3D map tab: SLAM map, Nav2 plans + local costmap, robot and interactive arm model, GPS fix with
  # an auto-fitted anchor over map tiles proxied through /api/tiles. Every map_nav field below is optional
  # and shows its default.
  - id: map
    type: map_nav
    label: "Map"
    map_topic: /map
    global_plan_topic: /plan
    local_plan_topic: /optimal_trajectory
    footprint_topic: /local_costmap/published_footprint
    local_costmap_topic: /local_costmap/costmap
    goal_topic: /goal_pose
    map_frame: map
    base_frame: base_link
    map_save_path: /var/lib/ros2/maps/slam_map
    map_reset_service: /slam_toolbox/reset
    navigate_action: /navigate_to_pose
    # Robot model (files under the URDF directory), swerve joint states and the arm driven from the tab.
    base_urdf: robot.urdf
    base_joint_states_topic: /swerve_drive/joint_states
    arm_urdf: so101_arm.urdf
    arm_joint_states_topic: /follower/joint_states
    arm_command_topic: /filter/web_ui_joint_commands
    # std_srvs/Trigger services behind the "Home" and "Set home" buttons.
    arm_home_service: /arm/home
    arm_set_home_service: /arm/set_home
    # Points of interest from poi_store (latched list, commands and their results).
    poi_list_topic: /poi/list
    poi_command_topic: /poi/command
    poi_result_topic: /poi/result
    # Grasp requests to the mcp_server GraspService and its answers (std_msgs/String JSON).
    grasp_command_topic: /grasp/command
    grasp_result_topic: /grasp/result
    # GPS fix and the anchor fit gates (samples, map-frame track extent in m, RMS residual in m).
    gps_fix_topic: /client/gps/fix
    gps_anchor_min_points: 10
    gps_anchor_min_spread_m: 5.0
    gps_anchor_max_residual_m: 1.5
    # Tile server fetched by the backend proxy ({s} rotates over tile_subdomains) and its disk cache.
    tile_url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"
    tile_subdomains: abcd
    tile_cache_dir: /var/cache/web_ui/tiles
    tile_cache_max_mb: 256

  - id: camera
    type: camera
    label: "Gripper Cam"
    topic: /camera_0/image_raw/compressed

  - id: overview_camera
    type: camera
    label: "Overview"
    topic: /overview_camera/image_raw/compressed

  - id: imu_graphs
    type: imu_orientation
    label: "IMU"
    topics:
      - topic: /imu/data
        fields: []

overlays:
  - topic: /client/gps/fix
    field: "latitude"
    label: "Lat"
    format: ".6f"
  - topic: /client/gps/fix
    field: "longitude"
    label: "Lon"
    format: ".6f"
  - topic: /odom
    field: "twist.twist.linear.x"
    label: "Vel"
    format: ".2f"
    unit: "m/s"
  - topic: /swerve_drive/joint_states
    field: "position[name=fl_steer]"
    label: "FL Steer"
    format: ".2f"
    unit: "rad"
