http_port: 8080
ws_broadcast_hz: 20

bridge:
  host: localhost
  port: 9090

# Robot and base GPS chips: rover status over DDS, base status from GET /status of the base gps_rtk node's
# NTRIP caster (port 5016, next to the /rtk mountpoint). null for either disables that chip.
gps_status:
  rover_topic: /client/gps/status
  base_url: http://server.ros2.lan:5016/status
  base_poll_hz: 1.0
  stale_after_s: 5.0
  base_timeout_s: 2.0

# Applied head calibration (head_chain.json, tof_joint.json) laid over the served head URDF; null serves the file as is.
head_applied_calibration_dir: null

# Ground recorder (operator tool, idle until POST /api/ground/recordings): records the head D435 cloud, the D435 depth
# camera model, the /head_rgbd depth + RGB pairs, IMU, head and /ground/state with the TF at each message stamp into npz
# files for ground replay. Off by default; see README.
ground_recorder:
  enabled: false
  dir: /tmp/web_ui_ground_recordings
  max_duration_s: 30      # longest recording a request may ask for (1..60)
  max_files: 4            # oldest files beyond this are deleted after each recording (1..20)
  tf_timeout_s: 0.5       # a message whose TF does not arrive within this is dropped and counted (0..2)
  cloud_topic: /head/d435/points_filtered
  depth_info_topic: /head/d435/depth/camera_info
  pair_depth_topic: /head_rgbd/depth/image_raw
  pair_info_topic: /head_rgbd/depth/camera_info
  pair_rgb_topic: /head_rgbd/rgb/image_raw/compressed
  imu_topic: /imu/data
  head_js_topic: /head/joint_states
  state_topic: /ground/state
  base_frame: base_link
  odom_frame: odom

tabs:
  # Merged 3D map tab: SLAM map, Nav2 plans + local costmap, robot and interactive arm model, GPS fix with
  # an auto-fitted anchor over map tiles proxied through /api/tiles. Every map_nav field below is optional
  # and shows its default.
  - id: map
    type: map_nav
    label: "Map"
    map_topic: /map
    global_plan_topic: /plan
    local_plan_topic: /optimal_trajectory
    footprint_topic: /local_costmap/published_footprint
    local_costmap_topic: /local_costmap/costmap
    # "3D obstacles" layer, subscribed only while a browser shows it: the D435 obstacle cloud (PointCloud2, robot body
    # removed by laser_filter) and the lidar points (LaserScan, robot body removed), drawn together.
    obstacle_cloud_topic: /head/d435/points_filtered
    scan_points_topic: /scan_filtered
    # 3D map (RTAB-Map, on demand): cloud, status and results come down from the server, commands go up (topic
    # contract nodes/rtabmap_mapping/config/map3d_topics.yaml). map3d_frame_id is RTAB-Map's map frame, identical to
    # map (design D7); the cloud is capped to map3d_max_points by growing the voxel from map3d_voxel_m.
    map3d_cloud_topic: /map3d/cloud
    map3d_status_topic: /map3d/status
    map3d_result_topic: /map3d/result
    map3d_command_topic: /map3d/command
    map3d_frame_id: rtabmap_map
    map3d_max_points: 60000
    map3d_voxel_m: 0.05
    # "Head RGB-D" layer (on demand): head_rgbd_cpp XYZRGB cloud, placed in the map frame by the TF of its sensor frame.
    rgbd_cloud_topic: /head_rgbd/points
    # "Ground" layer (on demand): ground_estimator_cpp labelled cloud (XYZ rgb label, base_link) and JSON state;
    # the state is marked stale after ground_state_stale_s seconds without a message (backend receive age).
    ground_cloud_topic: /ground/labelled_points
    ground_state_topic: /ground/state
    ground_state_stale_s: 2.0
    lidar_wall_height_m: 1.0
    goal_topic: /goal_pose
    map_frame: map
    base_frame: base_link
    map_save_path: /var/lib/ros2/maps/slam_map
    map_reset_service: /slam_toolbox/reset
    navigate_action: /navigate_to_pose
    # Robot model (files under the URDF directory), swerve joint states and the arm driven from the tab.
    base_urdf: robot.urdf
    base_joint_states_topic: /swerve_drive/joint_states
    arm_urdf: so101_arm.urdf
    arm_joint_states_topic: /follower/joint_states
    # Pan/tilt head model (URDF under the URDF directory) driven by the head joint states.
    head_urdf: head.urdf
    head_joint_states_topic: /head/joint_states
    # std_srvs/Trigger services behind the "Home" and "Set home" buttons.
    arm_home_service: /arm/home
    arm_set_home_service: /arm/set_home
    # Points of interest from poi_store (latched list, commands and their results).
    poi_list_topic: /poi/list
    poi_command_topic: /poi/command
    poi_result_topic: /poi/result
    # Grasp requests to the mcp_server GraspService and its answers (std_msgs/String JSON).
    grasp_command_topic: /grasp/command
    grasp_result_topic: /grasp/result
    # GPS fix and the anchor fit gates (samples, map-frame track extent in m, RMS residual in m).
    gps_fix_topic: /client/gps/fix
    gps_anchor_min_points: 10
    gps_anchor_min_spread_m: 5.0
    gps_anchor_max_residual_m: 1.5
    # Tile server fetched by the backend proxy ({s} rotates over tile_subdomains) and its disk cache.
    tile_url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"
    tile_subdomains: abcd
    tile_cache_dir: /var/cache/web_ui/tiles
    tile_cache_max_mb: 256

  - id: arm
    type: arm
    label: "Arm"
    head_camera_topic: /head/d435/color/image_raw/compressed
    arm_urdf: so101_arm.urdf
    arm_joint_states_topic: /follower/joint_states
    # Where the draggable arm publishes (filter_node web_ui input).
    arm_command_topic: /filter/web_ui_joint_commands

  # Head tab: the RealSense D435 on the pan/tilt head (realsense_d435, live topics pinned in
  # nodes/bridges/realsense_d435/config/topics.yaml): colour plus a greyscale preview of its 16UC1 mm depth.
  - id: head
    type: head
    label: "Head"
    # D435 colour stream (JPEG transport).
    rgb_camera_topic: /head/d435/color/image_raw/compressed
    # D435 depth preview (on demand): 16UC1 mm, near is bright, depth_range_m or beyond is black, invalid 0 is black.
    depth_topic: /head/d435/depth/image_rect_raw
    # RGB-D view (on demand, only while selected): head_rgbd_cpp RGB with the D435 depth aligned to it, paired by header
    # stamp and shown as a colormap overlay with a hover depth readout (nodes/head_rgbd_cpp/README.md "Topics").
    rgbd_rgb_topic: /head_rgbd/rgb/image_raw/compressed
    rgbd_depth_topic: /head_rgbd/depth/image_raw
    depth_range_m: 4.0
    # Pan/tilt control: commands (sensor_msgs/JointState head_pan, head_tilt rad) are refused outside the ranges.
    # Same limits as the head servo group (client.yml) and nodes/web_ui/urdf/head.urdf; home is inside both.
    head_command_topic: /head/joint_commands
    head_joint_states_topic: /head/joint_states
    head_pan_range_deg: [-90, 90]
    head_tilt_range_deg: [-30, 45]
    head_home_deg: [0, 30]

  - id: poi
    type: poi
    label: "POI"
    poi_list_topic: /poi/list
    poi_photos_topic: /poi/photos

overlays:
  - topic: /client/gps/fix
    field: "latitude"
    label: "Lat"
    format: ".6f"
  - topic: /client/gps/fix
    field: "longitude"
    label: "Lon"
    format: ".6f"
  - topic: /odom
    field: "twist.twist.linear.x"
    label: "Vel"
    format: ".2f"
    unit: "m/s"
  - topic: /swerve_drive/joint_states
    field: "position[name=fl_steer]"
    label: "FL Steer"
    format: ".2f"
    unit: "rad"
