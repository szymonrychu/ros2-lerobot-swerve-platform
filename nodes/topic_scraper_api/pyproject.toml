[project]
name = "topic-scraper-api"
version = "0.1.0"
description = "ROS2 topic scraper with HTTP JSON endpoints for runtime debugging"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<1",
    "pytest-asyncio>=0.23.0,<2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "topic_scraper_api"
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check topic_scraper_api tests
  ruff format --check topic_scraper_api tests
  vulture topic_scraper_api tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix topic_scraper_api tests
  ruff format topic_scraper_api tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

