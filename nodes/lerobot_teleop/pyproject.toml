[project]
name = "lerobot-teleop"
version = "0.1.0"
description = "Lerobot leader-follower teleop node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check .
  ruff format --check .
  vulture . --min-confidence 80 --exclude .venv
""" }
lint-fix = { shell = """
  ruff check --fix .
  ruff format .
""" }
test = "pytest tests/ -v --tb=short"
