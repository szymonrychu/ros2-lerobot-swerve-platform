[project]
name = "static_tf_publisher"
version = "0.1.0"
description = "Publish static TF from base_link to sensor frames (configurable offsets)"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["static_tf_publisher"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check static_tf_publisher tests
  ruff format --check static_tf_publisher tests
  vulture static_tf_publisher tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix static_tf_publisher tests
  ruff format static_tf_publisher tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
