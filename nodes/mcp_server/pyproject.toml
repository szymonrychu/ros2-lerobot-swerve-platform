[project]
name = "mcp-server"
version = "0.1.0"
description = "Robot MCP server: Streamable HTTP tools for base navigation, cameras and safe arm streaming (IK)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp==2.3.0",
    "ikpy==4.1.0",
    "numpy==2.4.3",
    "scipy==1.18.1",
    "opencv-python-headless==4.13.0.92",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "ros2-common",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture==2.16",
    "poethepoet==0.48.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv.sources]
ros2-common = { path = "../../shared", editable = true }
ros2-metrics = { path = "../../shared/ros2_metrics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check mcp_server tests
  ruff format --check mcp_server tests
  vulture mcp_server tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix mcp_server tests
  ruff format mcp_server tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:ikpy.*"]
