[tool.poetry]
name = "mcp-server"
version = "0.1.0"
description = "Robot MCP server: Streamable HTTP tools for base navigation, cameras and safe arm streaming (IK)"
readme = "README.md"
packages = [{ include = "mcp_server", from = "." }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
mcp = "2.3.0"
ikpy = "4.1.0"
numpy = "2.4.3"
opencv-python-headless = "4.13.0.92"
pydantic = "2.13.5"
uvicorn = "0.54.0"
pyyaml = "6.0.3"

[tool.poetry.group.dev.dependencies]
ruff = "0.16.10"
vulture = "2.16"
poethepoet = "0.48.0"
pytest = "9.1.1"
httpx = "0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check mcp_server tests
  ruff format --check mcp_server tests
  vulture mcp_server tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix mcp_server tests
  ruff format mcp_server tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:ikpy.*"]
