[project]
name = "steamdeck-ui-bridge"
version = "0.1.0"
description = "ROS2-to-WebSocket bridge for SteamDeck UI"
requires-python = ">=3.11,<4"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "websockets>=12.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=9.0.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
exclude = ["tests"]

[tool.hatch.build.targets.wheel.sources]
"" = "bridge"

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check bridge_server.py config.py msg_serializer.py
  ruff format --check bridge_server.py config.py msg_serializer.py
  vulture bridge_server.py config.py msg_serializer.py --min-confidence 80 --ignore-names cls
""" }
lint-fix = { shell = """
  ruff check --fix bridge_server.py config.py msg_serializer.py
  ruff format bridge_server.py config.py msg_serializer.py
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
addopts = "-v -rxXs"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
