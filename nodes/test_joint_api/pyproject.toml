[project]
name = "test-joint-api"
version = "0.1.0"
description = "REST API for posting joint updates (same path as master2master: filter -> feetech)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest-asyncio>=0.23.0,<0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_joint_api"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check test_joint_api tests
  ruff format --check test_joint_api tests
  vulture test_joint_api tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix test_joint_api tests
  ruff format test_joint_api tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
constraint-dependencies = [
    "attrs<26",
    "propcache<0.5",
]
