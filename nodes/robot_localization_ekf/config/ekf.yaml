# EKF: fuse /odom (swerve wheel odometry) + /odom_rf2o_twist (lidar odometry) + /imu/data (BNO055) into /odometry/filtered (robot_localization default output).
# This node is the only odom -> base_link TF publisher (swerve_controller runs with publish_tf: false).
# Keep identical in content to the robot_localization_ekf `config: |` block in ansible/group_vars/client.yml.
# State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: body-frame velocities only (holonomic vx, vy and yaw rate); poses are integrated by the EKF.
    odom0: /odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    # Mahalanobis gate on the wheel twist (robot_localization compares the squared distance with threshold^2). The
    # gate covers the 3 fused dof (vx, vy, vyaw), so the squared distance of a healthy measurement is chi-square
    # with 3 dof: threshold 3.0 means d^2 > 9, which rejects only ~3% of normal measurements (1.5 gave d^2 > 2.25,
    # i.e. about half of them, and a wheel yaw rate disagreeing with the gyro also dropped wheel vx/vy). A full stall
    # (wheels say ~0.25 m/s, lidar says 0) stays far beyond 3 sigma because swerve_drive_controller floors the wheel
    # xy variance at only 0.002 (m/s)^2. Rejection is only on the wheels: the lidar odometry and the IMU are never
    # gated. Tune from recorded /odom vs /odom_rf2o_twist data.
    odom0_twist_rejection_threshold: 3.0

    # Lidar odometry (rf2o via rf2o_odom_relay): body-frame vx, vy only. rf2o itself publishes zero covariance, a
    # laser-frame x speed and vy = 0, so the relay re-derives the body twist from its pose and adds a real
    # covariance. Yaw rate is not fused: the IMU gyro stays the yaw-rate source (rf2o yaw rate is noisy and its
    # scan matching degrades when rotating in featureless surroundings).
    odom1: /odom_rf2o_twist
    odom1_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    odom1_queue_size: 5
    odom1_differential: false
    odom1_relative: false

    # BNO055 in IMUPLUS mode: heading is relative (arbitrary zero), so only the gyro yaw rate is fused.
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false

    use_control: false
    print_diagnostics: false
