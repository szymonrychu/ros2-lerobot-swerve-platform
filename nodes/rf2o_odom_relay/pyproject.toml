[project]
name = "rf2o_odom_relay"
version = "0.1.0"
description = "rf2o lidar odometry relay: body-frame twist with covariance for the EKF"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rf2o_odom_relay"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check rf2o_odom_relay tests
  ruff format --check rf2o_odom_relay tests
  vulture rf2o_odom_relay tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix rf2o_odom_relay tests
  ruff format rf2o_odom_relay tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
