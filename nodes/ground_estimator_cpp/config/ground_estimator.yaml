# Ground estimator defaults. Installed to /etc/ros2/ground_estimator_cpp/config.yaml (GROUND_ESTIMATOR_CONFIG).
# Unknown keys are rejected at every level; any error exits 78.

cloud_topic: /tof/points_filtered  # PointCloud2 of the head ToF, 10 Hz, used for the plane fit
imu_topic: /imu/data  # sensor_msgs/Imu, prior of the floor normal
rgbd_cloud_topic: /head_rgbd/points  # coloured PointCloud2, used for the floor colour model
output_namespace: /ground  # prefix of obstacle_points, drop_points, labelled_points, state, warning_areas
base_frame: base_link  # robot frame the plane is expressed in
fixed_frame: odom  # world-fixed frame for stamping and warning areas
tf_timeout_s: 0.1  # seconds to wait for a transform, 0..0.5

imu:  # imu settings
  timeout_s: 0.5  # seconds after which an IMU sample is too old to use, > 0
  level_reference_roll_deg: 0.7  # IMU roll reading on level ground, degrees, |v| <= 30
  level_reference_pitch_deg: 1.3  # IMU pitch reading on level ground, degrees, |v| <= 30

fit:  # fit settings
  distance_m: 0.02  # RANSAC inlier distance to the plane, metres, 0 < v <= 0.1
  max_normal_angle_deg: 10.0  # max angle between fitted and IMU normal, degrees, 0 < v <= 30
  max_offset_m: 0.08  # max plane offset from the nominal floor, metres, 0 < v <= 0.3
  min_inliers: 150  # fewest inlier points for a valid plane, >= 10
  min_inlier_ratio: 0.2  # fewest inliers as a fraction of candidates, 0 < v <= 1
  max_iterations: 100  # RANSAC iterations, >= 10
  candidate_band_m: 0.15  # half-width of the band around the IMU plane that feeds the fit, metres, > distance_m
  max_range_m: 2.5  # farthest point used for the fit, metres, > 0
  hold_s: 1.0  # seconds the last plane is kept when a fit fails, >= 0
  smoothing: 0.2  # weight of the new plane in the running estimate, 0 < v <= 1 (1 = no smoothing)

bands:  # bands settings
  obstacle_max_m: 0.6  # obstacle band top above the plane, metres, > traversability max step
  drop_max_m: 1.0  # drop band depth below the plane, metres, > traversability max step
  max_range_m: 2.0  # farthest point published in the bands, metres, > 0

traversability:  # traversability settings
  wheel_radius_m: 0.06  # wheel radius, metres, same as swerve_drive_controller wheel_radius_m
  max_step_fraction: 0.3333  # max rideable step as a fraction of the wheel diameter (0.04 m), 0 < v < 1
  max_slope_deg: 15.0  # steepest rideable surface, degrees, <= slope.roll_error_deg and slope.pitch_error_deg
  edge_band_m: 0.05  # width of the strip on each side of an edge that sets its step height, metres, > 0
  lethal_min_points: 2  # fewest unclustered lethal points within edges.cluster_tolerance_m of each other for any to be lethal, 1..50

warnings:  # warnings settings
  frame: map  # frame of the published warning areas

edges:  # edges settings
  cluster_tolerance_m: 0.1  # max gap inside one cluster, metres, > 0
  min_cluster_points: 10  # fewest points in a cluster, >= 3
  max_regions: 8  # most regions reported, 1..16
  step_max_height_m: 0.2  # tallest step still treated as a step, metres, > max step, <= bands.obstacle_max_m
  step_flatness_m: 0.03  # max height spread for a flat top, metres, > 0
  slope_bin_m: 0.10  # edge of the xy bins a cluster is sampled in for its slope fit, metres, 0.02 <= v <= 0.5
  slope_min_cells: 3  # fewest slope bins a cluster must cover for a slope estimate (below it the slope is unknown), 2..50
  step_segment_m: 0.1  # length of the boundary segment a step is measured along, metres, 0.02 <= v <= 0.5
  step_segment_min_points: 3  # fewest boundary points in a segment for it to count, 1..50

occlusion:  # occlusion shadow gate settings
  enabled: true  # do not read a cell hidden behind a nearer occluder as a drop or ramp
  azimuth_bin_deg: 2.0  # width of an azimuth bin of the occluder horizon, degrees, 0.1..10
  elevation_margin_deg: 1.0  # slack on the shadow ray elevation, degrees, 0..5
  min_occluder_height_m: 0.04  # lowest plane-relative height that occludes, metres, > 0 and < bands.obstacle_max_m
  min_height_drop_m: 0.015  # smallest height drop behind an occluder that counts as shadowed, metres, > 0

slope:  # slope settings
  roll_warn_deg: 8  # tilt_guard roll warning limit, degrees
  roll_error_deg: 15  # tilt_guard roll error limit, degrees, > roll_warn_deg
  pitch_warn_deg: 12  # tilt_guard pitch warning limit, degrees
  pitch_error_deg: 20  # tilt_guard pitch error limit, degrees, > pitch_warn_deg

colour:  # colour settings
  enabled: true  # use the floor colour model
  max_mahalanobis: 3.0  # distance from the floor colour above which a point is flagged, > 0
  forgetting: 0.1  # weight of new samples in the colour model, 0 < v <= 1
  min_floor_samples: 200  # floor samples needed before flagging, >= 10

state:  # state settings
  rate_hz: 2.0  # state topic rate, hertz, 0 < v <= 10

temporal:  # temporal settings
  enabled: true  # take a per-cell temporal median of the plane-relative heights before segmentation
  cell_size_m: 0.10  # edge of a fixed-frame cell, metres, 0.02 <= v <= 0.5
  window_frames: 8  # per-frame values a cell keeps, 1..30
  min_frames: 4  # per-frame values a cell needs before its points are output, 1..window_frames
  max_age_s: 1.5  # per-frame values older than this are dropped, seconds, 0 < v <= 5
  max_spread_m: 0.025  # largest robust spread of a cell's per-frame medians before the cell is unknown, metres, 0 < v <= 0.2

hysteresis:  # per-cell class hysteresis settings
  enabled: true  # keep a cell's class until a different class holds enough of the recent frames
  window_frames: 5  # recent frames a cell's class is judged over, 1..30
  enter_frames: 3  # frames of a class (within the window) needed to enter it, exit_frames..window_frames, a strict majority of the window
  exit_frames: 1  # frames of the new class needed to leave the current one, 1..enter_frames

metrics_port: 19119  # Prometheus port, 1..65535, or null to disable
