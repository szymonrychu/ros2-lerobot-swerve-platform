# ROS params of rtabmap_util point_cloud_xyz (rtabmap_ros 0.23.13). Node name: tof_obstacle_cloud (set by -r __node).
tof_obstacle_cloud:
  ros__parameters:
    # Keep every 4th pixel per axis: 240x180 ToF -> 60x45 = 2700 points, enough for obstacles on the Pi 5 CPU budget.
    decimation: 4
    # Below 0.2 m the ToF reads the robot's own head/body and amplitude saturation, not obstacles.
    min_depth: 0.2
    # Obstacles matter inside 3 m; kept below the far range_mode limit (4 m) where depth precision degrades.
    max_depth: 3.0
    # 5 cm voxel grid merges neighbouring points: bounded cloud size for the costmap layer.
    voxel_size: 0.05
    # Pixels with no valid depth (0 mm) become NaN; drop them so no placeholder point is published.
    filter_nans: true
    # Single depth + camera_info pair from one driver with identical stamps: exact sync is enough, no queue delay.
    approx_sync: false
    # Radius filter: a point with fewer than min_neighbors inside 0.1 m is flying-pixel noise and is removed.
    noise_filter_radius: 0.1
    # See noise_filter_radius: at least 2 neighbours keep real surfaces and drop isolated pixels.
    noise_filter_min_neighbors: 2
    # 0 = system default (RELIABLE). arducam_tof publishes depth and camera_info with a depth-5 RELIABLE QoS
    # (nodes/bridges/arducam_tof/arducam_tof/bridge.py PUBLISH_QOS_DEPTH); a best-effort subscriber (1) would also
    # connect, but reliable keeps depth/camera_info pairs intact for the exact sync.
    qos: 0
