# Benchmark of decode and pose cost (python -m marker_detector.bench [this file]).
# Scenes are synthetic: QR markers warped through a pinhole camera with the D435 colour intrinsics (640x360, 69 deg
# horizontal FOV) scaled by image width / 640. marker_detector processes the D435 colour stream at 640x360.
iterations: 200
warmup: 20
seed: 1
scenes:
  - name: d435_1
    image_size: [640, 360]
    markers:
      - {size_mm: 150, distance_m: 1.0}
  - name: d435_3
    image_size: [640, 360]
    markers:
      - {size_mm: 150, distance_m: 1.0}
      - {size_mm: 100, distance_m: 0.8}
      - {size_mm: 60, distance_m: 0.5}
  - name: d435_far_1
    image_size: [640, 360]
    markers:
      - {size_mm: 150, distance_m: 1.6}
  - name: d435_far_3
    image_size: [640, 360]
    markers:
      - {size_mm: 150, distance_m: 1.6}
      - {size_mm: 150, distance_m: 1.8}
      - {size_mm: 100, distance_m: 1.2}
