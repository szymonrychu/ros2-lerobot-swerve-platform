# pi_cameras defaults (plain YAML read by launch/pi_cameras_config.py, not a ROS params file).
# Deployed overrides: /etc/ros2/pi_cameras/config.yaml (ros2_nodes `config: |`), merged over this file.
# The flat key front_port may be given at the top level of the override.

launch:
  # Which CSI connector carries the front camera; the other one is the back camera. cam0 / cam1 are the labels on the
  # Pi 5 board. Swap with `front_port: cam1` if the cameras are mounted the other way round.
  front_port: cam0
  # libcamera camera ID per connector (`cam -l`). The Pi 5 devicetree wires cam0 to rp1 i2c@88000 (i2c-10) and cam1 to
  # i2c@80000 (i2c-11); the sensor sits at 0x1a on both.
  camera_ids:
    cam0: /base/axi/pcie@120000/rp1/i2c@88000/imx708@1a
    cam1: /base/axi/pcie@120000/rp1/i2c@80000/imx708@1a

# Both cameras (camera_ros CameraNode parameters; capitalised names are libcamera controls). A low-rate preview: the
# ISP downscales the binned 2304x1296 sensor mode, the Pi CPU only converts and JPEG-compresses 10 frames a second.
camera:
  sensor_mode: "2304:1296"   # binned full field of view (the 4608x2592 mode is 14 fps and far heavier)
  width: 640
  height: 480
  role: video
  format: RGB888             # bgr8 on the topic
  FrameDurationLimits: [100000, 100000]   # us, exactly 10 fps
  AfMode: 2                  # continuous autofocus (the Camera Module 3 has a focus motor)

compressed:
  jpeg_quality: 70           # image_transport compressed plugin quality of image_raw/compressed
