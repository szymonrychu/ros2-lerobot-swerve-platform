[project]
name = "master2master"
version = "0.1.0"
description = "ROS2 topic proxy between Client and Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
]

[tool.uv]
constraint-dependencies = [
    "annotated-types<0.8",
]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check master2master
  ruff format --check master2master
  vulture master2master --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix master2master
  ruff format master2master
""" }
