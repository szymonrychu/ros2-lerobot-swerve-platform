# Single definition (design D2, D3) of every stream crossing the client <-> server WiFi link.
# Read by the client map3d_uplink launch, the server rtabmap launch, map3d_manager and tests/test_map3d_topics.py.
# budget_bytes are design D3 estimates; the runbook replaces them with measured values.
# rate_hz null = pass every message; expected_rate_hz is then the budgeting rate.
uplink:
  # head_rgbd_cpp exact-stamp pairs at the 2 Hz mapping rate, relayed unthrottled so a pair is never split (D5).
  - source: /head_rgbd/rgb/image_raw/compressed   # mapping JPEG 576x324 q80, passed through
    dest: /uplink/head_rgbd/rgb/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    rate_hz: null
    expected_rate_hz: 2.0
    qos: {reliability: best_effort, durability: volatile, depth: 5}
    transport: raw
    lazy: true
    budget_bytes: 40000   # ~40 KB JPEG 576x324 q80 (D3 estimate)
    server_readers: [rtabmap_mapping]
  - source: /head_rgbd/rgb/camera_info
    dest: /uplink/head_rgbd/rgb/camera_info
    type: sensor_msgs/msg/CameraInfo
    rate_hz: null
    expected_rate_hz: 2.0
    qos: {reliability: best_effort, durability: volatile, depth: 5}
    transport: raw
    lazy: true
    budget_bytes: 400   # ~400 B CameraInfo (D3 estimate)
    server_readers: [rtabmap_mapping, map3d_manager]
    small: true
  - source: /head_rgbd/depth/image_raw   # registered depth 288x162 16UC1 mm, raw 93 312 B
    dest: /uplink/head_rgbd/depth/image_raw/compressedDepth
    type: sensor_msgs/msg/Image
    rate_hz: null
    expected_rate_hz: 2.0
    qos: {reliability: best_effort, durability: volatile, depth: 5}
    transport: compressedDepth
    lazy: true
    budget_bytes: 45000   # ~45 KB PNG compressedDepth (D3 estimate)
    server_readers: [rtabmap_mapping]
  - source: /head_rgbd/depth/camera_info
    dest: /uplink/head_rgbd/depth/camera_info
    type: sensor_msgs/msg/CameraInfo
    rate_hz: null
    expected_rate_hz: 2.0
    qos: {reliability: best_effort, durability: volatile, depth: 5}
    transport: raw
    lazy: true
    budget_bytes: 400   # ~400 B CameraInfo (D3 estimate)
    server_readers: [rtabmap_mapping, map3d_manager]
    small: true
  - source: /scan_filtered
    dest: /uplink/scan_filtered
    type: sensor_msgs/msg/LaserScan
    rate_hz: null
    expected_rate_hz: 7.0
    qos: {reliability: best_effort, durability: volatile, depth: 5}
    transport: raw
    lazy: true
    budget_bytes: 12000   # RPLidar A1 ~1450 ranges + intensities (D3 estimate)
    server_readers: [rtabmap_mapping]
  - source: /tf
    dest: /uplink/tf
    type: tf2_msgs/msg/TFMessage
    rate_hz: null
    expected_rate_hz: 100.0   # EKF 30 Hz + slam 20 Hz + head joints, ~100 msg/s
    qos: {reliability: best_effort, durability: volatile, depth: 100}
    transport: raw
    lazy: false
    budget_bytes: 200   # ~200 B per TFMessage (D3 estimate)
    server_readers: [rtabmap_mapping]
  - source: /tf_static
    dest: /uplink/tf_static
    type: tf2_msgs/msg/TFMessage
    rate_hz: null
    expected_rate_hz: 0.01   # rare, latched
    qos: {reliability: reliable, durability: transient_local, depth: 100}
    transport: raw
    lazy: false
    budget_bytes: 2000   # a few static transforms
    server_readers: [rtabmap_mapping]
    small: true
  - source: /map_guard/map_reset
    dest: /uplink/map_guard/map_reset
    type: std_msgs/msg/Empty
    rate_hz: null
    expected_rate_hz: 0.01   # rare
    qos: {reliability: reliable, durability: volatile, depth: 10}
    transport: raw
    lazy: false
    budget_bytes: 100
    server_readers: [map3d_manager]
    small: true
  - source: /map3d/command
    dest: /uplink/map3d/command
    type: std_msgs/msg/String
    rate_hz: null
    expected_rate_hz: 0.01   # rare, operator or agent driven
    qos: {reliability: reliable, durability: volatile, depth: 10}
    transport: raw
    lazy: false
    budget_bytes: 300
    server_readers: [map3d_manager]
    small: true

downlink:
  - source: /rtabmap/cloud_map
    dest: /map3d/cloud
    type: sensor_msgs/msg/PointCloud2
    rate_hz: 0.1
    qos: {reliability: reliable, durability: volatile, depth: 1}
    transport: raw
    lazy: true
    budget_bytes: 1500000   # ~1.5 MB furnished room at 5 cm voxels (D3 estimate)
  - source: /map3d/status_server
    dest: /map3d/status
    type: std_msgs/msg/String
    rate_hz: null
    expected_rate_hz: 1.0
    qos: {reliability: reliable, durability: transient_local, depth: 1}
    transport: raw
    lazy: false
    budget_bytes: 600
    small: true
  - source: /map3d/result_server
    dest: /map3d/result
    type: std_msgs/msg/String
    rate_hz: null
    expected_rate_hz: 0.01   # rare, one per command
    qos: {reliability: reliable, durability: volatile, depth: 10}
    transport: raw
    lazy: false
    budget_bytes: 1000
    small: true

frames:
  map_frame: map                  # slam_toolbox; RTAB-Map's odometry frame (D7)
  map3d_frame: rtabmap_map        # RTAB-Map's map frame and frame of /map3d/cloud, identical to map by D7
  base_frame: base_link
  rgb_frame: head_camera_optical_frame
  depth_frame: tof_optical_frame

budget:
  uplink_mbit_s_max: 8.0
  downlink_mbit_s_max: 2.0
