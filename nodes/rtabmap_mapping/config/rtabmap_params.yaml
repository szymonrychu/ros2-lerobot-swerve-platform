# RTAB-Map defaults for the server rtabmap_mapping container (design D6, D7, D8, D9).
# Loaded by launch/rtabmap_mapping.launch.py; /etc/ros2/rtabmap_mapping/config.yaml (env RTABMAP_MAPPING_CONFIG, the
# Ansible `config: |` block) is merged on top key by key when it exists and is non-empty, same rule as slam_toolbox.
# RTAB-Map core parameters (Kp/, RGBD/, Grid/, Mem/, Reg/, Rtabmap/) are strings because RTAB-Map declares them as
# strings; the ROS wrapper parameters are typed.
# Not set here, because the launch file derives or fixes them: topics, image transports, subscribe_* flags, sync mode
# and QoS (from config/map3d_topics.yaml), database_path (<database_dir>/live.db) and delete_db_on_start (false).
# The launch file rejects an override of publish_tf to true (U2: slam_toolbox is the only map -> odom owner).

database_dir: /var/lib/ros2/rtabmap   # live.db and saved.db (D9); Ansible creates it, the launch restores saved.db

rgbd_sync:
  ros__parameters: {}   # empty: exact sync, transports and QoS are all set by the launch from the topic contract

rtabmap:
  ros__parameters:
    # --- frames and alignment (D7) ---
    frame_id: base_link                # robot body frame the 3D nodes are attached to
    odom_frame_id: map                 # slam_toolbox's map frame is RTAB-Map's odometry: its graph is the chain of slam_toolbox poses
    map_frame_id: rtabmap_map          # RTAB-Map's own map frame; identical to map while it makes no links of its own
    publish_tf: false                  # never broadcast rtabmap_map -> map; slam_toolbox stays the only map -> odom owner (U2)
    wait_for_transform: 0.2            # s to wait for map -> base_link at the image stamp (slam_toolbox + EKF over the uplink)
    odom_tf_linear_variance: 0.001     # slam_toolbox poses are lidar-localised: trust them (no own links to weigh them against)
    odom_tf_angular_variance: 0.001    # same for yaw
    # --- no own links (D7): own loop/proximity links would bend rtabmap_map away from map ---
    Kp/MaxFeatures: "-1"               # no visual features: no loop closure detection, removes the main CPU cost (D8)
    RGBD/ProximityBySpace: "false"     # no proximity links between nearby nodes
    RGBD/OptimizeFromGraphEnd: "true"  # keep the latest node fixed so an optimisation can never move the newest pose
    RGBD/NeighborLinkRefining: "false" # no ICP refinement of the odometry links: they stay exactly slam_toolbox's poses
    Reg/Force3DoF: "true"              # ground robot: x, y, yaw only
    # --- node creation (D6) ---
    RGBD/LinearUpdate: "0.1"           # a new node every 10 cm of travel
    RGBD/AngularUpdate: "0.1"          # or every 0.1 rad (~6 deg) of base rotation
    Rtabmap/DetectionRate: "1"         # process at most 1 Hz (inputs arrive at the 2 Hz mapping rate)
    # --- occupancy grid: depth only (D6, D13) ---
    Grid/Sensor: "1"                   # depth only: measured 3D points are never mixed with scan points (U6/D13); "2" would merge the scan in
    Grid/3D: "true"                    # 3D local grids: the source of cloud_map
    Grid/RangeMax: "3.0"               # m: D435 depth RMS z^2 x 0.08 px / (318.9 px x 50 mm) is 4.5 cm at 3 m, under the 5 cm cell (8 cm at 4 m)
    Grid/CellSize: "0.05"              # m, 5 cm voxels (cloud_map voxel size, D10)
    Grid/DepthDecimation: "2"          # use every 2nd depth pixel: 160x90 points per node from the 320x180 depth aligned to the 640x360 colour
    Grid/MaxObstacleHeight: "2.0"      # m, ignore points above 2 m (ceiling); >= the 0.6 m robot height so table tops stay in the map (the client classes them overhang)
    Grid/RayTracing: "false"           # no free-space ray tracing: saves CPU on the Pi 4b (Q7 open: allow it only inside the 200 % server cap, measured live)
    # --- ground segmentation from the ground estimator limits (task T3, ground_estimator.yaml traversability) ---
    Grid/NormalsSegmentation: "true"   # ground by surface normal, so a ramp up to the max slope is ground, not an obstacle
    Grid/MaxGroundAngle: "15.0"        # deg, traversability.max_slope_deg: steeper surfaces are not ground
    Grid/MaxGroundHeight: "0.04"       # m, the 0.04 m step up: a flat top at most this high is ground, points above it are obstacles
    Grid/MinGroundHeight: "-0.04"      # m, the 0.04 m step down: a lower floor deeper than this (a drop) is neither ground nor obstacle, so it stays unknown
    # --- memory management for the Pi 4b (D8) ---
    Rtabmap/MemoryThr: "400"           # at most 400 nodes in working memory; older nodes move to the database
    Rtabmap/TimeThr: "0"               # no time-based transfer: memory is bounded by MemoryThr
    Mem/STMSize: "10"                  # short-term memory nodes
    Mem/ImagePostDecimation: "2"       # images stored at half size (320x180 from the 640x360 colour)
    Mem/BinDataKept: "true"            # keep images in the database so it can be re-processed (~30-50 KB per node)
    Mem/RawDescriptorsKept: "false"    # no raw descriptors (there are none with Kp/MaxFeatures -1)
    Rtabmap/ImageBufferSize: "1"       # process only the latest input, drop older ones instead of queueing
    # --- outputs (D10) ---
    cloud_output_voxelized: true       # cloud_map voxelized at Grid/CellSize: smaller downlink and browser load
    map_always_update: false           # update the maps only when the graph changed (a node was added)
    latch: false                       # volatile map topics: the lazy downlink throttle gets the next assembled cloud, no stale latched copy
