[project]
name = "head-rgbd-calibration"
version = "0.1.0"
description = "Robot-side head RGB-D calibration capture and compute service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.111.0,<0.136",
    "uvicorn[standard]>=0.30.0,<0.43",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0,<5",
    "ros2-common",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
    "httpx>=0.27.0,<0.28",
]

[tool.uv.sources]
ros2-common = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["head_rgbd_calibration"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check head_rgbd_calibration tests
  ruff format --check head_rgbd_calibration tests
  vulture head_rgbd_calibration tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix head_rgbd_calibration tests
  ruff format head_rgbd_calibration tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
