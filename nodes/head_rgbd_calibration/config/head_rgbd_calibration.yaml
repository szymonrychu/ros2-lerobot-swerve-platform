# head_rgbd_calibration node config (HEAD_RGBD_CALIBRATION_CONFIG points here). Every key shown at its default.
# Directory holding sessions, poses and results.
state_dir: /var/lib/ros2/head_rgbd_calibration
# Arm re-zero stale marker of the follower bridge; the arm to camera accept is refused while it lists joint_offsets for
# a re-zero at or after the session's first still (null: no check).
arm_stale_marker: /var/lib/ros2/arm/calibration_stale.json
# mcp_server's stored arm home (its arm.home_file, written by Set home), read at each Park with the board on as its
# target.
arm_home_file: /var/lib/ros2/arm/home.yaml
# HTTP API bind address (web_ui proxies to it).
http_host: 127.0.0.1
# HTTP API port.
http_port: 18110
# D435 topics the capture subscribes to (nodes/bridges/realsense_d435/config/topics.yaml).
topics:
  rgb: /head/d435/color/image_raw/compressed # D435 colour (compressed)
  depth: /head/d435/aligned_depth_to_color/image_raw # D435 depth registered to colour (16UC1 mm)
  rgb_info: /head/d435/color/camera_info # D435 factory colour intrinsics, stored with each still
  head_joint_states: /head/joint_states # measured head pan/tilt (head_arm still capture)
  arm_joint_states: /follower/joint_states # measured arm joints (head_arm still capture)
# Subscription queue depths (>= 1).
qos:
  depth: 10 # D435 aligned depth
  rgb: 5 # D435 colour
# Longest a single capture may run, seconds (> 0).
max_capture_s: 900.0
# Kill the compute child after this many seconds (> 0).
compute_timeout_s: 600.0
# Nice value of the compute child process (0..19).
compute_nice: 10
# Optical frame of the D435 colour stream (head.urdf); the head-from-arm fit solves the camera in it.
camera_frame: d435_color_optical_frame
# URDF the apply step updates with the head extrinsics.
head_urdf_file: /opt/ros2-lerobot-swerve-platform/nodes/web_ui/urdf/head.urdf
# Arm URDF the head-from-arm fit uses for forward kinematics.
arm_urdf_file: /opt/ros2-lerobot-swerve-platform/nodes/web_ui/urdf/so101_arm.urdf
# Units restarted after applying a calibration.
restart_units:
  - ros2-head_rgbd_cpp.service
  - ros2-head_state_publisher.service
# Seconds to wait for the restarted units to report active (> 0).
restart_check_s: 60.0
# Pose thumbnail width, pixels.
thumbnail_width_px: 320
# Coverage grid of the image area.
coverage:
  cols: 4 # 3..6
  rows: 3 # 2..4
# ChArUco board; must equal the charuco-6x5-40mm board of scripts/markers_generate.yaml (the printed board).
board:
  name: charuco-6x5-40mm
  squares_x: 6
  squares_y: 5
  square_mm: 40.0
  marker_mm: 30.0
  dictionary: DICT_5X5_100
  ids_offset: 0
  thickness_mm: 4.0 # plate thickness behind the printed face
# Still-frame selection of the D435 check: a colour + aligned depth pair is still when every consecutive pair over
# still_window_s differs by less than both MADs.
selection:
  still_window_s: 0.5
  still_rgb_mad: 2.0 # mean abs difference between consecutive colour frames, 8-bit grey levels
  still_depth_mad: 0.01 # D435 aligned depth, mean abs change as a fraction of the median depth
  skip_start_s: 2.0 # frames ignored after the capture starts (D435 auto exposure settling)
# Acceptance limits of the D435 intrinsics check.
limits:
  # |median aligned depth - PnP board plane depth| over the stills, mm: the D435 depth error is under
  # 2 % at 2 m, so 10 mm at the 0.3-0.6 m board distance only passes a sound depth-to-colour alignment.
  plane_max_bias_mm: 10.0
  plane_max_spread_mm: 50.0 # median per-still spread of that difference over the board pixels, mm
  min_views: 12
  intrinsics_max_rms_px: 0.5 # D435 colour intrinsics fitted from the stills, against the factory camera_info
  intrinsics_max_focal_diff_pct: 1.0
  intrinsics_max_principal_diff_px: 5.0
# Guided head floor sweep (Head floor fit) on the D435 cloud: the head only moves, then returns.
floor:
  joint_states_topic: /head/joint_states # measured head pan/tilt
  command_topic: /head/joint_commands # JointState (head_pan, head_tilt rad) commands, as the web UI head tab
  cloud_topic: /head/d435/points # D435 cloud (d435_obstacle_cloud)
  sensor_frame: d435_depth_optical_frame # frame of the cloud points the floor planes are fitted in
  command_frame_id: head_rgbd_calibration # header.frame_id of the commands
  pan_deg: [-30, -15, 0, 15, 30, 45] # pan grid, deg (-90..90); -60 sees the parked arm
  tilt_deg: [20, 24, 28] # tilt grid, deg, + is down (each -30..45); the D435 58 deg vertical FOV sees floor from 0.41-0.45 m out to 1.8 m at these tilts, 32+ sees floor under 0.4 m
  reach_tol_deg: 1.0 # a pose counts as reached within this of the target, deg (> 0)
  still_tol_deg: 0.2 # head still when the joint spread over still_window_s is under this, deg (> 0)
  still_window_s: 0.5 # window the stillness is judged over, s (> 0)
  move_timeout_s: 6.0 # a pose not reached and still within this is skipped, s (> 0)
  settle_s: 0.5 # wait after still before the clouds count, s (>= 0)
  clouds_per_pose: 10 # clouds fitted per pose (>= 1)
  min_clouds_per_pose: 5 # a pose with fewer fitted clouds is skipped as partly blocked (1..clouds_per_pose; null or absent: half of clouds_per_pose, rounded up)
  cloud_timeout_s: 3.0 # wait for each cloud, s (> 0)
  max_stamp_dt_s: 0.1 # joint state must be this close to a cloud stamp, s (> 0)
  fit: # floor plane fit and the chain fit limits (shared core)
    plane:
      ransac_distance_m: 0.03
      ransac_iterations: 200
      min_inliers: 150
      min_inlier_ratio: 0.5
      max_range_m: 1.8
      candidate_band_m: 0.25
      seed: 0
    limits:
      min_observations: 30
      min_poses: 8
      min_pan_span_deg: 60.0
      max_height_rms_mm: 8.0
      max_normal_rms_deg: 1.0
      max_sigma_z_mm: 3.0
      max_sigma_deg: 0.3
      max_delta_z_m: 0.1
      max_delta_deg: 10.0
    sigma_height_mm: 5.0
    sigma_normal_deg: 0.5
    huber_scale: 1.0
# Ground board calibration (camera to ground; user decisions 312, 313, 324, 326): the FULL board lies flat on the
# floor, close and fully visible at the homed head; the head sweeps around it (head only, through the floor sweep's
# command path and motion settings) at 1-3 placements, the fit solves the head chain, the user accepts or declines.
ground_board:
  pan_offsets_deg: [-24, -12, 0, 12, 24] # pan offsets around the aim at the located board, deg
  tilt_offsets_deg: [-12, -6, 0, 6, 12] # tilt offsets around the aim, deg, + is down
  min_tilt_deg: 0.0 # tilt clamp, deg (-30..45)
  max_tilt_deg: 45.0 # tilt clamp, deg (-30..45; the head_tilt limit)
  image_margin_px: 10.0 # skip a pose whose predicted board comes closer to the image edge, px (>= 0)
  frames_per_pose: 3 # colour frames kept per pose (>= 1)
  min_frames_per_pose: 2 # a pose with fewer kept frames is skipped (1..frames_per_pose)
  min_corners: 12 # corners a kept frame needs (6..20)
  home_min_corners: 16 # corners the board needs at home before a placement starts (6..20)
  detect_upscale: 2 # detection retried at this times the size when it finds too few corners (1..4)
  frame_timeout_s: 3.0 # wait for each frame, s (> 0)
  max_placements: 3 # board placements per session (>= 1)
  placement_wait_s: 1800.0 # the session ends itself after this long without the next placement, s (> 0)
  fit: # shared core ground_board_fit
    board: # the FULL board (as board)
      name: charuco-6x5-40mm
      squares_x: 6
      squares_y: 5
      square_mm: 40.0
      marker_mm: 30.0
      dictionary: DICT_5X5_100
      ids_offset: 0
      thickness_mm: 4.0 # the pattern face lies this far above the floor
    fit_camera_mount: true # fit the D435 mount x, z, roll, yaw
    fit_pan_axis: true # fit the pan axis x, y
    huber_f_scale_px: 1.0 # robust loss scale, px
    near_m: 1.0 # accuracy example: floor height this far ahead of the head, m
    far_m: 2.0 # accuracy example: floor height and obstacle position this far ahead, m
    home_pan_deg: 0.0 # head home (mcp_server head home_pan_rad 0)
    home_tilt_deg: 30.0 # head home (mcp_server head home_tilt_rad 0.5236)
    limits: # advisory: a result past any of them is shown with a warning, the user decides
      rms_px: 2.0 # fit corner RMS, px
      holdout_rms_px: 3.0 # held-out poses corner RMS, px
      max_sigma_mm: 2.0 # largest one-sigma length
      max_sigma_deg: 0.2 # largest one-sigma angle
      min_views: 30
      min_poses: 12
      min_placements: 2 # one placement leaves the pan axis and the camera mount weakly pinned
      min_pan_span_deg: 20.0
      min_tilt_span_deg: 10.0
      max_floor_height_rms_mm: 8.0 # depth floor plane cross-check under the fitted chain (pose means, as floor.fit)
      max_floor_normal_rms_deg: 1.0
      holdout_every: 5 # every 5th head pose (all its frames) is held out
    bounds: # plausibility (decision 324): a result past any of them is refused and cannot be accepted
      max_mount_move_mm: 100.0 # head mount z change, mm
      max_mount_turn_deg: 10.0 # head mount roll or pitch change, deg
      max_tilt_change_deg: 10.0 # tilt zero or tilt roll change, deg
      max_camera_move_mm: 30.0 # D435 mount x, z move, mm
      max_camera_turn_deg: 10.0 # D435 mount roll or yaw change, deg
      max_pan_axis_move_mm: 50.0 # pan axis shift, mm
      max_board_distance_m: 2.5 # a board placement farther from the head mount, m
  verify: # after an accept (decision 313): the head visits these poses and /ground/state must read the floor flat
    state_topic: /ground/state # ground_estimator_cpp state (std_msgs/String JSON, reliable transient_local)
    poses_deg: [[0.0, 30.0], [40.0, 20.0], [-40.0, 25.0]] # (pan, tilt) deg: home and the runbook's two other poses
    settle_s: 3.0 # wait after the head is still before samples count, s (>= 0)
    window_s: 15.0 # samples are collected over this window per pose, s (> 0)
    min_samples: 10 # samples with head_moving false a pose needs (>= 1)
    sample_timeout_s: 60.0 # give up a pose without min_samples after this, s (> 0)
    max_height_m: 0.01 # |median plane height| at most this, m (docs/runbooks/head-floor-fit.md)
    max_plane_vs_base_deg: 0.6 # median plane_vs_base_deg under this, deg
    max_obstacle_points: 10 # median obstacle point count under this
    max_drop_points: 0 # median drop point count at most this
# Still capture of head_arm views: a view is stored only when frames and joints hold still.
still:
  window_s: 0.6 # frames and joints are judged over the last this many seconds (> 0)
  rgb_mad: 2.0 # frames differ by at most this, 8-bit grey levels (> 0)
  joint_still_rad: 0.002 # each of the seven joints moves less than this over the window, rad (> 0)
  max_joint_dt_s: 0.1 # joint samples must be this close to the frame stamp, s (> 0)
  timeout_s: 6.0 # give up waiting for stillness after this, s (> 0)
# Head-from-arm fit (shared core); fit.board is the ARM board, board the FULL board (intrinsics).
fit:
  board: # the ARM board (the one with the handle), disjoint marker ids from board
    name: charuco-arm-6x5-28mm
    squares_x: 6
    squares_y: 5
    square_mm: 28.0
    marker_mm: 21.0
    dictionary: DICT_5X5_100
    ids_offset: 15
    thickness_mm: 4.0 # plate thickness behind the printed face, in the collision checks
  # ARM board mount in gripper_link: CAD seed from the handle (markers/charuco-arm-6x5-28mm.json), not fit-solved.
  board_mount:
    xyz_init: [-0.0794, 0.187949, -0.118113] # initial mount position, m
    rpy_init: [3.141593, 0.0, 0.0] # initial mount roll/pitch/yaw, rad
    outline_margin_m: 0.01 # margin around the board outline, m
    # Handle material beyond the plate, [min, max] boxes in the board frame (mm), checked as board points by the pose
    # check: the edge handle's post, gusset and tab on the pattern side (z < 0) past the plate's bottom edge
    # (markers/charuco-arm-6x5-28mm.json handle_envelope_mm).
    handle_boxes_mm:
      - [[71.5, 175.7, -42.0], [100.05, 200.3, -6.0]]
      - [[80.0, 145.7, -42.0], [88.0, 175.7, -6.0]]
      - [[34.0, 145.0, -6.0], [134.0, 200.3, 4.0]]
  # Fit the head pan axis position (head_pan origin x, y) relative to the head; the head_tilt origin moves back by
  # the same shift so the head stays put at pan 0. Session calib-20261023-074418: the fixed axis left 13 px at the
  # +-10 deg pan offsets (rms 12.2 px), the free axis sits 38 mm behind and 11 mm right of the URDF value (rms 2.7 px).
  fit_pan_axis: true
  # Fit the D435 mount (d435_joint x, z, roll, yaw) from its CAD start; its y (along the tilt axis) and pitch
  # (folded into the tilt zero) are not observable and keep the head URDF values.
  fit_camera_mount: true
  # The residual limits are evidence from calib-20261023-074418 refitted with the free
  # pan axis over five leave-poses-out folds (tests/test_head_arm_real_session.py): the arm is about 2 mm accurate
  # (gripper camera calibration), about 2.5 px at the board distance; fit rms 2.51-2.72 px, held-out 2.56-3.59 px
  # and 2.89-3.77 mm, sigma at most 0.72 mm and 0.153 deg, largest correlation 0.973-0.976 (mount y / mount yaw).
  # Wrong models of the same views stay above rms_px: fixed pan axis 11.2-12.2 px (held-out 9.4-14.9 px,
  # 9.4-10.5 mm), a pan scale factor instead of the axis 3.07-3.33 px.
  limits: # acceptance limits of the fit
    rms_px: 3.0 # fit-view corner RMS, px
    holdout_rms_px: 4.0 # held-out arm poses corner RMS, px
    holdout_board_mm: 4.5 # held-out board centre, arm FK against the view's solvePnP, RMS mm
    max_sigma_mm: 2.0
    max_sigma_deg: 0.2
    max_correlation: 0.99 # |correlation| of any two head parameters; degenerate sets reach 0.994 or more
    min_views: 40
    min_arm_poses: 16
    min_pan_span_deg: 30.0
    min_tilt_span_deg: 10.0
    holdout_every: 5
    max_floor_delta_mm: 10.0
    max_floor_delta_deg: 1.5
    max_start_delta_mm: 30.0
    max_start_delta_deg: 5.0
    max_pan_axis_delta_mm: 50.0 # pan axis shift against its start, mm (head 90 mm wide; the session gave 38 mm)
  huber_f_scale_px: 1.0 # robust loss scale, px
  base_in_base_link: # arm base in base_link, m and rad
    x: 0.0592
    y: -0.05
    z: 0.1
    yaw: 0.0
  joint_offsets_rad: # trusted arm joint offsets, rad
    shoulder_pan: 0.0182
    shoulder_lift: -0.0345
    elbow_flex: -0.107
    wrist_flex: 0.0988
    wrist_roll: -0.071
  # Weight of the floor-fit prior (>= 0). User decision 2026-10-23 (replaces D49's prior off): 10. Session
  # calib-20261023-074418 without it fails the floor cross-check (pan axis direction 2.1-2.8 deg off the floor fit);
  # with it every limit passes at rms 2.93 px (2.67 px without), held-out 2.88 px / 2.86 mm.
  floor_prior_weight: 10.0
  # Arm offsets fit (shared core arm_offsets_fit, design D9, Q2): the gripper-held plate in the D435 colour camera
  # plus floor planes give the arm joint offsets (shoulder_pan the gauge), the head chain and the tool point.
  plate: # the ARM board, as fit.board
    name: charuco-arm-6x5-28mm
    squares_x: 6
    squares_y: 5
    square_mm: 28.0
    marker_mm: 21.0
    dictionary: DICT_5X5_100
    ids_offset: 15
    thickness_mm: 4.0
  # Plate in gripper_link: CAD seed from the handle (markers/charuco-arm-6x5-28mm.json), not fit-solved. rpy is the CAD
  # rotation (wrist_roll fitted); tool_in_board_m the CAD board-to-jaw-tip offset (the tool point is fitted).
  plate_mount:
    xyz_init: [-0.0794, 0.187949, -0.118113]
    rpy_init: [3.141593, 0.0, 0.0]
    rpy: [3.141593, 0.0, 0.0]
    tool_in_board_m: [0.0705, 0.193767, -0.021386]
  wrist_roll_offset_rad: null # wrist_roll zero from the recorded servo neutral, rad; required when rpy is null
  tool_offset_m: [0.001, -0.0056, -0.0014] # current tool point in gripper_frame_link (mcp_server arm), m
  floor_fit: # floor views of the arm offsets fit: plane fit, limits and residual scales (as floor.fit)
    plane: {ransac_distance_m: 0.03, ransac_iterations: 200, min_inliers: 150, min_inlier_ratio: 0.5,
      max_range_m: 1.8, candidate_band_m: 0.25, seed: 0}
    limits: {min_observations: 30, min_poses: 8, min_pan_span_deg: 60.0, max_height_rms_mm: 8.0,
      max_normal_rms_deg: 1.0, max_sigma_z_mm: 3.0, max_sigma_deg: 0.3, max_delta_z_m: 0.1, max_delta_deg: 10.0}
    sigma_height_mm: 5.0
    sigma_normal_deg: 0.5
    huber_scale: 1.0
  # Held-out plate views decide (design D9): every holdout_every-th view held out over at least
  # min_holdout_head_settings head offsets; the tool point is fitted only below max_tool_holdout_mm (Q2).
  arm_limits:
    rms_px: 3.0 # fit plate views corner RMS, px
    holdout_rms_px: 4.0 # held-out plate views corner RMS, px
    max_tool_holdout_mm: 5.0 # held-out FK tool point against the view's solvePnP plate pose, RMS mm
    min_views: 40 # fit plate views
    holdout_every: 5
    min_holdout_head_settings: 3
  # Arm to camera fit (shared core arm_camera_fit, user decisions 315, 324-326, m577, m578): the applied head chain is
  # held fixed; the arm joint offsets, the arm base x, y (z with fit_base_z), the board seat in the gripper and a
  # gravity sag about the grip axis are fitted. Gauges: the base yaw (a yaw turn equals a shoulder_pan offset change plus
  # a base x, y shift) and the wrist_roll offset unless fit_wrist_roll (a board turn about its axis).
  arm_camera:
    fit_base_z: true # fit the arm base z
    fit_wrist_roll: false # free the wrist_roll offset (only the board seat prior pins it)
    fit_droop: false # fit a droop along gravity proportional to the gravity torque
    pixel_sigma_px: 1.0 # corner noise the priors are weighed against, px
    board_prior_mm: 3.0 # board seat prior against the CAD board_mount, one sigma, mm
    board_prior_deg: 2.0 # board seat prior, one sigma, deg
    sag_prior_deg: 1.0 # sag prior at the reference torque, one sigma, deg
    droop_prior_mm: 1.0 # droop prior at the reference torque, one sigma, mm
    # ARM board mass model (markers/charuco-arm-6x5-28mm.json): mass, centre of mass and grip point (handle tool point)
    # in the board frame, grip axis (jaw closing axis, board x).
    board_mass_kg: 0.211728
    board_com_m: [0.08395, 0.109253, -0.002385]
    grip_point_m: [0.0705, 0.193767, -0.021386]
    grip_axis: [1.0, 0.0, 0.0]
    reach_m: 0.3 # accuracy example: tool point at this horizontal reach, m
    camera_distance_m: 0.5 # accuracy example: gripper this far in front of the head camera, m
    # Plausibility bounds (decision 324): a result past any of them is refused and cannot be accepted.
    bounds:
      max_offset_change_deg: 15.0 # any arm joint offset change, deg
      max_base_move_mm: 100.0 # arm base translation, mm
      max_base_turn_deg: 10.0 # arm base yaw change, deg
      max_skew_mm: 10.0 # board seat shift against the CAD mount, mm
      max_skew_deg: 10.0 # board seat turn against the CAD mount, deg
      max_sag_deg: 5.0 # sag at the reference torque, deg
      max_droop_mm: 5.0 # droop at the reference torque, mm
# mcp_server the node moves the head and arm through (guarded tools only).
robot:
  mcp_url: http://127.0.0.1:18200/mcp # mcp_server Streamable HTTP URL
  token_file: /etc/ros2/mcp_server/token # bearer token file, read per call
  board_park_token_file: /etc/ros2/mcp_server/board_park_token # token of the park-with-board admin route
  call_timeout_s: 60.0 # timeout of a normal tool call, s (> 0)
  move_timeout_s: 120.0 # timeout of an arm move call, s (> 0)
# Scripted arm sequence of the head-from-arm capture (design D37, D38). Poses are measured (follower) joint
# angles, rad, the space move_arm_joints takes (urdf = measured + fit.joint_offsets_rad).
# tests/test_arm_pose_set.py proves every pose and transit safe by FK, the board in view and a passing synthetic
# fit; the sequencer re-checks every move from the measured joints (check_path) before it commands it.
arm_sequence:
  # Board about 0.34 m in front of the head camera, lifted to the camera height and forward of the body.
  base_pose: {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.0}
  insert_gripper_rad: 0.4 # sent once with the base pose; at most pose_check.max_roll_gripper_rad (half open)
  handle_contact_rad: 0.0951 # gripper angle at first contact on the ARM board handle, rad; measured on the robot 2026-11-09 (CAD 0.070279)
  handle_squeeze_rad: 0.02 # squeeze past contact, rad (> 0); grip = contact - squeeze
  grip_converge_tolerance_rad: 0.03 # mcp_server gripper converge tolerance, rad; jaw >= grip + it is slack
  board_mass_g: 211.72779 # ARM board mass from the CAD, g (> 0)
  # Tier 0: wrist_roll only (within max_roll_delta_rad of base_pose).
  tier0_poses:
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.3}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.6}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 1.2}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.75}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.15}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.3}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.6}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -1.2}
  # Tier 1: wrist_flex (within max_flex_delta_rad) and wrist_roll. The last pose keeps the board 0.24 m from the
  # D435 rolled only -0.3, so it fits the 360 px colour image height.
  tier1_poses:
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: -0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.1, wrist_roll: -0.5}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.1, wrist_roll: 0.0}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: 0.4}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: 0.7}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.9, wrist_roll: 1.0}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.9, wrist_roll: 0.4}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: -0.1}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.85, wrist_roll: -0.3}
  # Tier 2, after the confirm naming elbow_flex, shoulder_lift, shoulder_pan: those too (each within
  # max_big_delta_rad). The measured board sits 0.12 m off the tool axis, so the low poses (shoulder_lift >= 0.6)
  # keep wrist_roll <= 0 (board up), and the high left pose keeps the board 0.25 m from the camera.
  tier2_poses:
  - {shoulder_pan: -0.27, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.3}
  - {shoulder_pan: -0.42, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: 0.0}
  - {shoulder_pan: -0.47, shoulder_lift: 0.5, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: 0.4}
  - {shoulder_pan: -0.42, shoulder_lift: 0.6, elbow_flex: 0.15, wrist_flex: -0.85, wrist_roll: -0.2}
  - {shoulder_pan: -0.22, shoulder_lift: 0.65, elbow_flex: 0.0, wrist_flex: -0.8, wrist_roll: 0.0}
  - {shoulder_pan: -0.02, shoulder_lift: 0.6, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: -0.2}
  - {shoulder_pan: 0.13, shoulder_lift: 0.5, elbow_flex: 0.15, wrist_flex: -0.8, wrist_roll: -0.6}
  - {shoulder_pan: 0.13, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.4, wrist_roll: -0.2}
  - {shoulder_pan: 0.08, shoulder_lift: 0.1, elbow_flex: 0.0, wrist_flex: -0.2, wrist_roll: 0.3}
  - {shoulder_pan: -0.02, shoulder_lift: -0.05, elbow_flex: 0.2, wrist_flex: -0.3, wrist_roll: 0.7}
  - {shoulder_pan: -0.22, shoulder_lift: -0.05, elbow_flex: 0.0, wrist_flex: -0.15, wrist_roll: 0.2}
  - {shoulder_pan: -0.3, shoulder_lift: 0.15, elbow_flex: -0.2, wrist_flex: -0.2, wrist_roll: -0.3}
  - {shoulder_pan: -0.32, shoulder_lift: 0.3, elbow_flex: -0.3, wrist_flex: -0.2, wrist_roll: -0.7}
  - {shoulder_pan: -0.12, shoulder_lift: 0.45, elbow_flex: 0.3, wrist_flex: -0.85, wrist_roll: -0.2}
  max_roll_delta_rad: 1.2 # tier poses: largest wrist_roll change from base_pose, rad (> 0)
  max_flex_delta_rad: 0.4 # tier 1 and 2: largest wrist_flex change from base_pose, rad (> 0)
  max_big_delta_rad: 0.35 # tier 2: largest elbow/shoulder joint change from base_pose, rad (> 0)
  speed_scale: 0.1 # move_arm_joints speed scale (0 < x <= 0.3); slow for the fragile board mount
  settle_s: 1.0 # wait after a move before the still capture, s (>= 0)
  confirm_timeout_s: 600.0 # an unanswered confirm ends the sequence (arm held), s (> 0)
  head_offsets_deg: [[0.0, 0.0], [10.0, 0.0], [-10.0, 0.0], [0.0, -3.0]] # (pan, tilt) added to the aimed head, deg; tilt -3 (up) fits the D435 colour FOV
  provisional_margin_m: 0.0 # extra board margin while board_mount is the CAD seed, m (>= 0); 0 by user decision 2026-11-10
  park_board_sag_margin_m: 0.01 # added to the board floor, body and head clearances of the Park path check (board sags under its weight), m (>= 0)
  board_record_max_age_s: 7200.0 # a board-clipped record older than this is ignored at start-up, s (> 0)
  # FK pose check before every arm command (shared core arm_pose_check); its body is the packaged robot body
  # (shared/arm_collision/arm_collision/robot_body.yaml, loaded by the BodyConfig defaults).
  pose_check:
    margin_m: 0.005 # clearance of the arm links (and the board, plus provisional_margin_m) from body and head, m
    min_tool_height_m: 0.1 # tool point above the floor, m
    min_board_height_m: 0.05 # every board outline point above the floor, m
    link_radius_m: 0.025 # radius of the upper arm, forearm and wrist capsules, m
    head_radius_m: 0.075 # head envelope radius about the pan axis (grown to the URDF head), m
    head_height_m: 0.09 # head envelope top above the head mount (grown to the URDF head), m
    roll_min_tool_height_m: 0.15 # tool point height while wrist_roll changes, m
    max_roll_gripper_rad: 0.8 # gripper at most this open while wrist_roll changes (half open), rad
    stretched_shoulder_lift_max_rad: 1.85 # refused above this with a negative (stretched) elbow_flex, rad
    path_step_rad: 0.05 # path samples: no joint steps more than this, rad (> 0)
    board_spacing_m: 0.005 # largest gap of the checked board lattice per axis (<= margin_m), m
    d435_min_z_m: 0.15 # D435 depth min-Z at 640x360 (design D2): every board corner deeper than this..., m
    d435_min_z_margin_m: 0.05 # ...plus this margin from d435_color_optical_frame, else the view is skipped, m
# CSI camera intrinsics (Calibrate page, CSI section): each Camera Module 3 instance of head_camera_cpp, its
# compressed image topic and the unit that reads applied/<name>_camera_calibration.yaml (the apply restart script's
# FILE:UNIT pair). Names are lower-case letters and digits. `enabled` mirrors the camera node's ros2_nodes `enabled`:
# only enabled cameras are offered (GET /api/csi), a disabled one is unknown to the routes.
csi_cameras:
  front:
    image_topic: /front_camera/image_raw/compressed
    unit: ros2-front_camera.service
    enabled: true
  back:
    image_topic: /back_camera/image_raw/compressed
    unit: ros2-back_camera.service
    enabled: false # back_camera is disabled until the module is fitted (client_back_camera_fitted)
# A detected board view is kept only when its shared corners moved this far from the last kept view (mean, px, > 0).
csi_min_view_shift_px: 20.0
# A capture with no frame this long after its start stops as "camera not detected: ... check the ribbon cable and
# reboot" (s, > 0).
csi_frame_timeout_s: 10.0
