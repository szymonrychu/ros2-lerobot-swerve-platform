# head_rgbd_calibration node config (HEAD_RGBD_CALIBRATION_CONFIG points here). Every key shown at its default.
# Directory holding sessions, poses and results.
state_dir: /var/lib/ros2/head_rgbd_calibration
# HTTP API bind address (web_ui proxies to it).
http_host: 127.0.0.1
# HTTP API port.
http_port: 18110
# Topics the capture subscribes to.
topics:
  rgb: /head_camera/mapping/image_raw/compressed # RGB (compressed) stream; engages the focus lock
  amplitude: /tof/amplitude/image_raw # ToF amplitude image
  depth: /tof/depth/image_raw # ToF depth image
  tof_info: /tof/camera_info # ToF camera info
  head_joint_states: /head/joint_states # measured head pan/tilt (head_arm still capture)
  arm_joint_states: /follower/joint_states # measured arm joints (head_arm still capture)
# Subscription queue depths (>= 1).
qos:
  tof_depth: 10 # ToF amplitude and depth
  rgb_depth: 5 # RGB
# Longest a single capture may run, seconds (> 0).
max_capture_s: 900.0
# Kill the compute child after this many seconds (> 0).
compute_timeout_s: 600.0
# Nice value of the compute child process (0..19).
compute_nice: 10
# head_camera_cpp config the lens position is read from.
head_camera_config_file: /etc/ros2/head_camera_cpp/config.yaml
# Lens position used when that config sets none.
default_lens_position: 1.0
# URDF the apply step updates with the head extrinsics.
head_urdf_file: /opt/ros2-lerobot-swerve-platform/nodes/web_ui/urdf/head.urdf
# Arm URDF the head-from-arm fit uses for forward kinematics.
arm_urdf_file: /opt/ros2-lerobot-swerve-platform/nodes/web_ui/urdf/so101_arm.urdf
# Units restarted after applying a calibration.
restart_units:
  - ros2-head_camera_cpp.service
  - ros2-head_rgbd_cpp.service
  - ros2-head_state_publisher.service
# Seconds to wait for the restarted units to report active (> 0).
restart_check_s: 60.0
# Pose thumbnail width, pixels.
thumbnail_width_px: 320
# Coverage grid of the image area.
coverage:
  cols: 4 # 3..6
  rows: 3 # 2..4
# ChArUco board; must equal the charuco block of scripts/markers_generate.yaml (the printed board).
board:
  squares_x: 6
  squares_y: 5
  square_mm: 40.0
  marker_mm: 30.0
  dictionary: DICT_5X5_100
# Still-frame selection.
selection:
  still_window_s: 0.5
  still_rgb_mad: 2.0 # mean abs difference between consecutive frames, 8-bit grey levels
  still_tof_mad: 0.01 # same, as a fraction of the amplitude range
  still_depth_mad: 0.01 # D435 aligned depth, as a fraction of the median depth
  max_pair_dt_s: 0.05
  skip_start_s: 2.0 # focus lock settling
  amplitude_percentiles: [1.0, 99.0]
  tof_upscale: 2 # bicubic enlargement before ToF detection
# Acceptance limits for the fits.
limits:
  rgb_max_rms_px: 0.5
  tof_max_rms_px: 0.3
  stereo_max_rms_px: 1.0
  tof_zero_distortion_rms_px: 0.3
  plane_max_bias_mm: 40.0   # |median board plane depth bias|, mm
  plane_max_spread_mm: 50.0 # a pair with most board pixels farther than this from its median is dropped, mm
  min_views: 12
  intrinsics_max_rms_px: 0.5 # D435 intrinsics check against factory
  intrinsics_max_focal_diff_pct: 1.0
  intrinsics_max_principal_diff_px: 5.0
# Guided head floor sweep (Head floor fit): the head only moves, then returns to where it started.
floor:
  joint_states_topic: /head/joint_states # measured head pan/tilt
  command_topic: /head/joint_commands # JointState (head_pan, head_tilt rad) commands, as the web UI head tab
  cloud_topic: /tof/points # ToF cloud in tof_optical_frame
  command_frame_id: head_rgbd_calibration # header.frame_id of the commands
  pan_deg: [-30, -15, 0, 15, 30, 45] # pan grid, deg (-90..90); -60 sees the parked arm
  tilt_deg: [20, 24, 28] # tilt grid, deg, + is down (each -30..30); near floor only
  reach_tol_deg: 1.0 # a pose counts as reached within this of the target, deg (> 0)
  still_tol_deg: 0.2 # head still when the joint spread over still_window_s is under this, deg (> 0)
  still_window_s: 0.5 # window the stillness is judged over, s (> 0)
  move_timeout_s: 6.0 # a pose not reached and still within this is skipped, s (> 0)
  settle_s: 0.5 # wait after still before the clouds count, s (>= 0)
  clouds_per_pose: 10 # clouds fitted per pose (>= 1)
  min_clouds_per_pose: 5 # a pose with fewer fitted clouds is skipped as partly blocked (1..clouds_per_pose; null or absent: half of clouds_per_pose, rounded up)
  cloud_timeout_s: 3.0 # wait for each cloud, s (> 0)
  max_stamp_dt_s: 0.1 # joint state must be this close to a cloud stamp, s (> 0)
  fit: # floor plane fit and the chain fit limits (shared core)
    plane:
      ransac_distance_m: 0.03
      ransac_iterations: 200
      min_inliers: 150
      min_inlier_ratio: 0.5
      max_range_m: 1.8
      candidate_band_m: 0.25
      seed: 0
    limits:
      min_observations: 30
      min_poses: 8
      min_pan_span_deg: 60.0
      max_height_rms_mm: 8.0
      max_normal_rms_deg: 1.0
      max_sigma_z_mm: 3.0
      max_sigma_deg: 0.3
      max_delta_z_m: 0.1
      max_delta_deg: 10.0
    sigma_height_mm: 5.0
    sigma_normal_deg: 0.5
    huber_scale: 1.0
# Still capture of head_arm views: a view is stored only when frames and joints hold still.
still:
  window_s: 0.6 # frames and joints are judged over the last this many seconds (> 0)
  rgb_mad: 2.0 # frames differ by at most this, 8-bit grey levels (> 0)
  joint_still_rad: 0.002 # each of the seven joints moves less than this over the window, rad (> 0)
  max_joint_dt_s: 0.1 # joint samples must be this close to the frame stamp, s (> 0)
  timeout_s: 6.0 # give up waiting for stillness after this, s (> 0)
# Head-from-arm fit (shared core); fit.board must equal board.
fit:
  board: # the printed ChArUco board, equal to board above
    squares_x: 6
    squares_y: 5
    square_mm: 40.0
    marker_mm: 30.0
    dictionary: DICT_5X5_100
  # Board on a stick held in the closed gripper (rubber band), in gripper_link, as measured by the user
  # (2026-10-23), not the jaw-geometry estimate: the 250 x 210 mm sheet is glued at the middle of its lower long
  # edge to the stick, its plane across the tool axis 2 cm past the URDF tool point (gripper_frame_joint), the
  # print toward the arm. "Up" is base_link +z in gripper_link at the parked arm (scripts/gen_nav_footprint.yaml
  # parked_arm_joints, FK with joint_offsets_rad) projected normal to the tool axis: (-0.185, 0.983, 0). The
  # lower edge sits 15 mm above the axis on that side, so the centre is 15 + 105 = 120 mm above it; the long
  # edges are level and board y points down when parked. The fit solves the real mount from this start value.
  board_mount: # measured by the user 2026-10-23, not fit-solved (design D47)
    xyz_init: [-0.1665, 0.1938, -0.1181] # initial mount position, m
    rpy_init: [3.141593, 0.0, 0.185886] # initial mount roll/pitch/yaw, rad
    outline_margin_m: 0.01 # margin around the board outline, m
  # Fit the head pan axis position (head_pan origin x, y) relative to the head; the head_tilt origin moves back by
  # the same shift so the head stays put at pan 0. Session calib-20261023-074418: the fixed axis left 13 px at the
  # +-10 deg pan offsets (rms 12.2 px), the free axis sits 38 mm behind and 11 mm right of the URDF value (rms 2.7 px).
  fit_pan_axis: true
  # The residual limits are evidence from calib-20261023-074418 refitted with the free
  # pan axis over five leave-poses-out folds (tests/test_head_arm_real_session.py): the arm is about 2 mm accurate
  # (gripper camera calibration), about 2.5 px at the board distance; fit rms 2.51-2.72 px, held-out 2.56-3.59 px
  # and 2.89-3.77 mm, sigma at most 0.72 mm and 0.153 deg, largest correlation 0.973-0.976 (mount y / mount yaw).
  # Wrong models of the same views stay above rms_px: fixed pan axis 11.2-12.2 px (held-out 9.4-14.9 px,
  # 9.4-10.5 mm), a pan scale factor instead of the axis 3.07-3.33 px.
  limits: # acceptance limits of the fit
    rms_px: 3.0 # fit-view corner RMS, px
    holdout_rms_px: 4.0 # held-out arm poses corner RMS, px
    holdout_board_mm: 4.5 # held-out board centre, arm FK against the view's solvePnP, RMS mm
    max_sigma_mm: 2.0
    max_sigma_deg: 0.2
    max_correlation: 0.99 # |correlation| of any two head parameters; degenerate sets reach 0.994 or more
    min_views: 40
    min_arm_poses: 16
    min_pan_span_deg: 30.0
    min_tilt_span_deg: 10.0
    holdout_every: 5
    max_floor_delta_mm: 10.0
    max_floor_delta_deg: 1.5
    max_start_delta_mm: 30.0
    max_start_delta_deg: 5.0
    max_pan_axis_delta_mm: 50.0 # pan axis shift against its start, mm (head 90 mm wide; the session gave 38 mm)
  huber_f_scale_px: 1.0 # robust loss scale, px
  base_in_base_link: # arm base in base_link, m and rad
    x: 0.0592
    y: -0.05
    z: 0.1
    yaw: 0.0
  joint_offsets_rad: # trusted arm joint offsets, rad
    shoulder_pan: 0.0182
    shoulder_lift: -0.0345
    elbow_flex: -0.107
    wrist_flex: 0.0988
    wrist_roll: -0.071
  # Weight of the floor-fit prior (>= 0). User decision 2026-10-23 (replaces D49's prior off): 10. Session
  # calib-20261023-074418 without it fails the floor cross-check (pan axis direction 2.1-2.8 deg off the floor fit);
  # with it every limit passes at rms 2.93 px (2.67 px without), held-out 2.88 px / 2.86 mm.
  floor_prior_weight: 10.0
# mcp_server the node moves the head and arm through (guarded tools only).
robot:
  mcp_url: http://127.0.0.1:18200/mcp # mcp_server Streamable HTTP URL
  token_file: /etc/ros2/mcp_server/token # bearer token file, read per call
  board_park_token_file: /etc/ros2/mcp_server/board_park_token # token of the park-with-board admin route
  call_timeout_s: 60.0 # timeout of a normal tool call, s (> 0)
  move_timeout_s: 120.0 # timeout of an arm move call, s (> 0)
# Scripted arm sequence of the head-from-arm capture (design D37, D38). Poses are measured (follower) joint
# angles, rad, the space move_arm_joints takes (urdf = measured + fit.joint_offsets_rad).
# tests/test_arm_pose_set.py proves every pose and transit safe by FK, the board in view and a passing synthetic
# fit; the sequencer re-checks every move from the measured joints (check_path) before it commands it.
arm_sequence:
  # Board about 0.34 m in front of the head camera, lifted to the camera height and forward of the body.
  base_pose: {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.0}
  gripper_rad: 0.4 # sent once with the base pose; at most pose_check.max_roll_gripper_rad (half open)
  # Tier 0: wrist_roll only (within max_roll_delta_rad of base_pose).
  tier0_poses:
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.3}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.6}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 1.2}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.75}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: 0.15}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.3}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.6}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -1.2}
  # Tier 1: wrist_flex (within max_flex_delta_rad) and wrist_roll.
  tier1_poses:
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: -0.9}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.1, wrist_roll: -0.5}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.1, wrist_roll: 0.0}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: 0.4}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: 0.7}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.9, wrist_roll: 1.0}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.9, wrist_roll: 0.4}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: -0.1}
  - {shoulder_pan: -0.12, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.9, wrist_roll: -0.6}
  # Tier 2, after the confirm naming elbow_flex, shoulder_lift, shoulder_pan: those too (each within
  # max_big_delta_rad). The measured board sits 0.12 m off the tool axis, so the low poses (shoulder_lift >= 0.6)
  # keep wrist_roll <= 0 (board up), and the high left pose keeps the board 0.25 m from the camera.
  tier2_poses:
  - {shoulder_pan: -0.27, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.5, wrist_roll: -0.3}
  - {shoulder_pan: -0.42, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.3, wrist_roll: 0.0}
  - {shoulder_pan: -0.47, shoulder_lift: 0.5, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: 0.4}
  - {shoulder_pan: -0.42, shoulder_lift: 0.6, elbow_flex: 0.15, wrist_flex: -0.85, wrist_roll: -0.2}
  - {shoulder_pan: -0.22, shoulder_lift: 0.65, elbow_flex: 0.0, wrist_flex: -0.8, wrist_roll: 0.0}
  - {shoulder_pan: -0.02, shoulder_lift: 0.6, elbow_flex: 0.0, wrist_flex: -0.7, wrist_roll: -0.2}
  - {shoulder_pan: 0.13, shoulder_lift: 0.5, elbow_flex: 0.15, wrist_flex: -0.8, wrist_roll: -0.6}
  - {shoulder_pan: 0.13, shoulder_lift: 0.3, elbow_flex: 0.0, wrist_flex: -0.4, wrist_roll: -0.2}
  - {shoulder_pan: 0.08, shoulder_lift: 0.1, elbow_flex: 0.0, wrist_flex: -0.2, wrist_roll: 0.3}
  - {shoulder_pan: -0.02, shoulder_lift: -0.05, elbow_flex: 0.2, wrist_flex: -0.3, wrist_roll: 0.7}
  - {shoulder_pan: -0.22, shoulder_lift: -0.05, elbow_flex: 0.0, wrist_flex: -0.15, wrist_roll: 0.2}
  - {shoulder_pan: -0.3, shoulder_lift: 0.15, elbow_flex: -0.2, wrist_flex: -0.2, wrist_roll: -0.3}
  - {shoulder_pan: -0.32, shoulder_lift: 0.3, elbow_flex: -0.3, wrist_flex: -0.2, wrist_roll: -0.7}
  - {shoulder_pan: -0.12, shoulder_lift: 0.45, elbow_flex: 0.3, wrist_flex: -0.85, wrist_roll: -0.2}
  max_roll_delta_rad: 1.2 # tier poses: largest wrist_roll change from base_pose, rad (> 0)
  max_flex_delta_rad: 0.4 # tier 1 and 2: largest wrist_flex change from base_pose, rad (> 0)
  max_big_delta_rad: 0.35 # tier 2: largest elbow/shoulder joint change from base_pose, rad (> 0)
  speed_scale: 0.1 # move_arm_joints speed scale (0 < x <= 0.3); slow for the fragile board mount
  settle_s: 1.0 # wait after a move before the still capture, s (>= 0)
  confirm_timeout_s: 600.0 # an unanswered confirm ends the sequence (arm held), s (> 0)
  head_offsets_deg: [[0.0, 0.0], [10.0, 0.0], [-10.0, 0.0], [0.0, 6.0]] # (pan, tilt) added to the aimed head, deg
  provisional_margin_m: 0.05 # extra board margin while board_mount is the hand-measured start, m (>= 0)
  # Parked arm (gen_nav_footprint.yaml parked_arm_joints): the target of Park with the board on.
  park_pose: {shoulder_pan: -0.003, shoulder_lift: -1.35, elbow_flex: 1.578, wrist_flex: -0.1, wrist_roll: -1.637}
  park_board_sag_margin_m: 0.01 # added to the board floor, body and head clearances of the Park path check (board sags under its weight), m (>= 0)
  board_record_max_age_s: 7200.0 # a board-clipped record older than this is ignored at start-up, s (> 0)
  # FK pose check before every arm command (shared core arm_pose_check; body equals the mcp_server body block).
  pose_check:
    body: # robot body obstacles in base_link, a copy of the mcp_server body block (m)
      boxes: # axis-aligned boxes: centre and full size
        - {name: frame_left, center: [0.0, 0.1333, 0.15], size: [0.425, 0.035, 0.06]}
        - {name: frame_right, center: [0.0, -0.1333, 0.15], size: [0.425, 0.035, 0.06]}
        - {name: crossbar, center: [-0.025, 0.0, 0.08], size: [0.25, 0.2316, 0.04]}
      cylinders: # vertical cylinders about (x, y) from z_min to z_max
        - {name: wheel_fl, x: 0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
        - {name: wheel_fr, x: 0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
        - {name: wheel_rl, x: -0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
        - {name: wheel_rr, x: -0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
        - {name: lidar, x: 0.15, y: 0.04, radius: 0.037, z_min: 0.1, z_max: 0.21}
    margin_m: 0.03 # clearance of the arm links (and the board, plus provisional_margin_m) from body and head, m
    min_tool_height_m: 0.1 # tool point above the floor, m
    min_board_height_m: 0.05 # every board outline point above the floor, m
    link_radius_m: 0.025 # radius of the upper arm, forearm and wrist capsules, m
    head_radius_m: 0.075 # head envelope radius about the pan axis (grown to the URDF head), m
    head_height_m: 0.09 # head envelope top above the head mount (grown to the URDF head), m
    roll_min_tool_height_m: 0.15 # tool point height while wrist_roll changes, m
    max_roll_gripper_rad: 0.8 # gripper at most this open while wrist_roll changes (half open), rad
    stretched_shoulder_lift_max_rad: 1.85 # refused above this with a negative (stretched) elbow_flex, rad
    path_step_rad: 0.05 # path samples: no joint steps more than this, rad (> 0)
    board_grid: 5 # board points per edge of the checked lattice (>= 2)
