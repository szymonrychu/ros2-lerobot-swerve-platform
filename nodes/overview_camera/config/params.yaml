# overview_camera defaults (plain YAML read by launch/overview_camera_config.py, not a ROS params file).
# Deployed overrides: /etc/ros2/overview_camera/config.yaml (ros2_nodes `config: |`), merged over this file.
# The flat keys left_camera_id and right_camera_id may be given at the top level of the override.

launch:
  # libcamera camera IDs, read on the Pi with `cam -l` (see README). Empty: select by index 0 (left) / 1 (right) and
  # log a warning (the index order is not stable across boots).
  left_camera_id: ""
  right_camera_id: ""
  # stereo_left.yaml / stereo_right.yaml written by `python3 -m stereo_depth.calibrate`. camera_info_url is set only
  # when the file has a valid projection matrix P; otherwise camera_ros publishes an uncalibrated camera_info.
  calibration_dir: /var/lib/ros2/camera_calibration

# Both IMX219 cameras (camera_ros CameraNode parameters; capitalised names are libcamera controls).
camera:
  sensor_mode: "1640:1232"   # 2x2 binned full field of view, ISP-downscaled (not the 640x480 crop mode)
  width: 480
  height: 360
  role: video
  format: RGB888             # bgr8 on the topic
  FrameDurationLimits: [200000, 200000]   # us, exactly 5 fps (sync needs a fixed frame rate)
  AeExposureMode: short      # normal | short | long: short exposure limits rolling-shutter smear

# Left camera (cam0): the overview camera, the sync server, the stereo reference.
left:
  namespace: /overview_camera
  sync_mode: server          # off | server | client: libcamera SyncMode
  frame_id: overview_camera_optical_frame
  jpeg_quality: 80           # image_transport compressed plugin quality of image_raw/compressed

# Right camera (cam1): the sync client.
right:
  namespace: /stereo/right
  sync_mode: client
  frame_id: stereo_right_optical_frame
