[project]
name = "costmap_zones"
version = "0.1.0"
description = "Keepout and speed costmap filter masks rasterised from POI area zones on the /map grid"
requires-python = ">=3.12,<4"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pydantic>=2.5",
    "opencv-python-headless>=4.8,<5",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["costmap_zones"]

[tool.uv.sources]
ros2-metrics = { path = "../../shared/ros2_metrics", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check costmap_zones tests
  ruff format --check costmap_zones tests
  vulture costmap_zones tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix costmap_zones tests
  ruff format costmap_zones tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
