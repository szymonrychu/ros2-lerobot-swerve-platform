[project]
name = "claude-agent"
version = "0.1.0"
description = "Claude (Agent SDK) chat agent driving the robot through its MCP server, with an HTTP/WebSocket API for the web UI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "claude-agent-sdk==0.2.163",
    "mcp==2.3.0",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "ros2-metrics",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture==2.16",
    "poethepoet==0.48.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_agent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
ignore_names = ["cls", "prompt"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check claude_agent tests
  ruff format --check claude_agent tests
  vulture claude_agent tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix claude_agent tests
  ruff format claude_agent tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
ros2-metrics = { path = "../../shared/ros2_metrics", editable = true }
