[project]
name = "filter_node"
version = "0.1.0"
description = "Modular joint command filter (Kalman and future algorithms) for follower teleop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filter_node"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80
# joint_name in algorithm interface is part of API; implementations may use it
ignore_names = ["joint_name"]

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check filter_node tests
  ruff format --check filter_node tests
  vulture filter_node tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix filter_node tests
  ruff format filter_node tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

