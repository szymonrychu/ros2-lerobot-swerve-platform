# depthd configuration: the one example and default file. Every key is optional; the values below are the
# built-in defaults (test_config checks this file equals them). Unknown keys are rejected at startup.
# Keys marked [live] can be changed at runtime through the HTTP API; the rest need a restart.

capture:
  left_sensor_id: 0            # nvarguscamerasrc sensor-id of the left IMX219
  right_sensor_id: 1           # sensor-id of the right IMX219 (must differ)
  sensor_mode:                 # IMX219 mode requested from Argus
    width: 1640
    height: 1232
    fps: 30
  settle_frames: 30            # exposure.mode lock_after_settle: frames to let AE/AWB converge before locking
  exposure:                    # auto exposure (README: Continuous AE/AWB)
    mode: follow               # follow (right pinned to the left) | lock_after_settle (old aelock/awblock)
    measure_interval_frames: 2 # left frames between readbacks and saturation measurements (>= 1)
    follow_threshold: 0.05     # relative left exposure or gain change that re-pins the right (0..1, exclusive)
    follow_settle_frames: 2    # right frames withheld from pairing after the right reached a new pin (>= 0)
    max_exposure_us: 20000     # exposure cap against motion blur, both cameras (34..683709)
    max_gain: 8.0              # analog gain cap, both cameras (1..10.625); ISP digital gain is pinned to 1x
    saturation_level: 250      # a left grey pixel at or above this counts as saturated (1..255)
    saturated_high: 0.02       # saturated fraction above which exposure compensation steps down (0..1)
    saturated_low: 0.005       # ... below which it steps back toward 0 (>= 0, < saturated_high)
    compensation_step: 0.25    # EV per step (0..2]
    compensation_min: -2.0     # lowest exposure compensation, EV (-2..0)
    compensation_hold_frames: 15 # left frames between two compensation steps (>= 0)
  pair_window_ms: 8.0          # max left/right capture-timestamp gap for a pair (> 0)
  zero_copy: true              # NVMM -> CUDA mapping via EGL instead of a host copy
  realign_skew_ms: 4.0        # re-align the camera phase when the median pair skew exceeds this (> 0)
  realign_window_s: 10.0      # ... over the trailing window, in seconds (> 0)
  realign_stall_s: 5.0        # re-align when no stereo pair came for this long (> 0)
  realign_cooldown_s: 30.0    # minimum time between re-alignments (>= 0)

processing:
  width: 640                   # matcher input size, multiple of 8
  height: 480
  matcher: cuda_sgm            # cuda_sgm | vpi | libsgm
  num_disparities: 128         # 64 | 128 | 256 (128 gives ~0.2 m near range)
  p1: 10                       # SGM smoothness penalties
  p2: 120
  uniqueness_ratio: 5
  min_depth_m: 0.2             # depths outside [min, max] are published as invalid (0)
  max_depth_m: 6.0

postprocess:                   # every key under postprocess is [live]
  lr_check:
    enabled: true              # left-right consistency check
    max_diff: 1                # disparity pixels
  confidence:
    enabled: true
  speckle:
    enabled: true
    max_size: 200              # speckle blobs smaller than this many pixels are removed
    max_diff: 1
  bilateral:
    enabled: true
  hole_fill:
    enabled: true
    max_hole_px: 64            # largest hole filled
  temporal:
    enabled: true
    alpha: 0.4                 # 0..1, weight of the new frame
    motion_threshold: 12       # change above this resets the filter per pixel
  wls:
    enabled: false             # WLS disparity filter (costly on the Nano)

mono:                          # monocular depth fused into the stereo holes
  enabled: true                # [live]
  model: dav2_small            # dav2_small | midas_small
  engine_path: /var/lib/depthd/models/dav2_small_266.engine
  rate_hz: 2.0                 # [live] inference rate, > 0

rgb:                           # JPEG overview stream
  enabled: true
  width: 640                   # multiple of 8
  height: 480
  jpeg_quality: 80             # [live] 1..100
  fps: 10                      # > 0

transport:
  bind_address: 10.77.0.2      # Jetson end of the cabled link
  pub_port: 5550               # ZeroMQ PUB, 1024-65535
  http_port: 8090              # HTTP API, 1024-65535
  zstd_level: 1                # 1..22
  send_hwm: 2                  # ZeroMQ send high-water mark (frames)

calibration:
  path: /var/lib/depthd/stereo.yaml
  max_rms_px: 0.5              # calibration RMS above this is rejected

frame_ids:
  depth: stereo_left_optical_frame
  rgb: overview_camera_optical_frame
