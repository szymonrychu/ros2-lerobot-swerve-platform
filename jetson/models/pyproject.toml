[project]
name = "depthd-models"
version = "0.1.0"
description = "Mac-side ONNX export of the depthd monocular models (Depth Anything V2 Small, MiDaS v2.1 small) for TensorRT 8.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "onnx==1.23.2",
    "onnxsim==0.8.1",
    "timm==1.0.30",
    "pyyaml>=6.0,<7",
    "pydantic>=2.5,<3",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11,<3",
    "poethepoet>=0.42.0,<0.43",
    "pytest>=8.0.0,<9",
    "onnxruntime==1.31.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check export_onnx.py tests
  ruff format --check export_onnx.py tests
  vulture export_onnx.py tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix export_onnx.py tests
  ruff format export_onnx.py tests
""" }
test = { shell = "pytest tests/ -v" }
export = { shell = "python export_onnx.py export" }
check = { shell = "python export_onnx.py check" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
