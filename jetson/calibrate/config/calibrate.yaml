# Stereo ChArUco calibration tool settings (python3 -m stereo_calibrate board|capture|solve).
# depthd reads the board keys (squares_x, squares_y, square_mm, marker_mm, dictionary) from this file too.

# Board. Defaults are the generated e-reader board: after showing it on the e-reader, MEASURE one square with a
# ruler and set square_mm; set marker_mm = square_mm * 22 / 30.
squares_x: 7
squares_y: 5
square_mm: 27.0
marker_mm: 19.8
dictionary: DICT_5X5_100

# depthd HTTP API (transport.bind_address:http_port in depthd.yaml, the link address): GET /calibration/capture, POST /calibration/reload.
depthd_url: http://10.77.0.2:8090

# Where the capture mode keeps the kept pairs and solve mode reads them back (cleared at the start of capture).
captures_dir: /var/lib/depthd/calibration/cli-captures
# The calibration depthd loads (calibration.path in depthd.yaml). Calibration lives on the Jetson, never on the Pi.
output_path: /var/lib/depthd/stereo.yaml

# Capture: stop at capture_count pairs; keep a pair only with min_shared_corners ChArUco corners seen in both images
# and a pose that differs from every kept pair by at least one of the thresholds below.
capture_count: 30
min_shared_corners: 12
capture_poll_s: 0.25
capture_timeout_s: 900.0
min_position_shift: 0.08      # board centre move, fraction of the image width/height
min_scale_change: 0.15        # board size change, fraction (moving closer or further)
min_tilt_change: 0.08         # change of foreshortening (0 = facing the camera, 1 = edge on)
min_roll_change_deg: 12.0     # in-plane rotation change

# Solve: refuse to write above rms_limit_px; fewest usable pairs.
rms_limit_px: 0.5
min_pairs: 10
