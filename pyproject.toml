[project]
name = "ros2-lerobot-swerve-platform"
version = "0.1.0"
description = "ROS2 Lerobot Swerve-Drive Platform - monorepo for server, client, and Ansible"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.9.0,<5",
    "ruff==0.15.20",
    "vulture>=2.11",
    "pre-commit>=4.0.0",
    "poethepoet>=0.42.0",
    "ansible-lint>=26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v -rxXs"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 120
extend-exclude = ["nodes", "ansible", "client", "server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.vulture]
exclude = ["venv", ".venv", "build", "dist", "client", "server", "ansible", "nodes", "**/__pycache__"]
paths = ["tests", "shared"]
min_confidence = 80
sort_by_size = true

[tool.coverage.run]
branch = true
source = ["shared"]

[tool.coverage.report]
skip_empty = true

# Root lint: tests, shared only. Python nodes have their own uv project and `poe lint` (see README).
[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check tests shared
  ruff format --check tests shared
  vulture tests shared --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix tests shared
  ruff format tests shared
""" }
lint-nodes = { shell = """
  set -e
  (cd nodes/master2master && uv run --frozen poe lint)
  (cd nodes/bridges/uvc_camera && uv run --frozen poe lint)
  (cd nodes/bridges/feetech_servos && uv run --frozen poe lint)
  (cd nodes/bridges/gps_rtk && uv run --frozen poe lint)
  (cd nodes/bridges/bno055_imu && uv run --frozen poe lint)
  (cd nodes/lerobot_teleop && uv run --frozen poe lint)
  (cd nodes/filter_node && uv run --frozen poe lint)
  (cd nodes/test_joint_api && uv run --frozen poe lint)
  (cd nodes/haptic_controller && uv run --frozen poe lint)
  (cd nodes/topic_scraper_api && uv run --frozen poe lint)
  (cd nodes/swerve_drive_controller && uv run --frozen poe lint)
  (cd nodes/web_ui && uv run --frozen poe lint)
  (cd nodes/claude_agent && uv run --frozen poe lint)
  (cd nodes/mcp_server && uv run --frozen poe lint)
  (cd nodes/poi_store && uv run --frozen poe lint)
  (cd nodes/static_tf_publisher && uv run --frozen poe lint)
  (cd nodes/rf2o_odom_relay && uv run --frozen poe lint)
  (cd nodes/steamdeck_ui/bridge && uv run --frozen poe lint)
""" }
lint-ansible = { shell = """
  set -e
  cd ansible && ansible-lint .
""" }
test-ansible = { shell = """
  set -e
  cd ansible
  ansible-lint .
  ansible-playbook -i inventory site.yml --syntax-check
  ansible-playbook -i inventory playbooks/client.yml --syntax-check
  ansible-playbook -i inventory playbooks/server.yml --syntax-check
  ansible-playbook -i inventory playbooks/deploy_nodes_client.yml --syntax-check
  ansible-playbook -i inventory playbooks/deploy_nodes_server.yml --syntax-check
  ansible-playbook -i inventory playbooks/controller.yml --syntax-check
  ansible-playbook -i inventory playbooks/deploy_steamdeck_ui.yml --syntax-check
  ansible-playbook -i inventory playbooks/deploy_topic_scraper_client_config.yml --syntax-check
  ansible-playbook -i inventory playbooks/docker_cleanup.yml --syntax-check
  ansible-playbook -i inventory playbooks/optimize.yml --syntax-check
""" }
