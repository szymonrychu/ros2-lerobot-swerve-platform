[project]
name = "ros2-metrics"
version = "0.1.0"
description = "Prometheus exporter helper for the robot's own ROS2 nodes (port resolution, /metrics server, node info)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ros2_metrics"]

[tool.ruff]
line-length = 120
