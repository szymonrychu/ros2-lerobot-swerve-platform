[project]
name = "arm-collision"
version = "0.1.0"
description = "rclpy-free arm self-collision model: body obstacles, link geometry, URDF kinematics and the body checker"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.4.3",
    "pydantic==2.13.5",
    "ikpy==4.1.0",
    "mcp-core-cpp",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture==2.16",
    "poethepoet==0.48.0",
    "pytest==9.1.1",
]

[tool.uv.sources]
# C++ kernels (scikit-build-core + nanobind): uv sync compiles them into this venv, see mcp_core_cpp/README.md.
mcp-core-cpp = { path = "../../nodes/mcp_server/mcp_core_cpp" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arm_collision"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.vulture]
exclude = ["**/__pycache__"]
min_confidence = 80

[tool.poe.tasks]
lint = { shell = """
  set -e
  ruff check arm_collision tests
  ruff format --check arm_collision tests
  vulture arm_collision tests --min-confidence 80
""" }
lint-fix = { shell = """
  ruff check --fix arm_collision tests
  ruff format arm_collision tests
""" }
test = { shell = "pytest tests/ -v" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:ikpy.*"]
