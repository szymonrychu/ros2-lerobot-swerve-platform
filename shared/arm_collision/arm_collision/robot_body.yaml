# Robot body the arm must not hit: the one body definition (settings.load_robot_body) for every node that checks the
# arm against the body (mcp_server, filter_node). base_link metres (x forward, y left, z up from the floor).
#
# Seen from above the robot is an H: two side frames above the wheels, the crossbar between them (the arm base and the
# lidar stand on it; the arm base/shoulder link is not checked), the wheels as their steering envelopes (vertical
# cylinders around the steer axes, they steer) and the lidar column up to the dome top.
# Measured 2026-10-10: lidar dome diameter 74 mm (radius 37 mm) centred at (0.150, 0.040), top face 210 mm; wheels and
# side bars 35 mm wide (wheel envelope = half-diagonal of the 120 x 35 mm wheel, 62.5 mm); side bar top ~180 mm. Still
# assumed (nodes/mcp_server/README.md "Body collision", "How to measure"): wheel line from swerve half_length/half_width
# 0.1525/0.1333, side bar bottom 120 mm, crossbar extent and height (it spans to the side bars' inner faces), lidar
# column bottom 100 mm.
boxes:
  - {name: frame_left, center: [0.0, 0.1333, 0.15], size: [0.425, 0.035, 0.06]}
  - {name: frame_right, center: [0.0, -0.1333, 0.15], size: [0.425, 0.035, 0.06]}
  - {name: crossbar, center: [-0.025, 0.0, 0.08], size: [0.25, 0.2316, 0.04]}
cylinders:
  - {name: wheel_fl, x: 0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
  - {name: wheel_fr, x: 0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
  - {name: wheel_rl, x: -0.1525, y: 0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
  - {name: wheel_rr, x: -0.1525, y: -0.1333, radius: 0.0625, z_min: 0.0, z_max: 0.12}
  - {name: lidar, x: 0.150, y: 0.040, radius: 0.037, z_min: 0.10, z_max: 0.21}
