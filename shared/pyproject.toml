[project]
name = "ros2-common"
version = "0.1.0"
description = "Shared helpers for the ROS2 nodes (battery cut-off guard and config, camera geometry)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.9.0,<5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "vulture>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ros2_common"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.vulture]
paths = ["ros2_common"]
min_confidence = 80
