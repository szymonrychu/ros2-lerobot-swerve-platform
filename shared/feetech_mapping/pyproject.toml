[project]
name = "feetech-mapping"
version = "0.1.0"
description = "Feetech STS servo step/radian conversions and the leader -> follower range mapping (no dependencies)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feetech_mapping"]

[tool.ruff]
line-length = 120
