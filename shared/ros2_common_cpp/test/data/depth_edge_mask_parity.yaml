# Parity fixture of the depth edge ("veil") rule: ros2_common_cpp::depth_edge_mask (C++, head_rgbd_cpp) and
# ros2_common.depth_edge_mask (Python, mcp_server pixel_to_point) must give these masks. `defaults` is the single
# source of the rule's numbers: the C++ DepthEdgeMaskParams defaults, the Python constants, head_rgbd_cpp's
# edge_mask and mcp_server's camera_arm edge settings are pinned to it (tests/test_depth_edge_rule_parity.py,
# shared/ros2_common_cpp/test/test_depth_mask.cpp). Rule: a valid pixel goes when a valid pixel of its window is
# nearer by more than max(abs_m, rel x its depth); grow_px then widens the removed region into valid pixels.
# depth_mm: 16UC1 millimetres, 0 = no depth; removed: 1 where the rule removes the pixel. Expected masks come from
# exact rational arithmetic and no pixel lies within 0.5 mm of its threshold (no float rounding ties).
