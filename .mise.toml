[tools]
python = "3.12"
uv = "0.11.29"
# Pinned here rather than inherited from the workbench root: this repo is an
# independent GitHub repo and its own CI clones it alone, with no superrepo
# .mise.toml above it to supply ruff.
ruff = "0.15.20"

[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.install]
description = "Sync the virtualenv from the lockfile"
run = "uv sync"

[tasks.lint]
description = "Lint and format check"
run = "uv run poe lint"

[tasks.fmt]
description = "Format and autofix"
run = "uv run poe lint-fix"

[tasks.test]
description = "Run root tests"
run = "uv run pytest tests -q"
